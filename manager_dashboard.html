<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 대시보드 · Panel</title>
<style>
  :root{
    --navy:#0c2444;--navy2:#163a66;--gold:#c9a14a;--gold2:#e3c878;
    --bg1:#eef2f8;--bg2:#e4eaf3;--card:#fff;--line:#e6ebf2;--ink:#0b1220;--muted:#6b7a90;
    --green:#15a34a;--slate:#475569;--red:#dc2626;--teal:#0d8276;--amber:#d97706}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:radial-gradient(1200px 600px at 50% -200px,#f4f7fc,transparent),linear-gradient(180deg,var(--bg1),var(--bg2));
    background-attachment:fixed;color:var(--ink);min-height:100vh}
  .wrap{max-width:1160px;margin:0 auto;padding:18px 16px 40px}

  /* ---------- 헤더 ---------- */
  header{position:relative;overflow:hidden;color:#fff;border-radius:18px;padding:20px 22px;
    display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px;
    background:linear-gradient(120deg,#0a1f3c 0%,#13335c 55%,#0d2748 100%);
    box-shadow:0 18px 40px -20px rgba(12,36,68,.65),0 2px 6px rgba(12,36,68,.2)}
  header::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold))}
  header::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle,rgba(201,161,74,.18),transparent 70%);pointer-events:none}
  .brand{display:flex;align-items:center;gap:14px;min-width:0}
  .logo{width:48px;height:48px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:18px;letter-spacing:.5px;color:#1a1407;
    background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 6px 16px -6px rgba(201,161,74,.7);position:relative;z-index:1}
  .brand-name{font-size:18px;font-weight:900;letter-spacing:.6px;line-height:1.1}
  .brand-sub{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.72);margin-top:3px}
  .brand-sub b{color:var(--gold2);font-weight:800}

  .filters{display:flex;gap:9px;align-items:center;flex-wrap:wrap;position:relative;z-index:1}
  .filters .fld{display:inline-flex;flex-direction:column;gap:3px}
  .filters label{font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;opacity:.65;font-weight:700}
  .filters select,.filters input[type=date]{padding:8px 11px;border:1px solid rgba(255,255,255,.22);border-radius:10px;
    background:rgba(255,255,255,.1);color:#fff;font-size:13px;font-weight:600;outline:none;transition:.15s}
  .filters select:focus,.filters input[type=date]:focus{border-color:var(--gold);background:rgba(255,255,255,.16)}
  .filters select option{color:#0b1220}
  .rbtn{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1407;border:none;border-radius:10px;
    padding:9px 16px;font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 6px 14px -6px rgba(201,161,74,.7);transition:.15s}
  .rbtn:hover{filter:brightness(1.05);transform:translateY(-1px)}
  .lang{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;font-weight:800;font-size:12px;
    padding:9px 12px;border-radius:10px;cursor:pointer;transition:.15s}
  .lang:hover{background:rgba(255,255,255,.22)}
  .toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;opacity:.85;font-weight:600}
  .updated{flex-basis:100%;font-size:11.5px;opacity:.62;font-weight:600;margin-top:4px;position:relative;z-index:1}

  /* ---------- KPI ---------- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin-bottom:18px}
  .kpi{position:relative;overflow:hidden;background:var(--card);border-radius:16px;padding:16px 17px 17px;
    border:1px solid rgba(12,36,68,.05);
    box-shadow:0 1px 2px rgba(12,36,68,.04),0 16px 32px -20px rgba(12,36,68,.30);transition:transform .18s,box-shadow .18s}
  .kpi:hover{transform:translateY(-3px);box-shadow:0 1px 2px rgba(12,36,68,.05),0 22px 38px -18px rgba(12,36,68,.36)}
  .kpi-top{display:flex;align-items:center;gap:10px;margin-bottom:13px}
  .kpi-ic{width:38px;height:38px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;background:#e8eef7;color:var(--navy2)}
  .kpi-ic svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .kpi.green .kpi-ic{background:#e7f7ee;color:#15a34a}
  .kpi.amber .kpi-ic{background:#fdf1e1;color:#d97706}
  .kpi.slate .kpi-ic{background:#eef1f6;color:#475569}
  .kpi.red   .kpi-ic{background:#fdecec;color:#dc2626}
  .kpi.teal  .kpi-ic{background:#e4f6f2;color:#0d8276}
  .kpi .l{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.2px}
  .kpi-bot{display:flex;align-items:baseline}
  .kpi .v{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-1px;color:#0c2444;line-height:1}
  .kpi .unit{font-size:13px;font-weight:700;color:var(--muted);margin-left:5px}
  .kpi-rate{margin-left:auto;align-self:center;font-size:12.5px;font-weight:900;font-variant-numeric:tabular-nums;
    background:#e7f7ee;color:#15a34a;padding:3px 9px;border-radius:999px;letter-spacing:.2px}
  .kpi.teal .kpi-rate{background:#e4f6f2;color:#0d8276}

  /* ---------- 탭 (세그먼트) ---------- */
  .tabs{display:inline-flex;gap:4px;margin-bottom:16px;flex-wrap:wrap;background:#fff;padding:5px;border-radius:14px;
    box-shadow:0 1px 2px rgba(12,36,68,.05),0 10px 24px -16px rgba(12,36,68,.3)}
  .tab{background:transparent;color:var(--muted);border:none;border-radius:10px;padding:9px 18px;font-weight:800;font-size:13.5px;cursor:pointer;transition:.15s}
  .tab:hover{color:var(--navy2);background:#f1f5fa}
  .tab.active{background:linear-gradient(135deg,#13335c,#0c2444);color:#fff;box-shadow:0 6px 14px -6px rgba(12,36,68,.6)}

  /* ---------- 카드 ---------- */
  .card{background:var(--card);border-radius:16px;box-shadow:0 1px 2px rgba(12,36,68,.05),0 14px 30px -20px rgba(12,36,68,.25);
    padding:18px 20px;margin-bottom:16px;border:1px solid rgba(12,36,68,.04)}
  .card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
  .card .head h3{margin:0;font-size:14px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:9px}
  .card .head h3::before{content:"";width:4px;height:16px;border-radius:3px;background:linear-gradient(180deg,var(--gold2),var(--gold))}
  .xbtn{background:linear-gradient(135deg,#1aa05a,#107c41);border:none;color:#fff;border-radius:10px;padding:8px 15px;font-weight:800;font-size:12px;cursor:pointer;
    box-shadow:0 6px 14px -6px rgba(16,124,65,.6);transition:.15s;display:inline-flex;align-items:center;gap:6px}
  .xbtn::before{content:"⤓";font-size:13px}
  #bMealAdd::before{content:"";font-size:0}
  .xbtn:hover{filter:brightness(1.05);transform:translateY(-1px)}

  /* ---------- 막대 ---------- */
  .bars{display:flex;flex-direction:column;gap:9px}
  .bar-row{display:grid;grid-template-columns:110px 1fr 46px;align-items:center;gap:10px;font-size:13px}
  .bar-row .lab{font-weight:700;color:#334155}
  .bar-track{background:#eef2f8;border-radius:8px;height:20px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(12,36,68,.06)}
  .bar-fill{height:100%;border-radius:8px;min-width:3px;transition:width .5s cubic-bezier(.2,.7,.2,1);box-shadow:0 1px 3px rgba(12,36,68,.18)}
  .bar-row .num{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;color:#0c2444}

  /* ---------- 표 ---------- */
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;padding:10px 11px;border-bottom:2px solid #eef2f8;color:var(--muted);font-size:11px;
    letter-spacing:.4px;text-transform:uppercase;font-weight:800;white-space:nowrap;cursor:pointer;user-select:none;transition:.12s}
  thead th:hover{color:var(--navy)}
  tbody td{padding:11px;border-bottom:1px solid #f3f6fa;white-space:nowrap;font-weight:500}
  tbody tr{transition:.1s}
  tbody tr:hover{background:#f6f9fd}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.2px}
  .pill.in{background:#dcfce7;color:#15803d}.pill.out{background:#eef2f6;color:#475569}
  .pill.normal{background:#dcfce7;color:#15803d}.pill.late{background:#fee2e2;color:#b91c1c}.pill.early{background:#fef3c7;color:#92400e}
  .photo-btn{background:#eef3f9;border:1px solid #e2e9f1;border-radius:8px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--navy);cursor:pointer;transition:.12s}
  .photo-btn:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
  .act-btn{background:#107c41;border:none;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:800;color:#fff;cursor:pointer;transition:.12s;white-space:nowrap}
  .act-btn:hover{filter:brightness(1.08)}
  .act-btn:disabled{opacity:.5;cursor:default}
  .empty{padding:34px;text-align:center;color:var(--muted);font-weight:600}
  .scroll{overflow-x:auto}
  /* 마지막 컬럼(사진/처리/시각) 오른쪽 고정 → 가로 스크롤 시에도 안 잘림 */
  thead th:last-child,tbody td:last-child{position:sticky;right:0;z-index:2;padding-right:16px}
  thead th:last-child{background:#fff;box-shadow:-12px 0 12px -10px rgba(12,36,68,.10)}
  tbody td:last-child{background:#fff;box-shadow:-12px 0 12px -10px rgba(12,36,68,.10)}
  tbody tr:hover td:last-child{background:#f6f9fd}

  /* ---------- 푸터 ---------- */
  .foot{text-align:center;color:var(--muted);font-size:11.5px;font-weight:600;margin-top:6px;opacity:.8}
  .foot b{color:var(--navy)}

  /* ---------- 모달 ---------- */
  .modal{position:fixed;inset:0;background:rgba(8,15,28,.72);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal.open{display:flex}
  .modal .box{background:#fff;border-radius:18px;padding:16px;max-width:360px;text-align:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
  .modal img{width:100%;border-radius:12px;background:#f1f5f9;min-height:120px}
  .modal .mname{font-weight:800;margin:12px 0 4px;color:#0c2444}
  .modal button{margin-top:12px;background:linear-gradient(135deg,#13335c,#0c2444);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-weight:800;cursor:pointer}

  /* ---------- 잠금 ---------- */
  .gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:99;color:#fff;
    background:radial-gradient(900px 500px at 50% 0,#13335c,transparent),linear-gradient(180deg,#0c2444,#081a33)}
  .gate .glogo{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;color:#1a1407;
    background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 12px 30px -10px rgba(201,161,74,.7);margin-bottom:4px}
  .gate input{font-size:24px;letter-spacing:6px;text-align:center;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.2);width:220px;background:rgba(255,255,255,.95);color:#0c2444;font-weight:800}
  .gate button{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1407;border:none;border-radius:12px;padding:12px 26px;font-weight:800;cursor:pointer}
  .gate .msg{font-size:13px;min-height:18px;color:#fecaca}

  @media (max-width:560px){ .brand-name{font-size:16px} .kpi .v{font-size:28px} .wrap{padding:12px 11px 32px} }
  @media print{ .filters,.xbtn,.tab,.rbtn,.photo-btn,.lang,.toggle{display:none!important}
    body{background:#fff} header{box-shadow:none} .kpi,.card{box-shadow:none;border:1px solid #e2e8f0} }

  /* ===================== DARK THEME ===================== */
  body{background:radial-gradient(1100px 620px at 50% -180px,#13294a,transparent),linear-gradient(180deg,#0a1726,#0b1d34);color:#e9eef7}
  .kpi{background:#15243f;border-color:rgba(255,255,255,.07);box-shadow:0 1px 2px rgba(0,0,0,.35),0 18px 34px -20px rgba(0,0,0,.7)}
  .kpi .v{color:#f1f5fb}
  .kpi .l{color:#9fb0c8}
  .kpi .unit{color:#7e90ab}
  .kpi-ic{background:rgba(255,255,255,.08);color:#a9c0e0}
  .kpi.green .kpi-ic{background:rgba(34,197,94,.16);color:#4ade80}
  .kpi-rate{background:rgba(34,197,94,.16);color:#4ade80}
  .kpi.teal .kpi-rate{background:rgba(45,212,191,.16);color:#2dd4bf}
  .kpi.amber .kpi-ic{background:rgba(251,191,36,.16);color:#fbbf24}
  .kpi.slate .kpi-ic{background:rgba(148,163,184,.20);color:#cbd5e1}
  .kpi.red   .kpi-ic{background:rgba(248,113,113,.16);color:#f87171}
  .kpi.teal  .kpi-ic{background:rgba(45,212,191,.16);color:#2dd4bf}
  .tabs{background:#13223c;box-shadow:0 1px 2px rgba(0,0,0,.35),0 12px 26px -16px rgba(0,0,0,.7)}
  .tab{color:#9fb0c8}
  .tab:hover{color:#e9eef7;background:rgba(255,255,255,.06)}
  .card{background:#15243f;border-color:rgba(255,255,255,.07);box-shadow:0 1px 2px rgba(0,0,0,.35),0 20px 38px -22px rgba(0,0,0,.75)}
  .card .head h3{color:#eaf0f8}
  .bar-track{background:rgba(255,255,255,.07);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
  .bar-row .lab{color:#c3d0e2}
  .bar-row .num{color:#f1f5fb}
  thead th{color:#8294ad;border-bottom-color:rgba(255,255,255,.12)}
  thead th:hover{color:#eaf0f8}
  tbody td{border-bottom-color:rgba(255,255,255,.06);color:#dde6f2}
  tbody tr:hover{background:rgba(255,255,255,.04)}
  .photo-btn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:#cfe0f5}
  .photo-btn:hover{background:#1d3a66;border-color:#1d3a66;color:#fff}
  thead th:last-child,tbody td:last-child{background:#15243f;box-shadow:-12px 0 14px -10px rgba(0,0,0,.55)}
  tbody tr:hover td:last-child{background:#1b2a47}
  .empty{color:#8294ad}
  .foot{color:#8294ad}.foot b{color:#e3c878}
  /* 직원 추가 버튼/폼 */
  .addbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;font-weight:800;font-size:13px;padding:9px 14px;border-radius:10px;cursor:pointer;transition:.15s;position:relative;z-index:1}
  .addbtn:hover{background:rgba(255,255,255,.22)}
  .addbox{max-width:400px!important;text-align:left!important}
  .addform{display:flex;flex-direction:column;gap:9px;margin-top:8px}
  .addform label{font-size:11.5px;font-weight:800;color:#475569;margin-bottom:-4px}
  .addform input,.addform select{border:1px solid #d8e0ea;border-radius:9px;padding:10px 12px;font-size:14px;color:#0c2444;background:#f8fafc;outline:none}
  .addform input:focus,.addform select:focus{border-color:#163a66;background:#fff}
  .amsg{font-size:12.5px;min-height:18px;font-weight:700;color:#dc2626;text-align:center}
  .addbtns{display:flex;gap:8px;margin-top:4px}
  .addbtns button{flex:1;border:none;border-radius:10px;padding:11px;font-weight:800;cursor:pointer}
  .abtn-cancel{background:#eef2f6;color:#475569}
  .abtn-ok{background:linear-gradient(135deg,#13335c,#0c2444);color:#fff}

  /* 직원 관리(퇴사/복직) */
  .mqbox{max-width:460px!important;text-align:left!important}
  /* 기간 조회 모달 */
  .qbox{max-width:660px!important;text-align:left!important}
  .qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin:12px 0}
  .qfld{display:flex;flex-direction:column;gap:4px}
  .qfld label{font-size:11px;font-weight:800;color:#64748b;letter-spacing:.3px}
  .qfld select,.qfld input[type=date]{border:1px solid #d8e0ea;border-radius:9px;padding:9px 10px;font-size:13.5px;color:#0c2444;background:#f8fafc;outline:none}
  .qfld select:focus,.qfld input:focus{border-color:#163a66;background:#fff}
  .qbtns{display:flex;gap:8px;margin-bottom:10px}
  .qrun{flex:1;border:none;border-radius:10px;padding:11px;font-weight:800;font-size:13.5px;cursor:pointer;background:linear-gradient(135deg,#163a66,#0c2444);color:#fff}
  .qexp{border:none;border-radius:10px;padding:11px 14px;font-weight:800;font-size:13px;cursor:pointer;background:#e7f7ee;color:#15803d}
  .qrun:disabled,.qexp:disabled{opacity:.5;cursor:default}
  .qsum{font-size:12.5px;font-weight:800;color:#334155;min-height:18px;margin-bottom:6px}
  .qwrap{max-height:48vh;overflow:auto;border:1px solid #e6ecf3;border-radius:10px}
  table.qt{width:100%;border-collapse:collapse;font-size:13px}
  table.qt th{position:sticky;top:0;background:#eef2f8;color:#334155;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;padding:9px 10px;text-align:left;z-index:1}
  table.qt td{padding:9px 10px;border-top:1px solid #eef2f6;color:#0c2444}
  table.qt td.n,table.qt th.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
  table.qt tr:hover td{background:#f6f9fd}
  .mqsearch{width:100%;border:1px solid #d8e0ea;border-radius:9px;padding:10px 12px;font-size:14px;margin:10px 0;outline:none;color:#0c2444;background:#f8fafc}
  .mqsearch:focus{border-color:#163a66;background:#fff}
  .mqlist{max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px}
  .mqrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;border:1px solid #eef1f5;border-radius:10px;background:#fff}
  .mqrow .info{min-width:0;overflow:hidden}
  .mqrow .nm{font-weight:700;color:#0c2444;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mqrow .id{font-size:11.5px;color:#8294ad;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mqrow .tm{font-size:11.5px;color:#2563eb;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mqrow .tm .noteam{color:#94a3b8;font-weight:600}
  .mqrow.off{opacity:.5;background:#f8fafc}
  .mqbtn{border:none;border-radius:8px;padding:7px 14px;font-weight:800;font-size:12px;cursor:pointer;flex:none}
  .mqbtn.res{background:#fee2e2;color:#b91c1c}
  .mqbtn.rst{background:#dcfce7;color:#15803d}

  #addModal{z-index:60}
  .addform input:read-only{background:#eef2f6;color:#64748b;cursor:not-allowed}
  .mqfilter{display:flex;gap:4px;background:#eef2f6;padding:4px;border-radius:10px;margin:6px 0 8px}
  .mqf{flex:1;border:none;background:transparent;border-radius:7px;padding:8px;font-weight:800;font-size:12.5px;color:#64748b;cursor:pointer}
  .mqf.active{background:#fff;color:#0c2444;box-shadow:0 1px 3px rgba(0,0,0,.14)}
  .mqact{display:flex;gap:6px;flex:none}
  .mqbtn.edit{background:#e8eef7;color:#163a66}
  /* 엑셀 일괄 업로드 / 양식 */
  .mqio{display:flex;gap:8px;margin:0 0 10px}
  .mqio-btn{flex:1;border:none;border-radius:9px;padding:10px;font-weight:800;font-size:12.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.12s}
  .mqio-btn.dl{background:#e8eef7;color:#163a66}
  .mqio-btn.up{background:linear-gradient(135deg,#163a66,#0c2444);color:#fff}
  .mqio-btn:hover{filter:brightness(1.06)}
  .mqio-btn:disabled{opacity:.55;cursor:default}
  .mqio-hint{font-size:11px;color:#94a3b8;margin:-4px 0 8px;line-height:1.4}

  .langtog{display:inline-flex;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);border-radius:10px;overflow:hidden}
  .langtog button{border:none;background:transparent;color:rgba(255,255,255,.62);font-weight:800;font-size:12px;padding:9px 13px;cursor:pointer;transition:.15s;min-width:38px}
  .langtog button:hover{color:#fff}

/* ---------- 날짜 ---------- */
function todayDate(){ const n=new Date(); const l=new Date(n.getTime()+CONFIG.TZ_OFFSET_HOURS*3600*1000); return l.toISOString().slice(0,10); }
function dayBounds(d){ const [y,m,dd]=d.split("-").map(Number); const base=Date.UTC(y,m-1,dd); const off=CONFIG.TZ_OFFSET_HOURS*3600*1000; return {start:new Date(base-off).toISOString(),end:new Date(base+86400000-off).toISOString()}; }
function localMin(iso){ const dt=new Date(new Date(iso).getTime()+CONFIG.TZ_OFFSET_HOURS*3600*1000); return dt.getUTCHours()*60+dt.getUTCMinutes(); }
function hhmm(iso){ const dt=new Date(new Date(iso).getTime()+CONFIG.TZ_OFFSET_HOURS*3600*1000); return String(dt.getUTCHours()).padStart(2,"0")+":"+String(dt.getUTCMinutes()).padStart(2,"0"); }
function hmToMin(s){ const [h,m]=s.split(":").map(Number); return h*60+m; }

/* ---------- 로드 ---------- */
async function getJson(url){ const r=await fetch(url,{headers:HEADERS}); if(!r.ok) throw new Error(await r.text()); return r.json(); }
async function refresh(){
  const date=$("fDate").value||todayDate(); const {start,end}=dayBounds(date);
  $("updated").textContent=t("loading");
  try{
    const [emp,att,meal]=await Promise.all([
      getJson(REST(`${CONFIG.T_EMPLOYEES}?active=eq.true&select=employee_id,name,team,factory&limit=5000`)).catch(()=>[]),
      getJson(REST(`${CONFIG.T_RECORDS}?created_at=gte.${start}&created_at=lt.${end}&select=id,employee_id,name,type,factory,created_at&order=created_at.asc&limit=20000`)),
      getJson(REST(`${CONFIG.T_MEALS}?meal_date=eq.${date}&status=eq.applied&select=employee_id,name,factory,created_at&order=created_at.asc&limit=20000`))
    ]);
    const noTest=arr=>Array.isArray(arr)?arr.filter(x=>!isTestId(x.employee_id)):[];
    state.employees=noTest(emp); state.att=noTest(att); state.meal=noTest(meal);
    compute();
    $("updated").textContent=t("updated")+new Date().toLocaleTimeString(lang==="ko"?"ko-KR":"es-MX");
  }catch(e){ $("updated").textContent=t("queryErr"); console.error(e); }
}

/* ---------- 집계 ---------- */
function fFactory(){ return $("fFactory").value; }
function passFactory(row){ return !fFactory() || String(row.factory)===fFactory(); }

function compute(){
  // 직원 → 팀 매핑 (재직 직원 기준)
  const empTeam={}; for(const e of state.employees){ empTeam[e.employee_id]=e.team||""; }
  populateTeamFilter();
  const teamSel=$("fTeam").value;
  const passTeam=tm=>!teamSel || (tm||"")===teamSel;

  const byEmp={};
  for(const r of state.att){
    if(!passFactory(r)) continue;
    const k=r.employee_id;
    if(!byEmp[k]) byEmp[k]={employee_id:k,name:r.name,factory:r.factory,firstIn:null,firstSeen:r.created_at,lastOut:null,last:null,inId:null,anyId:r.id};
    const g=byEmp[k];
    if(r.type==="in"){ if(!g.firstIn) g.firstIn=r.created_at; if(!g.inId) g.inId=r.id; }
    if(r.type==="out"){ g.lastOut=r.created_at; }
    g.last=r.type;
  }
  // ✅ 당일 어떤 기록이라도 있으면 출석현황에 표시 (이전에는 'in' 기록이 있는 직원만 표시 →
  //    스캐너가 'out'으로 기록했거나 날짜경계 문제가 있을 때 출석현황에서 누락되던 문제 해결)
  const attRows=Object.values(byEmp);
  const presentIds=new Set(attRows.map(g=>g.employee_id));

  view.att=attRows.map(g=>{
    const sc=plantSched(g.factory);
    const late = g.firstIn ? localMin(g.firstIn)>hmToMin(sc.inBy) : false;
    const early = g.lastOut ? localMin(g.lastOut)<hmToMin(sc.outBy) : false;
    const inSrc = g.firstIn||g.firstSeen;
    return { employee_id:g.employee_id, name:g.name||g.employee_id, factory:g.factory, team:empTeam[g.employee_id]||"",
      status:(g.last==="out"?"out":"in"),
      inTime:inSrc?hhmm(inSrc):"", outTime:g.lastOut?hhmm(g.lastOut):"",
      noIn:!g.firstIn, late, early, photoId:g.inId||g.anyId||null };
  }).filter(r=>passTeam(r.team));

  view.absent=state.employees.filter(e=>passFactory(e)).filter(e=>!presentIds.has(e.employee_id))
    .map(e=>({employee_id:e.employee_id,name:e.name||e.employee_id,factory:e.factory,team:e.team||""}))
    .filter(r=>passTeam(r.team));

  view.meal=state.meal.filter(m=>passFactory(m))
    .map(m=>({employee_id:m.employee_id,name:m.name||m.employee_id,factory:m.factory,team:empTeam[m.employee_id]||"",time:hhmm(m.created_at)}))
    .filter(r=>passTeam(r.team));

  // 퇴근 미타각: 출근(입력) 했으나 퇴근 기록이 없는 직원
  view.noout=view.att.filter(r=>!r.noIn && !r.outTime);
  // 조퇴: 퇴근 타각이 정규 퇴근시각보다 이른 직원
  view.early=view.att.filter(r=>r.early);

  $("kIn").textContent=view.att.length;
  $("kLate").textContent=view.att.filter(r=>r.late).length;
  $("kPresent").textContent=view.att.filter(r=>r.status==="in").length;
  $("kOut").textContent=view.att.filter(r=>r.status==="out").length;
  $("kAbsent").textContent=state.employees.length?view.absent.length:"–";
  $("kMeal").textContent=view.meal.length;
  // 총원(재직, 현재 필터 기준) = 출근 + 미출근 / 출근율·식사신청 비율
  const loaded=state.employees.length>0;
  const total=loaded?(view.att.length+view.absent.length):0;
  $("kTotal").textContent=loaded?total:"–";
  const pct=(n)=> total>0 ? Math.round(n/total*100)+"%" : "";
  const setRate=(id,n)=>{ const el=$(id); if(loaded&&total>0){ el.textContent=pct(n); el.style.display=""; } else el.style.display="none"; };
  setRate("rIn", view.att.length);
  setRate("rMeal", view.meal.length);
  render();
}
function populateTeamFilter(){
  if(!$("fTeam")) return;
  const cur=$("fTeam").value;
  const set=new Set();
  state.employees.forEach(e=>{ if(e.team&&String(e.team).trim()) set.add(e.team); });
  const teams=[...set].sort((a,b)=>String(a).localeCompare(String(b),'ko'));
  $("fTeam").innerHTML=`<option value="">${t("all")}</option>`+teams.map(tm=>`<option value="${escapeHtml(tm)}">${escapeHtml(tm)}</option>`).join("");
  $("fTeam").value=(cur===""||teams.includes(cur))?cur:"";
}

function setTab(tb){ state.tab=tb; sortKey=null; document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===tb)); render(); }
function COLS(){
  const T=I18N[lang];
  return {
    att:[["employee_id",T.colId],["name",T.colName],["team",T.colTeam],["factory",T.colPlant],["inTime",T.colIn],["outTime",T.colOut],["status",T.colState],["work",T.colWork],["__photo",T.colPhoto]],
    absent:[["employee_id",T.colId],["name",T.colName],["team",T.colTeam],["factory",T.colPlant],["__checkin",T.colAction]],
    meal:[["employee_id",T.colId],["name",T.colName],["team",T.colTeam],["factory",T.colPlant],["time",T.colTime]],
    noout:[["employee_id",T.colId],["name",T.colName],["team",T.colTeam],["factory",T.colPlant],["inTime",T.colIn],["work",T.colWork],["__photo",T.colPhoto],["__checkout",T.colAction]],
    early:[["employee_id",T.colId],["name",T.colName],["team",T.colTeam],["factory",T.colPlant],["inTime",T.colIn],["outTime",T.colOut],["work",T.colWork],["__photo",T.colPhoto]]
  };
}
function curRows(){ return view[state.tab].slice(); }

function render(){
  $("bMealAdd").style.display = state.tab==="meal" ? "" : "none";
  $("tblTitle").textContent=({att:t("tabAtt"),absent:t("tabAbsent"),meal:t("tabMeal"),noout:t("tabNoout"),early:t("tabEarly")})[state.tab]+" "+I18N[lang].listTitle(view[state.tab].length+(lang==="ko"?(I18N.ko.persons):""));
  renderBars(); renderTable();
}
function barColor(){ return ({att:"linear-gradient(90deg,#22c55e,#15a34a)",absent:"linear-gradient(90deg,#f87171,#dc2626)",meal:"linear-gradient(90deg,#2dd4bf,#0d8276)",noout:"linear-gradient(90deg,#fbbf24,#d97706)",early:"linear-gradient(90deg,#a78bfa,#7c3aed)"})[state.tab]||"linear-gradient(90deg,#1e4d8b,#0c2444)"; }
function renderBars(){
  const byTeam = state.tab==="noout"||state.tab==="early";
  $("barTitle").textContent = byTeam ? t("barTeam") : t("barPlant");
  const rows=curRows(); const counts={};
  for(const r of rows){ const k = byTeam ? (r.team&&String(r.team).trim()?r.team:t("noTeam")) : (plantName(r.factory)||"-"); counts[k]=(counts[k]||0)+1; }
  const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const max=Math.max(1,...entries.map(e=>e[1]));
  $("bars").innerHTML=entries.length?entries.map(([k,v])=>`
    <div class="bar-row"><span class="lab">${escapeHtml(k)}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${(v/max*100).toFixed(0)}%;background:${barColor()}"></span></span>
      <span class="num">${v}</span></div>`).join(""):`<div class="empty">${t("empty")}</div>`;
}
function workPill(r){
  if(r.late&&r.early) return `<span class="pill late">${t("late")}</span> <span class="pill early">${t("early")}</span>`;
  if(r.late) return `<span class="pill late">${t("late")}</span>`;
  if(r.early) return `<span class="pill early">${t("early")}</span>`;
  return `<span class="pill normal">${t("normal")}</span>`;
}
function renderTable(){
  const cols=COLS()[state.tab]; let rows=curRows();
  if(sortKey){ rows.sort((a,b)=>{ const x=(a[sortKey]??""),y=(b[sortKey]??""); return (x>y?1:x<y?-1:0)*sortDir; }); }
  const thead=$("tbl").querySelector("thead"), tbody=$("tbl").querySelector("tbody");
  thead.innerHTML="<tr>"+cols.map(c=>{ const arrow=sortKey===c[0]?(sortDir>0?" ▲":" ▼"):""; const oc=c[0].startsWith("__")?"":`onclick="sortBy('${c[0]}')"`; return `<th ${oc}>${escapeHtml(c[1])}${arrow}</th>`; }).join("")+"</tr>";
  if(rows.length===0){ tbody.innerHTML=`<tr><td colspan="${cols.length}"><div class="empty">${t("empty")}</div></td></tr>`; return; }
  tbody.innerHTML=rows.map(r=>"<tr>"+cols.map(c=>{
    const f=c[0];
    if(f==="__photo") return r.photoId?`<td><button class="photo-btn" onclick="showPhoto('${r.photoId}','${escapeHtml(r.name)}','${escapeHtml(plantName(r.factory))}')">${t("photoView")}</button></td>`:"<td>–</td>";
    if(f==="__checkin") return `<td><button class="act-btn" onclick="markPresent('${r.employee_id}',this)">${t("btnCheckin")}</button></td>`;
    if(f==="__checkout") return `<td><button class="act-btn" onclick="markLeft('${r.employee_id}',this)">${t("btnCheckout")}</button></td>`;
    if(f==="status") return r.status==="in"?`<td><span class="pill in">${t("present")}</span></td>`:`<td><span class="pill out">${t("left")}</span></td>`;
    if(f==="work") return `<td>${workPill(r)}</td>`;
    if(f==="factory") return `<td>${escapeHtml(plantName(r.factory))}</td>`;
    if(f==="team") return `<td>${r.team&&String(r.team).trim()?escapeHtml(r.team):"–"}</td>`;
    return `<td>${escapeHtml(r[f]!=null?String(r[f]):"")}</td>`;
  }).join("")+"</tr>").join("");
}
function sortBy(k){ if(sortKey===k) sortDir*=-1; else { sortKey=k; sortDir=1; } renderTable(); }

function openAdd(){
  editingId=null;

  editingId=id;
  $("aFactory").innerHTML=factoryOptions();
  $("aId").value=row.employee_id; $("aName").value=row.name||""; $("aKo").value=row.name_ko||"";

async function submitAdd(){
  const id=$("aId").value.trim().toUpperCase(), name=$("aName").value.trim();
  if(!id||!name){ $("addMsg").textContent=t("needMsg"); return; }
  $("aOk").disabled=true; $("addMsg").textContent="";
  const payload={name:name, name_ko:$("aKo").value.trim(), team:$("aTeam").value.trim(), factory:$("aFactory").value};
  const wasEdit=!!editingId;
  try{
    let r;
    if(wasEdit){
      r=await fetch(REST(`${CONFIG.T_EMPLOYEES}?employee_id=eq.${encodeURIComponent(editingId)}`),
        {method:"PATCH",headers:{...HEADERS,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify(payload)});
    } else {
      r=await fetch(REST(CONFIG.T_EMPLOYEES),
        {method:"POST",headers:{...HEADERS,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({employee_id:id, ...payload, active:true})});
      if(r.status===409){ $("addMsg").textContent=t("dupMsg"); $("aOk").disabled=false; return; }
    }
    if(!r.ok){ $("addMsg").textContent=t("addFail"); console.error(await r.text()); $("aOk").disabled=false; return; }
    if(wasEdit){ const row=manageData.find(x=>x.employee_id===id); if(row) Object.assign(row,payload); }
    closeAdd();
    if(wasEdit && $("manageModal").classList.contains("open")) renderManage();
    refresh();
  }catch(e){ $("addMsg").textContent=t("addFail"); }
  finally{ $("aOk").disabled=false; }
}

/* ---------- 미출근 → 출석 처리 (수기) ---------- */
function isoAtLocal(dateStr, hm){
  const [y,m,d]=dateStr.split("-").map(Number); const [hh,mm]=(hm||"08:30").split(":").map(Number);
  const utcMs=Date.UTC(y,m-1,d,hh,mm,0)-CONFIG.TZ_OFFSET_HOURS*3600*1000;
  return new Date(utcMs).toISOString();
}
async function markPresent(empId, btn){
  const row=view.absent.find(r=>r.employee_id===empId); if(!row) return;
  if(!confirm(t("confirmCheckin")(row.name))) return;
  if(btn){ btn.disabled=true; btn.textContent=t("processing"); }
  const date=$("fDate").value||todayDate(); const sched=plantSched(row.factory);
  const body={ employee_id:empId, name:row.name, type:"in", factory:row.factory, flag:"normal", created_at:isoAtLocal(date,sched.inBy) };
  try{
    const r=await fetch(REST(CONFIG.T_RECORDS),{method:"POST",headers:{...HEADERS,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify(body)});
    if(!r.ok){ console.error(await r.text()); if(btn){ btn.disabled=false; btn.textContent=t("btnCheckin"); } alert(t("opFail")); return; }
    refresh();
  }catch(e){ if(btn){ btn.disabled=false; btn.textContent=t("btnCheckin"); } alert(t("opFail")); }
}
async function markLeft(empId, btn){
  const row=view.noout.find(r=>r.employee_id===empId); if(!row) return;
  if(!confirm(t("confirmCheckout")(row.name))) return;
  if(btn){ btn.disabled=true; btn.textContent=t("processing"); }
  const date=$("fDate").value||todayDate(); const sched=plantSched(row.factory);
  const body={ employee_id:empId, name:row.name, type:"out", factory:row.factory, flag:"normal", created_at:isoAtLocal(date,sched.outBy) };
  try{

async function fetchRange(table, selectCols, fromISO, toISO, factory){
  const rows=[]; const PAGE=1000;
  let extra=`select=${selectCols}&created_at=gte.${encodeURIComponent(fromISO)}&created_at=lt.${encodeURIComponent(toISO)}`;
  if(factory) extra+=`&factory=eq.${encodeURIComponent(factory)}`;
  for(let off=0; off<60000; off+=PAGE){
    let chunk; try{ chunk=await getJson(REST(`${table}?${extra}&order=created_at.asc&limit=${PAGE}&offset=${off}`)); }
    catch(e){ break; }
    if(!chunk||!chunk.length) break; rows.push(...chunk); if(chunk.length<PAGE) break;
  }
  return rows.filter(r=>!isTestId(r.employee_id));
}
async function runQuery(){
  const item=$("qItem").value, unit=$("qUnit").value;
  const from=$("qFrom").value, to=$("qTo").value;
  const factory=$("qFactory").value, teamSel=$("qTeam").value;
  if(!from||!to){ return; }
  const fromISO=dayBounds(from).start, toISO=dayBounds(to).end;
  $("qRun").disabled=true; $("qExp").disabled=true; $("qSum").textContent=t("qLoading");
  $("qTable").querySelector("thead").innerHTML=""; $("qTable").querySelector("tbody").innerHTML="";
  try{
    // 직원 마스터 매핑
    const emp={}; for(const e of state.employees){ emp[e.employee_id]={name:e.name||e.employee_id,team:(e.team||"").trim(),factory:e.factory}; }
    const val={}; // employee_id → 값(정수)
    if(item==="meal"){
      const recs=await fetchRange(CONFIG.T_MEALS,"employee_id,factory,created_at",fromISO,toISO,factory);
      for(const r of recs){ val[r.employee_id]=(val[r.employee_id]||0)+1; }
    } else {
      const recs=await fetchRange(CONFIG.T_RECORDS,"employee_id,factory,type,created_at",fromISO,toISO,factory);
      // employee → date → {in:firstMin, out:bool, fac}
      const byEmpDate={};
      for(const r of recs){
        const d=localDate(r.created_at); const k=r.employee_id;
        (byEmpDate[k]=byEmpDate[k]||{});
        const cell=(byEmpDate[k][d]=byEmpDate[k][d]||{inMin:null,out:false,outMin:null,fac:r.factory});
        if(r.type==="in"){ const m=localMin(r.created_at); if(cell.inMin==null||m<cell.inMin) cell.inMin=m; if(cell.fac==null) cell.fac=r.factory; }
        if(r.type==="out"){ cell.out=true; const m=localMin(r.created_at); if(cell.outMin==null||m>cell.outMin) cell.outMin=m; }
      }
      for(const k in byEmpDate){
        let c=0;
        for(const d in byEmpDate[k]){
          const cell=byEmpDate[k][d]; const hasIn=cell.inMin!=null;
          if(item==="att"){ if(hasIn) c++; }
          else if(item==="late"){ if(hasIn){ const sc=plantSched(cell.fac); if(cell.inMin>hmToMin(sc.inBy)) c++; } }
          else if(item==="noout"){ if(hasIn && !cell.out) c++; }
          else if(item==="early"){ if(cell.out && cell.outMin!=null){ const sc=plantSched(cell.fac); if(cell.outMin<hmToMin(sc.outBy)) c++; } }
        }
        if(c>0) val[k]=c;
      }
    }
    // 팀 필터 + 행 구성
    let rows=Object.keys(val).map(id=>{
      const e=emp[id]||{name:id,team:"",factory:""};
      return { employee_id:id, name:e.name, team:e.team||t("noTeam"), value:val[id] };
    });
    if(teamSel) rows=rows.filter(r=>r.team===teamSel);
    const valUnit = item==="meal" ? t("qUnitCnt") : (item==="att" ? t("qUnitAtt") : t("qUnitCnt"));
    const itemLabel = ({att:t("qItemAtt"),late:t("qItemLate"),noout:t("qItemNoout"),early:t("qItemEarly"),meal:t("qItemMeal")})[item];
    let outRows, cols, sum=0;
    if(unit==="team"){
      const agg={};
      for(const r of rows){ const g=(agg[r.team]=agg[r.team]||{team:r.team,people:0,value:0}); g.people++; g.value+=r.value; }
      outRows=Object.values(agg).sort((a,b)=>b.value-a.value);
      outRows.forEach(r=>sum+=r.value);
      cols=[["team",t("qTeamL")],["people",t("qColEmp"),true],["value",itemLabel+" ("+valUnit+")",true]];
    } else {
      outRows=rows.sort((a,b)=>b.value-a.value||(a.employee_id<b.employee_id?-1:1));
      outRows.forEach(r=>sum+=r.value);
      cols=[["employee_id",t("colId")],["name",t("colName")],["team",t("colTeam")],["value",itemLabel+" ("+valUnit+")",true]];
    }
    queryResult={item,unit,from,to,cols,rows:outRows};
    renderQuery();
    const people = unit==="team" ? rows.length : outRows.length;
    $("qSum").textContent = outRows.length ? t("qSum")(people,sum) : "";
    if(!outRows.length){ $("qTable").querySelector("tbody").innerHTML=`<tr><td>${t("qNoData")}</td></tr>`; }
    $("qExp").disabled = !outRows.length;
  }catch(e){ console.error(e); $("qSum").textContent=t("qNoData"); }
  finally{ $("qRun").disabled=false; }
}

/* --- CSV 파서 --- */
function cleanCell(v){ return String(v==null?"":v).replace(/[\u00A0\u2000-\u200B\uFEFF\t\r\n]/g," ").replace(/\s+/g," ").trim(); }
function decodeCsvBuf(buf){
  let txt=new TextDecoder("utf-8").decode(buf);
  const bad=(txt.match(/\uFFFD/g)||[]).length;
  if(bad>0){ try{ const alt=new TextDecoder("euc-kr").decode(buf);
    if((alt.match(/\uFFFD/g)||[]).length<bad) txt=alt; }catch(e){} }
  return txt;
}
function detectDelim(text){
  const head=text.split(/\r?\n/).slice(0,5).join("\n");
  const n=ch=>(head.split(ch).length-1);
  const c={",":n(","),";":n(";"),"\t":n("\t")};
  if(c[";"]>c[","]&&c[";"]>=c["\t"]) return ";";
  if(c["\t"]>c[","]&&c["\t"]>c[";"]) return "\t";
  return ",";
}
function parseCsv(text,delim){
  delim=delim||",";
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const rows=[]; let row=[],cur="",inQ=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else inQ=false; } else cur+=ch; }
    else { if(ch==='"') inQ=true; else if(ch===delim) {row.push(cur);cur="";}
      else if(ch==='\r'){} else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else cur+=ch; }
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
/* --- 최소 XLSX(zip) 리더 --- */
function colRefToIndex(ref){ const m=/^([A-Z]+)\d+$/.exec(ref||""); if(!m) return -1;
  let s=m[1],n=0; for(let i=0;i<s.length;i++) n=n*26+(s.charCodeAt(i)-64); return n-1; }
async function unzipEntries(buf){
  const u8=new Uint8Array(buf), dv=new DataView(buf);
  let eocd=-1; for(let i=u8.length-22;i>=0;i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd<0) throw new Error("not a zip");
  const cdCount=dv.getUint16(eocd+10,true); let off=dv.getUint32(eocd+16,true);
  const files={};
  for(let n=0;n<cdCount;n++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    const method=dv.getUint16(off+10,true), compSize=dv.getUint32(off+20,true);
    const nameLen=dv.getUint16(off+28,true), extraLen=dv.getUint16(off+30,true), commentLen=dv.getUint16(off+32,true);
    const localOff=dv.getUint32(off+42,true);
    const name=new TextDecoder().decode(u8.subarray(off+46,off+46+nameLen));
    const lNameLen=dv.getUint16(localOff+26,true), lExtraLen=dv.getUint16(localOff+28,true);
    const dataStart=localOff+30+lNameLen+lExtraLen;
    files[name]={method, raw:u8.subarray(dataStart,dataStart+compSize)};
    off+=46+nameLen+extraLen+commentLen;
  }
  async function inflate(raw){
    if(typeof DecompressionStream==="undefined") throw new Error("no DecompressionStream");
    const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  return { files, read: async name=>{ const f=files[name]; if(!f) return null;
    const bytes=f.method===0?f.raw:await inflate(f.raw); return new TextDecoder("utf-8").decode(bytes); } };
}
async function parseXlsxAoa(buf){
  const zip=await unzipEntries(buf);
  let shared=[]; const ssXml=await zip.read("xl/sharedStrings.xml");
  if(ssXml){ const doc=new DOMParser().parseFromString(ssXml,"application/xml");
    const sis=doc.getElementsByTagName("si");
    for(let i=0;i<sis.length;i++){ const ts=sis[i].getElementsByTagName("t"); let s="";
      for(let j=0;j<ts.length;j++) s+=ts[j].textContent; shared.push(s); } }
  let wsXml=await zip.read("xl/worksheets/sheet1.xml");
  if(!wsXml){ const nm=Object.keys(zip.files).find(n=>/^xl\/worksheets\/.*\.xml$/.test(n)); if(nm) wsXml=await zip.read(nm); }
  if(!wsXml) throw new Error("no sheet");
  const doc=new DOMParser().parseFromString(wsXml,"application/xml");
  const rowsEl=doc.getElementsByTagName("row"); const aoa=[];
  for(let i=0;i<rowsEl.length;i++){
    const cells=rowsEl[i].getElementsByTagName("c"); const arr=[]; let lastIdx=-1;
    for(let j=0;j<cells.length;j++){ const c=cells[j];
      const colIdx=colRefToIndex(c.getAttribute("r")); const type=c.getAttribute("t"); let val="";
      if(type==="inlineStr"){ const ts=c.getElementsByTagName("t"); for(let k=0;k<ts.length;k++) val+=ts[k].textContent; }
      else { const vEl=c.getElementsByTagName("v")[0]; const raw=vEl?vEl.textContent:"";
        val = type==="s" ? (shared[parseInt(raw,10)]||"") : raw; }
      if(colIdx>=0){ arr[colIdx]=val; lastIdx=colIdx; } else { arr[++lastIdx]=val; }
    }
    aoa.push(arr);
  }
  return aoa;
}
async function handleEmpUpload(e){
  const file=e.target.files&&e.target.files[0]; e.target.value="";
  if(!file) return;
  const lower=file.name.toLowerCase();
  setIoBusy(true,t("ioReading"));
  try{
    let aoa;
    if(lower.endsWith(".csv")){ const txt=decodeCsvBuf(await file.arrayBuffer()); aoa=parseCsv(txt,detectDelim(txt)); }
    else if(lower.endsWith(".xlsx")){ ioMsg(t("ioParsing")); aoa=await parseXlsxAoa(await file.arrayBuffer()); }
    else { setIoBusy(false); ioMsg(t("ioBadFile"),true); return; }
    const isId=v=>/^M\d{3,}/i.test(String(v||"").trim());
    // 모든 셀 정리(특수공백 제거) 후 빈 행 제거
    let data=(aoa||[]).map(r=>(r||[]).map(cleanCell)).filter(r=>r.some(c=>c!==""));
    // 제목/머리글 행 제거: 사번 형식(M+숫자)이 나올 때까지 앞행 제거 (최대 5행)
    let drop=0; while(drop<data.length && drop<5 && !isId(data[drop][0])) drop++;
    data=data.slice(drop);
    const list=[]; let bad=0, noTeam=0;
    for(const r of data){
      const id=String(r[0]||"").trim().toUpperCase(); const name=String(r[1]||"").trim();
      if(!id||!name||/[\s\/]/.test(id)){ bad++; continue; }
      const team=String(r[3]||"").trim(); if(!team) noTeam++;
      list.push({ employee_id:id, name, name_ko:String(r[2]||"").trim(), team, factory:factoryFromInput(r[4]) });
    }
    if(!list.length){ setIoBusy(false); ioMsg(t("ioEmpty"),true); return; }
    let msg=t("ioConfirm")(list.length);
    if(bad) msg+="\n"+(lang==="es"?`⚠ ${bad} filas omitidas (N°/nombre inválido)`:`⚠ 형식 오류로 제외된 행: ${bad}건 (사번/이름 확인)`);
    if(noTeam) msg+="\n"+(lang==="es"?`⚠ ${noTeam} filas sin equipo`:`⚠ 팀명이 비어있는 행: ${noTeam}건`);
    if(!confirm(msg)){ setIoBusy(false); ioMsg(""); return; }
    await bulkUpsertEmployees(list);
  }catch(err){ console.error(err); setIoBusy(false); ioMsg(t("ioParseErr"),true); }
}
async function bulkUpsertEmployees(list){
  ioMsg(t("ioUploading")("0"));
  let existing=new Set();
  try{ const rows=await getJson(REST(`${CONFIG.T_EMPLOYEES}?select=employee_id&limit=10000`));
    (rows||[]).forEach(r=>existing.add(String(r.employee_id).toUpperCase())); }catch(e){}
  const map=new Map(); list.forEach(o=>map.set(o.employee_id,o)); const uniq=[...map.values()];
  const news=uniq.filter(o=>!existing.has(o.employee_id));
  const upds=uniq.filter(o=>existing.has(o.employee_id));
  let added=0,updated=0,fail=0,done=0; const total=uniq.length;
  const prog=()=>ioMsg(t("ioUploading")(`${done}/${total}`));
  for(let i=0;i<news.length;i+=200){
    const chunk=news.slice(i,i+200).map(o=>({...o,active:true}));
    try{ const r=await fetch(REST(CONFIG.T_EMPLOYEES),{method:"POST",headers:{...HEADERS,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify(chunk)});
      if(r.ok) added+=chunk.length; else { fail+=chunk.length; console.error(await r.text()); }
    }catch(e){ fail+=chunk.length; }
    done+=chunk.length; prog();
  }
  const pool=6;
  for(let i=0;i<upds.length;i+=pool){
    await Promise.all(upds.slice(i,i+pool).map(async o=>{
      // 빈 값은 보내지 않음 → 기존 팀명/한글약칭이 공백으로 지워지는 것 방지
      const body={name:o.name,factory:o.factory};
      if(o.name_ko) body.name_ko=o.name_ko;
      if(o.team) body.team=o.team;
      try{ const r=await fetch(REST(`${CONFIG.T_EMPLOYEES}?employee_id=eq.${encodeURIComponent(o.employee_id)}`),
        {method:"PATCH",headers:{...HEADERS,"Content-Type":"application/json","Prefer":"return=minimal"},
         body:JSON.stringify(body)});
        if(r.ok) updated++; else fail++;
      }catch(e){ fail++; }
      done++; prog();
    }));
  }
  setIoBusy(false);
  ioMsg(t("ioDone")(added,updated,fail), fail>0);
  try{ const rows=await getJson(REST(`${CONFIG.T_EMPLOYEES}?select=employee_id,name,name_ko,team,factory,active&order=active.desc,employee_id.asc&limit=5000`));
    manageData=Array.isArray(rows)?rows:[]; renderManage(); }catch(e){}
  refresh();
}

/* ---------- Excel(.xlsx) 내보내기 (라이브러리 없음) ---------- */
function makeXlsx(sheetName, aoa){
  const crcTable=(()=>{const tb=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);tb[n]=c>>>0;}return tb;})();
  function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=crcTable[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
  const enc=new TextEncoder(); const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const colN=i=>{let s="";i++;while(i>0){let m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=(i-(m+1))/26;}return s;};
  let rowsXml="";
  aoa.forEach((row,r)=>{ let cells=""; row.forEach((val,c)=>{ const ref=colN(c)+(r+1);
    if(typeof val==="number"&&isFinite(val)) cells+=`<c r="${ref}"><v>${val}</v></c>`;
    else cells+=`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${esc(val==null?"":val)}</t></is></c>`;
  }); rowsXml+=`<row r="${r+1}">${cells}</row>`; });
  const sheet=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${rowsXml}</sheetData></worksheet>`;
  const files=[
    {name:"[Content_Types].xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`},
    {name:"_rels/.rels",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:"xl/workbook.xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${esc(sheetName).slice(0,31)}" sheetId="1" r:id="rId1"/></sheets></workbook>`},
    {name:"xl/_rels/workbook.xml.rels",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>`},
    {name:"xl/worksheets/sheet1.xml",data:sheet}
  ];
  const chunks=[],central=[]; let offset=0;
  const u16=n=>[n&0xFF,(n>>8)&0xFF], u32=n=>[n&0xFF,(n>>8)&0xFF,(n>>16)&0xFF,(n>>24)&0xFF];
  for(const f of files){ const nm=enc.encode(f.name),da=enc.encode(f.data),crc=crc32(da);
    const local=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(da.length),u32(da.length),u16(nm.length),u16(0));
    chunks.push(new Uint8Array(local),nm,da);
    const cd=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(da.length),u32(da.length),u16(nm.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset));
    central.push(new Uint8Array(cd),nm); offset+=local.length+nm.length+da.length; }
  let cdSize=0; central.forEach(c=>cdSize+=c.length);
  const eocd=[].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cdSize),u32(offset),u16(0));
  const all=[...chunks,...central,new Uint8Array(eocd)]; let total=0; all.forEach(a=>total+=a.length);
  const out=new Uint8Array(total); let p=0; for(const a of all){ out.set(a,p); p+=a.length; } return out;
}
function exportXlsx(){
  const cols=COLS()[state.tab].filter(c=>!c[0].startsWith("__"));
  const rows=curRows();
  const aoa=[cols.map(c=>c[1])];
  for(const r of rows){
    aoa.push(cols.map(c=>{
      let v=r[c[0]];
      if(c[0]==="status") return r.status==="in"?t("present"):t("left");
      if(c[0]==="work") return r.late&&r.early?(t("late")+"·"+t("early")):r.late?t("late"):r.early?t("early"):t("normal");
      if(c[0]==="factory") return plantName(r.factory);
      return v==null?"":v;
    }));
  }
  const sheet=state.tab+"_"+$("fDate").value;
  const u8=makeXlsx(sheet, aoa);
  const blob=new Blob([u8],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=sheet+".xlsx";
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- 직원 명단 다운로드 (퇴사자 포함 전체) ---------- */
function downloadEmpList(){
  if(!manageData.length){ ioMsg(t("loading"),true); return; }
  const T=I18N[lang];
  const aoa=[[T.fId,T.fName,T.fKo,T.fTeam,T.fPlant,T.expHire,T.expStatus,T.expResigned]];
  for(const r of manageData){
    aoa.push([ r.employee_id||"", r.name||"", r.name_ko||"", r.team||"", plantName(r.factory),
      r.hire_date?String(r.hire_date).slice(0,10):"",
      r.active===false?T.stResigned:T.stActive,
      r.resigned_at?String(r.resigned_at).slice(0,10):"" ]);
  }
  const sheet=(lang==="ko"?"직원명단_":"empleados_")+todayDate();
  const u8=makeXlsx(sheet,aoa);
  const blob=new Blob([u8],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=sheet+".xlsx";
  document.body.appendChild(a); a.click(); a.remove();
}
