<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 대시보드 · Panel</title>
<style>
  :root{
    --navy:#0c2444;--navy2:#163a66;--gold:#c9a14a;--gold2:#e3c878;
    --bg1:#eef2f8;--bg2:#e4eaf3;--card:#fff;--line:#e6ebf2;--ink:#0b1220;--muted:#6b7a90;
    --green:#15a34a;--slate:#475569;--red:#dc2626;--teal:#0d8276;--amber:#d97706}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:radial-gradient(1200px 600px at 50% -200px,#f4f7fc,transparent),linear-gradient(180deg,var(--bg1),var(--bg2));
    background-attachment:fixed;color:var(--ink);min-height:100vh}
  .wrap{max-width:1160px;margin:0 auto;padding:18px 16px 40px}

  /* ---------- 헤더 ---------- */
  header{position:relative;overflow:hidden;color:#fff;border-radius:18px;padding:20px 22px;
    display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px;
    background:linear-gradient(120deg,#0a1f3c 0%,#13335c 55%,#0d2748 100%);
    box-shadow:0 18px 40px -20px rgba(12,36,68,.65),0 2px 6px rgba(12,36,68,.2)}
  header::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold))}
  header::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle,rgba(201,161,74,.18),transparent 70%);pointer-events:none}
  .brand{display:flex;align-items:center;gap:14px;min-width:0}
  .logo{width:48px;height:48px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:18px;letter-spacing:.5px;color:#1a1407;
    background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 6px 16px -6px rgba(201,161,74,.7);position:relative;z-index:1}
  .brand-name{font-size:18px;font-weight:900;letter-spacing:.6px;line-height:1.1}
  .brand-sub{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.72);margin-top:3px}
  .brand-sub b{color:var(--gold2);font-weight:800}

  .filters{display:flex;gap:9px;align-items:center;flex-wrap:wrap;position:relative;z-index:1}
  .filters .fld{display:inline-flex;flex-direction:column;gap:3px}
  .filters label{font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;opacity:.65;font-weight:700}
  .filters select,.filters input[type=date]{padding:8px 11px;border:1px solid rgba(255,255,255,.22);border-radius:10px;
    background:rgba(255,255,255,.1);color:#fff;font-size:13px;font-weight:600;outline:none;transition:.15s}
  .filters select:focus,.filters input[type=date]:focus{border-color:var(--gold);background:rgba(255,255,255,.16)}
  .filters select option{color:#0b1220}
  .rbtn{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1407;border:none;border-radius:10px;
    padding:9px 16px;font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 6px 14px -6px rgba(201,161,74,.7);transition:.15s}
  .rbtn:hover{filter:brightness(1.05);transform:translateY(-1px)}
  .lang{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;font-weight:800;font-size:12px;
    padding:9px 12px;border-radius:10px;cursor:pointer;transition:.15s}
  .lang:hover{background:rgba(255,255,255,.22)}
  .toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;opacity:.85;font-weight:600}
  .updated{flex-basis:100%;font-size:11.5px;opacity:.62;font-weight:600;margin-top:4px;position:relative;z-index:1}

  /* ---------- KPI ---------- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin-bottom:18px}
  .kpi{position:relative;overflow:hidden;background:var(--card);border-radius:16px;padding:16px 17px 17px;
    border:1px solid rgba(12,36,68,.05);
    box-shadow:0 1px 2px rgba(12,36,68,.04),0 16px 32px -20px rgba(12,36,68,.30);transition:transform .18s,box-shadow .18s}
  .kpi:hover{transform:translateY(-3px);box-shadow:0 1px 2px rgba(12,36,68,.05),0 22px 38px -18px rgba(12,36,68,.36)}
  .kpi-top{display:flex;align-items:center;gap:10px;margin-bottom:13px}
  .kpi-ic{width:38px;height:38px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;background:#e8eef7;color:var(--navy2)}
  .kpi-ic svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .kpi.green .kpi-ic{background:#e7f7ee;color:#15a34a}
  .kpi.amber .kpi-ic{background:#fdf1e1;color:#d97706}
  .kpi.slate .kpi-ic{background:#eef1f6;color:#475569}
  .kpi.red   .kpi-ic{background:#fdecec;color:#dc2626}
  .kpi.teal  .kpi-ic{background:#e4f6f2;color:#0d8276}
  .kpi .l{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.2px}
  .kpi-bot{display:flex;align-items:baseline}
  .kpi .v{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-1px;color:#0c2444;line-height:1}
  .kpi .unit{font-size:13px;font-weight:700;color:var(--muted);margin-left:5px}

  /* ---------- 탭 (세그먼트) ---------- */
  .tabs{display:inline-flex;gap:4px;margin-bottom:16px;flex-wrap:wrap;background:#fff;padding:5px;border-radius:14px;
    box-shadow:0 1px 2px rgba(12,36,68,.05),0 10px 24px -16px rgba(12,36,68,.3)}
  .tab{background:transparent;color:var(--muted);border:none;border-radius:10px;padding:9px 18px;font-weight:800;font-size:13.5px;cursor:pointer;transition:.15s}
  .tab:hover{color:var(--navy2);background:#f1f5fa}
  .tab.active{background:linear-gradient(135deg,#13335c,#0c2444);color:#fff;box-shadow:0 6px 14px -6px rgba(12,36,68,.6)}

  /* ---------- 카드 ---------- */
  .card{background:var(--card);border-radius:16px;box-shadow:0 1px 2px rgba(12,36,68,.05),0 14px 30px -20px rgba(12,36,68,.25);
    padding:18px 20px;margin-bottom:16px;border:1px solid rgba(12,36,68,.04)}
  .card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
  .card .head h3{margin:0;font-size:14px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:9px}
  .card .head h3::before{content:"";width:4px;height:16px;border-radius:3px;background:linear-gradient(180deg,var(--gold2),var(--gold))}
  .xbtn{background:linear-gradient(135deg,#1aa05a,#107c41);border:none;color:#fff;border-radius:10px;padding:8px 15px;font-weight:800;font-size:12px;cursor:pointer;
    box-shadow:0 6px 14px -6px rgba(16,124,65,.6);transition:.15s;display:inline-flex;align-items:center;gap:6px}
  .xbtn::before{content:"⤓";font-size:13px}
  .xbtn:hover{filter:brightness(1.05);transform:translateY(-1px)}

  /* ---------- 막대 ---------- */
  .bars{display:flex;flex-direction:column;gap:9px}
  .bar-row{display:grid;grid-template-columns:110px 1fr 46px;align-items:center;gap:10px;font-size:13px}
  .bar-row .lab{font-weight:700;color:#334155}
  .bar-track{background:#eef2f8;border-radius:8px;height:20px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(12,36,68,.06)}
  .bar-fill{height:100%;border-radius:8px;min-width:3px;transition:width .5s cubic-bezier(.2,.7,.2,1);box-shadow:0 1px 3px rgba(12,36,68,.18)}
  .bar-row .num{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;color:#0c2444}

  /* ---------- 표 ---------- */
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;padding:10px 11px;border-bottom:2px solid #eef2f8;color:var(--muted);font-size:11px;
    letter-spacing:.4px;text-transform:uppercase;font-weight:800;white-space:nowrap;cursor:pointer;user-select:none;transition:.12s}
  thead th:hover{color:var(--navy)}
  tbody td{padding:11px;border-bottom:1px solid #f3f6fa;white-space:nowrap;font-weight:500}
  tbody tr{transition:.1s}
  tbody tr:hover{background:#f6f9fd}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.2px}
  .pill.in{background:#dcfce7;color:#15803d}.pill.out{background:#eef2f6;color:#475569}
  .pill.normal{background:#dcfce7;color:#15803d}.pill.late{background:#fee2e2;color:#b91c1c}.pill.early{background:#fef3c7;color:#92400e}
  .photo-btn{background:#eef3f9;border:1px solid #e2e9f1;border-radius:8px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--navy);cursor:pointer;transition:.12s}
  .photo-btn:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
  .empty{padding:34px;text-align:center;color:var(--muted);font-weight:600}
  .scroll{overflow-x:auto}

  /* ---------- 푸터 ---------- */
  .foot{text-align:center;color:var(--muted);font-size:11.5px;font-weight:600;margin-top:6px;opacity:.8}
  .foot b{color:var(--navy)}

  /* ---------- 모달 ---------- */
  .modal{position:fixed;inset:0;background:rgba(8,15,28,.72);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal.open{display:flex}
  .modal .box{background:#fff;border-radius:18px;padding:16px;max-width:360px;text-align:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
  .modal img{width:100%;border-radius:12px;background:#f1f5f9;min-height:120px}
  .modal .mname{font-weight:800;margin:12px 0 4px;color:#0c2444}
  .modal button{margin-top:12px;background:linear-gradient(135deg,#13335c,#0c2444);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-weight:800;cursor:pointer}

  /* ---------- 잠금 ---------- */
  .gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:99;color:#fff;
    background:radial-gradient(900px 500px at 50% 0,#13335c,transparent),linear-gradient(180deg,#0c2444,#081a33)}
  .gate .glogo{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;color:#1a1407;
    background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 12px 30px -10px rgba(201,161,74,.7);margin-bottom:4px}
  .gate input{font-size:24px;letter-spacing:6px;text-align:center;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.2);width:220px;background:rgba(255,255,255,.95);color:#0c2444;font-weight:800}
  .gate button{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1407;border:none;border-radius:12px;padding:12px 26px;font-weight:800;cursor:pointer}
  .gate .msg{font-size:13px;min-height:18px;color:#fecaca}

  @media (max-width:560px){ .brand-name{font-size:16px} .kpi .v{font-size:28px} .wrap{padding:12px 11px 32px} }
  @media print{ .filters,.xbtn,.tab,.rbtn,.photo-btn,.lang,.toggle{display:none!important}
    body{background:#fff} header{box-shadow:none} .kpi,.card{box-shadow:none;border:1px solid #e2e8f0} }
</style>
</head>
<body>

<div class="gate" id="gate" style="display:none">
  <div class="glogo">YH</div>
  <div style="font-size:13px;letter-spacing:1px;opacity:.8;font-weight:800;color:#e3c878">YURA HARNESS MÉXICO</div>
  <div style="font-size:20px;font-weight:800" id="gT">관리자 대시보드</div>
  <div style="font-size:13px;opacity:.8" id="gS">PIN을 입력하세요</div>
  <input id="pin" inputmode="numeric" type="password" maxlength="8" placeholder="••••">
  <button onclick="checkPin()" id="gO">열기</button>
  <div class="msg" id="pinMsg"></div>
</div>

<div class="wrap" id="app" style="display:none">
  <header>
    <div class="brand">
      <div class="logo">YH</div>
      <div>
        <div class="brand-name">YURA HARNESS MÉXICO</div>
        <div class="brand-sub">유라하네스멕시코 · <b id="hTitle">출석 · 식사 관리 대시보드</b></div>
      </div>
    </div>
    <div class="filters">
      <span class="fld"><label id="lDate">날짜</label><input type="date" id="fDate"></span>
      <span class="fld"><label id="lPlant">공장</label><select id="fFactory"></select></span>
      <button class="rbtn" id="bRefresh" onclick="refresh()">새로고침</button>
      <label class="toggle"><input type="checkbox" id="fAuto"> <span id="lAuto">자동(30s)</span></label>
      <button class="lang" id="langBtn">ES</button>
    </div>
    <div class="updated" id="updated">—</div>
  </header>

  <section class="kpis">
    <div class="kpi green">
      <div class="kpi-top"><span class="kpi-ic"><svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg></span><span class="l" id="kl1">출근</span></div>
      <div class="kpi-bot"><span class="v" id="kIn">–</span><span class="unit"></span></div>
    </div>
    <div class="kpi amber">
      <div class="kpi-top"><span class="kpi-ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg></span><span class="l" id="kl2">지각</span></div>
      <div class="kpi-bot"><span class="v" id="kLate">–</span><span class="unit"></span></div>
    </div>
    <div class="kpi">
      <div class="kpi-top"><span class="kpi-ic"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span class="l" id="kl3">현재 재실</span></div>
      <div class="kpi-bot"><span class="v" id="kPresent">–</span><span class="unit"></span></div>
    </div>
    <div class="kpi slate">
      <div class="kpi-top"><span class="kpi-ic"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span><span class="l" id="kl4">퇴근 완료</span></div>
      <div class="kpi-bot"><span class="v" id="kOut">–</span><span class="unit"></span></div>
    </div>
    <div class="kpi red">
      <div class="kpi-top"><span class="kpi-ic"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="17" y1="8" x2="22" y2="13"/><line x1="22" y1="8" x2="17" y2="13"/></svg></span><span class="l" id="kl5">미출근</span></div>
      <div class="kpi-bot"><span class="v" id="kAbsent">–</span><span class="unit"></span></div>
    </div>
    <div class="kpi teal">
      <div class="kpi-top"><span class="kpi-ic"><svg viewBox="0 0 24 24"><path d="M3 11h18"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M10 4c0 1-1 1-1 2.5"/><path d="M14 4c0 1-1 1-1 2.5"/></svg></span><span class="l" id="kl6">식사 신청</span></div>
      <div class="kpi-bot"><span class="v" id="kMeal">–</span><span class="unit"></span></div>
    </div>
  </section>

  <div class="tabs">
    <button class="tab active" data-tab="att" onclick="setTab('att')" id="tAtt">출석 현황</button>
    <button class="tab" data-tab="absent" onclick="setTab('absent')" id="tAbsent">미출근</button>
    <button class="tab" data-tab="meal" onclick="setTab('meal')" id="tMeal">식사 신청</button>
  </div>

  <div class="card">
    <div class="head"><h3 id="barTitle">공장별 인원</h3></div>
    <div class="bars" id="bars"></div>
  </div>

  <div class="card">
    <div class="head">
      <h3 id="tblTitle">목록</h3>
      <button class="xbtn" onclick="exportXlsx()" id="bExcel">Excel 내보내기</button>
    </div>
    <div class="scroll"><table id="tbl"><thead></thead><tbody></tbody></table></div>
  </div>

  <div class="foot">YURA HARNESS MÉXICO · 유라하네스멕시코 &nbsp;|&nbsp; 출석 · 식사 관리 시스템</div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <img id="mImg" alt="">
    <div class="mname" id="mName"></div>
    <div style="font-size:12px;color:#64748b" id="mInfo"></div>
    <button onclick="closeModal()" id="mClose">닫기</button>
  </div>
</div>

<script>
/* ============================================================
   설정 (CONFIG)
   ============================================================ */
const CONFIG = {
  SUPABASE_URL:  "https://lrjurjhavlalhlwaplxd.supabase.co",
  SUPABASE_ANON: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyanVyamhhdmxhbGhsd2FwbHhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNzUxNDAsImV4cCI6MjA5NTY1MTE0MH0.DVFmZaT37R9CXSMHdnLx4YAVNTnlBGijkOIaoUo7Qsk",     // ← 채우기
  T_EMPLOYEES:"att_employees", T_RECORDS:"attendance_records", T_MEALS:"meal_requests",
  FACTORIES: {
    "1":{ ko:"1공장", es:"Planta 1", inBy:"08:30", outBy:"17:20" },
    "2":{ ko:"2공장", es:"Planta 2", inBy:"08:30", outBy:"17:20" }
  },
  TZ_OFFSET_HOURS:-6, DASHBOARD_PIN:"", AUTO_SECONDS:30
};
/* ============================================================ */

/* ---------- 다국어 ---------- */
const I18N={
  ko:{ title:"출석 · 식사 관리 대시보드", date:"날짜", plant:"공장", all:"전체", refresh:"새로고침", auto:"자동(30s)",
    kIn:"출근", kLate:"지각", kPresent:"현재 재실", kOut:"퇴근 완료", kAbsent:"미출근", kMeal:"식사 신청",
    tabAtt:"출석 현황", tabAbsent:"미출근", tabMeal:"식사 신청",
    barPlant:"공장별 인원", excel:"Excel 내보내기", empty:"데이터 없음",
    colId:"사번", colName:"이름", colPlant:"공장", colIn:"출근", colOut:"퇴근", colState:"상태", colWork:"근태", colPhoto:"사진", colTime:"신청시각",
    photoView:"보기", present:"재실", left:"퇴근", normal:"정상", late:"지각", early:"조퇴",
    photoNone:"사진 없음", photoFail:"사진 불러오기 실패", close:"닫기",
    pinTitle:"관리자 대시보드", pinSub:"PIN을 입력하세요", pinOpen:"열기", pinBad:"PIN이 올바르지 않습니다.",
    loading:"불러오는 중…", queryErr:"조회 오류 — 설정/네트워크 확인", updated:"업데이트 ",
    listTitle:(n)=>`목록 (${n})`, persons:"명" },
  es:{ title:"Panel de Asistencia y Comidas", date:"Fecha", plant:"Planta", all:"Todas", refresh:"Actualizar", auto:"Auto(30s)",
    kIn:"Entradas", kLate:"Tardes", kPresent:"Presentes", kOut:"Salidas", kAbsent:"Ausentes", kMeal:"Comidas",
    tabAtt:"Asistencia", tabAbsent:"Ausentes", tabMeal:"Comidas",
    barPlant:"Por planta", excel:"Exportar Excel", empty:"Sin datos",
    colId:"N° emp.", colName:"Nombre", colPlant:"Planta", colIn:"Entrada", colOut:"Salida", colState:"Estado", colWork:"Puntualidad", colPhoto:"Foto", colTime:"Hora",
    photoView:"Ver", present:"Presente", left:"Salió", normal:"A tiempo", late:"Tarde", early:"Anticipada",
    photoNone:"Sin foto", photoFail:"Error al cargar foto", close:"Cerrar",
    pinTitle:"Panel", pinSub:"Ingrese el PIN", pinOpen:"Abrir", pinBad:"PIN incorrecto.",
    loading:"Cargando…", queryErr:"Error de consulta — revise config/red", updated:"Act. ",
    listTitle:(n)=>`Lista (${n})`, persons:"" }
};
let lang=localStorage.getItem("yura_lang")||(navigator.language.startsWith("es")?"es":"ko");
const t=k=>I18N[lang][k];

/* ---------- 공통 ---------- */
const $=id=>document.getElementById(id);
const REST=p=>CONFIG.SUPABASE_URL+"/rest/v1/"+p;
const HEADERS={"apikey":CONFIG.SUPABASE_ANON,"Authorization":"Bearer "+CONFIG.SUPABASE_ANON};
let state={employees:[],att:[],meal:[],tab:"att",autoTimer:null};
let view={att:[],absent:[],meal:[]};
let sortKey=null,sortDir=1;

function plantName(fk){ const p=CONFIG.FACTORIES[fk]; return p?p[lang]:String(fk||""); }
function plantSched(fk){ return CONFIG.FACTORIES[fk]||{inBy:"08:30",outBy:"17:20"}; }

function applyLang(){
  document.documentElement.lang=lang;
  $("langBtn").textContent=lang==="ko"?"ES":"한";
  $("hTitle").textContent=t("title");
  $("lDate").textContent=t("date"); $("lPlant").textContent=t("plant");
  $("bRefresh").textContent=t("refresh"); $("lAuto").textContent=t("auto");
  $("kl1").textContent=t("kIn"); $("kl2").textContent=t("kLate"); $("kl3").textContent=t("kPresent");
  $("kl4").textContent=t("kOut"); $("kl5").textContent=t("kAbsent"); $("kl6").textContent=t("kMeal");
  document.querySelectorAll(".kpi .unit").forEach(u=>u.textContent=t("persons"));
  $("tAtt").textContent=t("tabAtt"); $("tAbsent").textContent=t("tabAbsent"); $("tMeal").textContent=t("tabMeal");
  $("bExcel").textContent=t("excel"); $("mClose").textContent=t("close");
  $("gT").textContent=t("pinTitle"); $("gS").textContent=t("pinSub"); $("gO").textContent=t("pinOpen");
  // 공장 필터 옵션 갱신
  const cur=$("fFactory").value;
  $("fFactory").innerHTML=`<option value="">${t("all")}</option>`+Object.keys(CONFIG.FACTORIES).map(k=>`<option value="${k}">${CONFIG.FACTORIES[k][lang]}</option>`).join("");
  $("fFactory").value=cur;
  if(state.att.length||state.meal.length||state.employees.length) compute(); else render();
}
$("langBtn").onclick=()=>{ lang=lang==="ko"?"es":"ko"; localStorage.setItem("yura_lang",lang); applyLang(); };

/* ---------- 잠금 ---------- */
function startGate(){
  if(!CONFIG.DASHBOARD_PIN){ openApp(); return; }
  if(sessionStorage.getItem("yura_dash_ok")==="1"){ openApp(); return; }
  $("gT").textContent=t("pinTitle"); $("gS").textContent=t("pinSub"); $("gO").textContent=t("pinOpen");
  $("gate").style.display="flex"; setTimeout(()=>$("pin").focus(),200);
}
function checkPin(){
  if($("pin").value===CONFIG.DASHBOARD_PIN){ sessionStorage.setItem("yura_dash_ok","1"); $("gate").style.display="none"; openApp(); }
  else { $("pinMsg").textContent=t("pinBad"); $("pin").value=""; }
}
$("pin")&&$("pin").addEventListener("keydown",e=>{ if(e.key==="Enter") checkPin(); });

function openApp(){
  $("app").style.display="block";
  applyLang();
  $("fDate").value=todayDate();
  $("fAuto").addEventListener("change",toggleAuto);
  ["fDate","fFactory"].forEach(id=>$(id).addEventListener("change",refresh));
  refresh();
}

/* ---------- 날짜 ---------- */
function todayDate(){ const n=new Date(); const l=new Date(n.getTime()+CONFIG.TZ_OFFSET_HOURS*3600*1000); return l.toISOString().slice(0,10); }
function dayBounds(d){ const [y,m,dd]=d.split("-").map(Number); const base=Date.UTC(y,m-1,dd); const off=CONFIG.TZ_OFFSET_HOURS*3600*1000; return {start:new Date(base-off).toISOString(),end:new Date(base+86400000-off).toISOString()}; }
function localMin(iso){ const dt=new Date(new Date(iso).getTime()+CONFIG.TZ_OFFSET_HOURS*3600*1000); return dt.getUTCHours()*60+dt.getUTCMinutes(); }
function hhmm(iso){ const dt=new Date(new Date(iso).getTime()+CONFIG.TZ_OFFSET_HOURS*3600*1000); return String(dt.getUTCHours()).padStart(2,"0")+":"+String(dt.getUTCMinutes()).padStart(2,"0"); }
function hmToMin(s){ const [h,m]=s.split(":").map(Number); return h*60+m; }

/* ---------- 로드 ---------- */
async function getJson(url){ const r=await fetch(url,{headers:HEADERS}); if(!r.ok) throw new Error(await r.text()); return r.json(); }
async function refresh(){
  const date=$("fDate").value||todayDate(); const {start,end}=dayBounds(date);
  $("updated").textContent=t("loading");
  try{
    const [emp,att,meal]=await Promise.all([
      getJson(REST(`${CONFIG.T_EMPLOYEES}?select=employee_id,name,factory&limit=5000`)).catch(()=>[]),
      getJson(REST(`${CONFIG.T_RECORDS}?created_at=gte.${start}&created_at=lt.${end}&select=id,employee_id,name,type,factory,created_at&order=created_at.asc&limit=20000`)),
      getJson(REST(`${CONFIG.T_MEALS}?meal_date=eq.${date}&status=eq.applied&select=employee_id,name,factory,created_at&order=created_at.asc&limit=20000`))
    ]);
    state.employees=Array.isArray(emp)?emp:[]; state.att=Array.isArray(att)?att:[]; state.meal=Array.isArray(meal)?meal:[];
    compute();
    $("updated").textContent=t("updated")+new Date().toLocaleTimeString(lang==="ko"?"ko-KR":"es-MX");
  }catch(e){ $("updated").textContent=t("queryErr"); console.error(e); }
}

/* ---------- 집계 ---------- */
function fFactory(){ return $("fFactory").value; }
function passFactory(row){ return !fFactory() || String(row.factory)===fFactory(); }

function compute(){
  const byEmp={};
  for(const r of state.att){
    if(!passFactory(r)) continue;
    const k=r.employee_id;
    if(!byEmp[k]) byEmp[k]={employee_id:k,name:r.name,factory:r.factory,firstIn:null,lastOut:null,last:null,inId:null};
    const g=byEmp[k];
    if(r.type==="in"){ if(!g.firstIn) g.firstIn=r.created_at; g.inId=r.id; }
    if(r.type==="out"){ g.lastOut=r.created_at; }
    g.last=r.type;
  }
  const attRows=Object.values(byEmp).filter(g=>g.firstIn);
  const presentIds=new Set(attRows.map(g=>g.employee_id));

  view.att=attRows.map(g=>{
    const sc=plantSched(g.factory);
    const late = g.firstIn ? localMin(g.firstIn)>hmToMin(sc.inBy) : false;
    const early = g.lastOut ? localMin(g.lastOut)<hmToMin(sc.outBy) : false;
    return { employee_id:g.employee_id, name:g.name||g.employee_id, factory:g.factory,
      status:(g.last==="out"?"out":"in"),
      inTime:g.firstIn?hhmm(g.firstIn):"", outTime:g.lastOut?hhmm(g.lastOut):"",
      late, early, photoId:g.inId||null };
  });

  view.absent=state.employees.filter(e=>passFactory(e)).filter(e=>!presentIds.has(e.employee_id))
    .map(e=>({employee_id:e.employee_id,name:e.name||e.employee_id,factory:e.factory}));

  view.meal=state.meal.filter(m=>passFactory(m))
    .map(m=>({employee_id:m.employee_id,name:m.name||m.employee_id,factory:m.factory,time:hhmm(m.created_at)}));

  $("kIn").textContent=view.att.length;
  $("kLate").textContent=view.att.filter(r=>r.late).length;
  $("kPresent").textContent=view.att.filter(r=>r.status==="in").length;
  $("kOut").textContent=view.att.filter(r=>r.status==="out").length;
  $("kAbsent").textContent=state.employees.length?view.absent.length:"–";
  $("kMeal").textContent=view.meal.length;
  render();
}

/* ---------- 렌더 ---------- */
function setTab(tb){ state.tab=tb; sortKey=null; document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===tb)); render(); }
function COLS(){
  const T=I18N[lang];
  return {
    att:[["employee_id",T.colId],["name",T.colName],["factory",T.colPlant],["inTime",T.colIn],["outTime",T.colOut],["status",T.colState],["work",T.colWork],["__photo",T.colPhoto]],
    absent:[["employee_id",T.colId],["name",T.colName],["factory",T.colPlant]],
    meal:[["employee_id",T.colId],["name",T.colName],["factory",T.colPlant],["time",T.colTime]]
  };
}
function curRows(){ return view[state.tab].slice(); }

function render(){
  $("tblTitle").textContent=({att:t("tabAtt"),absent:t("tabAbsent"),meal:t("tabMeal")})[state.tab]+" "+I18N[lang].listTitle(view[state.tab].length+(lang==="ko"?(I18N.ko.persons):""));
  renderBars(); renderTable();
}
function barColor(){ return ({att:"linear-gradient(90deg,#22c55e,#15a34a)",absent:"linear-gradient(90deg,#f87171,#dc2626)",meal:"linear-gradient(90deg,#2dd4bf,#0d8276)"})[state.tab]||"linear-gradient(90deg,#1e4d8b,#0c2444)"; }
function renderBars(){
  $("barTitle").textContent=t("barPlant");
  const rows=curRows(); const counts={};
  for(const r of rows){ const k=plantName(r.factory)||"-"; counts[k]=(counts[k]||0)+1; }
  const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const max=Math.max(1,...entries.map(e=>e[1]));
  $("bars").innerHTML=entries.length?entries.map(([k,v])=>`
    <div class="bar-row"><span class="lab">${escapeHtml(k)}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${(v/max*100).toFixed(0)}%;background:${barColor()}"></span></span>
      <span class="num">${v}</span></div>`).join(""):`<div class="empty">${t("empty")}</div>`;
}
function workPill(r){
  if(r.late&&r.early) return `<span class="pill late">${t("late")}</span> <span class="pill early">${t("early")}</span>`;
  if(r.late) return `<span class="pill late">${t("late")}</span>`;
  if(r.early) return `<span class="pill early">${t("early")}</span>`;
  return `<span class="pill normal">${t("normal")}</span>`;
}
function renderTable(){
  const cols=COLS()[state.tab]; let rows=curRows();
  if(sortKey){ rows.sort((a,b)=>{ const x=(a[sortKey]??""),y=(b[sortKey]??""); return (x>y?1:x<y?-1:0)*sortDir; }); }
  const thead=$("tbl").querySelector("thead"), tbody=$("tbl").querySelector("tbody");
  thead.innerHTML="<tr>"+cols.map(c=>{ const arrow=sortKey===c[0]?(sortDir>0?" ▲":" ▼"):""; const oc=c[0].startsWith("__")?"":`onclick="sortBy('${c[0]}')"`; return `<th ${oc}>${escapeHtml(c[1])}${arrow}</th>`; }).join("")+"</tr>";
  if(rows.length===0){ tbody.innerHTML=`<tr><td colspan="${cols.length}"><div class="empty">${t("empty")}</div></td></tr>`; return; }
  tbody.innerHTML=rows.map(r=>"<tr>"+cols.map(c=>{
    const f=c[0];
    if(f==="__photo") return r.photoId?`<td><button class="photo-btn" onclick="showPhoto('${r.photoId}','${escapeHtml(r.name)}','${escapeHtml(plantName(r.factory))}')">${t("photoView")}</button></td>`:"<td>–</td>";
    if(f==="status") return r.status==="in"?`<td><span class="pill in">${t("present")}</span></td>`:`<td><span class="pill out">${t("left")}</span></td>`;
    if(f==="work") return `<td>${workPill(r)}</td>`;
    if(f==="factory") return `<td>${escapeHtml(plantName(r.factory))}</td>`;
    return `<td>${escapeHtml(r[f]!=null?String(r[f]):"")}</td>`;
  }).join("")+"</tr>").join("");
}
function sortBy(k){ if(sortKey===k) sortDir*=-1; else { sortKey=k; sortDir=1; } renderTable(); }

/* ---------- 사진 ---------- */
async function showPhoto(id,name,info){
  $("mName").textContent=name; $("mInfo").textContent=info; $("mImg").removeAttribute("src"); $("modal").classList.add("open");
  try{ const rows=await getJson(REST(`${CONFIG.T_RECORDS}?id=eq.${id}&select=photo&limit=1`)); const p=rows&&rows[0]&&rows[0].photo;
    if(p) $("mImg").src=p; else $("mInfo").textContent=info+" · "+t("photoNone");
  }catch(e){ $("mInfo").textContent=info+" · "+t("photoFail"); }
}
function closeModal(){ $("modal").classList.remove("open"); }
$("modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeModal(); });

/* ---------- Excel(.xlsx) 내보내기 (라이브러리 없음) ---------- */
function makeXlsx(sheetName, aoa){
  const crcTable=(()=>{const tb=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);tb[n]=c>>>0;}return tb;})();
  function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=crcTable[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
  const enc=new TextEncoder(); const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const colN=i=>{let s="";i++;while(i>0){let m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=(i-(m+1))/26;}return s;};
  let rowsXml="";
  aoa.forEach((row,r)=>{ let cells=""; row.forEach((val,c)=>{ const ref=colN(c)+(r+1);
    if(typeof val==="number"&&isFinite(val)) cells+=`<c r="${ref}"><v>${val}</v></c>`;
    else cells+=`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${esc(val==null?"":val)}</t></is></c>`;
  }); rowsXml+=`<row r="${r+1}">${cells}</row>`; });
  const sheet=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${rowsXml}</sheetData></worksheet>`;
  const files=[
    {name:"[Content_Types].xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`},
    {name:"_rels/.rels",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:"xl/workbook.xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${esc(sheetName).slice(0,31)}" sheetId="1" r:id="rId1"/></sheets></workbook>`},
    {name:"xl/_rels/workbook.xml.rels",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>`},
    {name:"xl/worksheets/sheet1.xml",data:sheet}
  ];
  const chunks=[],central=[]; let offset=0;
  const u16=n=>[n&0xFF,(n>>8)&0xFF], u32=n=>[n&0xFF,(n>>8)&0xFF,(n>>16)&0xFF,(n>>24)&0xFF];
  for(const f of files){ const nm=enc.encode(f.name),da=enc.encode(f.data),crc=crc32(da);
    const local=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(da.length),u32(da.length),u16(nm.length),u16(0));
    chunks.push(new Uint8Array(local),nm,da);
    const cd=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(da.length),u32(da.length),u16(nm.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset));
    central.push(new Uint8Array(cd),nm); offset+=local.length+nm.length+da.length; }
  let cdSize=0; central.forEach(c=>cdSize+=c.length);
  const eocd=[].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cdSize),u32(offset),u16(0));
  const all=[...chunks,...central,new Uint8Array(eocd)]; let total=0; all.forEach(a=>total+=a.length);
  const out=new Uint8Array(total); let p=0; for(const a of all){ out.set(a,p); p+=a.length; } return out;
}
function exportXlsx(){
  const cols=COLS()[state.tab].filter(c=>!c[0].startsWith("__"));
  const rows=curRows();
  const aoa=[cols.map(c=>c[1])];
  for(const r of rows){
    aoa.push(cols.map(c=>{
      let v=r[c[0]];
      if(c[0]==="status") return r.status==="in"?t("present"):t("left");
      if(c[0]==="work") return r.late&&r.early?(t("late")+"·"+t("early")):r.late?t("late"):r.early?t("early"):t("normal");
      if(c[0]==="factory") return plantName(r.factory);
      return v==null?"":v;
    }));
  }
  const sheet=state.tab+"_"+$("fDate").value;
  const u8=makeXlsx(sheet, aoa);
  const blob=new Blob([u8],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=sheet+".xlsx";
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- 자동 새로고침 ---------- */
function toggleAuto(){ if($("fAuto").checked) state.autoTimer=setInterval(refresh,CONFIG.AUTO_SECONDS*1000); else { clearInterval(state.autoTimer); state.autoTimer=null; } }
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

startGate();
</script>
