.tabs button.on{color:#fff; border-bottom-color:var(--gold);}
main{max-width:640px; margin:0 auto; padding:14px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px;}
.scan-wrap{position:relative;}
#q{width:100%; padding:15px 88px 15px 14px; font-size:17px; border:2px solid var(--navy2); border-radius:10px; outline:none;}
#q:focus{border-color:var(--gold);}
.clear-x{position:absolute; right:52px; top:50%; transform:translateY(-50%); background:#e8ecf2; border:none; border-radius:50%; width:30px; height:30px; font-size:15px; color:var(--sub); cursor:pointer; display:none;}
.cam-btn{position:absolute; right:8px; top:50%; transform:translateY(-50%); background:var(--navy); border:none; border-radius:9px; width:38px; height:38px; font-size:18px; cursor:pointer; color:#fff; display:flex; align-items:center; justify-content:center;}
.cam-btn:active{background:var(--navy2);}
/* camera scanner modal */
#camModal{position:fixed; inset:0; background:rgba(10,18,32,.96); z-index:110; display:none; flex-direction:column;}
#camModal.on{display:flex;}
.cam-top{display:flex; align-items:center; justify-content:space-between; padding:14px; color:#fff;}
.cam-top .ttl{font-weight:800; font-size:16px;}
.cam-close{background:var(--gold); color:var(--navy); border:none; border-radius:20px; padding:8px 18px; font-weight:800; font-size:14px; cursor:pointer;}
#camReader{flex:1; width:100%; overflow:hidden; display:flex; align-items:center; justify-content:center;}
#camReader video{width:100% !important; height:100% !important; object-fit:cover;}
.cam-hint{color:#aab8cf; font-size:13px; text-align:center; padding:12px 16px 22px; line-height:1.5;}
.cam-msg{color:var(--gold); font-size:14px; font-weight:700; text-align:center; padding:8px 16px;}
.hint{font-size:12px; color:var(--sub); margin-top:8px; line-height:1.5;}

#ac{position:absolute; left:0; right:0; top:calc(100% + 4px); background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(18,35,63,.18); max-height:320px; overflow-y:auto; z-index:40; display:none;}

.ac-item:last-child{border-bottom:none;}
.ac-item:active{background:#f4f7fb;}
.ac-item .code{font-weight:700; font-size:14px;}
.ac-item .name{font-size:12px; color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;}
.badge{font-size:10px; font-weight:700; padding:3px 7px; border-radius:10px; flex-shrink:0;}
.b-loc{background:#e4efff; color:var(--blue);}
.b-app{background:#fdf1d8; color:#9a6b00;}
.b-wire{background:#e2f5ea; color:var(--green);}
/* result */

.loc-big{background:var(--navy); color:var(--gold); border-radius:12px; text-align:center; padding:22px 10px; margin:10px 0;}
.loc-big .lbl{font-size:12px; color:#9fb0c8; letter-spacing:2px; font-weight:700;}
.loc-big .val{font-size:44px; font-weight:800; letter-spacing:2px; line-height:1.15; word-break:break-all;}
.kv{display:flex; justify-content:space-between; padding:8px 2px; border-bottom:1px solid #f0f2f6; font-size:14px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--sub);}
.kv .v{font-weight:700; text-align:right; word-break:break-all; max-width:60%;}
.loc-stack{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
.loc-item{background:var(--navy); color:var(--gold); border-radius:12px; text-align:center; padding:16px 10px; font-size:34px; font-weight:800; letter-spacing:2px; word-break:break-all;}
.loc-empty{background:#f4f6fa; color:#b06060; border-radius:12px; text-align:center; padding:16px 10px; font-size:16px; font-weight:700;}
/* upload mode buttons */

.up-modes .btn{margin-top:10px;}
.noresult{text-align:center; color:var(--sub); padding:26px 0; font-size:14px;}

.btn-primary{background:var(--gold); color:var(--navy);}

async function fetchAll(table){
  const rows = [];
  let offset = 0;
  while(true){
    const r = await fetch(`${SUPA_URL}/${table}?select=*&order=id.asc&limit=1000&offset=${offset}`, {headers:HDR});
    if(!r.ok) throw new Error(table+' '+r.status);
    const chunk = await r.json();
    rows.push(...chunk);
    if(chunk.length < 1000) break;
    offset += 1000;
  }
  return rows;
}

  toast(T('loading'), 60000);
  try{
    const [l,a,w] = await Promise.all([fetchAll('loc_data_2'), fetchAll('app_data_2'), fetchAll('wire_data_2')]);
    DB.loc = l; DB.app = a; DB.wire = w;
    document.getElementById('c_loc').textContent = l.length;
    document.getElementById('c_app').textContent = a.length;
    document.getElementById('c_wire').textContent = w.length;
    updateCurCnt();
    hideToast();
  }catch(e){
    console.error(e);
    document.getElementById('lock').style.display = 'flex';
  }
}

/* ================= search ================= */
const qEl = document.getElementById('q');
const acEl = document.getElementById('ac');
const resEl = document.getElementById('result');

qEl.addEventListener('input', ()=>{
  document.getElementById('clearX').style.display = qEl.value ? 'block' : 'none';
  showAC(qEl.value.trim());
});
qEl.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){ e.preventDefault(); hideAC(); doSearch(qEl.value.trim()); }
});
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.scan-wrap')) hideAC();
});
function clearQ(){ qEl.value=''; hideAC(); document.getElementById('clearX').style.display='none'; qEl.focus(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* --- autocomplete: unique items across 3 sources --- */
function buildCandidates(query){
  const q = query.toLowerCase();
  const out = [];
  const seen = new Set();
  // loc: unique mat_code
  for(const r of DB.loc){
    const c = (r.mat_code||''), n = (r.mat_name||'');
    if(!c && !n) continue;
    if(c.toLowerCase().includes(q) || n.toLowerCase().includes(q)){
      const key = 'L|'+c+'|'+n;
      if(!seen.has(key)){ seen.add(key); out.push({src:'loc', code:c, name:n}); }
    }
    if(out.length >= 60) break;
  }
  for(const r of DB.app){
    const c = (r.code||''), n = (r.name||'');
    if(c.toLowerCase().includes(q) || n.toLowerCase().includes(q)){
      const key = 'A|'+c+'|'+(r.mgmt_no||'');
      if(!seen.has(key)){ seen.add(key); out.push({src:'app', code:c, name:n, row:r}); }
    }
    if(out.length >= 80) break;
  }
  for(const r of DB.wire){
    const c = (r.code||''), n = (r.name||'');
    if(c.toLowerCase().includes(q) || n.toLowerCase().includes(q)){
      const key = 'W|'+c;
      if(!seen.has(key)){ seen.add(key); out.push({src:'wire', code:c, name:n, row:r}); }
    }
    if(out.length >= 100) break;
  }
  return out.slice(0, 30);
}
function showAC(query){
  if(!query || query.length < 1){ hideAC(); return; }
  const items = buildCandidates(query);
  if(items.length === 0){ hideAC(); return; }
  const bmap = {loc:['b-loc','srcloc'], app:['b-app','srcapp'], wire:['b-wire','srcwire']};
  acEl.innerHTML = items.map((it,i)=>{
    const [cls,lbl] = bmap[it.src];
    return `<div class="ac-item" data-i="${i}">
      <span class="badge ${cls}">${T(lbl)}</span>
      <span class="code">${esc(it.code)}</span>
      <span class="name">${esc(it.name)}</span>
    </div>`;
  }).join('');
  acEl.style.display = 'block';
  acEl.querySelectorAll('.ac-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      const it = items[+el.dataset.i];
      hideAC();
      qEl.value = it.code || it.name;
      if(it.src === 'loc') renderLocByMat(it.code, it.name);
      else if(it.src === 'app') renderApp([it.row]);
      else renderWire([it.row]);
    });
  });
}
function hideAC(){ acEl.style.display = 'none'; }

/* --- exact / scan search --- */
function doSearch(raw){
  if(!raw){ return; }
  const q = raw.trim();
  const ql = q.toLowerCase();

  // 1) loc barcode exact (with/without @)
  let hits = DB.loc.filter(r => r.bc === q || r.bc === '@'+q || (r.bc||'').toLowerCase() === ql);
  if(hits.length){ renderLoc(hits); afterScan(); return; }

  // 2) app barcode / code exact (with/without $)
  let ahits = DB.app.filter(r => r.bc === q || r.bc === '$'+q || (r.code||'').toLowerCase() === ql);
  if(ahits.length){ renderApp(ahits); afterScan(); return; }

  // 3) wire code exact
  let whits = DB.wire.filter(r => (r.code||'').toLowerCase() === ql);
  if(whits.length){ renderWire(whits); afterScan(); return; }

  // 4) loc mat_code / mat_name exact
  hits = DB.loc.filter(r => (r.mat_code||'').toLowerCase() === ql || (r.mat_name||'').toLowerCase() === ql);
  if(hits.length){ renderLoc(hits); afterScan(); return; }

  // 5) contains fallback (partial)
  hits = DB.loc.filter(r => (r.mat_code||'').toLowerCase().includes(ql) || (r.mat_name||'').toLowerCase().includes(ql));
  if(hits.length){ renderLoc(hits); afterScan(); return; }
  ahits = DB.app.filter(r => (r.code||'').toLowerCase().includes(ql) || (r.name||'').toLowerCase().includes(ql));
  if(ahits.length){ renderApp(ahits); afterScan(); return; }
  whits = DB.wire.filter(r => (r.code||'').toLowerCase().includes(ql) || (r.name||'').toLowerCase().includes(ql));
  if(whits.length){ renderWire(whits); afterScan(); return; }

  lastResultRender = ()=>{ resEl.innerHTML = `<div class="card"><div class="noresult">🔍 ${esc(q)}<br>${T('noresult')}</div></div>`; };
  lastResultRender();
  afterScan();
}
function afterScan(){
  // barcode scanners: select text so next scan overwrites
  qEl.select();
}

/* --- renderers --- */
function sortByTimeDesc(rows){
  return [...rows].sort((a,b)=> String(b.proc_time||'').localeCompare(String(a.proc_time||'')));
}
function renderLoc(rows){
  lastResultRender = ()=>{
    const sorted = sortByTimeDesc(rows);
    const top = sorted[0];
    // unique 호기위치 (L열) values, latest first
    const locs = [];
    for(const r of sorted){
      const v = (r.loc || '').trim();
      if(v && !locs.includes(v)) locs.push(v);
    }
    let stack;
    if(locs.length){
      stack = `<div class="loc-stack">` + locs.map(v=>`<div class="loc-item">${esc(v)}</div>`).join('') + `</div>`;
    }else{
      stack = `<div class="loc-stack"><div class="loc-empty">${T('noloc')}</div></div>`;
    }
    resEl.innerHTML = `<div class="card">
      <div class="res-title"><span class="badge b-loc">${T('srcloc')}</span> ${esc(top.mat_code||'')}</div>
      <div class="kv"><span class="k">${T('matname')}</span><span class="v">${esc(top.mat_name)}</span></div>
      ${stack}
    </div>`;
  };
  lastResultRender();
}
function renderLocByMat(code, name){
  const rows = DB.loc.filter(r => (r.mat_code||'') === code && (r.mat_name||'') === name);
  if(rows.length) renderLoc(rows);
}
function renderApp(rows){
  lastResultRender = ()=>{
    resEl.innerHTML = rows.slice(0,20).map(r=>{
      const v = (r.loc||'').trim();
      const stack = v ? `<div class="loc-stack"><div class="loc-item">${esc(v)}</div></div>`
                      : `<div class="loc-stack"><div class="loc-empty">${T('noloc')}</div></div>`;
      return `<div class="card">
        <div class="res-title"><span class="badge b-app">${T('srcapp')}</span> ${esc(r.code||'')}</div>
        <div class="kv"><span class="k">${T('moldname')}</span><span class="v">${esc(r.name)}</span></div>
        <div class="kv"><span class="k">${T('mgmt')}</span><span class="v">${esc(r.mgmt_no)}</span></div>
        ${stack}
      </div>`;
    }).join('');
  };
  lastResultRender();
}
function renderWire(rows){
  lastResultRender = ()=>{
    resEl.innerHTML = rows.slice(0,20).map(r=>{
      const v = (r.loc||'').trim();
      const stack = v ? `<div class="loc-stack"><div class="loc-item">${esc(v)}</div></div>`
                      : `<div class="loc-stack"><div class="loc-empty">${T('noloc')}</div></div>`;
      return `<div class="card">
        <div class="res-title"><span class="badge b-wire">${T('srcwire')}</span> ${esc(r.code||'')}</div>
        <div class="kv"><span class="k">${T('wirename')}</span><span class="v">${esc(r.name)}</span></div>
        ${stack}
      </div>`;
    }).join('');
  };
  lastResultRender();
}

/* ================= tabs ================= */
function showTab(t){
  document.getElementById('pgSearch').style.display = (t==='search')?'':'none';
  document.getElementById('pgData').style.display = (t==='data')?'':'none';
  document.getElementById('tabSearch').classList.toggle('on', t==='search');
  document.getElementById('tabData').classList.toggle('on', t==='data');
  if(t==='search') setTimeout(()=>qEl.focus(), 100);
}

/* ================= data management ================= */
let curSheet = 'loc';
let parsedRows = null;
const TABLE = {loc:'loc_data_2', app:'app_data_2', wire:'wire_data_2'};
const HEADS = ['바코드','금형바코드','유라CODE','업체바코드'];

function pickSheet(s){
  curSheet = s; parsedRows = null;
  ['loc','app','wire'].forEach(k=>document.getElementById('dt_'+k).classList.toggle('on', k===s));
  document.getElementById('sheetGuide').textContent = T('guide_'+s);
  document.getElementById('pasteBox').value = '';
  document.getElementById('parseInfo').className = 'parse-info';
  document.getElementById('btnMerge').disabled = true;
  document.getElementById('btnReplace').disabled = true;
  updateCurCnt();
}
function updateCurCnt(){
  document.getElementById('curCnt').textContent = DB[curSheet].length;
}
function parsePaste(text, sheet){
  const rows = [];
  for(const line of text.split(/\r?\n/)){
    if(!line.trim()) continue;
    const c = line.split('\t').map(x=>x.trim());
    if(HEADS.some(h => c[0] === h)) continue; // header row
    const val = i => (c[i] !== undefined && c[i] !== '') ? c[i] : null;
    if(sheet === 'loc'){
      if(!val(0) && !val(3)) continue;
      const qn = val(5) != null ? parseFloat(String(val(5)).replace(/,/g,'')) : null;
      rows.push({bc:val(0), vendor_bc:val(1), bundle_bc:val(2), mat_code:val(3), mat_name:val(4),
                 qty:(isNaN(qn)?null:qn), unit:val(6), rack:val(7), proc_time:val(8),
                 worker:val(9), gubun:val(10), loc:val(11)});
    }else if(sheet === 'app'){
      if(!val(0) && !val(1)) continue;
      rows.push({bc:val(0), code:val(1), mgmt_no:val(2), name:val(3), storage:val(4), loc:val(5)});
    }else{ // wire: A=code, B=name, F=loc (or 3-col paste: C=loc)
      if(!val(0)) continue;
      const lv = c.length >= 6 ? val(5) : (c.length === 3 ? val(2) : val(c.length-1));
      rows.push({code:val(0), name:val(1), loc:lv});
    }
  }
  return rows;
}
function doParse(){
  const text = document.getElementById('pasteBox').value;
  parsedRows = parsePaste(text, curSheet);
  const info = document.getElementById('parseInfo');
  const ok = parsedRows.length > 0;
  info.className = 'parse-info ' + (ok ? 'pi-ok' : 'pi-err');
  info.textContent = ok ? T('parsed')(parsedRows.length) : T('parseEmpty');
  document.getElementById('btnMerge').disabled = !ok;
  document.getElementById('btnReplace').disabled = !ok;
}
const KEYCOL = {loc:'bc', app:'bc', wire:'code'};

async function doUpload(mode){
  if(!parsedRows || !parsedRows.length) return;
  const msg = (mode === 'replace') ? T('confirmReplace')(curSheet, parsedRows.length)
                                   : T('confirmMerge')(curSheet, parsedRows.length);
  if(!confirm(msg)) return;
  const btn = document.getElementById(mode === 'replace' ? 'btnReplace' : 'btnMerge');
  const orig = btn.innerHTML;
  document.getElementById('btnMerge').disabled = true;
  document.getElementById('btnReplace').disabled = true;
  btn.innerHTML = `<span class="spin"></span>${T('uploading')}`;
  const table = TABLE[curSheet];
  try{
    if(mode === 'replace'){
      // delete all
      const dr = await fetch(`${SUPA_URL}/${table}?id=gt.0`, {method:'DELETE', headers:HDR});
      if(!dr.ok) throw new Error('delete '+dr.status);
    }else{
      // partial: delete only rows whose key matches pasted keys, then insert pasted rows
      const keyCol = KEYCOL[curSheet];
      const keys = [...new Set(parsedRows.map(r => r[keyCol]).filter(v => v != null && v !== ''))];
      for(let i=0; i<keys.length; i+=80){
        const chunk = keys.slice(i, i+80).map(k => '"' + String(k).replace(/"/g,'') + '"').join(',');
        const url = `${SUPA_URL}/${table}?${keyCol}=in.(${encodeURIComponent(chunk)})`;
        const dr = await fetch(url, {method:'DELETE', headers:HDR});
        if(!dr.ok) throw new Error('partial delete '+dr.status);
      }
    }
    // batch insert
    for(let i=0; i<parsedRows.length; i+=500){
      const r = await fetch(`${SUPA_URL}/${table}`, {
        method:'POST',
        headers:{...HDR, 'Prefer':'return=minimal'},
        body: JSON.stringify(parsedRows.slice(i, i+500))
      });
      if(!r.ok) throw new Error('insert '+r.status);
    }
    DB[curSheet] = await fetchAll(table);
    document.getElementById('c_'+curSheet).textContent = DB[curSheet].length;
    updateCurCnt();
    toast(T('uploadDone')(DB[curSheet].length), 3500);
    document.getElementById('pasteBox').value = '';
    document.getElementById('parseInfo').className = 'parse-info';
    parsedRows = null;
  }catch(e){
    console.error(e);
    toast(T('uploadFail'), 4000);
  }
  btn.innerHTML = orig;
  document.getElementById('btnMerge').disabled = true;
  document.getElementById('btnReplace').disabled = true;
}

/* ================= misc ================= */
let toastTimer = null;
function toast(msg, ms){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.style.display='none', ms||2500);
}
function hideToast(){ document.getElementById('toast').style.display='none'; clearTimeout(toastTimer); }

/* init */
/* ================= camera barcode scan ================= */
let camScanner = null, camLibLoading = null, camActive = false;

function loadCamLib(){
  if(window.Html5Qrcode) return Promise.resolve();
  if(camLibLoading) return camLibLoading;
  camLibLoading = new Promise((res, rej)=>{
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
    s.onload = res;
    s.onerror = ()=>{
      const s2 = document.createElement('script');
      s2.src = 'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
      s2.onload = res; s2.onerror = rej;
      document.head.appendChild(s2);
    };
    document.head.appendChild(s);
  });
  return camLibLoading;
}

async function openCam(){
  const modal = document.getElementById('camModal');
  const msg = document.getElementById('camMsg');
  modal.classList.add('on');
  msg.textContent = T('camLoading');
  try{
    await loadCamLib();
  }catch(e){
    msg.textContent = T('camLibErr');
    return;
  }
  try{
    if(!camScanner) camScanner = new Html5Qrcode('camReader');
    camActive = true;
    await camScanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: (w,h)=>({ width: Math.floor(w*0.85), height: Math.floor(Math.min(h*0.35, 220)) }) },
      (decoded)=>{ onCamScan(decoded); },
      ()=>{} // per-frame decode misses: ignore
    );
    msg.textContent = '';
  }catch(e){
    console.error(e);
    camActive = false;
    msg.textContent = T('camErr');
  }
}

let camLastCode = '', camLastTime = 0;
function onCamScan(code){
  const now = Date.now();
  if(code === camLastCode && now - camLastTime < 2500) return; // debounce duplicates
  camLastCode = code; camLastTime = now;
  if(navigator.vibrate) navigator.vibrate(80);
  document.getElementById('camMsg').textContent = T('camOk')(code);
  closeCam();
  qEl.value = code;
  document.getElementById('clearX').style.display = 'block';
  hideAC();
  doSearch(code);
}

function closeCam(){
  const modal = document.getElementById('camModal');
  if(camScanner && camActive){
    camActive = false;
    camScanner.stop().then(()=>camScanner.clear()).catch(()=>{});
  }
  modal.classList.remove('on');
}

applyLang();
pickSheet('loc');
loadAll().then(()=>qEl.focus());
</script>
