<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>보전자 자격인증 평가</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;--surface:#141414;--surface2:#1b1b1b;--border:#2a2a2a;
  --navy:#141414;--accent:#c9a84c;--sky:#e2c46a;--text:#f0f0f0;--text2:#8a8a8a;
  --green:#2ecc7a;--red:#e05252;--blue:#c9a84c;--purple:#9b7ee8;
  --gold:#e2c46a;--teal:#2ab8a8;--orange:#e87a2a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;}

header{background:#141414;border-bottom:2px solid #2a2a2a;padding:0 1.2rem;display:flex;align-items:center;gap:12px;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,0.4);}
.header-left{display:flex;align-items:center;gap:12px;flex-shrink:0;}
.home-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.35);color:#c9a84c;font-size:12px;font-weight:700;letter-spacing:1.5px;cursor:pointer;text-decoration:none;border-radius:4px;transition:all 0.2s;flex-shrink:0;font-family:inherit;white-space:nowrap;}
.home-btn:hover{background:rgba(201,168,76,0.22);border-color:#c9a84c;transform:translateY(-1px);box-shadow:0 4px 12px rgba(201,168,76,0.2);}
.home-btn svg{width:14px;height:14px;fill:none;stroke:#c9a84c;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.hdivider{width:1px;height:28px;background:rgba(255,255,255,0.12);flex-shrink:0;}
.logo-text .logo-es{font-size:0.82rem;font-weight:700;color:#fafafa;}
.logo-text .logo-kr{font-size:.75rem;font-weight:600;color:#a8a8a8;}
.tab-nav{display:flex;overflow-x:auto;flex:1;justify-content:center;}
.tab-btn{padding:0 1rem;height:60px;background:none;border:none;color:rgba(255,255,255,0.45);font-family:inherit;font-size:0.78rem;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;transition:all .18s;white-space:nowrap;}
.tab-btn.active{color:#ffffff;border-bottom-color:var(--sky);background:rgba(255,255,255,0.06);}
.tab-btn:hover:not(.active){color:rgba(255,255,255,0.85);background:rgba(255,255,255,0.04);}
.lang-btn{padding:5px 10px;background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.35);color:#c9a84c;border-radius:5px;cursor:pointer;font-family:inherit;font-size:0.75rem;font-weight:700;white-space:nowrap;}
@media(max-width:900px){
  header{height:auto;flex-wrap:wrap;padding:8px 10px;gap:8px;position:static;}
  .header-left{flex:1 1 auto;min-width:0;}
  .logo-text .logo-es{font-size:.75rem;}.logo-text .logo-kr{font-size:.75rem;}
  .tab-nav{order:3;flex-wrap:wrap;overflow-x:visible;width:100%;border-top:1px solid rgba(255,255,255,0.08);padding-top:4px;justify-content:flex-start;}
  .tab-btn{height:40px;padding:0 0.7rem;font-size:.75rem;flex:0 0 auto;}
}
@media(max-width:480px){
  .home-btn{padding:5px 8px;font-size:12px;}.hdivider{display:none;}
  .tab-btn{height:36px;padding:0 0.55rem;font-size:.75rem;}
}

.page{display:none;padding:1.5rem;max-width:1280px;margin:0 auto;}.page.active{display:block;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1.4rem;margin-bottom:1.4rem;box-shadow:0 2px 8px rgba(0,0,0,0.2);}
.card-title{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--sky);margin-bottom:1.1rem;display:flex;align-items:center;gap:0.5rem;padding-bottom:0.6rem;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.card-title .sp{flex:1;}
.card-title.blue{color:var(--blue);}.card-title.purple{color:var(--purple);}.card-title.green{color:var(--green);}.card-title.gold{color:var(--gold);}.card-title.teal{color:var(--teal);}
.card-title select{width:auto;font-size:0.76rem;padding:0.3rem 0.6rem;text-transform:none;letter-spacing:0;}

input,select,textarea{background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:inherit;font-size:0.88rem;padding:0.55rem 0.85rem;outline:none;transition:border-color .2s,box-shadow .2s;width:100%;}
input:focus,select:focus,textarea:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(201,168,76,0.15);}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(0.7) brightness(1.5);cursor:pointer;}
label{font-size:0.78rem;color:var(--text2);margin-bottom:0.3rem;display:block;}
.form-row{display:grid;gap:1rem;margin-bottom:1rem;align-items:end;}
.col4{grid-template-columns:2fr 1.4fr 1fr 1fr auto;}
.col-admin{grid-template-columns:2fr 1fr 1fr auto;}
.col-cfg{grid-template-columns:1fr 1fr auto;max-width:520px;}
@media(max-width:760px){.col4,.col-admin,.col-cfg{grid-template-columns:1fr 1fr;}}

.btn{padding:0.5rem 1.1rem;border-radius:6px;border:none;cursor:pointer;font-family:inherit;font-size:0.83rem;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;gap:0.35rem;white-space:nowrap;}
.btn-primary{background:var(--accent);color:#fff;}.btn-primary:hover{background:var(--sky);}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}.btn-secondary:hover{border-color:var(--sky);color:var(--sky);}
.btn-danger{background:#b83232;color:#fff;}.btn-danger:hover{background:var(--red);}
.btn-success{background:#1d9460;color:#fff;}.btn-success:hover{background:var(--green);}
.btn-teal{background:#1a8a7c;color:#fff;}.btn-teal:hover{background:var(--teal);}
.btn-sm{padding:0.32rem 0.75rem;font-size:0.76rem;}
.btn-outline{background:none;color:var(--accent);border:1px solid var(--accent);}.btn-outline:hover{background:rgba(201,168,76,0.12);}

/* tables */
.tw{overflow:auto;max-height:72vh;}
.results-table{width:100%;border-collapse:collapse;}
.results-table th,.results-table td{padding:0.6rem 0.7rem;text-align:center;border-bottom:1px solid var(--border);font-size:0.8rem;vertical-align:middle;}
.results-table thead,.results-table th{background:var(--surface2);}
.results-table th{color:var(--sky);font-size:.75rem;text-transform:uppercase;letter-spacing:1px;font-weight:700;position:sticky;top:0;z-index:1;}
.results-table tr:hover td{background:rgba(255,255,255,0.03);}
.results-table .l{text-align:left;}
.mono{font-family:'JetBrains Mono',monospace;}
.name-link{color:var(--sky);font-weight:600;cursor:pointer;}
.name-link:hover{text-decoration:underline;}

/* grades / badges */
.grade-s{background:linear-gradient(135deg,#f1c40f,#f39c12);color:#000;border-radius:6px;padding:0.15rem 0.55rem;font-size:0.78rem;font-weight:900;white-space:nowrap;}
.grade-a{background:rgba(46,204,122,0.2);color:var(--green);border:1px solid rgba(46,204,122,0.5);border-radius:6px;padding:0.15rem 0.55rem;font-size:0.78rem;font-weight:700;white-space:nowrap;}
.grade-b{background:rgba(201,168,76,0.2);color:var(--blue);border:1px solid rgba(201,168,76,0.5);border-radius:6px;padding:0.15rem 0.55rem;font-size:0.78rem;font-weight:700;white-space:nowrap;}
.grade-fail{background:rgba(224,82,82,0.15);color:var(--red);border:1px solid rgba(224,82,82,0.4);border-radius:6px;padding:0.15rem 0.55rem;font-size:0.78rem;font-weight:700;white-space:nowrap;}
.grade-na{color:var(--text2);font-size:0.78rem;}
.done-badge{background:rgba(46,204,122,0.12);color:var(--green);border:1px solid rgba(46,204,122,0.3);border-radius:4px;padding:0.15rem 0.5rem;font-size:.75rem;font-weight:700;white-space:nowrap;}
.pend-badge{background:rgba(226,196,106,0.12);color:var(--gold);border:1px solid rgba(226,196,106,0.3);border-radius:4px;padding:0.15rem 0.5rem;font-size:.75rem;font-weight:700;white-space:nowrap;}
.fail-badge{background:rgba(224,82,82,0.12);color:var(--red);border:1px solid rgba(224,82,82,0.3);border-radius:4px;padding:0.15rem 0.5rem;font-size:.75rem;font-weight:700;white-space:nowrap;}
.na-badge{background:var(--surface2);color:var(--text2);border:1px solid var(--border);border-radius:4px;padding:0.15rem 0.5rem;font-size:.75rem;font-weight:700;white-space:nowrap;}
.score-t{background:rgba(201,168,76,0.15);color:var(--blue);font-size:0.76rem;padding:0.12rem 0.45rem;border-radius:4px;font-weight:700;}
.score-t.low{background:rgba(224,82,82,0.15);color:var(--red);}

/* stats */
.stats-row{display:grid;grid-template-columns:repeat(6,1fr);gap:0.9rem;margin-bottom:1.4rem;}
@media(max-width:900px){.stats-row{grid-template-columns:repeat(3,1fr);}}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1.1rem;text-align:center;border-top:3px solid var(--accent);}
.stat-card.green{border-top-color:var(--green);}.stat-card.gold{border-top-color:var(--gold);}.stat-card.red{border-top-color:var(--red);}.stat-card.purple{border-top-color:var(--purple);}
.stat-val{font-size:1.7rem;font-weight:700;color:var(--sky);font-family:'JetBrains Mono',monospace;}
.stat-val.green{color:var(--green);}.stat-val.gold{color:var(--gold);}.stat-val.red{color:var(--red);}.stat-val.purple{color:var(--purple);}
.stat-label{font-size:.75rem;color:var(--text2);margin-top:0.2rem;}

/* distribution bars */
.dist{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem 1.4rem;}
.bar-label{font-size:0.76rem;color:var(--text);margin-bottom:0.3rem;display:flex;justify-content:space-between;}
.bar-label span{color:var(--text2);}
.stack{display:flex;height:20px;background:var(--surface2);border-radius:5px;overflow:hidden;}
.stack div{display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;color:#fff;}
.legend{display:flex;gap:0.9rem;font-size:.75rem;color:var(--text2);margin-top:0.9rem;flex-wrap:wrap;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;}
.bar-track{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;min-width:70px;}
.bar-fill{height:100%;border-radius:4px;}

/* flow */
.flow{display:flex;align-items:center;flex-wrap:wrap;gap:0.4rem;justify-content:center;padding:0.4rem 0;}
.flow-step{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:0.6rem 0.9rem;font-size:0.8rem;font-weight:700;color:var(--sky);text-align:center;}
.flow-step.red{color:var(--red);border-color:rgba(224,82,82,0.4);}
.flow-sub{font-size:.75rem;color:var(--text2);font-weight:400;margin-top:0.15rem;}
.flow-arrow{color:var(--text2);font-weight:700;}
.flow-label{font-size:.75rem;font-weight:700;color:var(--gold);width:100%;text-align:center;margin-top:0.6rem;}
.info-box{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:0.7rem 1rem;font-size:0.77rem;color:var(--text2);margin-top:0.8rem;line-height:1.7;}
.info-box .hl{color:var(--sky);font-weight:600;}
.hint{font-size:.75rem;color:var(--text2);margin-top:0.7rem;line-height:1.6;}

/* practical */
.lv{display:flex;gap:0.35rem;flex-wrap:wrap;}
.lv button{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:0.3rem 0.5rem;font-size:.75rem;color:var(--text2);cursor:pointer;font-family:inherit;line-height:1.25;text-align:center;min-width:66px;transition:all .15s;}
.lv button b{display:block;font-size:0.9rem;color:var(--text);font-family:'JetBrains Mono',monospace;}
.lv button:hover{border-color:var(--sky);}
.lv button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.lv button.on b{color:#fff;}
.crit{font-size:.75rem;color:var(--text2);margin-top:0.25rem;line-height:1.5;}
.sc-in{width:72px!important;text-align:center;font-family:'JetBrains Mono',monospace;font-size:1rem!important;font-weight:700;}
.score-total-bar{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:0.8rem 1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-top:1rem;}
.score-total-bar .big{font-size:1.9rem;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--sky);}
.edit-tag{font-size:.75rem;color:var(--gold);text-transform:none;letter-spacing:0;}

/* modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:9999;align-items:flex-start;justify-content:center;overflow:auto;padding:2rem 0.6rem;}
.modal-bg.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.6rem;width:100%;max-width:860px;box-shadow:0 8px 40px rgba(0,0,0,0.5);}
.modal-title{font-size:1rem;font-weight:700;color:var(--sky);flex:1;}
.modal h4{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--purple);margin:1.3rem 0 0.6rem;display:flex;gap:0.6rem;align-items:center;flex-wrap:wrap;}
.modal h4.t{color:var(--blue);}
.weak{color:var(--red)!important;font-weight:700;}
.muted{color:var(--text2);font-size:0.76rem;}
.empty-state{text-align:center;padding:2rem;color:var(--text2);font-size:0.82rem;}

/* ===== EXAM (exam.html style) ===== */
.ex-wrap{display:flex;justify-content:center;padding:1rem 0;}
.ex-card{background:#0d0d0d;border:1px solid #2a2a2a;border-radius:16px;padding:2rem 1.5rem;width:100%;max-width:420px;position:relative;}
.ex-ttl{font-size:1.1rem;font-weight:800;text-align:center;color:var(--sky);margin-bottom:0.25rem;}
.ex-sub{font-size:0.78rem;color:#8a8a8a;text-align:center;margin-bottom:1.2rem;}
.ex-tags{display:flex;gap:0.5rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.2rem;}
.ex-tag{background:#141414;border:1px solid #2a2a2a;border-radius:20px;padding:0.2rem 0.7rem;font-size:.75rem;color:#8a8a8a;}
.ex-card label{font-size:0.82rem;color:#8a8a8a;font-weight:600;}
.ex-card select{background:#141414;border:1px solid #2a2a2a;border-radius:10px;font-size:1rem;padding:0.75rem 0.9rem;margin-bottom:1rem;}
.ex-info{display:none;background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.3);border-radius:8px;padding:0.6rem 0.9rem;margin-bottom:0.8rem;font-size:0.85rem;color:var(--sky);}
.btn-start{display:block;width:100%;background:linear-gradient(135deg,#c9a84c,#b8923a);color:#fff;border:none;border-radius:12px;padding:1rem;font-size:1.05rem;font-weight:700;cursor:pointer;margin-top:0.5rem;font-family:inherit;}
.btn-start:active{opacity:0.85;}
.ex-lang{position:absolute;top:12px;right:12px;}
.ex-link{margin-top:1.2rem;padding-top:1rem;border-top:1px solid #2a2a2a;font-size:0.76rem;color:#8a8a8a;text-align:center;line-height:1.6;}
.qr-box{background:#fff;padding:10px;border-radius:10px;display:inline-block;margin:0.6rem 0 0.3rem;}
.qr-box img,.qr-box canvas{display:block;}
.qr-url{font-size:.75rem;color:#8a8a8a;word-break:break-all;margin-bottom:0.6rem;}
.qr-sheet{text-align:center;padding:1rem 0;}
.qr-sheet .qr-box{padding:18px;}
.qr-sheet h2{color:var(--sky);font-size:1.4rem;margin-bottom:0.2rem;}
.qr-sheet .qs-sub{color:var(--text2);font-size:0.95rem;margin-bottom:0.4rem;}
.qr-sheet .qs-steps{color:var(--text);font-size:0.9rem;line-height:1.9;margin-top:0.8rem;}

#exScreen{background:#0d0d0d;border-radius:10px;overflow:hidden;max-width:640px;margin:0 auto;border:1px solid #2a2a2a;}
body.exam-only #exScreen{border:none;border-radius:0;max-width:none;min-height:100vh;}
.ex-hdr{background:#0d0d0d;border-bottom:1px solid #2a2a2a;padding:0.8rem 1rem;display:flex;justify-content:space-between;align-items:center;gap:0.6rem;position:sticky;top:0;z-index:50;}
.ex-hdr-u{font-size:0.78rem;color:#8a8a8a;}
.ex-hdr-u strong{color:var(--sky);}
.ex-cnt{font-size:0.9rem;font-weight:700;color:var(--gold);font-family:monospace;background:#141414;padding:0.2rem 0.6rem;border-radius:6px;}
.pb-w{width:100%;height:5px;background:#141414;}
.pb-f{height:100%;background:linear-gradient(90deg,#c9a84c,#2bbcb0);transition:width 0.4s;}
.qw{padding:1.2rem 1rem 2.5rem;max-width:600px;margin:0 auto;}
.qcnt{font-size:0.75rem;color:#8a8a8a;text-align:center;margin-bottom:0.5rem;}
.qtxt{font-size:1.05rem;font-weight:700;line-height:1.7;color:#f0f0f0;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:12px;padding:1.1rem 1rem;margin-bottom:1rem;word-break:keep-all;}
.opts{display:flex;flex-direction:column;gap:0.65rem;}
.opt-btn{background:#0d0d0d;border:2px solid #2a2a2a;border-radius:12px;padding:0.9rem 1rem;text-align:left;cursor:pointer;display:flex;align-items:center;gap:0.7rem;color:#f0f0f0;font-size:0.97rem;width:100%;font-family:inherit;}
.opt-btn.selected{border-color:#c9a84c;background:rgba(201,168,76,0.15);}
.onum{width:28px;height:28px;border-radius:50%;background:#141414;border:1px solid #2a2a2a;display:inline-flex;align-items:center;justify-content:center;font-size:0.78rem;font-weight:700;flex-shrink:0;color:#8a8a8a;}
.opt-btn.selected .onum{background:#c9a84c;border-color:#c9a84c;color:#fff;}
.otxt{flex:1;line-height:1.5;word-break:keep-all;}
.q21r{background:#141414;border:1px solid #2a2a2a;border-radius:10px;margin-top:0.7rem;font-size:0.95rem;min-height:90px;}
.dots{display:flex;flex-wrap:wrap;margin:0.9rem 0;justify-content:center;}
.a-dot{width:32px;height:32px;border-radius:50%;border:2px solid #2a2a2a;display:inline-flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;cursor:pointer;color:#8a8a8a;background:#141414;margin:0.2rem;}
.a-dot.answered{background:#c9a84c;border-color:#c9a84c;color:#fff;}
.a-dot.current{border-color:var(--gold);}
.ex-nav{display:flex;gap:0.6rem;margin-top:1.2rem;}
.btn-prev,.btn-next,.btn-submit{flex:1;padding:0.9rem;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-prev{background:#141414;color:#8a8a8a;}
.btn-next{background:linear-gradient(135deg,#c9a84c,#b8923a);color:#fff;}
.btn-submit{background:linear-gradient(135deg,#2ecc71,#27ae60);color:#fff;}
.btn-prev:disabled{opacity:0.4;}
.done-card{background:#0d0d0d;border:1px solid #2a2a2a;border-radius:16px;padding:2rem 1.5rem;width:100%;max-width:420px;text-align:center;}
.done-title{font-size:1.3rem;font-weight:800;margin-bottom:0.3rem;}
.done-score{font-size:3.4rem;font-weight:900;font-family:'JetBrains Mono',monospace;margin:0.4rem 0;}
.done-msg{font-size:0.85rem;color:#8a8a8a;line-height:1.7;margin:0.8rem 0 1.2rem;}
body.exam-only{background:#0d0d0d;}
body.exam-only .ex-wrap{min-height:100vh;align-items:center;padding:1.2rem;}
body.exam-only .page{padding:0;max-width:none;}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#141414;border:1px solid var(--sky);color:#fff;padding:0.65rem 1.2rem;border-radius:8px;display:none;z-index:99999;font-size:0.82rem;font-weight:600;}
.hide{display:none!important;}
@media(max-width:640px){.page{padding:0.8rem;}.card{padding:1rem;}}
@media print{
  :root{--bg:#fff;--surface:#fff;--surface2:#eef1f6;--border:#c9ced8;--text:#000;--text2:#444;--sky:#1f4e9c;}
  body{background:#fff;}header,.no-print{display:none!important;}
  .card{box-shadow:none;border:none;padding:0;}.tw{max-height:none;overflow:visible;}.results-table th{position:static;}
  body.printmodal .page{display:none!important;}
  .modal-bg.open{position:static;background:none;padding:0;}.modal{box-shadow:none;border:none;max-width:none;}
}

<!-- ═══ 포털 공통 (yh-common-v2): 제목 서체 · 닫기 버튼 · 최소 글자 크기 ═══ -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style id="yh-common-v2">
  /* ① 제목 서체 */
  .logo-kr{font-family:'IBM Plex Sans KR','Noto Sans KR','Malgun Gothic',sans-serif!important;font-weight:700!important;letter-spacing:-.01em!important;font-size:20px!important;line-height:1.2!important}
  @media (max-width:820px){ .logo-kr{font-size:16px!important} }
  /* ② 닫기 버튼 */
  .yh-close-wrap{display:inline-flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;margin-left:8px}
  header > .yh-close-wrap{margin-left:auto}
  .yh-close-wrap.yh-fixed{position:fixed;top:12px;right:14px;z-index:99999;margin:0}
  .yh-close{height:34px;padding:0 15px;border-radius:999px;background:rgba(10,10,10,.65);border:1px solid rgba(224,92,92,.55);color:#ef9a9a;font-weight:700;font-size:13px;cursor:pointer;font-family:'IBM Plex Sans KR','Noto Sans KR','Malgun Gothic',sans-serif;transition:.15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1;letter-spacing:0}
  .yh-close:hover{background:rgba(224,92,92,.14);border-color:#e05c5c;color:#fff}
  .yh-close-cap{font-family:'Space Mono',ui-monospace,Consolas,monospace;font-size:12px;letter-spacing:.06em;color:#7a7a7a;white-space:nowrap;line-height:1}
  .yh-close .es,.yh-close-cap .es{display:none}
  html[lang="es"] .yh-close .ko,html[lang="es"] .yh-close-cap .ko{display:none}
  html[lang="es"] .yh-close .es,html[lang="es"] .yh-close-cap .es{display:inline}
  @media print{.yh-close-wrap{display:none!important}}
  @media (max-width:820px){.yh-close-cap{display:none} .yh-close{height:30px;padding:0 12px;font-size:12px}}
  /* ③ 최소 글자 크기 (화면에서만) */
  @media screen{.yh-fs12{font-size:12px!important}}
</style>
<script>
(function(){
  /* ── 닫기 버튼 ── */
  function mkClose(){
    if(document.querySelector('.yh-close-wrap'))return;
    var w=document.createElement('span');w.className='yh-close-wrap';
    w.innerHTML='<button type="button" class="yh-close" title="창 닫기 / Cerrar ventana (ESC)"><span>✕</span><span class="ko">닫기</span><span class="es">Cerrar</span></button>'
      +'<small class="yh-close-cap"><span class="ko">창 닫기 (ESC)</span><span class="es">Cerrar ventana (ESC)</span></small>';
    var sel='parent:.lang-btn',t=null;
    try{
      if(sel.indexOf('parent:')===0){var e=document.querySelector(sel.slice(7));t=e&&e.parentElement;}
      else t=document.querySelector(sel);
    }catch(e){}
    if(t)t.appendChild(w);else{w.classList.add('yh-fixed');document.body.appendChild(w);}
    w.querySelector('.yh-close').addEventListener('click',doClose);
    window.addEventListener('keydown',function(ev){
      if(ev.key!=='Escape')return;
      var a=document.activeElement;
      if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
      var openUI=[].slice.call(document.querySelectorAll('dialog,[role="dialog"],[class*="modal"],[class*="overlay"],[class*="drawer"],[class*="popup"],[class*="dialog"],[class*="lightbox"]')).some(function(e){if(e.classList.contains('yh-close-wrap'))return false;var cs=getComputedStyle(e);return cs.display!=='none'&&cs.visibility!=='hidden'&&cs.opacity!=='0'&&e.getBoundingClientRect().width>0;});
      if(openUI)return;
      doClose();
    },true);
  }
  function doClose(){
    var top=window.top||window;
    try{top.close();}catch(e){}
    try{window.close();}catch(e){}
    setTimeout(function(){
      try{if(top.closed||window.closed)return;}catch(e){}
      try{top.location.href='./';}catch(e){location.href='./';}
    },250);
  }
  /* ── 최소 글자 크기 12px ── */
  var SKIP=/^(SCRIPT|STYLE|CANVAS|SVG|svg|path|g|text|tspan|circle|rect|line|polyline|polygon|BR|HR|IMG|VIDEO)$/;
  function bump(root){
    var list=root.querySelectorAll?root.querySelectorAll('*'):[];
    var i=0,n=list.length;
    (function chunk(){
      var end=Math.min(n,i+1500);
      for(;i<end;i++){
        var el=list[i];
        if(SKIP.test(el.tagName)||el.classList.contains('yh-fs12'))continue;
        if(el.namespaceURI&&el.namespaceURI.indexOf('svg')>-1)continue;
        if(el.closest&&el.closest('.pcell,.plabel,.print-only,.sheet-flow'))continue;
        var st=el.style&&el.style.fontSize;
        if(st&&/(pt|mm|cm|in)\s*$/.test(st))continue;
        var fs=parseFloat(getComputedStyle(el).fontSize);
        if(fs>=6&&fs<12)el.classList.add('yh-fs12');
      }
      if(i<n)setTimeout(chunk,0);
    })();
  }
  var pend=null,queue=[];
  function schedule(nodes){
    for(var k=0;k<nodes.length;k++)if(nodes[k].nodeType===1)queue.push(nodes[k]);
    if(pend)return;
    pend=setTimeout(function(){pend=null;var q=queue;queue=[];q.forEach(bump);},120);
  }
  function init(){
    mkClose();
    if(!true)return;
    bump(document.body);
    new MutationObserver(function(ms){
      var add=[];
      ms.forEach(function(m){
        if(m.type==='childList'){for(var j=0;j<m.addedNodes.length;j++)add.push(m.addedNodes[j]);}
        else if(m.type==='attributes'&&m.target.nodeType===1&&!m.target.classList.contains('yh-fs12'))add.push(m.target);
      });
      if(add.length)schedule(add);
    }).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['style','class']});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</head>

let STAFF=[],PRAC=[],THEO=[],CFG={theoryPass:70,shuffle:true};
async function sb(path,opt={}){
  const r=await fetch(SB+'/rest/v1/'+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=representation',...(opt.headers||{})}});
  const t=await r.text(); if(!r.ok) throw new Error(t||r.status); return t?JSON.parse(t):null;
}
async function loadAll(){
  const [s,p,t,c]=await Promise.all([
    sb(TB.staff+'?select=*&order=name'),
    sb(TB.practical+'?select=*&order=eval_date.desc,id.desc'),
    sb(TB.theory+'?select=*&order=exam_date.desc,id.desc'),
    sb(TB.config+'?select=*')]);
  STAFF=s;PRAC=p;THEO=t;
  const st=(c||[]).find(x=>x.key==='settings'); if(st) CFG={...CFG,...st.value};
  const gr=(c||[]).find(x=>x.key==='grades'); if(gr&&gr.value&&Array.isArray(gr.value.levels)&&gr.value.levels.length) GR={...DEF_GR,...gr.value,levels:[...gr.value.levels].sort((a,b)=>b.min-a.min)};
}
const DEF_GR={levels:[{label:'L1',min:95},{label:'L2',min:90},{label:'L3',min:80},{label:'L4',min:70},{label:'L5',min:60}],passMin:80,condMin:70};
let GR=DEF_GR;
const grade=s=>s==null?null:((GR.levels.find(l=>s>=l.min)||{}).label||'NG');
const gClsOf=g=>({L1:'grade-l1',L2:'grade-l2',L3:'grade-l3',L4:'grade-l4',L5:'grade-l5'}[g]||'grade-fail');
const gTag=s=>s==null?`<span class="grade-na">—</span>`:`<span class="${gClsOf(grade(s))}">${s} (${grade(s)})</span>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2400)}
const latestPrac=(n,e)=>PRAC.find(r=>r.staff_name===n&&r.equip===e);
const latestTheo=n=>THEO.find(r=>r.staff_name===n);
const plantLabel=p=>p==='2'?(LANG==='ko'?'2공장':'Planta 2'):(LANG==='ko'?'1공장':'Planta 1');

function judge(n){
  const th=latestTheo(n), sc=EQK.map(e=>{const p=latestPrac(n,e);return p?p.total:null});
  const done=sc.filter(x=>x!=null);
  const avg=done.length?Math.round(done.reduce((a,b)=>a+b,0)/done.length*10)/10:null;
  const cs=EQK.filter((e,i)=>sc[i]!=null&&sc[i]<GR.condMin);
  let res;
  if(th&&th.score<CFG.theoryPass) res='NG';
  else if(!th||done.length<EQK.length) res='NA';
  else if(Math.min(...sc)>=GR.passMin) res='OK';
  else res='COND';
  return {th,sc,avg,res,cs};
}
const resPill=r=>({OK:`<span class="done-badge">✔ ${T('pass')}</span>`,COND:`<span class="pend-badge">△ ${T('cond')}</span>`,NG:`<span class="fail-badge">✖ ${T('fail')}</span>`,NA:`<span class="na-badge">${T('incomplete')}</span>`}[r]);
const thTag=th=>th?`<span class="score-t${th.score<CFG.theoryPass?' low':''}">${th.score}</span>`:`<span class="grade-na">—</span>`;

function opts(list,cur){return list.map(([v,t])=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(t)}</option>`).join('')}
function fillSelects(){
  const act=STAFF.filter(s=>s.active);
  const pl=[['',T('all')],['1',plantLabel('1')],['2',plantLabel('2')]];
  ['fPlant','exPlant'].forEach(id=>{const e=document.getElementById(id);const v=e.value;e.innerHTML=opts(pl,v)});
  const exP=document.getElementById('exPlant').value;
  const exN=document.getElementById('exName');const v1=exN.value;
  exN.innerHTML=`<option value="">-- ${T('sel_name')} --</option>`+opts(act.filter(s=>!exP||s.plant===exP).map(s=>[s.name,s.name+(s.emp_no?' ('+s.emp_no+')':'')]),v1);
  const prN=document.getElementById('prName');const v2=prN.value;
  prN.innerHTML=`<option value="">-- ${T('sel_name')} --</option>`+opts(act.map(s=>[s.name,s.name]),v2);
  const prE=document.getElementById('prEquip');const v3=prE.value||'kmp2n';
  prE.innerHTML=opts(EQK.map(k=>[k,L(EQUIP[k])]),v3);
  const hN=document.getElementById('hName');const v4=hN.value;
  hN.innerHTML=`<option value="">${T('name')}: ${T('all')}</option>`+opts(STAFF.map(s=>[s.name,s.name]),v4);
  const hE=document.getElementById('hEquip');const v5=hE.value;
  hE.innerHTML=`<option value="">${T('equip')}: ${T('all')}</option>`+opts(EQK.map(k=>[k,eqShort(k)]),v5);
}

function renderDash(){
  const st=dashStaff(), J=st.map(s=>({s,...judge(s.name)}));
  const thDone=J.filter(j=>j.th).length, thPass=J.filter(j=>j.th&&j.th.score>=CFG.theoryPass).length;
  const allSc=J.flatMap(j=>j.sc.filter(x=>x!=null));
  const avg=allSc.length?(allSc.reduce((a,b)=>a+b,0)/allSc.length).toFixed(1):'—';
  const cnt=r=>J.filter(j=>j.res===r).length;
  document.getElementById('kpis').innerHTML=[
    ['',st.length,T('k_staff')],['',`${thDone}/${thPass}`,T('k_theory')],['purple',avg,T('k_avg')],
    ['green',cnt('OK'),T('k_ok')],['gold',cnt('COND'),T('k_cond')],['red',cnt('NG'),T('k_ng')]
  ].map(([c,v,l])=>`<div class="stat-card ${c}"><div class="stat-val ${c}">${v}</div><div class="stat-label">${l}</div></div>`).join('');
  let h=`<thead><tr><th>#</th><th class="l">${T('name')}</th><th>${T('plant')}</th><th>${T('theory')}</th>${EQK.map(k=>`<th>${eqShort(k)}</th>`).join('')}<th>${T('avg')}</th><th>${T('result')}</th><th class="no-print">${T('cert')}</th></tr></thead><tbody>`;

      <div style="margin-top:0.5rem;font-size:0.8rem"><b>Q21.</b> ${esc(L(Q21))}<div class="muted">${j.th.q21_choice?esc(Q21.o[j.th.q21_choice==='A'?0:1][li]):'—'} ${esc(j.th.q21_reason||'')}</div></div>`;
  } else h+=`<div class="muted">${T('no_data')}</div>`;
  EQK.forEach(k=>{

      const v=p.scores[i]??0, r=v/it.max, w=r<0.7;
      return `<tr><td class="l${w?' weak':''}">${L(it)}</td><td class="mono${w?' weak':''}">${v} / ${it.max}</td><td><div class="bar-track"><div class="bar-fill" style="width:${r*100}%;background:${w?'var(--red)':r>=0.9?'#f1c40f':r>=0.8?'var(--green)':'var(--blue)'}"></div></div></td></tr>`}).join('')+'</tbody></table>';
    const weak=E.items.filter((it,i)=>(p.scores[i]??0)/it.max<0.7).map(L);
    if(weak.length) h+=`<div class="weak" style="font-size:0.74rem;margin-top:0.4rem">⚠ ${T('weak')}: ${weak.join(', ')}</div>`;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const NQ=21;
function renderQ(){
  const li=LANG==='ko'?0:1, i=EX.cur, ko=LANG;
  document.getElementById('qCounter').textContent=`${T('question')} ${i+1} / ${NQ}`;
  if(i<20){
    const q=Q[i];
    document.getElementById('qText').textContent=`${i+1}. ${q[ko]}`;
    document.getElementById('qOpts').innerHTML=EX.order[i].map((oi,pos)=>`<button type="button" class="opt-btn${EX.ans[i]===oi?' selected':''}" onclick="pick(${oi})"><span class="onum">${ABCD[pos]}</span><span class="otxt">${esc(q.o[oi][li])}</span></button>`).join('');
  } else {
    document.getElementById('qText').textContent=`21. ${Q21[ko]}`;
    document.getElementById('qOpts').innerHTML=Q21.o.map((o,k)=>`<button type="button" class="opt-btn${EX.q21===ABCD[k]?' selected':''}" onclick="pick21('${ABCD[k]}')"><span class="onum">${ABCD[k]}</span><span class="otxt">${esc(o[li])}</span></button>`).join('')
      +`<textarea class="q21r" id="q21r" placeholder="${T('q21_hint')}" oninput="EX.q21r=this.value">${esc(EX.q21r)}</textarea>`;
  }
  const answered=k=>k<20?EX.ans[k]!=null:!!EX.q21;
  document.getElementById('qDots').innerHTML=Array.from({length:NQ},(_,k)=>`<span class="a-dot${answered(k)?' answered':''}${k===i?' current':''}" onclick="goQ(${k})">${k+1}</span>`).join('');
  document.getElementById('qNav').innerHTML=`<button class="btn-prev" onclick="goQ(${i-1})"${i===0?' disabled':''}>${T('prev')}</button>`+
    (i<NQ-1?`<button class="btn-next" onclick="goQ(${i+1})">${T('next')}</button>`:`<button class="btn-submit" onclick="submitExam()">${T('submit')}</button>`);
  const n=EX.ans.filter(x=>x!=null).length+(EX.q21?1:0);
  document.getElementById('exCnt').textContent=`${n}/${NQ}`;
  document.getElementById('exBar').style.width=(n/NQ*100)+'%';
}
function goQ(k){if(k<0||k>=NQ)return;EX.cur=k;renderQ();window.scrollTo(0,document.getElementById('exScreen').offsetTop-70)}
function pick(oi){EX.ans[EX.cur]=oi;renderQ();if(EX.cur<NQ-1)setTimeout(()=>goQ(EX.cur+1),250)}
function pick21(c){EX.q21=c;renderQ();setTimeout(()=>{const t=document.getElementById('q21r');if(t)t.focus()},50)}

async function submitExam(){
  const miss=EX.ans.map((a,i)=>a==null?i:-1).filter(i=>i>=0); if(!EX.q21) miss.push(20);
  if(miss.length){alert(T('unanswered_confirm')+` (${miss.map(i=>i+1).join(', ')})`);goQ(miss[0]);return}
  const correct=EX.ans.filter((a,i)=>a===Q[i].a).length, score=correct*5;
  const rec={staff_name:EX.name,lang:LANG,answers:EX.ans,correct,score,q21_choice:EX.q21,q21_reason:EX.q21r,exam_date:today()};
  try{const r=await sb(TB.theory+'',{method:'POST',body:JSON.stringify(rec)});THEO.unshift(r[0])}catch(e){alert(T('err')+': '+e.message);return}
  const ok=score>=CFG.theoryPass, g=grade(score), ko=LANG==='ko';

  document.getElementById('exResult').classList.remove('hide');
  document.getElementById('exResultCard').innerHTML=`<div style="font-size:3rem">${ok?'✅':'📚'}</div>
    <div class="done-title" style="color:${ok?'var(--green)':'var(--red)'}">${ok?(ko?'합격':'Aprobado'):(ko?'불합격':'Reprobado')}</div>
    <div class="muted">${esc(EX.name)}</div>
    <div class="done-score" style="color:${ok?'var(--green)':'var(--red)'}">${score}</div>
    <span class="${ok?gClsOf(g):'grade-fail'}">${g}</span>
    <div class="done-msg">${ko?'정답':'Correctas'} ${correct} / 20<br>${ok?'':(ko?'교육 후 재시험 대상입니다.':'Debe recapacitarse y presentar de nuevo.')}<br>${ko?'21번 서술형은 평가자가 확인합니다.':'La pregunta 21 la revisa el evaluador.'}</div>
    <button class="btn-start" onclick="EX={on:false};resetExamView()">${T('next_person')}</button>`;
  window.scrollTo(0,0); EX.on=false;
}

    <td style="white-space:nowrap"><button class="btn btn-secondary btn-sm" onclick="editPrac(${r.id})">✏️ ${T('edit')}</button> <button class="btn btn-danger btn-sm" onclick="delRec(TB.practical+'',${r.id})">🗑</button></td></tr>`).join(''):`<tr><td colspan="8" class="empty-state">${T('no_data')}</td></tr>`)+'</tbody>';
  const TH=THEO.filter(r=>!n||r.staff_name===n);
  document.getElementById('hTheory').innerHTML=`<thead><tr><th>${T('date')}</th><th class="l">${T('name')}</th><th>${T('lang')}</th><th>${T('correct_cnt')}</th><th>${T('score')}</th><th class="l">Q21</th><th></th></tr></thead><tbody>`+
   (TH.length?TH.map(r=>`<tr><td class="mono">${r.exam_date}</td><td class="l">${esc(r.staff_name)}</td><td>${r.lang==='ko'?'KR':'ES'}</td><td class="mono">${r.correct}/20</td><td>${gTag(r.score)}</td><td class="l muted">${esc(r.q21_choice||'')} ${esc(r.q21_reason||'')}</td>
    <td style="white-space:nowrap"><button class="btn btn-secondary btn-sm name-link-btn" onclick="openPerson(this.dataset.n)" data-n="${esc(r.staff_name)}">🔍 ${T('view')}</button> <button class="btn btn-danger btn-sm" onclick="delRec(TB.theory+'',${r.id})">🗑</button></td></tr>`).join(''):`<tr><td colspan="7" class="empty-state">${T('no_data')}</td></tr>`)+'</tbody>';

async function delRec(tb,id){if(!confirm(T('del_confirm')))return;try{await sb(tb+'?id=eq.'+id,{method:'DELETE'});await loadAll();toast(T('deleted'));render()}catch(e){alert(T('err')+': '+e.message)}}

/* ===================== ADMIN ===================== */
function renderAdmin(){
  document.getElementById('staffT').innerHTML=`<thead><tr><th>#</th><th class="l">${T('name')}</th><th>${T('c_photo')}</th><th>${T('empno')}</th><th>${T('plant')}</th><th>${T('active')}</th><th></th></tr></thead><tbody>`+
   STAFF.map((s,i)=>`<tr><td class="mono">${i+1}</td><td class="l">${esc(s.name)}</td><td style="white-space:nowrap"><span class="st-ph" data-ph="${esc(String(s.emp_no||'').trim())}">👤</span><button type="button" class="btn-cert" data-phup="${s.id}" data-cam="1" title="${T('c_shoot')}">📷</button> <button type="button" class="btn-cert" data-phup="${s.id}" title="${T('c_file')}">🖼</button></td><td><input type="text" value="${esc(s.emp_no||'')}" style="width:120px" onchange="updStaff(${s.id},{emp_no:this.value.trim()})"></td>
    <td><select style="width:auto" onchange="updStaff(${s.id},{plant:this.value})">${opts([['1',plantLabel('1')],['2',plantLabel('2')]],s.plant)}</select></td>
    <td><input type="checkbox" style="width:auto" ${s.active?'checked':''} onchange="updStaff(${s.id},{active:this.checked})"></td><td><button class="btn btn-danger btn-sm" onclick="delStaff(${s.id})">🗑</button></td></tr>`).join('')+'</tbody>';
  document.getElementById('cfPass').value=CFG.theoryPass;document.getElementById('cfShuffle').value=CFG.shuffle?'1':'0';
  const li=LANG==='ko'?0:1;
  document.getElementById('qbankT').innerHTML=`<thead><tr><th>No</th><th class="l">${LANG==='ko'?'문제':'Pregunta'}</th><th>${T('answer')}</th></tr></thead><tbody>`+
   Q.map((q,i)=>`<tr><td class="mono">${i+1}</td><td class="l">${esc(L(q))}<div class="muted" style="margin-top:3px">${q.o.map((o,k)=>`<span style="${k===q.a?'color:var(--green);font-weight:700':''}">${ABCD[k]}) ${esc(o[li])}</span>`).join(' &nbsp; ')}</div></td><td><span class="grade-a">${ABCD[q.a]}</span></td></tr>`).join('')+
   `<tr><td class="mono">21</td><td class="l">${esc(L(Q21))}</td><td class="muted">${LANG==='ko'?'서술형':'Abierta'}</td></tr></tbody>`;
  try{MCERT.fillThumbs()}catch(e){}
}
async function addStaff(){
  const name=document.getElementById('adName').value.trim(); if(!name)return;
  if(STAFF.some(s=>s.name.toLowerCase()===name.toLowerCase())){alert(T('dup'));return}
  try{await sb(TB.staff+'',{method:'POST',body:JSON.stringify({name,emp_no:document.getElementById('adNo').value.trim()||null,plant:document.getElementById('adPlant').value})});
    document.getElementById('adName').value='';document.getElementById('adNo').value='';await loadAll();render();toast(T('saved'))}catch(e){alert(T('err')+': '+e.message)}
}
async function delStaff(id){
  const s=STAFF.find(x=>x.id===id); if(!s)return;
  if(!confirm((LANG==='ko'?'명단에서 삭제할까요? (평가 기록은 유지됩니다)\n':'¿Eliminar de la lista? (los registros se conservan)\n')+s.name))return;
  try{await sb(TB.staff+'?id=eq.'+id,{method:'DELETE'});await loadAll();render();toast(T('deleted'))}catch(e){alert(T('err')+': '+e.message)}
}
async function updStaff(id,patch){try{await sb(TB.staff+'?id=eq.'+id,{method:'PATCH',body:JSON.stringify(patch)});Object.assign(STAFF.find(s=>s.id===id),patch);toast(T('saved'))}catch(e){alert(T('err')+': '+e.message)}}
async function saveCfg(){
  CFG={theoryPass:+document.getElementById('cfPass').value||70,shuffle:document.getElementById('cfShuffle').value==='1'};
  try{await sb(TB.config+'',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify({key:'settings',value:CFG})});toast(T('saved'))}catch(e){alert(T('err')+': '+e.message)}
}

(async()=>{

  applyLang();
  document.getElementById('kpis').innerHTML=`<div class="stat-card"><div class="stat-label">${T('loading')}</div></div>`;
  try{await loadAll()}catch(e){alert(T('err')+': '+e.message)}

  .info .v{font-size:13.5pt;font-weight:700;margin-top:1.2mm;line-height:1.25}
  .info .v.g{color:#d71920;font-size:16.5pt}
  .info .v small{font-size:8.5pt;font-weight:500;color:#666;margin-left:1mm}
  .photo{width:40mm;height:50mm;flex:none;border:.4mm solid #161616;padding:1mm;background:#fff;display:flex;align-items:center;justify-content:center}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .photo .noph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4mm;background:#fafafa}
  .photo .noph svg{width:27mm;height:27mm}
  .photo .noph .cap{font-size:6.4pt;line-height:1.25;text-align:center;color:#333;font-weight:700}
  .photo .noph .cap small{display:block;font-weight:400;color:#777;font-size:5.8pt}
  .body{margin-top:14mm;text-align:center;font-size:12pt;line-height:1.8;color:#262626;padding:0 4mm;white-space:pre-line}
  .foot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end}
  .foot .k{font-family:'Space Mono','Courier New',monospace;font-size:6.8pt;letter-spacing:1.6px;color:#8a8a8a;text-transform:uppercase}
  .f-date{width:46mm}.f-date .v{font-size:11.5pt;font-weight:700;margin-top:1.2mm}
  .f-sign{text-align:center;width:66mm}.f-sign .line{border-top:.4mm solid #161616;margin:0 0 2mm}.f-sign .nm{font-size:13pt;font-weight:700;line-height:1.2}.f-sign .k{margin-top:1mm}
  .f-sign .sp{height:14mm}
  .f-qr{width:46mm;display:flex;justify-content:flex-end}
  .f-qr .box{text-align:center}.f-qr svg{width:19mm;height:19mm;display:block;margin:0 auto}
  .f-qr .cap{font-family:'Space Mono','Courier New',monospace;font-size:6pt;color:#8a8a8a;letter-spacing:.8px;margin-top:1mm;line-height:1.3}
  .ft{position:absolute;left:12mm;right:12mm;bottom:12.8mm;text-align:center;font-family:'Space Mono','Courier New',monospace;font-size:6pt;letter-spacing:1.8px;color:#aaa}
  `;
  function build(d){
    const body=(d.body||DEFAULT_BODY).replace(/\{proceso\}/g,d.processEs||d.process||'');
    const photo=d.photo
      ?`<img src="${d.photo}" alt="foto">`
      :`<div class="noph">${d.qrSvg||''}<div class="cap">Escanea para subir tu foto<small>사진 등록 (QR 스캔)</small></div></div>`;
    const no=`${d.plant?'P'+d.plant+'-':''}${esc(d.empNo)}${d.issueDate?'-'+String(d.issueDate).replace(/-/g,'').slice(2):''}`;
    return `<!doctype html><html><head><meta charset="utf-8"><title>Certificado - ${esc(d.name)}</title>${FONT}<style>${CSS}${d.zoom?`html{zoom:${d.zoom}}`:''}</style></head><body>
<div class="page">
  <div class="fr1"></div><div class="fr2"></div><div class="cn tl"></div><div class="cn tr"></div><div class="cn bl"></div><div class="cn br"></div>
  <div class="in">
    <div class="hd"><img src="${LOGO}" alt="YURA HARNESS"><div class="no">CERTIFICADO N°<br><b>${no}</b></div></div>
    <div class="co">YURA HARNESS MÉXICO</div>
    <div class="title">Certificación de calificación</div>
    <div class="rule"></div>
    <div class="intro">Se otorga el presente certificado a</div>
    <div class="name">${esc(d.name)}</div>
    <div class="meta">
      <div class="info">
        <div><div class="k">N° de empleado</div><div class="v">${esc(d.empNo)}</div></div>
        <div><div class="k">Departamento</div><div class="v">${esc(d.dept)}</div></div>
        <div><div class="k">Proceso calificado</div><div class="v">${esc(d.processEs||d.process||'')}</div></div>
        <div><div class="k">Grado · Nota</div><div class="v g">${esc(d.grade)}<small>${esc(d.score)} pts</small></div></div>
        <div><div class="k">Fecha de ingreso</div><div class="v">${esc(fmtD(d.hireDate))}</div></div>
        <div><div class="k">Fecha de vigencia</div><div class="v">${esc(fmtD(d.validDate))}</div></div>
      </div>
      <div class="photo">${photo}</div>
    </div>
    <div class="body">${esc(body)}</div>
    <div class="foot">
      <div class="f-date"><div class="k">Fecha de emisión</div><div class="v">${esc(fmtD(d.issueDate))}</div></div>
      <div class="f-sign"><div class="sp"></div><div class="line"></div><div class="nm">${esc(d.manager)}</div><div class="k">Gerente · YURA Harness</div></div>
      <div class="f-qr">${d.qrSvg?`<div class="box">${d.qrSvg}<div class="cap">VERIFICACIÓN</div></div>`:''}</div>
    </div>
  </div>
  <div class="ft">YURA HARNESS MÉXICO · SISTEMA DE CERTIFICACIÓN DE CALIFICACIÓN${d.plant?' · PLANTA '+d.plant:''}</div>
</div></body></html>`;
  }
  // 개인 QR 라벨 시트 — list=[{name,empNo,process,processEs,qrSvg}]
  function labels(list,opts){
    opts=opts||{};
    const css=`
    @page{size:letter;margin:8mm}
    *{box-sizing:border-box}
    body{margin:0;font-family:'Noto Sans KR','Noto Sans',Arial,sans-serif;color:#111;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .hd{font-size:8pt;color:#666;margin:0 0 3mm;display:flex;justify-content:space-between}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm}
    .lb{border:1px dashed #9a9a9a;border-radius:2mm;height:40mm;display:flex;align-items:center;gap:2.5mm;padding:2.5mm;break-inside:avoid;page-break-inside:avoid;overflow:hidden}
    .lb svg{width:29mm;height:29mm;flex:none}
    .tx{min-width:0;flex:1;display:flex;flex-direction:column;gap:.8mm}
    .tx .n{font-weight:800;font-size:9.5pt;line-height:1.15;word-break:break-word}
    .tx .e{font-family:'Courier New',monospace;font-size:9pt;font-weight:700;color:#000}
    .tx .p{font-size:7.5pt;color:#333;line-height:1.2}
    .tx .s{font-size:6.3pt;color:#777;line-height:1.15;margin-top:.5mm}
    .tx .co{font-size:6.5pt;font-weight:800;color:#8a6d1f;letter-spacing:.3px}
    @media screen{body{padding:8mm}}`;
    return `<!doctype html><html><head><meta charset="utf-8"><title>QR - Certificado</title>${FONT}<style>${css}${opts.zoom?`html{zoom:${opts.zoom}}`:''}</style></head><body>
<div class="hd"><span>YURA HARNESS MÉXICO · Certificado de calificación — QR personal (${list.length})</span><span>${esc(opts.date||'')}</span></div>
<div class="grid">${list.map(x=>`<div class="lb">${x.qrSvg}<div class="tx"><div class="co">YURA HARNESS</div><div class="n">${esc(x.name)}</div><div class="e">${esc(x.empNo)}</div><div class="p">${esc(x.processEs||x.process||'')}</div><div class="s">Escanea para ver el certificado<br>인증서 확인 · 사진 등록</div></div></div>`).join('')}</div>
</body></html>`;
  }
  return {build,labels,DEFAULT_BODY,fmtD,_logo:LOGO};
})();
</script>
<script>
// ════ 보전자 인증서 출력 · 사진 · 개인 QR 라벨 (2026-11-13) ════
// · 인증 현황 표의 🪪 버튼 → 인증서 모달(미리보기·설정·사진·인쇄) — 가공·조립 자격인증과 같은 양식(CERT_DOC)
// · 점수 = 실기 평균, 등급 = 실기 평균의 L등급, 평가일 = 이론·실기 중 가장 최근 평가일
// · 개인 QR: cert.html?p=공장&e=사번&t=m (서버 함수 cert_info_m — maint_cert_cert.sql)
// · 공통 설정(Gerente·유효기간·본문·공정명·QR 기본주소)은 mcert_config key='cert'에 저장
var MCERT=(function(){
  const P=parseInt(PLANT)||1;
  const DEF={certManager:P===1?'LEE DU SUNG':'Park Jae Yoon',certValidMonths:'12',certDept:'MANTENIMIENTO',certProc:'Mantenimiento de equipos',certBaseUrl:'https://yuraharness-mexico.pages.dev',certBody:CERT_DOC.DEFAULT_BODY};
  const cfg=Object.assign({},DEF);
  let cur=null,_t=null,_cfgT=null;
  const $=id=>document.getElementById(id);
  const addMonths=(d,m)=>{if(!d)return'';const x=new Date(d+'T00:00:00');if(isNaN(x))return'';x.setMonth(x.getMonth()+(parseInt(m)||0));return x.toISOString().slice(0,10);};
  function applyCfg(o){Object.keys(DEF).forEach(k=>{if(o&&o[k]!=null&&String(o[k])!=='')cfg[k]=String(o[k]);});}
  function urlOf(empNo){const b=String(cfg.certBaseUrl||location.origin).replace(/\/+$/,'');return b+'/cert.html?p='+P+'&e='+encodeURIComponent(empNo)+'&t=m';}
  function qrSvg(text){const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:0,scalable:true});}
  const rpc=(fn,args)=>sb('rpc/'+fn,{method:'POST',body:JSON.stringify(args)});
  function hireFromEmp(e){const m=String(e).match(/^M0(\d{2})(\d{2})(\d{2})/);if(!m)return'';const s=`20${m[1]}-${m[2]}-${m[3]}`;const d=new Date(s+'T00:00:00');return(!isNaN(d)&&d.toISOString().slice(0,10)===s)?s:'';}
  function evalDateOf(n,j){const ds=[j.th&&j.th.exam_date,...EQK.map(e=>{const p=latestPrac(n,e);return p&&p.eval_date;})].filter(Boolean).map(x=>String(x).slice(0,10)).sort();return ds.length?ds[ds.length-1]:today();}
  function gradeOf(j){if(j.avg==null)return'-';const g=grade(j.avg);return g==='NG'?'-':g;}
  function modalHtml(){
    const f=(k,id,extra)=>`<div${extra&&extra.span?' class="span2"':''}><label>${T(k)}${extra&&extra.tail||''}</label>${extra&&extra.ta?`<textarea id="${id}" rows="4" oninput="MCERT.onChange('${extra.src||''}')"></textarea>`:`<input id="${id}" type="${extra&&extra.type||'text'}"${extra&&extra.ro?' readonly':''} oninput="MCERT.onChange('${extra&&extra.src||''}')">`}</div>`;
    return `<div class="cert-head"><div class="modal-title">🪪 ${T('c_title')} <span id="certWho" style="color:var(--text);font-weight:600;margin-left:.4rem"></span></div><button class="btn btn-primary btn-sm" onclick="MCERT.close()">${T('close')}</button></div>
    <div class="cert-wrap"><div class="cert-side">
      <div class="cert-actions"><button class="btn btn-primary" onclick="MCERT.print()">🖨 ${T('c_print')}</button><button class="btn btn-secondary" onclick="MCERT.printLabel()">🔳 ${T('c_label')}</button></div>
      <div class="cert-photo-row"><div class="cert-thumb" id="cPhotoThumb"></div><div style="min-width:0;flex:1"><div id="cPhotoState" style="font-size:12.5px;margin-bottom:.45rem"></div>
        <div style="display:flex;gap:.4rem;flex-wrap:wrap"><button class="btn btn-primary btn-sm" onclick="document.getElementById('cPhotoCam').click()">📷 ${T('c_shoot')}</button><button class="btn btn-secondary btn-sm" onclick="document.getElementById('cPhotoFile').click()">🖼 ${T('c_file')}</button><button class="btn btn-danger btn-sm" id="cPhotoDel" style="display:none" onclick="MCERT.delPhoto()">🗑 ${T('del')}</button>
        <input type="file" id="cPhotoFile" accept="image/*" style="display:none" onchange="MCERT.onPhotoFile(this)"><input type="file" id="cPhotoCam" accept="image/*" capture="environment" style="display:none" onchange="MCERT.onPhotoFile(this)"></div></div></div>
      <div class="cert-grid">
        ${f('c_name','cName')}${f('c_emp','cEmp',{ro:1})}
        ${f('c_dept','cDept',{tail:' <span id="cDeptSrc" style="color:var(--teal)"></span>'})}${f('c_proc','cProc',{src:'proc'})}
        ${f('c_score','cScore')}${f('c_grade','cGrade')}
        ${f('c_hire','cHire',{type:'date'})}${f('c_eval','cEval',{type:'date',src:'eval'})}
        ${f('c_months','cMonths',{type:'number',src:'months'})}${f('c_valid','cValid',{type:'date'})}
        ${f('c_issue','cIssue',{type:'date'})}${f('c_mgr','cManager',{src:'manager'})}
        ${f('c_body','cBody',{span:1,ta:1,src:'body'})}
        <div class="span2"><label>${T('c_base')}</label><input id="cBase" type="text" oninput="MCERT.onChange('base')"><div class="cert-url" id="cUrl"></div></div>
      </div></div>
      <div class="cert-prev"><iframe id="certFrame" title="certificado"></iframe></div></div>`;
  }
  function fillCfg(){$('cManager').value=cfg.certManager;$('cMonths').value=cfg.certValidMonths;$('cBody').value=cfg.certBody;$('cBase').value=cfg.certBaseUrl;$('cProc').value=cfg.certProc;
    $('cValid').value=addMonths($('cEval').value,cfg.certValidMonths);$('cUrl').textContent=urlOf(cur.empNo);}
  async function open(name){
    const s=STAFF.find(x=>x.name===name);if(!s)return;
    const empNo=String(s.emp_no||'').trim();
    if(!empNo){alert(T('c_noemp'));return;}
    const j=judge(name);
    if(j.res!=='OK'&&j.res!=='COND'&&!confirm(T('c_notpass')))return;
    cur={s,j,name,empNo,photo:null,deptSrc:''};
    $('certBody').innerHTML=modalHtml();
    $('certWho').textContent=`${name} · ${empNo}`;
    $('cName').value=name;$('cEmp').value=empNo;$('cDept').value=cfg.certDept;
    $('cScore').value=j.avg!=null?j.avg:'';$('cGrade').value=gradeOf(j);
    $('cHire').value=hireFromEmp(empNo);$('cEval').value=evalDateOf(name,j);$('cIssue').value=today();
    fillCfg();
    $('certModal').classList.add('open');
    setPhotoUI('loading');render();
    const me=cur;
    try{
      const info=await rpc('cert_info_m',{p_plant:P,p_empno:empNo});
      if(cur!==me)return;
      cur.photo=(info&&typeof info.photo==='string'&&info.photo.startsWith('data:'))?info.photo:null;
      if(info&&info.cfg)applyCfg(info.cfg);
      if(info&&info.dept){$('cDept').value=info.dept;cur.deptSrc='tress';}
      if(info&&info.hire_date)$('cHire').value=String(info.hire_date).slice(0,10);
    }catch(e){
      // 서버 함수(cert_info_m) 미설치 시: 사진·설정만 개별 조회
      console.warn('cert_info_m 조회 실패 → 개별 조회',e);
      try{const c=await sb(TB.config+'?key=eq.cert&select=value');if(cur!==me)return;if(c&&c[0]&&c[0].value)applyCfg(c[0].value);}catch(x){}
      try{const p=await rpc('cert_photo_get',{p_plant:P,p_empno:empNo});if(cur!==me)return;cur.photo=(typeof p==='string'&&p.startsWith('data:'))?p:null;}catch(x){}
    }
    if(cur!==me)return;
    fillCfg();
    $('cDeptSrc').textContent='· '+(cur.deptSrc==='tress'?T('c_dept_tress'):T('c_dept_def'));
    setPhotoUI(cur.photo?'ok':'none');render();
  }
  function close(){$('certModal').classList.remove('open');$('certBody').innerHTML='';cur=null;}
  function setPhotoUI(state){
    const th=$('cPhotoThumb'),st=$('cPhotoState');if(!th)return;
    $('cPhotoDel').style.display=state==='ok'?'inline-flex':'none';
    if(state==='loading'){th.textContent=T('c_loading');st.textContent='';return;}
    if(state==='ok'){th.innerHTML=`<img src="${cur.photo}" style="width:100%;height:100%;object-fit:cover;display:block">`;st.innerHTML=`<span style="color:var(--green)">${T('c_ph_ok')}</span>`;return;}
    th.textContent=T('c_ph_none');st.innerHTML=`<span style="color:var(--orange)">${T('c_ph_no')}</span>`;
  }
  function data(){
    if(!cur)return null;
    return {name:$('cName').value,empNo:cur.empNo,plant:P,dept:$('cDept').value,process:'설비 보전',processEs:$('cProc').value,score:$('cScore').value,grade:$('cGrade').value,
      hireDate:$('cHire').value,validDate:$('cValid').value,issueDate:$('cIssue').value,manager:$('cManager').value,body:$('cBody').value,
      photo:cur.photo,qrSvg:qrSvg(urlOf(cur.empNo)),url:urlOf(cur.empNo)};
  }
  function onChange(src){
    if(!cur)return;
    if(src==='months'||src==='eval')$('cValid').value=addMonths($('cEval').value,$('cMonths').value);
    if(src==='base'){cfg.certBaseUrl=$('cBase').value.trim()||DEF.certBaseUrl;$('cUrl').textContent=urlOf(cur.empNo);}
    if(['manager','months','body','base','proc'].includes(src)){clearTimeout(_cfgT);_cfgT=setTimeout(saveCfg,900);}
    clearTimeout(_t);_t=setTimeout(render,250);
  }
  function render(){
    const d=data();if(!d)return;
    const fr=$('certFrame');const w=fr.clientWidth||600;const zoom=Math.min(1,(w-4)/816);   // Letter 215.9mm = 816px
    fr.style.height=Math.round(1056*zoom+8)+'px';
    fr.srcdoc=CERT_DOC.build(Object.assign({zoom},d));
  }
  function printDoc(html){
    const old=$('certPrintFrame');if(old)old.remove();
    const f=document.createElement('iframe');f.id='certPrintFrame';f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
    document.body.appendChild(f);
    f.onload=()=>{const w=f.contentWindow;const go=()=>{try{w.focus();w.print();}catch(e){alert(T('err')+': '+e.message);}};
      const fs=w.document.fonts;if(fs&&fs.ready)fs.ready.then(()=>setTimeout(go,150));else setTimeout(go,400);};
    f.srcdoc=html;
  }
  function print(){const d=data();if(!d)return;printDoc(CERT_DOC.build(d));}
  function printLabel(){if(!cur)return;printDoc(CERT_DOC.labels([{name:cur.name,empNo:cur.empNo,process:'설비 보전',processEs:$('cProc').value,qrSvg:qrSvg(urlOf(cur.empNo))}],{date:today()}));}
  // 인증 현황에 표시된 인원 전체(사번 있는 인원) 개인 QR 라벨
  function printLabels(){
    const list=dashStaff().filter(s=>String(s.emp_no||'').trim()).map(s=>{const e=String(s.emp_no).trim();return {name:s.name,empNo:e,process:'설비 보전',processEs:cfg.certProc,qrSvg:qrSvg(urlOf(e))};});
    if(!list.length){alert(T('c_no_list'));return;}
    list.sort((a,b)=>a.empNo.localeCompare(b.empNo,undefined,{numeric:true}));
    printDoc(CERT_DOC.labels(list,{date:today()}));
  }
  async function saveCfg(){
    if(!cur)return;
    cfg.certManager=$('cManager').value.trim()||DEF.certManager;cfg.certValidMonths=String(parseInt($('cMonths').value)||12);
    cfg.certBody=$('cBody').value||DEF.certBody;cfg.certBaseUrl=$('cBase').value.trim()||DEF.certBaseUrl;cfg.certProc=$('cProc').value.trim()||DEF.certProc;
    const value={certManager:cfg.certManager,certValidMonths:cfg.certValidMonths,certBody:cfg.certBody,certBaseUrl:cfg.certBaseUrl,certProc:cfg.certProc};
    try{await sb(TB.config+'',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify({key:'cert',value})});toast(T('c_cfg_saved'));}
    catch(e){console.warn('인증서 설정 저장 실패',e);toast(T('err')+': '+e.message);}
  }
  // ── 관리 탭 보전자 명단: 사진 썸네일 · 바로 등록 ──
  const phCache=new Map();let upEmp=null;   // 사번 → dataURL | null
  async function photoOf(e){if(phCache.has(e))return phCache.get(e);let v=null;
    try{const p=await rpc('cert_photo_get',{p_plant:P,p_empno:e});v=(typeof p==='string'&&p.startsWith('data:'))?p:null;}catch(x){return null;}
    phCache.set(e,v);return v;}
  function paintThumb(e){const v=phCache.get(e);document.querySelectorAll('.st-ph[data-ph]').forEach(el=>{if(el.dataset.ph===e)el.innerHTML=v?`<img src="${v}" alt="">`:'👤';});}
  async function fillThumbs(){const es=[...new Set([...document.querySelectorAll('.st-ph[data-ph]')].map(el=>el.dataset.ph).filter(Boolean))];
    for(const e of es){await photoOf(e);paintThumb(e);}}
  function pickFor(id,cam){const s=STAFF.find(x=>x.id===id);const e=String(s&&s.emp_no||'').trim();if(!e){alert(T('c_noemp'));return;}upEmp=e;$(cam?'mcPhCam':'mcPhFile').click();}
  async function onListFile(inp){const f=inp.files&&inp.files[0];inp.value='';const e=upEmp;upEmp=null;if(!f||!e)return;
    try{const dataUrl=await shrink(f,640,0.85);
      const res=await rpc('cert_photo_set',{p_plant:P,p_empno:e,p_photo:dataUrl,p_source:'admin'});
      if(res&&res.ok===false){alert(res.msg||T('err'));return;}
      phCache.set(e,dataUrl);paintThumb(e);toast(T('c_ph_saved'));
    }catch(x){alert(T('err')+': '+x.message);}}
  async function onPhotoFile(inp){
    const f=inp.files&&inp.files[0];inp.value='';if(!f||!cur)return;
    try{const dataUrl=await shrink(f,640,0.85);
      const res=await rpc('cert_photo_set',{p_plant:P,p_empno:cur.empNo,p_photo:dataUrl,p_source:'admin'});
      if(res&&res.ok===false){alert(res.msg||T('err'));return;}
      cur.photo=dataUrl;phCache.set(cur.empNo,dataUrl);paintThumb(cur.empNo);setPhotoUI('ok');render();toast(T('c_ph_saved'));
    }catch(e){alert(T('err')+': '+e.message);}
  }
  async function delPhoto(){
    if(!cur||!confirm(T('c_del_photo')))return;
    try{await rpc('cert_photo_del',{p_plant:P,p_empno:cur.empNo});
      const p=await rpc('cert_photo_get',{p_plant:P,p_empno:cur.empNo});cur.photo=(typeof p==='string'&&p.startsWith('data:'))?p:null;
      phCache.set(cur.empNo,cur.photo);paintThumb(cur.empNo);setPhotoUI(cur.photo?'ok':'none');render();}catch(e){alert(T('err')+': '+e.message);}
  }
  function shrink(file,max,q){return new Promise((ok,no)=>{const img=new Image();const u=URL.createObjectURL(file);
    img.onload=()=>{URL.revokeObjectURL(u);let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);ok(c.toDataURL('image/jpeg',q));};
    img.onerror=()=>{URL.revokeObjectURL(u);no(new Error('image'));};img.src=u;});}
  document.addEventListener('click',e=>{const b=e.target.closest('[data-cert]');if(b){e.stopPropagation();open(b.dataset.cert);return;}
    const u=e.target.closest('[data-phup]');if(u)pickFor(parseInt(u.dataset.phup),!!u.dataset.cam);});
  return {open,close,render,onChange,print,printLabel,printLabels,saveCfg,onPhotoFile,delPhoto,fillThumbs,onListFile,urlOf,_cfg:cfg};
})();
</script>
