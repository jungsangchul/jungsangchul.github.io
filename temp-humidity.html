<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일별 온습도 관리 | Control de Temperatura y Humedad</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F2F5F7; --panel:#FFFFFF; --ink:#17324A; --ink-soft:#5B7186;
  --line:#DCE4EA; --temp:#C8442F; --temp-soft:#FBEAE6;
  --humid:#1F6FA8; --humid-soft:#E7F1F8;
  --ok:#2E7D52; --alert:#B3261E; --alert-bg:#FCEBEA;
  --radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo','Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
header{background:var(--ink);color:#fff;padding:14px 18px}
.head-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;max-width:1100px;margin:0 auto}
h1{font-size:1.15rem;font-weight:700;letter-spacing:-.3px}
h1 small{display:block;font-size:.72rem;font-weight:400;opacity:.75;margin-top:2px}
.head-ctrl{display:flex;gap:8px;align-items:center}
.seg{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden}
.seg button{background:transparent;color:#fff;border:0;padding:7px 14px;font-size:.85rem;cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);font-weight:700}
nav{background:var(--panel);border-bottom:1px solid var(--line)}
.tabs{max-width:1100px;margin:0 auto;display:flex}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:12px 6px;font-size:.92rem;color:var(--ink-soft);cursor:pointer;font-family:inherit}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--temp)}
main{max-width:1100px;margin:0 auto;padding:16px 14px 60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.panel h2{font-size:1rem;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
label{display:block;font-size:.78rem;color:var(--ink-soft);margin-bottom:4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:.95rem;font-family:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--humid);outline-offset:-1px}
.num-wrap{position:relative}
.num-wrap span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:.8rem;color:var(--ink-soft)}
.btn{padding:11px 20px;border:0;border-radius:8px;font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn-main{background:var(--ink);color:#fff;width:100%;margin-top:12px}
.btn-sub{background:#EDF1F4;color:var(--ink);border:1px solid var(--line)}
.btn-danger{background:none;border:0;color:var(--alert);cursor:pointer;font-size:.8rem;text-decoration:underline}
.range-hint{display:flex;gap:14px;margin-top:10px;font-size:.8rem;color:var(--ink-soft);flex-wrap:wrap}
.range-hint b.t{color:var(--temp)} .range-hint b.h{color:var(--humid)}
.warn-box{margin-top:12px;background:var(--alert-bg);border:1px solid #E9B4B0;border-radius:8px;padding:10px 12px;font-size:.86rem;color:var(--alert);display:none}
.warn-box.show{display:block}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{background:#F5F8FA;color:var(--ink-soft);font-weight:600;padding:8px 6px;border-bottom:2px solid var(--line);text-align:center;font-size:.76rem;white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
tr.bad{background:var(--alert-bg)}
td .v-bad{color:var(--alert);font-weight:700}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.7rem;font-weight:700}
.badge.ok{background:#E4F2EA;color:var(--ok)} .badge.ng{background:var(--alert);color:#fff}
.table-wrap{overflow-x:auto}
.row-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{border:1px solid var(--line);border-radius:var(--radius);padding:12px;background:var(--panel)}
.stat .lbl{font-size:.74rem;color:var(--ink-soft)}
.stat .val{font-size:1.5rem;font-weight:800;margin-top:2px}
.stat.temp{border-top:3px solid var(--temp)} .stat.humid{border-top:3px solid var(--humid)}
.stat.alertc{border-top:3px solid var(--alert)}
.chart-box{position:relative;height:340px}
.loc-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.loc-chip{background:var(--humid-soft);border:1px solid #BCD6E8;color:var(--humid);padding:5px 10px;border-radius:20px;font-size:.83rem;display:flex;gap:6px;align-items:center}
.loc-chip button{background:none;border:0;color:var(--humid);cursor:pointer;font-weight:700}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 22px;border-radius:24px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:99;max-width:92vw;text-align:center}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--ink-soft);padding:30px 10px;font-size:.9rem}
.action-cell{max-width:180px;font-size:.8rem;text-align:left}
@media(max-width:640px){ main{padding:12px 8px 60px} .panel{padding:12px} }
</style>
</head>
<body>
<header>
  <div class="head-row">
    <h1 id="ttl">일별 온습도 관리<small id="ttl2">Control Diario de Temperatura y Humedad</small></h1>
    <div class="head-ctrl">
      <div class="seg" id="segFactory">
        <button data-f="1" class="on">공장 1</button>
        <button data-f="2">공장 2</button>
      </div>
      <div class="seg" id="segLang">
        <button data-l="ko" class="on">한국어</button>
        <button data-l="es">Español</button>
      </div>
    </div>
  </div>
</header>

<nav><div class="tabs" id="tabs">
  <button data-t="input" class="on"></button>
  <button data-t="month"></button>
  <button data-t="setting"></button>
</div></nav>

<main>
<!-- ========== 입력/일별조회 ========== -->
<section id="view-input">
  <div class="panel">
    <h2 id="h-reg"></h2>
    <div class="grid">
      <div><label id="l-date"></label><input type="date" id="inDate"></div>
      <div><label id="l-time"></label><input type="time" id="inTime"></div>
      <div><label id="l-loc"></label><select id="inLoc"></select></div>
      <div><label id="l-rec"></label><input type="text" id="inRec" maxlength="30"></div>
      <div><label id="l-temp"></label><div class="num-wrap"><input type="number" step="0.1" id="inTemp" inputmode="decimal"><span>°C</span></div></div>
      <div><label id="l-humid"></label><div class="num-wrap"><input type="number" step="0.1" id="inHumid" inputmode="decimal"><span>%</span></div></div>
    </div>
    <div class="range-hint">
      <span>🌡 <b class="t" id="hintTemp"></b></span>
      <span>💧 <b class="h" id="hintHumid"></b></span>
    </div>
    <div class="warn-box" id="warnBox">
      <div id="warnMsg" style="margin-bottom:8px;font-weight:700"></div>
      <label id="l-action" style="color:var(--alert)"></label>
      <textarea id="inAction" rows="2"></textarea>
    </div>
    <button class="btn btn-main" id="btnSave"></button>
  </div>

  <div class="panel">
    <div class="row-tools">
      <h2 id="h-daily" style="border:0;margin:0;padding:0"></h2>
      <input type="date" id="listDate" style="width:auto">
    </div>
    <div class="chart-box" id="dayChartBox" style="height:240px;margin-bottom:14px"><canvas id="chartDay"></canvas></div>
    <div class="table-wrap"><table>
      <thead><tr>
        <th id="th-time"></th><th id="th-loc"></th>
        <th>🌡 °C</th><th>💧 %</th>
        <th id="th-state"></th><th id="th-rec"></th><th id="th-action"></th><th></th>
      </tr></thead>
      <tbody id="dailyBody"></tbody>
    </table></div>
    <div class="empty" id="dailyEmpty" style="display:none"></div>
  </div>
</section>

<!-- ========== 월별 추이 ========== -->
<section id="view-month" style="display:none">
  <div class="row-tools">
    <h2 id="h-month" style="margin:0"></h2>
    <input type="month" id="monthPick" style="width:auto">
  </div>
  <div class="stat-cards">
    <div class="stat temp"><div class="lbl" id="s-tavg"></div><div class="val" id="vTavg">-</div></div>
    <div class="stat temp"><div class="lbl" id="s-trange"></div><div class="val" id="vTrange" style="font-size:1.1rem">-</div></div>
    <div class="stat humid"><div class="lbl" id="s-havg"></div><div class="val" id="vHavg">-</div></div>
    <div class="stat humid"><div class="lbl" id="s-hrange"></div><div class="val" id="vHrange" style="font-size:1.1rem">-</div></div>
    <div class="stat alertc"><div class="lbl" id="s-ng"></div><div class="val" id="vNg">-</div></div>
  </div>
  <div class="panel"><div class="chart-box"><canvas id="chart"></canvas></div></div>
  <div class="panel">
    <h2 id="h-nglist"></h2>
    <div class="table-wrap"><table>
      <thead><tr><th id="th-date2"></th><th id="th-time2"></th><th id="th-loc2"></th><th>🌡</th><th>💧</th><th id="th-action2"></th></tr></thead>
      <tbody id="ngBody"></tbody>
    </table></div>
    <div class="empty" id="ngEmpty" style="display:none"></div>
  </div>
</section>

<!-- ========== 설정 ========== -->
<section id="view-setting" style="display:none">
  <div class="panel">
    <h2 id="h-std"></h2>
    <div class="grid">
      <div><label id="l-tmin"></label><div class="num-wrap"><input type="number" step="0.1" id="setTmin"><span>°C</span></div></div>
      <div><label id="l-tmax"></label><div class="num-wrap"><input type="number" step="0.1" id="setTmax"><span>°C</span></div></div>
      <div><label id="l-hmin"></label><div class="num-wrap"><input type="number" step="0.1" id="setHmin"><span>%</span></div></div>
      <div><label id="l-hmax"></label><div class="num-wrap"><input type="number" step="0.1" id="setHmax"><span>%</span></div></div>
    </div>
  </div>
  <div class="panel">
    <h2 id="h-locmgr"></h2>
    <div style="display:flex;gap:8px">
      <input type="text" id="newLoc" maxlength="40">
      <button class="btn btn-sub" id="btnAddLoc" style="white-space:nowrap"></button>
    </div>
    <div class="loc-list" id="locList"></div>
  </div>
  <button class="btn btn-main" id="btnSaveSet"></button>
</section>
</main>

<div class="toast" id="toast"></div>

<script>
/* ================== Supabase 설정 ================== */
const SB_URL = "https://lrjurjhavlalhlwaplxd.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyanVyamhhdmxhbGhsd2FwbHhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNzUxNDAsImV4cCI6MjA5NTY1MTE0MH0.DVFmZaT37R9CXSMHdnLx4YAVNTnlBGijkOIaoUo7Qsk";
const HDR = { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": "application/json" };

async function sb(path, opt = {}) {
  const res = await fetch(SB_URL + "/rest/v1/" + path, {
    method: opt.method || "GET",
    headers: { ...HDR, ...(opt.headers || {}) },
    body: opt.body ? JSON.stringify(opt.body) : undefined
  });
  if (!res.ok) { const t = await res.text(); throw new Error(t || res.status); }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

/* ================== 다국어 ================== */
const I18N = {
  ko: {
    factory: "공장", tabs: ["기록 입력·조회", "월별 추이", "관리 기준 설정"],
    hReg: "온습도 측정 기록", lDate: "측정일", lTime: "측정 시간", lLoc: "측정 위치",
    lRec: "기록자", lTemp: "온도", lHumid: "습도",
    lAction: "조치사항 (기준 초과 시 입력)", btnSave: "기록 저장",
    hint: (a,b)=>`관리기준 ${a} ~ ${b}`,
    warnT: "⚠ 온도가 관리 기준을 벗어났습니다.", warnH: "⚠ 습도가 관리 기준을 벗어났습니다.",
    warnTH: "⚠ 온도·습도가 관리 기준을 벗어났습니다.",
    hDaily: "일별 측정 기록", thTime:"시간", thLoc:"위치", thState:"판정", thRec:"기록자", thAction:"조치사항",
    ok:"정상", ng:"초과", del:"삭제", empty:"기록이 없습니다.",
    hMonth:"월별 추이", sTavg:"평균 온도", sTrange:"온도 최저/최고", sHavg:"평균 습도", sHrange:"습도 최저/최고", sNg:"기준 초과 건수",
    hNg:"기준 초과 이력 및 조치사항", thDate:"날짜", ngEmpty:"이번 달 기준 초과 기록이 없습니다. 👍",
    hStd:"관리 기준치", lTmin:"온도 하한", lTmax:"온도 상한", lHmin:"습도 하한", lHmax:"습도 상한",
    hLoc:"측정 위치 관리", addLoc:"추가", newLocPh:"새 측정 위치 입력",
    btnSet:"설정 저장", saved:"저장되었습니다 ✓", setSaved:"설정이 저장되었습니다 ✓",
    delConfirm:"이 기록을 삭제하시겠습니까?", deleted:"삭제되었습니다",
    needVal:"온도와 습도를 입력해 주세요.", needLoc:"측정 위치를 선택해 주세요.",
    needAction:"기준 초과입니다. 조치사항을 입력해 주세요.",
    err:"오류가 발생했습니다. 네트워크를 확인해 주세요.",
    chTemp:"온도(°C)", chHumid:"습도(%)", chTmax:"온도 상한", chTmin:"온도 하한", chHmax:"습도 상한", chHmin:"습도 하한",
    actionPh:"예: 에어컨 가동, 환기 실시, 제습기 가동 등", locDelConfirm:"이 위치를 삭제하시겠습니까?"
  },
  es: {
    factory: "Planta", tabs: ["Registro y consulta", "Tendencia mensual", "Configuración"],
    hReg: "Registro de temperatura y humedad", lDate: "Fecha", lTime: "Hora", lLoc: "Ubicación",
    lRec: "Registrado por", lTemp: "Temperatura", lHumid: "Humedad",
    lAction: "Acción correctiva (obligatoria si excede el límite)", btnSave: "Guardar registro",
    hint: (a,b)=>`Límite de control ${a} ~ ${b}`,
    warnT: "⚠ La temperatura está fuera del límite de control.", warnH: "⚠ La humedad está fuera del límite de control.",
    warnTH: "⚠ Temperatura y humedad fuera del límite de control.",
    hDaily: "Registros del día", thTime:"Hora", thLoc:"Ubicación", thState:"Estado", thRec:"Registró", thAction:"Acción",
    ok:"Normal", ng:"Excede", del:"Eliminar", empty:"No hay registros.",
    hMonth:"Tendencia mensual", sTavg:"Temp. promedio", sTrange:"Temp. mín/máx", sHavg:"Hum. promedio", sHrange:"Hum. mín/máx", sNg:"Casos fuera de límite",
    hNg:"Historial fuera de límite y acciones", thDate:"Fecha", ngEmpty:"Sin registros fuera de límite este mes. 👍",
    hStd:"Límites de control", lTmin:"Temp. mínima", lTmax:"Temp. máxima", lHmin:"Hum. mínima", lHmax:"Hum. máxima",
    hLoc:"Ubicaciones de medición", addLoc:"Agregar", newLocPh:"Nueva ubicación",
    btnSet:"Guardar configuración", saved:"Guardado ✓", setSaved:"Configuración guardada ✓",
    delConfirm:"¿Eliminar este registro?", deleted:"Eliminado",
    needVal:"Ingrese temperatura y humedad.", needLoc:"Seleccione la ubicación.",
    needAction:"Fuera de límite. Ingrese la acción correctiva.",
    err:"Ocurrió un error. Verifique la red.",
    chTemp:"Temp.(°C)", chHumid:"Hum.(%)", chTmax:"Temp. máx", chTmin:"Temp. mín", chHmax:"Hum. máx", chHmin:"Hum. mín",
    actionPh:"Ej: encender aire acondicionado, ventilar, deshumidificador", locDelConfirm:"¿Eliminar esta ubicación?"
  }
};

/* ================== 상태 ================== */
let lang = localStorage.getItem("th_lang") || "ko";
let factory = Number(localStorage.getItem("th_factory") || 1);
let settings = { temp_min:15, temp_max:30, humid_min:30, humid_max:70, locations:[] };
let chart = null;
let dayChart = null;

const $ = id => document.getElementById(id);
const T = () => I18N[lang];
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const nowTime = () => { const d=new Date(); return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }
function isTempBad(v){ return v < settings.temp_min || v > settings.temp_max; }
function isHumidBad(v){ return v < settings.humid_min || v > settings.humid_max; }

/* ================== UI 텍스트 적용 ================== */
function applyLang(){
  const t = T();
  document.querySelectorAll("#segFactory button").forEach(b=> b.textContent = `${t.factory} ${b.dataset.f}`);
  const tabs = document.querySelectorAll("#tabs button");
  t.tabs.forEach((s,i)=> tabs[i].textContent = s);
  $("h-reg").textContent=t.hReg; $("l-date").textContent=t.lDate; $("l-time").textContent=t.lTime;
  $("l-loc").textContent=t.lLoc; $("l-rec").textContent=t.lRec; $("l-temp").textContent=t.lTemp;
  $("l-humid").textContent=t.lHumid; $("l-action").textContent=t.lAction; $("btnSave").textContent=t.btnSave;
  $("inAction").placeholder=t.actionPh; $("newLoc").placeholder=t.newLocPh;
  $("h-daily").textContent=t.hDaily;
  $("th-time").textContent=t.thTime; $("th-loc").textContent=t.thLoc; $("th-state").textContent=t.thState;
  $("th-rec").textContent=t.thRec; $("th-action").textContent=t.thAction;
  $("h-month").textContent=t.hMonth; $("s-tavg").textContent=t.sTavg; $("s-trange").textContent=t.sTrange;
  $("s-havg").textContent=t.sHavg; $("s-hrange").textContent=t.sHrange; $("s-ng").textContent=t.sNg;
  $("h-nglist").textContent=t.hNg;
  $("th-date2").textContent=t.thDate; $("th-time2").textContent=t.thTime; $("th-loc2").textContent=t.thLoc; $("th-action2").textContent=t.thAction;
  $("h-std").textContent=t.hStd; $("l-tmin").textContent=t.lTmin; $("l-tmax").textContent=t.lTmax;
  $("l-hmin").textContent=t.lHmin; $("l-hmax").textContent=t.lHmax;
  $("h-locmgr").textContent=t.hLoc; $("btnAddLoc").textContent=t.addLoc; $("btnSaveSet").textContent=t.btnSet;
  $("dailyEmpty").textContent=t.empty; $("ngEmpty").textContent=t.ngEmpty;
  updateHints();
}
function updateHints(){
  const t=T();
  $("hintTemp").textContent = t.hint(settings.temp_min+"°C", settings.temp_max+"°C");
  $("hintHumid").textContent = t.hint(settings.humid_min+"%", settings.humid_max+"%");
}

/* ================== 설정 로드/저장 ================== */
async function loadSettings(){
  try{
    const rows = await sb(`temp_humidity_settings?factory=eq.${factory}&select=*`);
    if(rows && rows.length){ 
      const r=rows[0];
      settings = { temp_min:+r.temp_min, temp_max:+r.temp_max, humid_min:+r.humid_min, humid_max:+r.humid_max, locations:r.locations||[] };
    }
  }catch(e){ console.error(e); toast(T().err); }
  $("setTmin").value=settings.temp_min; $("setTmax").value=settings.temp_max;
  $("setHmin").value=settings.humid_min; $("setHmax").value=settings.humid_max;
  renderLocSelect(); renderLocList(); updateHints();
}
function renderLocSelect(){
  const sel=$("inLoc"); const cur=sel.value;
  sel.innerHTML = settings.locations.map(l=>`<option>${esc(l)}</option>`).join("");
  if(cur && settings.locations.includes(cur)) sel.value=cur;
}
function renderLocList(){
  $("locList").innerHTML = settings.locations.map((l,i)=>
    `<span class="loc-chip">${esc(l)}<button data-i="${i}" aria-label="delete">✕</button></span>`).join("");
  document.querySelectorAll("#locList button").forEach(b=> b.onclick=()=>{
    if(!confirm(T().locDelConfirm)) return;
    settings.locations.splice(+b.dataset.i,1); renderLocList(); renderLocSelect();
  });
}
$("btnAddLoc").onclick=()=>{
  const v=$("newLoc").value.trim(); if(!v) return;
  if(!settings.locations.includes(v)) settings.locations.push(v);
  $("newLoc").value=""; renderLocList(); renderLocSelect();
};
$("btnSaveSet").onclick=async ()=>{
  settings.temp_min=+$("setTmin").value; settings.temp_max=+$("setTmax").value;
  settings.humid_min=+$("setHmin").value; settings.humid_max=+$("setHmax").value;
  try{
    await sb(`temp_humidity_settings?factory=eq.${factory}`,{method:"PATCH",body:{
      temp_min:settings.temp_min, temp_max:settings.temp_max,
      humid_min:settings.humid_min, humid_max:settings.humid_max,
      locations:settings.locations, updated_at:new Date().toISOString()
    }});
    toast(T().setSaved); updateHints(); renderLocSelect();
  }catch(e){ toast(T().err); }
};

/* ================== 입력 경고 실시간 표시 ================== */
function checkWarn(){
  const tv=parseFloat($("inTemp").value), hv=parseFloat($("inHumid").value);
  const tb=!isNaN(tv)&&isTempBad(tv), hb=!isNaN(hv)&&isHumidBad(hv);
  const box=$("warnBox"), t=T();
  if(tb||hb){ box.classList.add("show");
    $("warnMsg").textContent = tb&&hb ? t.warnTH : tb ? t.warnT : t.warnH;
  } else box.classList.remove("show");
}
$("inTemp").addEventListener("input",checkWarn);
$("inHumid").addEventListener("input",checkWarn);

/* ================== 기록 저장 ================== */
$("btnSave").onclick=async ()=>{
  const t=T();
  const tv=parseFloat($("inTemp").value), hv=parseFloat($("inHumid").value);
  if(isNaN(tv)||isNaN(hv)){ toast(t.needVal); return; }
  const loc=$("inLoc").value; if(!loc){ toast(t.needLoc); return; }
  const bad = isTempBad(tv)||isHumidBad(hv);
  const action=$("inAction").value.trim();
  if(bad && !action){ toast(t.needAction); $("inAction").focus(); return; }
  const btn=$("btnSave"); btn.disabled=true;
  try{
    await sb("temp_humidity_logs",{method:"POST",body:{
      factory, location:loc, log_date:$("inDate").value, log_time:$("inTime").value,
      temperature:tv, humidity:hv, recorder:$("inRec").value.trim()||null,
      action_note: bad ? action : (action||null)
    }});
    toast(t.saved);
    $("inTemp").value=""; $("inHumid").value=""; $("inAction").value="";
    $("inTime").value=nowTime(); checkWarn();
    if($("listDate").value===$("inDate").value) loadDaily();
  }catch(e){ console.error(e); toast(t.err); }
  btn.disabled=false;
};

/* ================== 일별 기록 조회 ================== */
async function loadDaily(){
  const t=T(), d=$("listDate").value;
  try{
    const rows = await sb(`temp_humidity_logs?factory=eq.${factory}&log_date=eq.${d}&order=log_time.asc&select=*`);
    const body=$("dailyBody"); body.innerHTML="";
    $("dailyEmpty").style.display = rows.length? "none":"block";
    rows.forEach(r=>{
      const tb=isTempBad(+r.temperature), hb=isHumidBad(+r.humidity), bad=tb||hb;
      const tr=document.createElement("tr"); if(bad) tr.className="bad";
      tr.innerHTML = `
        <td>${r.log_time.slice(0,5)}</td>
        <td>${esc(r.location)}</td>
        <td class="${tb?'v-bad':''}">${(+r.temperature).toFixed(1)}</td>
        <td class="${hb?'v-bad':''}">${(+r.humidity).toFixed(1)}</td>
        <td><span class="badge ${bad?'ng':'ok'}">${bad?t.ng:t.ok}</span></td>
        <td>${esc(r.recorder||"-")}</td>
        <td class="action-cell">${esc(r.action_note||"-")}</td>
        <td><button class="btn-danger" data-id="${r.id}">${t.del}</button></td>`;
      body.appendChild(tr);
    });
    body.querySelectorAll(".btn-danger").forEach(b=> b.onclick=async ()=>{
      if(!confirm(t.delConfirm)) return;
      try{ await sb(`temp_humidity_logs?id=eq.${b.dataset.id}`,{method:"DELETE"}); toast(t.deleted); loadDaily(); }
      catch(e){ toast(t.err); }
    });
    drawDayChart(rows);
  }catch(e){ console.error(e); toast(t.err); }
}
function drawDayChart(rows){
  const t=T();
  $("dayChartBox").style.display = rows.length ? "" : "none";
  if(dayChart){ dayChart.destroy(); dayChart=null; }
  if(!rows.length) return;
  const labels = rows.map(r=>r.log_time.slice(0,5));
  const temps  = rows.map(r=>+r.temperature);
  const humids = rows.map(r=>+r.humidity);
  dayChart = new Chart($("chartDay"),{
    type:"line",
    data:{ labels, datasets:[
      { label:t.chTemp, data:temps, borderColor:"#C8442F", backgroundColor:"#C8442F", yAxisID:"yT", tension:.25, pointRadius:4 },
      { label:t.chHumid, data:humids, borderColor:"#1F6FA8", backgroundColor:"#1F6FA8", yAxisID:"yH", tension:.25, pointRadius:4 },
      { ...limitLine(labels.length,settings.temp_max,"#E5988A",t.chTmax), yAxisID:"yT" },
      { ...limitLine(labels.length,settings.temp_min,"#E5988A",t.chTmin), yAxisID:"yT" },
      { ...limitLine(labels.length,settings.humid_max,"#8FB8D6",t.chHmax), yAxisID:"yH" }
    ]},
    options:{
      responsive:true, maintainAspectRatio:false, interaction:{mode:"index",intersect:false},
      plugins:{ legend:{ labels:{ boxWidth:14, font:{size:11}, filter:i=>i.datasetIndex<2 } } },
      scales:{
        yT:{ position:"left", title:{display:true,text:"°C",color:"#C8442F"}, grid:{color:"#EDF1F4"} },
        yH:{ position:"right", title:{display:true,text:"%",color:"#1F6FA8"}, grid:{display:false}, suggestedMin:0, suggestedMax:100 },
        x:{ grid:{display:false} }
      }
    }
  });
}
$("listDate").addEventListener("change",loadDaily);

/* ================== 월별 추이 ================== */
async function loadMonth(){
  const t=T(), ym=$("monthPick").value; if(!ym) return;
  const [y,m]=ym.split("-").map(Number);
  const first=`${ym}-01`, lastDay=new Date(y,m,0).getDate(), last=`${ym}-${String(lastDay).padStart(2,"0")}`;
  try{
    const rows = await sb(`temp_humidity_logs?factory=eq.${factory}&log_date=gte.${first}&log_date=lte.${last}&order=log_date.asc,log_time.asc&select=*`);
    // 일별 평균 집계
    const byDay={};
    rows.forEach(r=>{ (byDay[r.log_date]=byDay[r.log_date]||[]).push(r); });
    const labels=[], tAvg=[], hAvg=[];
    for(let d=1; d<=lastDay; d++){
      const ds=`${ym}-${String(d).padStart(2,"0")}`;
      labels.push(String(d));
      const arr=byDay[ds];
      if(arr){
        tAvg.push(+(arr.reduce((s,r)=>s+ +r.temperature,0)/arr.length).toFixed(1));
        hAvg.push(+(arr.reduce((s,r)=>s+ +r.humidity,0)/arr.length).toFixed(1));
      } else { tAvg.push(null); hAvg.push(null); }
    }
    // 통계 카드
    const temps=rows.map(r=>+r.temperature), humids=rows.map(r=>+r.humidity);
    const ngRows=rows.filter(r=>isTempBad(+r.temperature)||isHumidBad(+r.humidity));
    $("vTavg").textContent = temps.length? (temps.reduce((a,b)=>a+b,0)/temps.length).toFixed(1)+"°C" : "-";
    $("vHavg").textContent = humids.length? (humids.reduce((a,b)=>a+b,0)/humids.length).toFixed(1)+"%" : "-";
    $("vTrange").textContent = temps.length? `${Math.min(...temps).toFixed(1)} / ${Math.max(...temps).toFixed(1)}°C` : "-";
    $("vHrange").textContent = humids.length? `${Math.min(...humids).toFixed(1)} / ${Math.max(...humids).toFixed(1)}%` : "-";
    $("vNg").textContent = ngRows.length;
    $("vNg").style.color = ngRows.length? "var(--alert)":"var(--ok)";
    // 초과 이력 테이블
    const nb=$("ngBody"); nb.innerHTML="";
    $("ngEmpty").style.display = ngRows.length? "none":"block";
    ngRows.forEach(r=>{
      const tb=isTempBad(+r.temperature), hb=isHumidBad(+r.humidity);
      const tr=document.createElement("tr"); tr.className="bad";
      tr.innerHTML=`<td>${r.log_date.slice(5)}</td><td>${r.log_time.slice(0,5)}</td><td>${esc(r.location)}</td>
        <td class="${tb?'v-bad':''}">${(+r.temperature).toFixed(1)}</td>
        <td class="${hb?'v-bad':''}">${(+r.humidity).toFixed(1)}</td>
        <td class="action-cell">${esc(r.action_note||"-")}</td>`;
      nb.appendChild(tr);
    });
    drawChart(labels,tAvg,hAvg);
  }catch(e){ console.error(e); toast(t.err); }
}
function limitLine(len,val,color,label){
  return { label, data:Array(len).fill(val), borderColor:color, borderDash:[6,4], borderWidth:1.2, pointRadius:0, fill:false, tension:0 };
}
function drawChart(labels,tAvg,hAvg){
  const t=T();
  if(chart) chart.destroy();
  chart = new Chart($("chart"),{
    type:"line",
    data:{ labels, datasets:[
      { label:t.chTemp, data:tAvg, borderColor:"#C8442F", backgroundColor:"#C8442F", yAxisID:"yT", spanGaps:true, tension:.25, pointRadius:3 },
      { label:t.chHumid, data:hAvg, borderColor:"#1F6FA8", backgroundColor:"#1F6FA8", yAxisID:"yH", spanGaps:true, tension:.25, pointRadius:3 },
      { ...limitLine(labels.length,settings.temp_max,"#E5988A",t.chTmax), yAxisID:"yT" },
      { ...limitLine(labels.length,settings.temp_min,"#E5988A",t.chTmin), yAxisID:"yT" },
      { ...limitLine(labels.length,settings.humid_max,"#8FB8D6",t.chHmax), yAxisID:"yH" },
      { ...limitLine(labels.length,settings.humid_min,"#8FB8D6",t.chHmin), yAxisID:"yH" }
    ]},
    options:{
      responsive:true, maintainAspectRatio:false, interaction:{mode:"index",intersect:false},
      plugins:{ legend:{ labels:{ boxWidth:14, font:{size:11}, filter:i=>i.datasetIndex<2 } } },
      scales:{
        yT:{ position:"left", title:{display:true,text:"°C",color:"#C8442F"}, grid:{color:"#EDF1F4"} },
        yH:{ position:"right", title:{display:true,text:"%",color:"#1F6FA8"}, grid:{display:false}, suggestedMin:0, suggestedMax:100 },
        x:{ grid:{display:false} }
      }
    }
  });
}
$("monthPick").addEventListener("change",loadMonth);

/* ================== 탭/공장/언어 전환 ================== */
document.querySelectorAll("#tabs button").forEach(b=> b.onclick=()=>{
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  ["input","month","setting"].forEach(v=> $("view-"+v).style.display = v===b.dataset.t? "":"none");
  if(b.dataset.t==="month") loadMonth();
});
document.querySelectorAll("#segFactory button").forEach(b=> b.onclick=async ()=>{
  factory=+b.dataset.f; localStorage.setItem("th_factory",factory);
  document.querySelectorAll("#segFactory button").forEach(x=>x.classList.toggle("on",+x.dataset.f===factory));
  await loadSettings(); loadDaily();
  if($("view-month").style.display!=="none") loadMonth();
});
document.querySelectorAll("#segLang button").forEach(b=> b.onclick=()=>{
  lang=b.dataset.l; localStorage.setItem("th_lang",lang);
  document.querySelectorAll("#segLang button").forEach(x=>x.classList.toggle("on",x.dataset.l===lang));
  applyLang(); loadDaily();
  if($("view-month").style.display!=="none") loadMonth();
});

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ================== 초기화 ================== */
(async function init(){
  $("inDate").value=todayStr(); $("inTime").value=nowTime();
  $("listDate").value=todayStr();
  $("monthPick").value=todayStr().slice(0,7);
  document.querySelectorAll("#segFactory button").forEach(x=>x.classList.toggle("on",+x.dataset.f===factory));
  document.querySelectorAll("#segLang button").forEach(x=>x.classList.toggle("on",x.dataset.l===lang));
  applyLang();
  await loadSettings();
  loadDaily();
})();
</script>
</body>
