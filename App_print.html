<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/variable/pretendardvariable.min.css">
<title>금형 지정장소 라벨 출력 · 1공장</title>
<style>
  /* ===== 디자인 토큰 (밝은 미니멀) ===== */
  :root{
    --bg:#eef1f6; --surface:#ffffff; --surface-2:#f6f8fb;
    --border:#e5e9f0; --border-strong:#d4dae4;
    --text:#0f172a; --text-2:#334155; --muted:#697588;
    --primary:#4f46e5; --primary-600:#4338ca; --primary-050:#eef0ff; --primary-100:#e0e3ff;
    --ok:#059669; --ok-bg:#ecfdf5; --ok-bd:#a7f3d0;
    --err:#e11d48; --err-bg:#fff1f2; --err-bd:#fecdd3;
    --amber:#b45309; --amber-bg:#fffbeb; --amber-bd:#fde68a;
    --shadow-sm:0 1px 2px rgba(15,23,42,.06);
    --shadow-md:0 8px 24px rgba(15,23,42,.07);
    --shadow-lg:0 24px 60px rgba(15,23,42,.28);
    --r-lg:16px; --r-md:12px; --r-sm:9px;
    --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Malgun Gothic','맑은 고딕',sans-serif;
    --mono:ui-monospace,'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;letter-spacing:-.01em;}
  ::selection{background:var(--primary-100);}

  /* 스크롤바 */
  .listtbl-wrap::-webkit-scrollbar,.qbody::-webkit-scrollbar,.pv-wrap::-webkit-scrollbar,.ppv::-webkit-scrollbar{width:10px;height:10px;}
  .listtbl-wrap::-webkit-scrollbar-thumb,.qbody::-webkit-scrollbar-thumb,.pv-wrap::-webkit-scrollbar-thumb,.ppv::-webkit-scrollbar-thumb{background:#cbd2de;border-radius:8px;border:2px solid transparent;background-clip:content-box;}
  .listtbl-wrap::-webkit-scrollbar-thumb:hover,.qbody::-webkit-scrollbar-thumb:hover{background:#aab3c2;background-clip:content-box;}

  /* ===== 상단바 ===== */
  .topbar{background:var(--surface);color:var(--text);padding:13px 22px;display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm);position:sticky;top:0;z-index:50;flex-wrap:wrap;}
  .topbar h1{font-size:17.5px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:8px;}
  .topbar .ver{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:0;}
  .topbar .ver #dataSrc,.topbar .ver #totalCnt{color:var(--text-2);font-weight:700;}
  .facbadge{background:var(--primary-050);color:var(--primary-600);border:1px solid var(--primary-100);font-weight:800;font-size:12px;padding:5px 12px;border-radius:999px;letter-spacing:.2px;}
  .upzone{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;}
  .upbtn{padding:9px 14px;font-size:12.5px;font-weight:700;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border);border-radius:var(--r-sm);cursor:pointer;transition:.15s ease;line-height:1;display:inline-flex;align-items:center;gap:5px;}
  .upbtn:hover{background:#eaeef4;border-color:var(--border-strong);transform:translateY(-1px);}
  .upbtn:active{transform:translateY(0);}
  .upbtn.gray{background:var(--surface-2);color:var(--text-2);}
  .upbtn.dl{background:var(--primary-050);color:var(--primary-600);border-color:var(--primary-100);}
  .upbtn.dl:hover{background:var(--primary-100);}
  .upbtn.lang{background:var(--surface-2);color:var(--text-2);}

  /* ===== 오버레이/모달 공통 ===== */
  #lockOverlay,#pasteModal,#modeModal{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:900;display:none;align-items:center;justify-content:center;padding:16px;}
  #lockOverlay{z-index:999;}
  #modeModal{z-index:950;}
  @keyframes sp{to{transform:rotate(360deg);}}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:none;}}

  .lockbox{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:30px 34px;text-align:center;max-width:420px;box-shadow:var(--shadow-lg);font-size:15px;line-height:1.6;color:var(--text-2);animation:pop .22s ease;}
  .lockbox .spin{width:40px;height:40px;margin:0 auto 16px;border:4px solid var(--primary-100);border-top-color:var(--primary);border-radius:50%;animation:sp .9s linear infinite;}
  .lockbox button{margin-top:18px;padding:11px 26px;font-size:15px;font-weight:700;background:var(--primary);color:#fff;border:none;border-radius:var(--r-sm);cursor:pointer;transition:.15s;}
  .lockbox button:hover{background:var(--primary-600);}
  @media print{#lockOverlay{display:none !important;}}

  /* 붙여넣기 모달 */
  .pastebox{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);width:min(720px,94vw);max-height:88vh;display:flex;flex-direction:column;padding:20px 22px;box-shadow:var(--shadow-lg);animation:pop .22s ease;}
  .pastebox .ph{display:flex;align-items:center;margin-bottom:12px;}
  .pastebox h3{font-size:16.5px;font-weight:800;letter-spacing:-.02em;}
  .pclose{margin-left:auto;background:var(--surface-2);border:1px solid var(--border);width:30px;height:30px;border-radius:8px;font-size:15px;cursor:pointer;color:var(--muted);transition:.15s;}
  .pclose:hover{background:#eaeef4;color:var(--text);}
  .pguide{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:10px;line-height:1.7;}
  .pguide b{color:var(--text-2);}
  #pasteArea{width:100%;height:160px;font-family:var(--mono);font-size:12.5px;border:1.5px solid var(--border-strong);border-radius:var(--r-sm);padding:10px;resize:vertical;background:var(--surface-2);transition:.15s;}
  #pasteArea:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px var(--primary-050);}
  .ppv{font-size:12px;margin:10px 0;max-height:170px;overflow:auto;}
  .ppv table{border-collapse:separate;border-spacing:0;width:100%;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;}
  .ppv th,.ppv td{border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:5px 7px;text-align:center;font-family:var(--mono);}
  .ppv th{background:var(--surface-2);color:var(--muted);font-family:var(--font);font-weight:700;}
  .ppv tr td:last-child,.ppv tr th:last-child{border-right:none;}
  .ppv .ok{color:var(--ok);font-weight:700;margin-bottom:6px;}
  .ppv .err{color:var(--err);font-weight:700;white-space:pre-line;}
  .pbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;}
  .pbtns button{padding:11px 20px;font-size:14px;font-weight:700;border:none;border-radius:var(--r-sm);cursor:pointer;transition:.15s;}
  .pbtns button:disabled{opacity:.45;cursor:not-allowed;}
  @media print{#pasteModal{display:none !important;}}

  /* 반영 방식 모달 */
  .modebox{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);width:min(460px,92vw);padding:22px 24px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:11px;animation:pop .22s ease;}
  .modebox h3{font-size:16.5px;font-weight:800;text-align:center;letter-spacing:-.02em;}
  .modedesc{font-size:13px;color:var(--muted);text-align:center;margin-bottom:4px;}
  .modebox button{border:none;border-radius:var(--r-md);cursor:pointer;padding:15px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:.15s;border:1.5px solid transparent;}
  .modebox button b{font-size:15px;}
  .modebox button span{font-size:12px;opacity:.9;font-weight:400;}
  .mode-merge{background:var(--ok-bg);color:#047857;border-color:var(--ok-bd) !important;}
  .mode-merge:hover{background:#d9fbe9;border-color:#6ee7b7 !important;}
  .mode-replace{background:var(--err-bg);color:#be123c;border-color:var(--err-bd) !important;}
  .mode-replace:hover{background:#ffe0e4;border-color:#fda4af !important;}
  .mode-cancel{background:var(--surface-2);color:var(--text-2);text-align:center !important;align-items:center;font-weight:700;border-color:var(--border) !important;}
  .mode-cancel:hover{background:#eaeef4;}
  @media print{#modeModal{display:none !important;}}

  /* ===== 레이아웃 ===== */
  .wrap{display:flex;gap:16px;padding:18px;align-items:flex-start;max-width:1440px;margin:0 auto;flex-wrap:wrap;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-md);overflow:hidden;}

  /* 좌측 */
  .left{flex:1.2;min-width:420px;}
  .tabs{display:flex;gap:4px;padding:8px 8px 0;border-bottom:1px solid var(--border);background:var(--surface-2);}
  .tab{flex:1;padding:12px;text-align:center;font-weight:700;cursor:pointer;background:transparent;color:var(--muted);border-radius:10px 10px 0 0;font-size:14.5px;transition:.15s;position:relative;top:1px;}
  .tab:hover{color:var(--text-2);background:rgba(255,255,255,.6);}
  .tab.on{background:var(--surface);color:var(--primary-600);box-shadow:0 -1px 0 var(--border) inset,2.5px 0 0 var(--border) inset,-2.5px 0 0 var(--border);border-bottom:2.5px solid var(--primary);}
  .tabbody{padding:16px;}

  .scanbox{display:flex;gap:8px;}
  .scanbox input{flex:1;padding:15px 16px;font-size:19px;border:1.5px solid var(--border-strong);border-radius:var(--r-md);font-family:var(--mono);background:var(--surface-2);transition:.15s;}
  .scanbox input:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px var(--primary-050);}
  .scanbox button{padding:0 24px;font-size:15px;font-weight:700;background:var(--primary);color:#fff;border:none;border-radius:var(--r-md);cursor:pointer;transition:.15s;}
  .scanbox button:hover{background:var(--primary-600);}
  .scanmsg{margin-top:12px;padding:12px 14px;border-radius:var(--r-md);font-size:14px;font-weight:600;display:none;}
  .scanmsg.ok{display:block;background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-bd);}
  .scanmsg.err{display:block;background:var(--err-bg);color:var(--err);border:1px solid var(--err-bd);}
  .hint{margin-top:12px;font-size:12px;color:var(--muted);line-height:1.7;}

  .searchrow{display:flex;gap:8px;margin-bottom:12px;}
  .searchrow input{flex:1;padding:11px 13px;font-size:14.5px;border:1.5px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface-2);transition:.15s;}
  .searchrow input:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px var(--primary-050);}
  .listtbl-wrap{max-height:520px;overflow:auto;border:1px solid var(--border);border-radius:var(--r-md);}
  table.listtbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
  table.listtbl th{position:sticky;top:0;background:var(--surface-2);color:var(--muted);padding:11px 8px;font-size:11.5px;font-weight:700;z-index:1;border-bottom:1px solid var(--border);}
  table.listtbl td{padding:9px 8px;border-bottom:1px solid var(--border);text-align:center;font-family:var(--mono);color:var(--text-2);}
  table.listtbl td.kr{font-family:var(--font);}
  table.listtbl tbody tr{cursor:pointer;transition:background .12s;}
  table.listtbl tbody tr:hover{background:var(--surface-2);}
  table.listtbl tr.sel{background:var(--primary-050);}
  table.listtbl tr.sel td{color:var(--primary-600);}
  table.listtbl input[type=checkbox]{width:15px;height:15px;accent-color:var(--primary);cursor:pointer;}
  .listactions{display:flex;gap:8px;margin-top:12px;align-items:center;}
  .listactions button{padding:10px 16px;font-size:13.5px;font-weight:700;border:none;border-radius:var(--r-sm);cursor:pointer;transition:.15s;}
  .btn-add{background:var(--primary);color:#fff;}
  .btn-add:hover{background:var(--primary-600);}
  .btn-gray{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border) !important;}
  .btn-gray:hover{background:#eaeef4;}
  .selcount{font-size:13px;color:var(--muted);margin-left:auto;font-weight:600;}

  /* 우측 */
  .right{flex:1;min-width:380px;}
  .right .head{padding:15px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
  .right .head h2{font-size:15.5px;font-weight:800;letter-spacing:-.02em;}
  .right .head .cnt{background:var(--primary);color:#fff;border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:800;}
  .right .head button{margin-left:auto;}
  .qbody{padding:14px 16px;max-height:420px;overflow-y:auto;}
  .qitem{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:var(--r-md);padding:11px 12px;margin-bottom:9px;background:var(--surface);transition:.14s;}
  .qitem:hover{border-color:var(--border-strong);box-shadow:var(--shadow-sm);}
  .qitem .lab{flex:1;min-width:0;}
  .qitem .lab .l1{font-size:17px;font-weight:800;letter-spacing:-.02em;}
  .qitem .lab .l2{font-size:12.5px;color:var(--muted);font-family:var(--mono);margin-top:2px;}
  .qitem .qty{width:56px;padding:7px;text-align:center;border:1px solid var(--border-strong);border-radius:8px;font-size:14px;font-weight:700;transition:.15s;}
  .qitem .qty:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-050);}
  .qitem .del{background:var(--err-bg);color:var(--err);border:none;border-radius:8px;padding:8px 11px;cursor:pointer;font-weight:800;transition:.14s;}
  .qitem .del:hover{background:#ffe0e4;}
  .qempty{text-align:center;color:var(--muted);padding:34px 0;font-size:14px;}

  .printopts{padding:14px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;font-size:13px;background:var(--surface-2);}
  .printopts select,.printopts input[type=number]{padding:8px 9px;border:1px solid var(--border-strong);border-radius:8px;font-size:13px;width:100%;background:#fff;font-family:inherit;transition:.15s;}
  .printopts select:focus,.printopts input[type=number]:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-050);}
  .optgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
  .optgrid label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:700;color:var(--text-2);}
  .optgrid .unit{font-weight:400;color:var(--muted);}
  .printopts>label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--text-2);}
  .printopts>label input[type=checkbox]{width:15px;height:15px;accent-color:var(--primary);cursor:pointer;}
  .pv-title{margin-top:8px;font-size:11.5px;font-weight:700;color:var(--muted);}
  .pv-wrap{border:1px dashed var(--border-strong);border-radius:var(--r-md);background:#fff;padding:10px;overflow:auto;max-height:230px;display:flex;justify-content:center;}
  .printbtn{display:block;width:calc(100% - 32px);margin:14px 16px;padding:15px;font-size:16.5px;font-weight:800;letter-spacing:-.01em;background:var(--primary);color:#fff;border:none;border-radius:var(--r-md);cursor:pointer;box-shadow:var(--shadow-md);transition:.16s;}
  .printbtn:hover{background:var(--primary-600);transform:translateY(-1px);}
  .printbtn:active{transform:translateY(0);}

  /* ===== 인쇄 영역 (LETTER) — 원본 유지 ===== */
  #printArea { display:none; }
  @media print {
    body * { visibility:hidden; }
    body { background:#fff; }
    #printArea, #printArea * { visibility:visible; }
    #printArea { display:block; position:absolute; left:0; top:0; width:100%; }
    @page { size: letter; margin: 10mm; }
  }
  .sheet-flow { display:flex; flex-wrap:wrap; gap:0; align-content:flex-start; }
  /* 재단 셀(바깥) = 점선 재단선 : 이 선을 칼로 자름 */
  .pcell {
    box-sizing:border-box; background:#fff; flex:none;
    border:0.3mm dashed #64748b; padding:1.5mm;
    page-break-inside:avoid; break-inside:avoid;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  /* 라벨 프레임(안) = 재단 후에도 남는 실선 사각 테두리 */
  .plabel {
    width:100%; height:100%; box-sizing:border-box; background:#fff;
    border:1.5pt solid #0f172a;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:1mm; overflow:hidden;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .plabel .pl1 { line-height:1.0; white-space:nowrap; letter-spacing:-.5px; color:#0f172a; }
  .plabel .pl-rule { background:#0f172a; border-radius:2px; margin:1mm 0 0; flex:none; }
  .plabel .pl2 { font-family:'Pretendard Variable',Pretendard,'맑은 고딕',sans-serif; line-height:1.2; margin-top:1mm; white-space:nowrap; color:#1e293b; }
  .plabel .pl2.mono { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; letter-spacing:.3px; }
</style>
</head>
<body>

<div class="topbar">
  <h1 data-i18n="title">🏷️ 금형 지정장소 라벨 출력</h1>
  <span class="facbadge" data-i18n="facBadge">🏭 1공장</span>
  <span class="ver">v2.6 · LETTER · <span id="dataSrc">-</span> · <span data-i18n="total">총</span> <span id="totalCnt">-</span></span>
  <div class="upzone">
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleFile(this.files[0]); this.value='';">
    <button class="upbtn" data-i18n="btnUpload" onclick="document.getElementById('fileInput').click()">📂 리스트 업로드</button>
    <button class="upbtn" data-i18n="btnPaste" onclick="openPaste()">📋 붙여넣기 입력</button>
    <button class="upbtn gray" data-i18n="btnRefresh" onclick="loadFromServer()">↻ 새로고침</button>
    <button class="upbtn dl" data-i18n="btnDownload" onclick="downloadExcel()">⬇ 엑셀 다운로드</button>
    <button class="upbtn lang" id="langBtn" onclick="toggleLang()">🌐 Español</button>
  </div>
</div>

<div class="wrap">
  <!-- 좌측 -->
  <div class="panel left">
    <div class="tabs">
      <div class="tab on" id="tabScan" data-i18n="tabScan" onclick="showTab('scan')">① 바코드 스캔</div>
      <div class="tab" id="tabList" data-i18n="tabList" onclick="showTab('list')">② 금형 리스트 선택</div>
    </div>

    <div class="tabbody" id="bodyScan">
      <div class="scanbox">
        <input type="text" id="scanInput" data-i18n-ph="scanPh" placeholder="바코드 스캔 ($267030061)" autocomplete="off">
        <button data-i18n="btnAdd" onclick="doScan()">추가</button>
      </div>
      <div class="scanmsg" id="scanMsg"></div>
      <div class="hint" data-i18n-html="scanHint"></div>
    </div>

    <div class="tabbody" id="bodyList" style="display:none">
      <div class="searchrow">
        <input type="text" id="searchInput" data-i18n-ph="searchPh" placeholder="검색" oninput="renderList()">
      </div>
      <div class="listtbl-wrap">
        <table class="listtbl">
          <thead><tr>
            <th style="width:34px"><input type="checkbox" id="chkAll" onclick="toggleAll(this)"></th>
            <th data-i18n-html="thBc">바코드</th><th data-i18n-html="thCode">금형코드</th><th data-i18n-html="thNo">관리<br>번호</th><th data-i18n-html="thStore">보관<br>장소</th><th data-i18n-html="thLoc">지정<br>장소</th>
          </tr></thead>
          <tbody id="listBody"></tbody>
        </table>
      </div>
      <div class="listactions">
        <button class="btn-add" data-i18n="btnAddSel" onclick="addSelected()">✔ 선택 항목 추가</button>
        <button class="btn-gray" data-i18n="btnClearSel" onclick="clearSel()">선택 해제</button>
        <span class="selcount" id="selCount"></span>
      </div>
    </div>
  </div>

  <!-- 우측 -->
  <div class="panel right">
    <div class="head">
      <h2 data-i18n="queueTitle">🖨️ 출력 대기 목록</h2>
      <span class="cnt" id="queueCnt">0</span>
      <button class="btn-gray" style="padding:6px 12px;border:none;border-radius:5px;cursor:pointer;font-weight:700" data-i18n="btnClearAll" onclick="clearQueue()">전체 삭제</button>
    </div>
    <div class="qbody" id="queueBody"></div>
    <div class="printopts">
      <div class="optgrid">
        <label><span data-i18n="optPresetLbl">프리셋</span>
          <select id="optPreset" onchange="applyPreset()">

let LANG = 'ko';
try{ LANG = localStorage.getItem('moldLabelLang') || 'ko'; }catch(e){}
function T(key){ return (I18N[LANG] && I18N[LANG][key] !== undefined) ? I18N[LANG][key] : I18N.ko[key]; }
let lastSrcTime = null;

function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = T(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = T(el.dataset.i18nPh); });
  document.getElementById('langBtn').textContent = T('langBtn');
  document.getElementById('selCount').textContent = T('selCount')(selSet.size);
  renderQueue();
  if(lastSrcTime) document.getElementById('dataSrc').textContent = T('srcLabel')(lastSrcTime);
}
function toggleLang(){
  LANG = (LANG === 'ko') ? 'es' : 'ko';
  try{ localStorage.setItem('moldLabelLang', LANG); }catch(e){}
  applyLang();
}

/* ================= Supabase 전용 데이터 계층 ================= */
const SUPA_URL = 'https://lrjurjhavlalhlwaplxd.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyanVyamhhdmxhbGhsd2FwbHhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNzUxNDAsImV4cCI6MjA5NTY1MTE0MH0.DVFmZaT37R9CXSMHdnLx4YAVNTnlBGijkOIaoUo7Qsk';
const TABLE = 'mold_locations';
const SB_HEADERS = { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY, 'Content-Type': 'application/json' };

let MOLDS = [];
let byBc = {};

function setData(list, srcLabel){
  MOLDS = list;
  byBc = {};
  MOLDS.forEach(m => { byBc[m.bc.toUpperCase()] = m; });
  document.getElementById('totalCnt').textContent = MOLDS.length;
  document.getElementById('dataSrc').textContent = srcLabel;
  selSet.clear();
  renderList(); renderPreview();
}

function showLock(msg){
  document.getElementById('lockMsg').textContent = msg;
  document.getElementById('lockOverlay').style.display = 'flex';
}
function hideLock(){ document.getElementById('lockOverlay').style.display = 'none'; }

async function sbFetchAll(){
  const rows = [];
  const PAGE = 1000;
  for(let from = 0; ; from += PAGE){
    const res = await fetch(`${SUPA_URL}/rest/v1/${TABLE}?select=bc,code,mgmt_no,name,store,loc,sort_order&order=sort_order.asc,id.asc&limit=${PAGE}&offset=${from}`, { headers: SB_HEADERS });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const chunk = await res.json();
    chunk.forEach(r => rows.push({ bc:r.bc, code:r.code||'', no:r.mgmt_no||'', name:r.name||'', store:r.store||'', loc:r.loc||'' }));
    if(chunk.length < PAGE) break;
  }
  return rows;
}

async function loadFromServer(){
  showLock(T('connecting'));
  try{
    const rows = await sbFetchAll();
    lastSrcTime = new Date().toLocaleTimeString('ko-KR', {hour12:false});
    setData(rows, T('srcLabel')(lastSrcTime));
    hideLock();
    if(rows.length === 0){
      alert(T('emptyServer'));
    }
  }catch(e){
    showLock(T('connFail')(e.message));
  }
}
window.addEventListener('load', ()=>{ applyLang(); loadFromServer(); });

  '금형명':'name',
  '보관장소':'store',
  '지정장소':'loc', '장소':'loc'
};

function handleFile(file){
  if(!file) return;
  const ext = file.name.split('.').pop().toLowerCase();
  if(ext === 'csv'){
    const fr = new FileReader();
    fr.onload = () => {
      try{ syncToServer(parseCSV(fr.result), file.name); }
      catch(e){ alert(e.message.startsWith('❌') ? e.message : T('csvReadErr')(e.message)); }
    };
    fr.readAsText(file, 'utf-8');
  } else {
    if(typeof XLSX === 'undefined'){
      alert(T('xlsxLibFail'));
      return;
    }
    const fr = new FileReader();
    fr.onload = () => {
      try{
        const wb = XLSX.read(new Uint8Array(fr.result), {type:'array'});
        const sn = wb.SheetNames.includes('금형지정장소') ? '금형지정장소' : wb.SheetNames[0];
        const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, defval:''});
        syncToServer(parseAOA(aoa), file.name + ' [' + sn + ']');
      }catch(e){
        alert(e.message.startsWith('❌') ? e.message : T('xlsxReadErr')(e.message));
      }
    };
    fr.readAsArrayBuffer(file);
  }
}

function parseCSV(text){
  const lines = text.replace(/\r/g,'').split('\n').filter(l=>l.trim());
  return parseAOA(lines.map(l => l.split(',').map(c => c.trim().replace(/^"|"$/g,''))));
}

function parseAOA(aoa){
  let hIdx = -1, colMap = {};
  for(let i=0; i<Math.min(aoa.length,10); i++){
    const row = aoa[i].map(c => String(c).trim());
    if(row.some(c => c === '금형바코드' || c === 'CODE' || c === '바코드')){
      hIdx = i;
      row.forEach((h,ci) => { if(HEADER_MAP[h] && !(HEADER_MAP[h] in colMap)) colMap[HEADER_MAP[h]] = ci; });
      break;
    }
  }
  if(hIdx < 0 || !('bc' in colMap) || !('loc' in colMap)){
    throw new Error(T('errNoHeader'));
  }
  const rows = [];
  for(let i=hIdx+1; i<aoa.length; i++){
    const r = aoa[i];
    const bc = String(r[colMap.bc] ?? '').trim();
    if(!bc) continue;
    rows.push({
      bc,
      code:  String(r[colMap.code]  ?? '').trim(),
      no:    String(r[colMap.no]    ?? '').trim(),
      name:  String(r[colMap.name]  ?? '').trim(),
      store: String(r[colMap.store] ?? '').trim(),
      loc:   String(r[colMap.loc]   ?? '').trim()
    });
  }
  if(rows.length === 0) throw new Error(T('errNoRows'));
  validateDup(rows);
  return rows;
}

/* ---------- 중복 검사: 바코드 / (금형코드+관리번호) / (금형명+관리번호) ---------- */
function findDups(rows, keyFn){
  const map = {};
  rows.forEach(m => { const k = keyFn(m); if(!k) return; (map[k] = map[k] || []).push(m); });
  return Object.entries(map).filter(([k,v]) => v.length > 1).map(([k,v]) => k + ' ×' + v.length);
}
function validateDup(rows){
  const problems = [];
  const dBc = findDups(rows, m => m.bc.toUpperCase());
  if(dBc.length) problems.push(T('dupBc') + '\n  ' + dBc.slice(0,10).join('\n  ') + (dBc.length>10 ? '\n  ...' : ''));
  const dCode = findDups(rows, m => (m.code ? (m.code + ' ' + m.no).toUpperCase() : ''));
  if(dCode.length) problems.push(T('dupCode') + '\n  ' + dCode.slice(0,10).join('\n  ') + (dCode.length>10 ? '\n  ...' : ''));
  const dName = findDups(rows, m => (m.name && m.name !== m.code ? (m.name + ' ' + m.no).toUpperCase() : ''));
  if(dName.length) problems.push(T('dupName') + '\n  ' + dName.slice(0,10).join('\n  ') + (dName.length>10 ? '\n  ...' : ''));
  if(problems.length) throw new Error(T('dupFound') + '\n\n' + problems.join('\n\n'));
}

/* 업로드/붙여넣기 → 반영 방식 선택 모달 */
let pendingSync = null; // {rows, name}
function syncToServer(rows, name){
  pendingSync = {rows, name};
  document.getElementById('modeDesc').textContent = name + ' · ' + rows.length + (LANG==='ko' ? '건' : ' registros');
  document.getElementById('modeModal').style.display = 'flex';
}
function closeMode(){ document.getElementById('modeModal').style.display = 'none'; pendingSync = null; }

/* ➕ 추가/수정: 기존 데이터 유지, 같은 바코드는 수정, 새 바코드는 추가 */
async function doMerge(){
  const {rows, name} = pendingSync; closeMode();
  showLock(T('syncing')(rows.length));
  try{
    /* 1) 현재 서버 데이터 조회 */
    const res0 = await fetch(`${SUPA_URL}/rest/v1/${TABLE}?select=bc,code,mgmt_no,name,store,loc,sort_order&order=sort_order.asc`, { headers: SB_HEADERS });
    if(!res0.ok) throw new Error('HTTP ' + res0.status);
    const server = (await res0.json()).map(r => ({ bc:r.bc, code:r.code||'', no:r.mgmt_no||'', name:r.name||'', store:r.store||'', loc:r.loc||'', sort:r.sort_order||0 }));
    const srvByBc = {};
    server.forEach(s => srvByBc[s.bc.toUpperCase()] = s);
    /* 2) 병합 결과 전체에 대해 중복 검사 (기존 데이터와의 금형코드+관리번호 충돌 포함) */
    const kept = server.filter(s => !rows.some(m => m.bc.toUpperCase() === s.bc.toUpperCase()));
    validateDup(kept.concat(rows));
    /* 3) sort_order: 수정건은 기존 순번 유지, 신규건은 맨 뒤에 이어붙임 */
    let maxSort = server.reduce((mx,s)=>Math.max(mx,s.sort), 0);
    let added = 0, updated = 0;
    const payload = rows.map(m => {
      const ex = srvByBc[m.bc.toUpperCase()];
      if(ex){ updated++; return { bc:m.bc, code:m.code, mgmt_no:m.no, name:m.name, store:m.store, loc:m.loc, sort_order:ex.sort }; }
      added++; return { bc:m.bc, code:m.code, mgmt_no:m.no, name:m.name, store:m.store, loc:m.loc, sort_order:++maxSort };
    });
    /* 4) upsert (바코드 기준) */
    for(let i=0; i<payload.length; i+=500){
      const res = await fetch(`${SUPA_URL}/rest/v1/${TABLE}?on_conflict=bc`, {
        method:'POST',
        headers: Object.assign({}, SB_HEADERS, {'Prefer':'resolution=merge-duplicates'}),
        body: JSON.stringify(payload.slice(i,i+500))
      });
      if(!res.ok) throw new Error(T('insFail') + ' HTTP ' + res.status);
    }
    hideLock();
    alert(T('mergeDone')(added, updated));
    await loadFromServer();
  }catch(e){
    if(String(e.message).startsWith('❌')){ hideLock(); alert(e.message); }
    else showLock(T('syncErr')(e.message));
  }
}

/* 🔄 전체 교체: 서버 데이터를 모두 지우고 업로드 데이터로 대체 */
async function doReplace(){
  const {rows, name} = pendingSync; closeMode();
  if(!confirm(T('confirmSync')(name, rows.length))) return;
  showLock(T('syncing')(rows.length));
  try{
    let res = await fetch(`${SUPA_URL}/rest/v1/${TABLE}?id=gt.0`, { method:'DELETE', headers: SB_HEADERS });
    if(!res.ok) throw new Error(T('delFail') + ' HTTP ' + res.status);
    for(let i=0; i<rows.length; i+=500){
      const batch = rows.slice(i,i+500).map((m,bi)=>({
        bc:m.bc, code:m.code, mgmt_no:m.no, name:m.name, store:m.store, loc:m.loc, sort_order:i+bi+1
      }));
      res = await fetch(`${SUPA_URL}/rest/v1/${TABLE}`, { method:'POST', headers: SB_HEADERS, body: JSON.stringify(batch) });
      if(!res.ok) throw new Error(T('insFail') + ' HTTP ' + res.status);
    }
    queue = []; renderQueue();
    hideLock();
    alert(T('syncDone')(rows.length));
    await loadFromServer();
  }catch(e){
    showLock(T('syncErr')(e.message));
  }
}

/* ---------- 엑셀 다운로드 (서버 데이터) ---------- */
function downloadExcel(){
  if(!MOLDS.length){ alert(T('dlEmpty')); return; }
  if(typeof XLSX === 'undefined'){ alert(T('xlsxLibFail')); return; }
  const header = ['금형바코드','금형코드','관리번호','금형명','보관장소','지정장소'];
  const aoa = [header].concat(MOLDS.map(m => [m.bc, m.code, m.no, m.name, m.store, m.loc]));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:13},{wch:15},{wch:9},{wch:15},{wch:10},{wch:10}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '금형지정장소');
  const d = new Date();
  const ymd = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  XLSX.writeFile(wb, '금형지정장소_1공장_' + ymd + '.xlsx');
}

/* ---------- 붙여넣기 입력 ---------- */
let pasteRows = null;

function openPaste(){
  document.getElementById('pasteArea').value = '';
  document.getElementById('pastePreview').innerHTML = '';
  document.getElementById('pasteApplyBtn').disabled = true;
  pasteRows = null;
  document.getElementById('pasteModal').style.display = 'flex';
  setTimeout(()=>document.getElementById('pasteArea').focus(), 50);
}
function closePaste(){ document.getElementById('pasteModal').style.display = 'none'; }

function parsePasted(text){
  const lines = text.replace(/\r/g,'').split('\n').filter(l => l.trim());
  if(lines.length === 0) throw new Error(T('errNoPaste'));
  /* 구분자: 탭 우선(엑셀 복사), 탭이 없으면 콤마 */
  const delim = text.includes('\t') ? '\t' : ',';
  const aoa = lines.map(l => l.split(delim).map(c => c.trim().replace(/^"|"$/g,'')));
  /* 헤더 행이 있으면 헤더 방식으로 */
  const hasHeader = aoa.slice(0,10).some(row => row.some(c => c === '금형바코드' || c === 'CODE' || c === '바코드'));
  if(hasHeader) return parseAOA(aoa);
  /* 헤더 없음: 고정 열 순서 (바코드,금형코드,관리번호,금형명,보관장소,지정장소) */
  const rows = [];
  for(const r of aoa){
    const bc = String(r[0] ?? '').trim();
    if(!bc) continue;
    rows.push({
      bc,
      code:  String(r[1] ?? '').trim(),
      no:    String(r[2] ?? '').trim(),
      name:  String(r[3] ?? '').trim(),
      store: String(r[4] ?? '').trim(),
      loc:   String(r[5] ?? '').trim()
    });
  }
  if(rows.length === 0) throw new Error(T('errNoRows'));
  const noLoc = rows.filter(m => !m.loc).length;
  if(noLoc === rows.length) throw new Error(T('errNoLocCol'));
  validateDup(rows);
  return rows;
}

function previewPaste(){
  const box = document.getElementById('pastePreview');
  const btn = document.getElementById('pasteApplyBtn');
  const text = document.getElementById('pasteArea').value;
  if(!text.trim()){ box.innerHTML=''; btn.disabled = true; pasteRows = null; return; }
  try{
    pasteRows = parsePasted(text);
    const head = pasteRows.slice(0,5).map(m =>
      `<tr><td>${m.bc}</td><td>${m.code}</td><td>${m.no}</td><td>${m.name}</td><td>${m.store}</td><td><b>${m.loc}</b></td></tr>`).join('');
    box.innerHTML = `<div class="ok">${T('pasteOk')(pasteRows.length)}</div>
      <table><tr>${T('pvTh').map(h=>`<th>${h}</th>`).join('')}</tr>${head}</table>`;
    btn.disabled = false;
  }catch(e){
    pasteRows = null;
    box.innerHTML = `<div class="err">✕ ${e.message}</div>`;
    btn.disabled = true;
  }
}

async function applyPaste(){
  if(!pasteRows || !pasteRows.length) return;
  closePaste();
  await syncToServer(pasteRows, T('pasteSrc')(pasteRows.length));
}


let queue = [];          // [{m, qty}]
let selSet = new Set();  // 리스트 선택 (bc)

/* ---------- 탭 ---------- */
function showTab(t){
  document.getElementById('tabScan').classList.toggle('on', t==='scan');
  document.getElementById('tabList').classList.toggle('on', t==='list');
  document.getElementById('bodyScan').style.display = t==='scan' ? '' : 'none';
  document.getElementById('bodyList').style.display = t==='list' ? '' : 'none';
  if(t==='scan') setTimeout(()=>document.getElementById('scanInput').focus(),50);
  if(t==='list') renderList();
}

/* ---------- 스캔 ---------- */
const scanInput = document.getElementById('scanInput');
scanInput.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); doScan(); } });
window.addEventListener('load', ()=>scanInput.focus());

function doScan(){
  let v = scanInput.value.trim().toUpperCase();
  scanInput.value=''; scanInput.focus();
  if(!v) return;
  let m = byBc[v] || byBc['$'+v];
  const msg = document.getElementById('scanMsg');
  if(!m){
    msg.className='scanmsg err';
    msg.textContent = T('scanUnknown') + v;
    return;
  }
  addToQueue(m);
  msg.className='scanmsg ok';
  msg.textContent = T('scanAdded') + m.loc + '  |  ' + m.code + ' ' + m.no;
}

/* ---------- 리스트 ---------- */
function filtered(){
  const q = document.getElementById('searchInput').value.trim().toUpperCase();
  if(!q) return MOLDS;
  return MOLDS.filter(m =>
    m.bc.toUpperCase().includes(q) || m.code.toUpperCase().includes(q) ||
    m.no.toUpperCase().includes(q) || m.loc.toUpperCase().includes(q) ||
    m.store.toUpperCase().includes(q));
}
function renderList(){
  const rows = filtered();
  const tb = document.getElementById('listBody');
  tb.innerHTML = rows.map(m => `
    <tr class="${selSet.has(m.bc)?'sel':''}" onclick="rowClick('${m.bc}')">
      <td><input type="checkbox" ${selSet.has(m.bc)?'checked':''} onclick="event.stopPropagation();rowClick('${m.bc}')"></td>
      <td>${m.bc}</td><td>${m.code}</td><td>${m.no}</td><td class="kr">${m.store}</td><td><b>${m.loc}</b></td>
    </tr>`).join('');
  document.getElementById('selCount').textContent = T('selCount')(selSet.size);
  document.getElementById('chkAll').checked = rows.length>0 && rows.every(m=>selSet.has(m.bc));
}
function rowClick(bc){
  if(selSet.has(bc)) selSet.delete(bc); else selSet.add(bc);
  renderList();
}
function toggleAll(cb){
  const rows = filtered();
  if(cb.checked) rows.forEach(m=>selSet.add(m.bc));
  else rows.forEach(m=>selSet.delete(m.bc));
  renderList();
}
function clearSel(){ selSet.clear(); renderList(); }
function addSelected(){
  if(selSet.size===0){ alert(T('noSel')); return; }
  selSet.forEach(bc => addToQueue(byBc[bc.toUpperCase()]));
  selSet.clear(); renderList();
}

/* ---------- 출력 대기 ---------- */
function addToQueue(m){
  const ex = queue.find(q => q.m.bc === m.bc);
  if(ex) ex.qty++;
  else queue.push({m, qty:1});
  renderQueue();
}
function renderQueue(){
  const box = document.getElementById('queueBody');
  document.getElementById('queueCnt').textContent = queue.reduce((s,q)=>s+q.qty,0);
  if(queue.length===0){ box.innerHTML='<div class="qempty">'+T('qEmpty')+'</div>'; return; }
  box.innerHTML = queue.map((q,i)=>`
    <div class="qitem">
      <div class="lab">
        <div class="l1">${q.m.loc}</div>
        <div class="l2">${q.m.code} ${q.m.no}</div>
      </div>
      <input class="qty" type="number" min="1" max="99" value="${q.qty}" onchange="setQty(${i},this.value)">
      <button class="del" onclick="delQ(${i})">✕</button>
    </div>`).join('');
}
function setQty(i,v){ queue[i].qty = Math.max(1, parseInt(v)||1); renderQueue(); }
const _origRenderQueue = renderQueue;
renderQueue = function(){ _origRenderQueue(); if(typeof renderPreview==='function') renderPreview(); };
function delQ(i){ queue.splice(i,1); renderQueue(); }
function clearQueue(){ if(queue.length && confirm(T('confirmClearQ'))){ queue=[]; renderQueue(); } }

/* ---------- 인쇄 (LETTER) ---------- */
/* LETTER 216×279mm, 여백 10mm → 인쇄영역 약 196×259mm */
const AREA_W = 196, AREA_H = 259, GAP = 0; // mm (라벨 맞붙여 배치 → 공유 점선 재단선)

function getOpts(){
  const clamp = (v,min,max,def) => { v = parseFloat(v); return isNaN(v) ? def : Math.min(max, Math.max(min, v)); };
  return {
    w:  clamp(document.getElementById('optW').value, 20, AREA_W, 95),
    h:  clamp(document.getElementById('optH').value, 10, AREA_H, 48),
    bw: clamp(document.getElementById('optBorder').value, 0, 6, 1.5),
    f1: clamp(document.getElementById('optF1').value, 6, 300, 42),
    f2: clamp(document.getElementById('optF2').value, 4, 200, 13),
    b1: document.getElementById('optB1').value,
    b2: document.getElementById('optB2').value,
    store: document.getElementById('optStore').checked
  };
}

function applyPreset(){
  const v = document.getElementById('optPreset').value;
  if(v){
    const [w,h,f1,f2] = v.split(',');
    document.getElementById('optW').value = w;
    document.getElementById('optH').value = h;
    document.getElementById('optF1').value = f1;
    document.getElementById('optF2').value = f2;
  }
  renderPreview(); buildPrint();
}
function optChanged(){
  document.getElementById('optPreset').value = ''; // 직접 설정으로 전환
  renderPreview(); buildPrint();
}

function labelHTML(m, o){
  const rw = Math.max(6, o.w*0.2).toFixed(1);
  const rh = Math.max(1.2, o.bw).toFixed(1);
  return `
    <div class="pcell" style="width:${o.w}mm;height:${o.h}mm">
      <div class="plabel" style="border-width:${o.bw}pt;${o.bw===0?'border:none;':''}">
        <div class="pl1" style="font-size:${o.f1}pt;font-weight:${o.b1}">${m.loc}</div>
        <div class="pl-rule" style="width:${rw}mm;height:${rh}pt"></div>
        <div class="pl2 mono" style="font-size:${o.f2}pt;font-weight:${o.b2}">${m.code} ${m.no}</div>
        ${o.store?`<div class="pl2" style="font-size:${(o.f2*0.8).toFixed(1)}pt;font-weight:500;color:#475569">${m.store}</div>`:''}
      </div>
    </div>`;
}

function renderPreview(){
  const o = getOpts();
  const sample = queue.length ? queue[0].m : (MOLDS[0] || {loc:'A01-01', code:'TAPMM025K2SN', no:'P01', store:'공무실'});
  document.getElementById('pvBox').innerHTML = labelHTML(sample, o);
}

function buildPrint(){
  const o = getOpts();
  const labels = [];
  queue.forEach(q => { for(let i=0;i<q.qty;i++) labels.push(q.m); });

  const cols = Math.max(1, Math.floor((AREA_W + GAP) / (o.w + GAP)));
  const rows = Math.max(1, Math.floor((AREA_H + GAP) / (o.h + GAP)));
  const perPage = cols * rows;
  const pages = [];
  for(let i=0;i<labels.length;i+=perPage) pages.push(labels.slice(i,i+perPage));

  document.getElementById('printArea').innerHTML = pages.map((pg,pi)=>`
    <div class="sheet-flow" style="${pi<pages.length-1?'page-break-after:always;':''}">
      ${pg.map(m=>labelHTML(m,o)).join('')}
    </div>`).join('');
}

function doPrint(){
  if(queue.length===0){ alert(T('noLabels')); return; }
  const o = getOpts();
  buildPrint();
  const cols = Math.max(1, Math.floor((AREA_W + GAP) / (o.w + GAP)));
  if(o.w > AREA_W || o.h > AREA_H){
    alert(T('sizeOver'));
    return;
  }
  window.print();
}
renderPreview();
</script>
