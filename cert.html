<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificado de calificación · YURA HARNESS MÉXICO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@700&family=Noto+Sans+KR:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{--bg:#0a0a0a;--surface:#141414;--surface2:#1b1b1b;--border:#2a2a2a;--accent:#c9a84c;--gold:#e2c46a;--text:#f0f0f0;--text2:#8a8a8a;--green:#2ecc7a;--red:#e05252;--orange:#e87a2a;--teal:#2ab8a8;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#141414;border-bottom:2px solid #2a2a2a;position:sticky;top:0;z-index:10}
.ttl{font-family:'IBM Plex Sans KR',sans-serif;font-weight:700;font-size:15px;letter-spacing:-.2px;line-height:1.1}
.ttl small{display:block;font-family:'Space Mono',monospace;font-size:9px;color:var(--accent);letter-spacing:1.5px;font-weight:400;margin-top:3px}
.lang{display:flex;border:1px solid rgba(201,168,76,.4);border-radius:999px;overflow:hidden;font-size:11px;font-weight:700}
.lang button{background:none;border:0;color:var(--text2);padding:6px 10px;font-family:inherit;cursor:pointer}
.lang button.on{background:var(--accent);color:#000}
main{max-width:760px;margin:0 auto;padding:14px 12px 40px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.cap{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
.who{display:flex;gap:12px;align-items:center}
.who .ph{width:64px;height:82px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px}
.who .ph img{width:100%;height:100%;object-fit:cover;display:block}
.who .nm{font-weight:700;font-size:17px;line-height:1.2}
.who .em{font-family:'Space Mono',monospace;font-size:12px;color:var(--gold);margin-top:3px}
.who .pr{font-size:12px;color:var(--text2);margin-top:3px}
.badge{display:inline-block;border-radius:6px;padding:3px 9px;font-size:12px;font-weight:700;margin-top:6px}
.b-ok{background:rgba(46,204,122,.14);color:var(--green);border:1px solid rgba(46,204,122,.4)}
.b-no{background:rgba(232,122,42,.14);color:var(--orange);border:1px solid rgba(232,122,42,.4)}
.b-x{background:rgba(224,82,82,.14);color:var(--red);border:1px solid rgba(224,82,82,.4)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kv div{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.kv b{display:block;font-size:10px;color:var(--text2);font-weight:500;margin-bottom:2px}
.kv span{font-size:14px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;padding:11px 14px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;width:100%}
.btn-gold{background:var(--accent);color:#000}
.btn-sec{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-ghost{background:none;color:var(--text2);border:1px solid var(--border);font-weight:600;font-size:13px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;margin-top:10px}
.prev{background:#3a3a3a;border:1px solid var(--border);border-radius:12px;padding:8px;margin-bottom:12px}
.prev iframe{width:100%;border:0;background:#fff;display:block;border-radius:4px}
.up{margin-top:10px}
.up .shot{width:100%;max-height:52vh;object-fit:contain;border-radius:8px;border:1px solid var(--border);background:#000;display:none;margin-top:10px}
.note{font-size:12px;color:var(--text2);line-height:1.5;margin-top:8px}
.msg{font-size:13px;padding:10px 12px;border-radius:8px;margin-top:10px;display:none}
.msg.ok{display:block;background:rgba(46,204,122,.12);color:var(--green);border:1px solid rgba(46,204,122,.35)}
.msg.err{display:block;background:rgba(224,82,82,.12);color:var(--red);border:1px solid rgba(224,82,82,.35)}
.empty{text-align:center;padding:30px 10px;color:var(--text2)}
.empty .ic{font-size:40px;margin-bottom:8px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media print{body>*{display:none!important}}
</style>
</head>

<header>
  <div class="ttl" id="hdTitle">Certificado de calificación<small>YURA HARNESS MÉXICO · PLANTA <span id="hdPlant">1</span></small></div>

</main>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;

      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate

      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var c, mc, r, mr, qrSvg='', rect;

        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var unicodeMap = {};

        var b1 = read();
        var b2 = read();
        var b3 = read();

        var v = (b2 << 8) | b3;

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];

              bytes.push(b & 0xff);

          }
        }
      }

          num[i + j] ^= QRMath.gexp(QRMath.glog(_this.getAt(i) ) + QRMath.glog(e.getAt(j) ) );

      return qrPolynomial(num, 0);

let lang=(Q.get('lang')||'es');try{lang=localStorage.getItem('cert_lang')||lang;}catch(e){}
let info=null, shot=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L=(ko,es)=>lang==='es'?es:ko;
async function rpc(fn,args){const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});
  const t=await r.text();if(!r.ok){let m=t;try{m=JSON.parse(t).message||t;}catch(e){}throw new Error(m);}return t?JSON.parse(t):null;}
function setLang(l){lang=l;try{localStorage.setItem('cert_lang',l);}catch(e){}document.getElementById('lkKo').classList.toggle('on',l==='ko');document.getElementById('lkEs').classList.toggle('on',l==='es');
  document.querySelectorAll('[data-ko]').forEach(el=>el.textContent=l==='es'?el.dataset.es:el.dataset.ko);if(info)render();}
function qrSvg(t){const q=qrcode(0,'M');q.addData(t);q.make();return q.createSvgTag({cellSize:4,margin:0,scalable:true});}
const addMonths=(d,m)=>{if(!d)return'';const x=new Date(String(d).slice(0,10)+'T00:00:00');if(isNaN(x))return'';x.setMonth(x.getMonth()+(parseInt(m)||0));return x.toISOString().slice(0,10);};
function certData(){
  const c=info.cfg||{}, r=info.result||{};
  return {name:info.name,empNo:info.emp_no,plant:PLANT,dept:info.dept||c.certDept||DEF_DEPT,process:info.process,processEs:info.process_es||info.process||'',score:r.total_score!=null?r.total_score:'',
    grade:r.grade||'-',hireDate:(info.hire_date||'').slice(0,10),validDate:addMonths(r.date,c.certValidMonths||6),issueDate:(r.date||'').slice(0,10),
    manager:c.certManager||'Park Jae Yoon',body:c.certBody||CERT_DOC.DEFAULT_BODY,photo:info.photo||null,qrSvg:qrSvg(location.href.split('#')[0]),url:location.href};
}
function render(){
  const app=document.getElementById('app');document.getElementById('loading').style.display='none';app.style.display='block';
  document.getElementById('hdPlant').textContent=PLANT;
  if(!info||!info.found){app.innerHTML=`<div class="card empty"><div class="ic">🔎</div><div style="font-weight:700;margin-bottom:6px">${L('등록된 인원을 찾을 수 없습니다','No se encontró el empleado')}</div><div style="font-family:'Space Mono',monospace;color:var(--gold)">${esc(EMP)||'-'}</div><div class="note">${L('QR이 올바른지, 자격인증 응시자 명단에 등록되어 있는지 확인하세요.','Verifique el QR o que esté registrado en la lista de aspirantes.')}</div></div>`;return;}
  const r=info.result, has=!!r, resigned=r&&r.resigned;
  const badge=resigned?`<span class="badge b-x">🚪 ${L('퇴사','Baja')}</span>`:has?`<span class="badge b-ok">🏆 ${L('최종합격 · 인증 유효','Certificado · Aprobado')}</span>`:`<span class="badge b-no">⏳ ${L('인증 기록 없음 (평가중/미응시)','Sin certificado (en evaluación)')}</span>`;
  const d=has?certData():null;
  const photoBox=info.photo?`<img src="${info.photo}" alt="">`:'👤';
  app.innerHTML=`
  <div class="card">
    <div class="cap">${L('인증 정보','Información')}</div>
    <div class="who"><div class="ph">${photoBox}</div><div style="min-width:0"><div class="nm">${esc(info.name||'-')}</div><div class="em">${esc(info.emp_no)}</div><div class="pr">${esc(info.process_es||info.process||'')}${info.process_es&&info.process?' · '+esc(info.process):''}</div>${badge}</div></div>
    ${has?`<div class="kv">
      <div><b>${L('등급 / Grado','Grado')}</b><span style="color:var(--gold)">${esc(r.grade||'-')}</span></div>
      <div><b>${L('총점 / Nota','Nota')}</b><span>${esc(r.total_score)}</span></div>
      <div><b>${L('평가일','Fecha de evaluación')}</b><span>${esc(CERT_DOC.fmtD(r.date))}</span></div>
      <div><b>${L('유효기간','Vigencia')}</b><span>${esc(CERT_DOC.fmtD(d.validDate))}</span></div>
    </div>`:''}
  </div>
  ${!info.has_photo?`<div class="card" id="upCard">
    <div class="cap">📷 ${L('사진 등록','Registrar foto')}</div>
    <div class="note" style="margin-top:0">${L('인증서에 들어갈 사진이 아직 없습니다. 밝은 곳에서 정면 얼굴 사진을 찍어 등록하세요. (1회 등록 후 변경은 관리자에게 요청)','Aún no hay foto para el certificado. Tome una foto de frente en un lugar iluminado. (Después de registrar, los cambios se solicitan al administrador)')}</div>
    <input type="file" id="file" accept="image/*" capture="user" style="display:none" onchange="onFile(this)">
    <input type="file" id="fileG" accept="image/*" style="display:none" onchange="onFile(this)">
    <div class="row"><button class="btn btn-gold" onclick="document.getElementById('file').click()">📷 ${L('사진 촬영','Tomar foto')}</button><button class="btn btn-sec" onclick="document.getElementById('fileG').click()">🖼 ${L('갤러리','Galería')}</button></div>
    <img id="shot" class="shot" alt="">
    <div class="row" id="saveRow" style="display:none"><button class="btn btn-gold" id="saveBtn" onclick="save()">✅ ${L('이 사진으로 등록','Registrar esta foto')}</button><button class="btn btn-ghost" onclick="reset()">↺ ${L('다시','Otra')}</button></div>
    <div class="msg" id="msg"></div>
  </div>`:''}
  ${has?`<div class="card" style="padding:10px 12px"><div class="cap" style="margin-bottom:6px">${L('인증서','Certificado')}</div>
    <div class="prev"><iframe id="fr" title="certificado"></iframe></div>
    <button class="btn btn-sec" onclick="printCert()">🖨 ${L('인쇄 / PDF 저장','Imprimir / Guardar PDF')}</button></div>`:''}
  <div class="note" style="text-align:center;font-family:'Space Mono',monospace;font-size:10px">YURA HARNESS MÉXICO · ${L('자격인증 시스템','Sistema de certificación')} · P${PLANT}</div>`;
  if(has){const fr=document.getElementById('fr');const w=fr.clientWidth||340;const zoom=Math.min(1,(w-2)/816);fr.style.height=Math.round(1056*zoom+6)+'px';fr.srcdoc=CERT_DOC.build(Object.assign({zoom},d));}
}
function shrink(file,max,q){return new Promise((ok,no)=>{const img=new Image();const u=URL.createObjectURL(file);
  img.onload=()=>{URL.revokeObjectURL(u);let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);ok(c.toDataURL('image/jpeg',q));};
  img.onerror=()=>{URL.revokeObjectURL(u);no(new Error('image'));};img.src=u;});}
async function onFile(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  try{shot=await shrink(f,640,0.85);const im=document.getElementById('shot');im.src=shot;im.style.display='block';document.getElementById('saveRow').style.display='flex';document.getElementById('msg').className='msg';}
  catch(e){const m=document.getElementById('msg');m.className='msg err';m.textContent=L('사진을 읽을 수 없습니다','No se pudo leer la foto');}}
function reset(){shot=null;document.getElementById('shot').style.display='none';document.getElementById('saveRow').style.display='none';}
async function save(){if(!shot)return;const b=document.getElementById('saveBtn'),m=document.getElementById('msg');b.disabled=true;b.innerHTML='<span class="spin"></span>'+L('등록 중…','Guardando…');
  try{const r=await rpc('cert_photo_set',{p_plant:PLANT,p_empno:EMP,p_photo:shot,p_source:'qr'});
    if(r&&r.ok===false)throw new Error(r.msg||'error');
    m.className='msg ok';m.textContent=L('✅ 사진이 등록되었습니다. 인증서를 다시 불러옵니다…','✅ Foto registrada. Actualizando certificado…');
    setTimeout(load,900);
  }catch(e){m.className='msg err';m.textContent=L('등록 실패: ','Error: ')+e.message;b.disabled=false;b.textContent='✅ '+L('이 사진으로 등록','Registrar esta foto');}}
function printCert(){const d=certData();const old=document.getElementById('pf');if(old)old.remove();const f=document.createElement('iframe');f.id='pf';f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  document.body.appendChild(f);f.onload=()=>{const w=f.contentWindow;const go=()=>{try{w.focus();w.print();}catch(e){}};const fs=w.document.fonts;if(fs&&fs.ready)fs.ready.then(()=>setTimeout(go,150));else setTimeout(go,400);};f.srcdoc=CERT_DOC.build(d);}
async function load(){
  try{info=await rpc(INFO_FN,{p_plant:PLANT,p_empno:EMP});}
  catch(e){info=null;document.getElementById('loading').innerHTML=`<div class="empty"><div class="ic">⚠️</div><div style="font-weight:700">${L('서버 연결 실패','Error de conexión')}</div><div class="note">${esc(e.message)}</div><div class="row"><button class="btn btn-sec" onclick="location.reload()">🔄 ${L('다시 시도','Reintentar')}</button></div></div>`;return;}
  render();
}
setLang(lang);
if(!EMP){document.getElementById('loading').innerHTML=`<div class="empty"><div class="ic">🔳</div><div style="font-weight:700">${L('사번이 없습니다','Falta el número de empleado')}</div><div class="note">cert.html?p=1&e=M026…</div></div>`;}else load();
</script>
</body>
</html>
