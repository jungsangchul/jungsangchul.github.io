<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Solicitud de Comida</title>
<style>
  :root{--navy:#0f2747;--teal:#0d7a6e;--teal2:#0a6055;--ink:#0b1220;--bad:#dc2626;--line:#e2e8f0;--muted:#64748b;--field:#f1f5f9}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;background:var(--ink);overflow:hidden;-webkit-user-select:none;user-select:none}
  .app{height:100dvh;display:flex;flex-direction:column;background:#f8fafc}
  header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:calc(14px + env(safe-area-inset-top))}
  header .brand{font-weight:800;letter-spacing:.5px;font-size:15px}
  .hd-right{display:flex;align-items:center;gap:10px}
  header .loc{font-size:13px;opacity:.85;font-weight:600}
  .lang{background:rgba(255,255,255,.16);border:none;color:#fff;font-weight:800;font-size:12px;padding:6px 10px;border-radius:8px;cursor:pointer}
  main{flex:1;position:relative;overflow:hidden}
  .panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:18px;opacity:0;pointer-events:none;transition:opacity .18s;background:#f8fafc}
  .panel.active{opacity:1;pointer-events:auto}
  .big-name{font-size:30px;font-weight:800;color:var(--ink);line-height:1.15}
  .sub{font-size:15px;color:var(--muted);font-weight:600}
  .chip{display:inline-flex;gap:8px;align-items:center;background:#dcfaf4;color:var(--teal2);padding:7px 14px;border-radius:999px;font-weight:700;font-size:14px}
  .datebig{font-size:18px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
  .cta{width:100%;max-width:420px;border:none;border-radius:20px;padding:26px;font-size:24px;font-weight:800;color:#fff;background:linear-gradient(135deg,#0d7a6e,#0a6055);box-shadow:0 10px 24px rgba(13,122,110,.3);cursor:pointer;transition:transform .08s}
  .cta:active{transform:scale(.97)}
  .cta .cta-sub{display:block;font-size:14px;font-weight:600;opacity:.9;margin-top:4px}
  .cta.cancel{background:#fff;color:var(--bad);border:2px solid #fecaca;box-shadow:none;font-size:18px;padding:18px;max-width:300px}
  .field{width:100%;max-width:360px;border:2px solid var(--line);border-radius:16px;background:var(--field);padding:18px 20px;font-size:22px;font-weight:800;text-align:center;letter-spacing:1px;text-transform:uppercase;color:var(--ink);outline:none}
  .field:focus{border-color:var(--navy);background:#fff}
  .btn{width:100%;max-width:360px;border:none;border-radius:16px;padding:18px;font-size:18px;font-weight:800;color:#fff;background:var(--navy);cursor:pointer}
  .btn:active{transform:scale(.98)}
  .footlink{font-size:13px;color:var(--muted);font-weight:600;background:none;border:none;text-decoration:underline;cursor:pointer}
  .panel.flood-ok{background:linear-gradient(160deg,#0d7a6e,#0a6055);color:#fff}
  .panel.flood-bad{background:linear-gradient(160deg,#dc2626,#b91c1c);color:#fff}
  .panel.flood-warn{background:linear-gradient(160deg,#d97706,#b45309);color:#fff}
  .flood-ok .sub,.flood-bad .sub,.flood-warn .sub{color:rgba(255,255,255,.9)}
  .mark{width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:72px;font-weight:800}
  .result-name{font-size:34px;font-weight:800;color:#fff}
  .result-type{font-size:22px;font-weight:800;letter-spacing:1px}
  .spin{width:64px;height:64px;border-radius:50%;border:6px solid #dbe3ee;border-top-color:var(--teal);animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .step{font-size:15px;font-weight:600;color:var(--muted)}
  .badge-done{display:inline-flex;align-items:center;gap:8px;background:#dcfce7;color:#15803d;font-weight:800;font-size:17px;padding:12px 20px;border-radius:14px}
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="brand" data-i18n="brand">식사신청</span>
    <div class="hd-right">
      <span class="loc" id="locLabel">—</span>
      <button class="lang" id="langBtn" style="display:none">ES</button>
    </div>
  </header>
  <main>
    <section class="panel active" id="p-init"><div class="spin"></div><div class="step" data-i18n="checking">확인 중…</div></section>

    <section class="panel" id="p-id">
      <div class="big-name" data-i18n="enterId">사번 입력</div>
      <input class="field" id="idInput" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="M026…">
      <button class="btn" id="idBtn" data-i18n="confirm">확인</button>
      <div class="step" id="idMsg" style="min-height:18px;color:var(--bad)"></div>
    </section>

    <section class="panel" id="p-ready">
      <div class="chip" id="readyMeal" data-i18n="todayMeal">오늘 식사</div>
      <div class="big-name" id="readyName">—</div>
      <div class="datebig" id="readyDate">—</div>
      <button class="cta" id="applyBtn"><span data-i18n="apply">식사 신청</span><span class="cta-sub" data-i18n="applySub">Solicitar comida</span></button>
      <button class="footlink" id="changeId" data-i18n="changeId">사번 변경</button>
    </section>

    <section class="panel" id="p-applied">
      <div class="badge-done"><span>✓</span><span data-i18n="done">신청 완료</span></div>
      <div class="big-name" id="appliedName">—</div>
      <div class="datebig" id="appliedDate">—</div>
      <button class="cta cancel" id="cancelBtn" data-i18n="cancel">신청 취소</button>
      <button class="footlink" id="changeId2" data-i18n="changeId">사번 변경</button>
    </section>

    <section class="panel" id="p-proc"><div class="spin"></div><div class="step" id="procStep">—</div></section>

    <section class="panel flood-ok" id="p-ok">
      <div class="mark">✓</div>
      <div class="result-type" data-i18n="okTitle">식사 신청 완료</div>
      <div class="result-name" id="okName">—</div>
      <div class="sub" id="okDate">—</div>
      <button class="btn" id="mealClose" data-i18n="closeBtn" style="background:rgba(255,255,255,.2);max-width:280px;margin-top:14px">닫기</button>
    </section>

    <section class="panel flood-warn" id="p-canceled">
      <div class="mark">↺</div>
      <div class="result-type" data-i18n="canceledTitle">신청 취소됨</div>
      <button class="btn" id="canceledBack" style="background:rgba(255,255,255,.18);max-width:280px;margin-top:8px" data-i18n="ok">확인</button>
    </section>

    <section class="panel flood-bad" id="p-bad">
      <div class="mark">✕</div>
      <div class="result-type" id="badTitle">—</div>
      <div class="sub" id="badMsg" style="font-size:17px;max-width:320px">—</div>
      <button class="btn" id="badRetry" style="background:rgba(255,255,255,.18);max-width:280px;margin-top:8px" data-i18n="retry">다시 시도</button>
    </section>
  </main>
</div>

<script>
/* ============================================================
   설정 (CONFIG)
   ============================================================ */
const CONFIG = {
  SUPABASE_URL:  "https://lrjurjhavlalhlwaplxd.supabase.co",
  SUPABASE_ANON: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyanVyamhhdmxhbGhsd2FwbHhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNzUxNDAsImV4cCI6MjA5NTY1MTE0MH0.DVFmZaT37R9CXSMHdnLx4YAVNTnlBGijkOIaoUo7Qsk",        // ← 채우기
  T_EMPLOYEES:   "att_employees",
  T_MEALS:       "meal_requests",
  PLANTS: { "1":{ko:"1공장",es:"Planta 1"}, "lib":{ko:"도서관",es:"Biblioteca"} },
  TZ_OFFSET_HOURS:-6, ALLOW_CANCEL:true, CUTOFF_HOUR:null, RESET_AFTER_MS:4000
};
/* ============================================================ */

const I18N = {
  ko:{ brand:"식사신청", checking:"확인 중…", enterId:"사번 입력", confirm:"확인", changeId:"사번 변경",
    retry:"다시 시도", ok:"확인", idEmpty:"사번을 입력하세요", idBad:"등록되지 않은 사번입니다", netErr:"통신 오류",
    todayMeal:"오늘 식사", apply:"식사 신청", applySub:"Solicitar comida", done:"신청 완료", cancel:"신청 취소",
    okTitle:"식사 신청 완료", canceledTitle:"신청 취소됨",
    stepApply:"신청 중…", stepCancel:"취소 중…",
    cutoffT:"신청 마감", cutoffM:"오늘 신청이 마감되었습니다.",
    failT:"신청 실패", failM:"잠시 후 다시 시도하세요.", netFailM:"네트워크를 확인하세요.", closeBtn:"닫기" },
  es:{ brand:"Comida", checking:"Verificando…", enterId:"Número de empleado", confirm:"Confirmar", changeId:"Cambiar empleado",
    retry:"Reintentar", ok:"OK", idEmpty:"Ingrese su número", idBad:"Número no registrado", netErr:"Error de red",
    todayMeal:"Comida de hoy", apply:"Solicitar comida", applySub:"식사 신청", done:"Solicitado", cancel:"Cancelar",
    okTitle:"Comida solicitada", canceledTitle:"Solicitud cancelada",
    stepApply:"Solicitando…", stepCancel:"Cancelando…",
    cutoffT:"Cerrado", cutoffM:"La solicitud de hoy ya cerró.",
    failT:"Error al solicitar", failM:"Intente de nuevo.", netFailM:"Verifique su conexión.", closeBtn:"Cerrar" }
};
let lang = "es";  // 작업자 페이지: 스페인어 고정
const t = k => I18N[lang][k];
function dispName(){ return (lang==='ko' && me && me.name_ko) ? me.name_ko : (me?me.name:''); }

const $ = id => document.getElementById(id);
const REST = p => CONFIG.SUPABASE_URL + "/rest/v1/" + p;
const HEADERS = { "apikey":CONFIG.SUPABASE_ANON, "Authorization":"Bearer "+CONFIG.SUPABASE_ANON, "Content-Type":"application/json" };
const params = new URLSearchParams(location.search);
const factoryKey = params.get("f") || "";
let me=null, todayRow=null;

function plantLabel(){ const p=CONFIG.PLANTS[factoryKey]; return p?p[lang]:(lang==="ko"?"식사신청":"Comida"); }
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent=t(el.dataset.i18n); });
  $("langBtn").textContent = lang==="ko"?"ES":"한";
  $("locLabel").textContent = plantLabel();
  if($("p-ready").classList.contains("active")||$("p-applied").classList.contains("active")) refreshLabels();
}
$("langBtn").onclick=()=>{ lang=lang==="ko"?"es":"ko"; localStorage.setItem("yura_lang",lang); applyLang(); };

function show(id){ document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active")); $(id).classList.add("active"); }
function reject(title,msg,retry){ $("badTitle").textContent=title; $("badMsg").textContent=msg; $("badRetry").style.display=retry?"":"none"; show("p-bad"); }

function todayDate(){ const n=new Date(); const l=new Date(n.getTime()+CONFIG.TZ_OFFSET_HOURS*3600*1000); return l.toISOString().slice(0,10); }
function todayLabel(){ const d=todayDate().split("-"); return `${d[0]}.${d[1]}.${d[2]}`; }
function pastCutoff(){ if(CONFIG.CUTOFF_HOUR==null) return false; const n=new Date(); const l=new Date(n.getTime()+CONFIG.TZ_OFFSET_HOURS*3600*1000); return l.getUTCHours()>=CONFIG.CUTOFF_HOUR; }

function refreshLabels(){
  $("readyName").textContent=dispName(); $("readyDate").textContent=todayLabel();
  $("appliedName").textContent=dispName(); $("appliedDate").textContent=plantLabel()+" · "+todayLabel();
  $("cancelBtn").style.display=CONFIG.ALLOW_CANCEL?"":"none";
}

function init(){
  applyLang();
  const saved=localStorage.getItem("yura_att_me");
  if(saved){ try{ me=JSON.parse(saved); }catch(e){ me=null; } }
  if(me && me.employee_id) loadStatus();
  else { show("p-id"); setTimeout(()=>$("idInput").focus(),200); }
}

$("idBtn").onclick=verifyId;
$("idInput").addEventListener("keydown",e=>{ if(e.key==="Enter") verifyId(); });
async function verifyId(){
  const id=$("idInput").value.trim().toUpperCase(); $("idMsg").textContent="";
  if(!id){ $("idMsg").textContent=t("idEmpty"); return; }
  $("idBtn").textContent=t("checking"); $("idBtn").disabled=true;
  try{
    const r=await fetch(REST(`${CONFIG.T_EMPLOYEES}?employee_id=eq.${encodeURIComponent(id)}&select=employee_id,name,name_ko&limit=1`),{headers:HEADERS});
    const rows=await r.json();
    if(!Array.isArray(rows)||rows.length===0){ $("idMsg").textContent=t("idBad"); return; }
    me={employee_id:rows[0].employee_id, name:rows[0].name||rows[0].employee_id, name_ko:rows[0].name_ko||''};
    localStorage.setItem("yura_att_me",JSON.stringify(me)); loadStatus();
  }catch(e){ $("idMsg").textContent=t("netErr"); }
  finally{ $("idBtn").textContent=t("confirm"); $("idBtn").disabled=false; }
}
$("changeId").onclick=$("changeId2").onclick=()=>{ localStorage.removeItem("yura_att_me"); me=null; $("idInput").value=""; show("p-id"); setTimeout(()=>$("idInput").focus(),150); };

async function loadStatus(){
  show("p-init");
  try{
    const r=await fetch(REST(`${CONFIG.T_MEALS}?employee_id=eq.${encodeURIComponent(me.employee_id)}&meal_date=eq.${todayDate()}&select=id,status&limit=1`),{headers:HEADERS});
    const rows=await r.json(); todayRow=(Array.isArray(rows)&&rows[0])?rows[0]:null;
  }catch(e){ todayRow=null; }
  refreshLabels();
  if(todayRow && todayRow.status==="applied") show("p-applied");
  else show("p-ready");
}

$("applyBtn").onclick=apply;
async function apply(){
  if(pastCutoff()){ reject(t("cutoffT"), t("cutoffM"), false); return; }
  show("p-proc"); $("procStep").textContent=t("stepApply");
  try{
    let r;
    if(todayRow && todayRow.id){
      r=await fetch(REST(`${CONFIG.T_MEALS}?id=eq.${todayRow.id}`),{method:"PATCH",headers:{...HEADERS,"Prefer":"return=minimal"},body:JSON.stringify({status:"applied"})});
    } else {
      r=await fetch(REST(CONFIG.T_MEALS),{method:"POST",headers:{...HEADERS,"Prefer":"return=representation"},
        body:JSON.stringify({employee_id:me.employee_id, name:me.name, meal_date:todayDate(), factory:factoryKey, status:"applied"})});
      if(r.status===409){ await loadStatus(); return; }
      const ins=await r.json(); if(Array.isArray(ins)&&ins[0]) todayRow={id:ins[0].id,status:"applied"};
    }
    if(!r.ok){ reject(t("failT"), t("failM"), true); return; }
    if(todayRow) todayRow.status="applied";
    $("okName").textContent=dispName(); $("okDate").textContent=plantLabel()+" · "+todayLabel(); show("p-ok");
  }catch(e){ reject(t("failT"), t("netFailM"), true); }
}

$("cancelBtn").onclick=cancelMeal;
async function cancelMeal(){
  if(!todayRow || !todayRow.id){ loadStatus(); return; }
  show("p-proc"); $("procStep").textContent=t("stepCancel");
  try{
    const r=await fetch(REST(`${CONFIG.T_MEALS}?id=eq.${todayRow.id}`),{method:"PATCH",headers:{...HEADERS,"Prefer":"return=minimal"},body:JSON.stringify({status:"canceled"})});
    if(!r.ok){ reject(t("failT"), t("failM"), true); return; }
    todayRow.status="canceled"; show("p-canceled");
  }catch(e){ reject(t("failT"), t("netFailM"), true); }
}

$("badRetry").onclick=loadStatus; $("canceledBack").onclick=loadStatus; $("mealClose").onclick=loadStatus;
init();
</script>
</body>
</html>
