<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>보전자 자격인증 평가</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1e2535;--surface:#252d3d;--surface2:#2d3649;--border:#3a4560;
  --navy:#0f1f3d;--accent:#4a90d9;--sky:#5ba3e8;--text:#dde4f0;--text2:#8a9bbf;
  --green:#2ecc7a;--red:#e05252;--blue:#4a90d9;--purple:#9b7ee8;
  --gold:#e8b84b;--teal:#2ab8a8;--orange:#e87a2a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;}

header{background:#0f1f3d;border-bottom:2px solid #1e3a6e;padding:0 1.2rem;display:flex;align-items:center;gap:12px;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,0.4);}
.header-left{display:flex;align-items:center;gap:12px;flex-shrink:0;}
.home-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;background:rgba(0,200,255,0.1);border:1px solid rgba(0,200,255,0.35);color:#00c8ff;font-size:11px;font-weight:700;letter-spacing:1.5px;cursor:pointer;text-decoration:none;border-radius:4px;transition:all 0.2s;flex-shrink:0;font-family:inherit;white-space:nowrap;}
.home-btn:hover{background:rgba(0,200,255,0.22);border-color:#00c8ff;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,200,255,0.2);}
.home-btn svg{width:14px;height:14px;fill:none;stroke:#00c8ff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.hdivider{width:1px;height:28px;background:rgba(255,255,255,0.12);flex-shrink:0;}
.logo-text .logo-es{font-size:0.82rem;font-weight:700;color:#e8f0ff;}
.logo-text .logo-kr{font-size:0.72rem;font-weight:600;color:#7eb8f7;}
.tab-nav{display:flex;overflow-x:auto;flex:1;justify-content:center;}
.tab-btn{padding:0 1rem;height:60px;background:none;border:none;color:rgba(255,255,255,0.45);font-family:inherit;font-size:0.78rem;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;transition:all .18s;white-space:nowrap;}
.tab-btn.active{color:#ffffff;border-bottom-color:var(--sky);background:rgba(255,255,255,0.06);}
.tab-btn:hover:not(.active){color:rgba(255,255,255,0.85);background:rgba(255,255,255,0.04);}
.lang-btn{padding:5px 10px;background:rgba(0,200,255,0.1);border:1px solid rgba(0,200,255,0.35);color:#00c8ff;border-radius:5px;cursor:pointer;font-family:inherit;font-size:0.75rem;font-weight:700;white-space:nowrap;}
@media(max-width:900px){
  header{height:auto;flex-wrap:wrap;padding:8px 10px;gap:8px;position:static;}
  .header-left{flex:1 1 auto;min-width:0;}
  .logo-text .logo-es{font-size:0.72rem;}.logo-text .logo-kr{font-size:0.65rem;}
  .tab-nav{order:3;flex-wrap:wrap;overflow-x:visible;width:100%;border-top:1px solid rgba(255,255,255,0.08);padding-top:4px;justify-content:flex-start;}
  .tab-btn{height:40px;padding:0 0.7rem;font-size:0.74rem;flex:0 0 auto;}
}
@media(max-width:480px){
  .home-btn{padding:5px 8px;font-size:10px;}.hdivider{display:none;}
  .tab-btn{height:36px;padding:0 0.55rem;font-size:0.7rem;}
}

.page{display:none;padding:1.5rem;max-width:1280px;margin:0 auto;}.page.active{display:block;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1.4rem;margin-bottom:1.4rem;box-shadow:0 2px 8px rgba(0,0,0,0.2);}
.card-title{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--sky);margin-bottom:1.1rem;display:flex;align-items:center;gap:0.5rem;padding-bottom:0.6rem;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.card-title .sp{flex:1;}
.card-title.blue{color:var(--blue);}.card-title.purple{color:var(--purple);}.card-title.green{color:var(--green);}.card-title.gold{color:var(--gold);}.card-title.teal{color:var(--teal);}
.card-title select{width:auto;font-size:0.76rem;padding:0.3rem 0.6rem;text-transform:none;letter-spacing:0;}

input,select,textarea{background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:inherit;font-size:0.88rem;padding:0.55rem 0.85rem;outline:none;transition:border-color .2s,box-shadow .2s;width:100%;}
input:focus,select:focus,textarea:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(91,163,232,0.15);}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(0.7) brightness(1.5);cursor:pointer;}
label{font-size:0.78rem;color:var(--text2);margin-bottom:0.3rem;display:block;}
.form-row{display:grid;gap:1rem;margin-bottom:1rem;align-items:end;}
.col4{grid-template-columns:2fr 1.4fr 1fr 1fr auto;}
.col-admin{grid-template-columns:2fr 1fr 1fr auto;}
.col-cfg{grid-template-columns:1fr 1fr auto;max-width:520px;}
@media(max-width:760px){.col4,.col-admin,.col-cfg{grid-template-columns:1fr 1fr;}}

.btn{padding:0.5rem 1.1rem;border-radius:6px;border:none;cursor:pointer;font-family:inherit;font-size:0.83rem;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;gap:0.35rem;white-space:nowrap;}
.btn-primary{background:var(--accent);color:#fff;}.btn-primary:hover{background:var(--sky);}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}.btn-secondary:hover{border-color:var(--sky);color:var(--sky);}
.btn-danger{background:#b83232;color:#fff;}.btn-danger:hover{background:var(--red);}
.btn-success{background:#1d9460;color:#fff;}.btn-success:hover{background:var(--green);}
.btn-teal{background:#1a8a7c;color:#fff;}.btn-teal:hover{background:var(--teal);}
.btn-sm{padding:0.32rem 0.75rem;font-size:0.76rem;}
.btn-outline{background:none;color:var(--accent);border:1px solid var(--accent);}.btn-outline:hover{background:rgba(74,144,217,0.12);}

/* tables */
.tw{overflow:auto;max-height:72vh;}
.results-table{width:100%;border-collapse:collapse;}
.results-table th,.results-table td{padding:0.6rem 0.7rem;text-align:center;border-bottom:1px solid var(--border);font-size:0.8rem;vertical-align:middle;}
.results-table thead,.results-table th{background:var(--surface2);}
.results-table th{color:var(--sky);font-size:0.7rem;text-transform:uppercase;letter-spacing:1px;font-weight:700;position:sticky;top:0;z-index:1;}
.results-table tr:hover td{background:rgba(255,255,255,0.03);}
.results-table .l{text-align:left;}
.mono{font-family:'JetBrains Mono',monospace;}
.name-link{color:var(--sky);font-weight:600;cursor:pointer;}
.name-link:hover{text-decoration:underline;}

/* grades / badges */
.grade-s{background:linear-gradient(135deg,#f1c40f,#f39c12);color:#000;border-radius:6px;padding:0.15rem 0.55rem;font-size:0.78rem;font-weight:900;white-space:nowrap;}
.grade-a{background:rgba(46,204,122,0.2);color:var(--green);border:1px solid rgba(46,204,122,0.5);border-radius:6px;padding:0.15rem 0.55rem;font-size:0.78rem;font-weight:700;white-space:nowrap;}
.grade-b{background:rgba(74,144,217,0.2);color:var(--blue);border:1px solid rgba(74,144,217,0.5);border-radius:6px;padding:0.15rem 0.55rem;font-size:0.78rem;font-weight:700;white-space:nowrap;}
.grade-fail{background:rgba(224,82,82,0.15);color:var(--red);border:1px solid rgba(224,82,82,0.4);border-radius:6px;padding:0.15rem 0.55rem;font-size:0.78rem;font-weight:700;white-space:nowrap;}
.grade-na{color:var(--text2);font-size:0.78rem;}
.done-badge{background:rgba(46,204,122,0.12);color:var(--green);border:1px solid rgba(46,204,122,0.3);border-radius:4px;padding:0.15rem 0.5rem;font-size:0.72rem;font-weight:700;white-space:nowrap;}
.pend-badge{background:rgba(232,184,75,0.12);color:var(--gold);border:1px solid rgba(232,184,75,0.3);border-radius:4px;padding:0.15rem 0.5rem;font-size:0.72rem;font-weight:700;white-space:nowrap;}
.fail-badge{background:rgba(224,82,82,0.12);color:var(--red);border:1px solid rgba(224,82,82,0.3);border-radius:4px;padding:0.15rem 0.5rem;font-size:0.72rem;font-weight:700;white-space:nowrap;}
.na-badge{background:var(--surface2);color:var(--text2);border:1px solid var(--border);border-radius:4px;padding:0.15rem 0.5rem;font-size:0.72rem;font-weight:700;white-space:nowrap;}
.score-t{background:rgba(74,144,217,0.15);color:var(--blue);font-size:0.76rem;padding:0.12rem 0.45rem;border-radius:4px;font-weight:700;}
.score-t.low{background:rgba(224,82,82,0.15);color:var(--red);}

/* stats */
.stats-row{display:grid;grid-template-columns:repeat(6,1fr);gap:0.9rem;margin-bottom:1.4rem;}
@media(max-width:900px){.stats-row{grid-template-columns:repeat(3,1fr);}}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1.1rem;text-align:center;border-top:3px solid var(--accent);}
.stat-card.green{border-top-color:var(--green);}.stat-card.gold{border-top-color:var(--gold);}.stat-card.red{border-top-color:var(--red);}.stat-card.purple{border-top-color:var(--purple);}
.stat-val{font-size:1.7rem;font-weight:700;color:var(--sky);font-family:'JetBrains Mono',monospace;}
.stat-val.green{color:var(--green);}.stat-val.gold{color:var(--gold);}.stat-val.red{color:var(--red);}.stat-val.purple{color:var(--purple);}
.stat-label{font-size:0.7rem;color:var(--text2);margin-top:0.2rem;}

/* distribution bars */
.dist{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem 1.4rem;}
.bar-label{font-size:0.76rem;color:var(--text);margin-bottom:0.3rem;display:flex;justify-content:space-between;}
.bar-label span{color:var(--text2);}
.stack{display:flex;height:20px;background:var(--surface2);border-radius:5px;overflow:hidden;}
.stack div{display:flex;align-items:center;justify-content:center;font-size:0.68rem;font-weight:800;color:#fff;}
.legend{display:flex;gap:0.9rem;font-size:0.7rem;color:var(--text2);margin-top:0.9rem;flex-wrap:wrap;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;}
.bar-track{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;min-width:70px;}
.bar-fill{height:100%;border-radius:4px;}

/* flow */
.flow{display:flex;align-items:center;flex-wrap:wrap;gap:0.4rem;justify-content:center;padding:0.4rem 0;}
.flow-step{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:0.6rem 0.9rem;font-size:0.8rem;font-weight:700;color:var(--sky);text-align:center;}
.flow-step.red{color:var(--red);border-color:rgba(224,82,82,0.4);}
.flow-sub{font-size:0.68rem;color:var(--text2);font-weight:400;margin-top:0.15rem;}
.flow-arrow{color:var(--text2);font-weight:700;}
.flow-label{font-size:0.72rem;font-weight:700;color:var(--gold);width:100%;text-align:center;margin-top:0.6rem;}
.info-box{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:0.7rem 1rem;font-size:0.77rem;color:var(--text2);margin-top:0.8rem;line-height:1.7;}
.info-box .hl{color:var(--sky);font-weight:600;}
.hint{font-size:0.74rem;color:var(--text2);margin-top:0.7rem;line-height:1.6;}

/* practical */
.lv{display:flex;gap:0.35rem;flex-wrap:wrap;}
.lv button{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:0.3rem 0.5rem;font-size:0.7rem;color:var(--text2);cursor:pointer;font-family:inherit;line-height:1.25;text-align:center;min-width:66px;transition:all .15s;}
.lv button b{display:block;font-size:0.9rem;color:var(--text);font-family:'JetBrains Mono',monospace;}
.lv button:hover{border-color:var(--sky);}
.lv button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.lv button.on b{color:#fff;}
.crit{font-size:0.72rem;color:var(--text2);margin-top:0.25rem;line-height:1.5;}
.sc-in{width:72px!important;text-align:center;font-family:'JetBrains Mono',monospace;font-size:1rem!important;font-weight:700;}
.score-total-bar{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:0.8rem 1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-top:1rem;}
.score-total-bar .big{font-size:1.9rem;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--sky);}
.edit-tag{font-size:0.7rem;color:var(--gold);text-transform:none;letter-spacing:0;}

/* modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:9999;align-items:flex-start;justify-content:center;overflow:auto;padding:2rem 0.6rem;}
.modal-bg.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.6rem;width:100%;max-width:860px;box-shadow:0 8px 40px rgba(0,0,0,0.5);}
.modal-title{font-size:1rem;font-weight:700;color:var(--sky);flex:1;}
.modal h4{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--purple);margin:1.3rem 0 0.6rem;display:flex;gap:0.6rem;align-items:center;flex-wrap:wrap;}
.modal h4.t{color:var(--blue);}
.weak{color:var(--red)!important;font-weight:700;}
.muted{color:var(--text2);font-size:0.76rem;}
.empty-state{text-align:center;padding:2rem;color:var(--text2);font-size:0.82rem;}

/* ===== EXAM (exam.html style) ===== */
.ex-wrap{display:flex;justify-content:center;padding:1rem 0;}
.ex-card{background:#1a1d27;border:1px solid #2a2f45;border-radius:16px;padding:2rem 1.5rem;width:100%;max-width:420px;position:relative;}
.ex-ttl{font-size:1.1rem;font-weight:800;text-align:center;color:var(--sky);margin-bottom:0.25rem;}
.ex-sub{font-size:0.78rem;color:#8892b0;text-align:center;margin-bottom:1.2rem;}
.ex-tags{display:flex;gap:0.5rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.2rem;}
.ex-tag{background:#22263a;border:1px solid #2a2f45;border-radius:20px;padding:0.2rem 0.7rem;font-size:0.72rem;color:#8892b0;}
.ex-card label{font-size:0.82rem;color:#8892b0;font-weight:600;}
.ex-card select{background:#22263a;border:1px solid #2a2f45;border-radius:10px;font-size:1rem;padding:0.75rem 0.9rem;margin-bottom:1rem;}
.ex-info{display:none;background:rgba(74,144,217,0.1);border:1px solid rgba(74,144,217,0.3);border-radius:8px;padding:0.6rem 0.9rem;margin-bottom:0.8rem;font-size:0.85rem;color:var(--sky);}
.btn-start{display:block;width:100%;background:linear-gradient(135deg,#4a90d9,#3a7bc8);color:#fff;border:none;border-radius:12px;padding:1rem;font-size:1.05rem;font-weight:700;cursor:pointer;margin-top:0.5rem;font-family:inherit;}
.btn-start:active{opacity:0.85;}
.ex-lang{position:absolute;top:12px;right:12px;}
.ex-link{margin-top:1.2rem;padding-top:1rem;border-top:1px solid #2a2f45;font-size:0.76rem;color:#8892b0;text-align:center;line-height:1.6;}
.qr-box{background:#fff;padding:10px;border-radius:10px;display:inline-block;margin:0.6rem 0 0.3rem;}
.qr-box img,.qr-box canvas{display:block;}
.qr-url{font-size:0.68rem;color:#8892b0;word-break:break-all;margin-bottom:0.6rem;}
.qr-sheet{text-align:center;padding:1rem 0;}
.qr-sheet .qr-box{padding:18px;}
.qr-sheet h2{color:var(--sky);font-size:1.4rem;margin-bottom:0.2rem;}
.qr-sheet .qs-sub{color:var(--text2);font-size:0.95rem;margin-bottom:0.4rem;}
.qr-sheet .qs-steps{color:var(--text);font-size:0.9rem;line-height:1.9;margin-top:0.8rem;}

#exScreen{background:#0f1117;border-radius:10px;overflow:hidden;max-width:640px;margin:0 auto;border:1px solid #2a2f45;}
body.exam-only #exScreen{border:none;border-radius:0;max-width:none;min-height:100vh;}
.ex-hdr{background:#1a1d27;border-bottom:1px solid #2a2f45;padding:0.8rem 1rem;display:flex;justify-content:space-between;align-items:center;gap:0.6rem;position:sticky;top:0;z-index:50;}
.ex-hdr-u{font-size:0.78rem;color:#8892b0;}
.ex-hdr-u strong{color:var(--sky);}
.ex-cnt{font-size:0.9rem;font-weight:700;color:var(--gold);font-family:monospace;background:#22263a;padding:0.2rem 0.6rem;border-radius:6px;}
.pb-w{width:100%;height:5px;background:#22263a;}
.pb-f{height:100%;background:linear-gradient(90deg,#4a90d9,#2bbcb0);transition:width 0.4s;}
.qw{padding:1.2rem 1rem 2.5rem;max-width:600px;margin:0 auto;}
.qcnt{font-size:0.75rem;color:#8892b0;text-align:center;margin-bottom:0.5rem;}
.qtxt{font-size:1.05rem;font-weight:700;line-height:1.7;color:#e8eaf0;background:#1a1d27;border:1px solid #2a2f45;border-radius:12px;padding:1.1rem 1rem;margin-bottom:1rem;word-break:keep-all;}
.opts{display:flex;flex-direction:column;gap:0.65rem;}
.opt-btn{background:#1a1d27;border:2px solid #2a2f45;border-radius:12px;padding:0.9rem 1rem;text-align:left;cursor:pointer;display:flex;align-items:center;gap:0.7rem;color:#e8eaf0;font-size:0.97rem;width:100%;font-family:inherit;}
.opt-btn.selected{border-color:#4a90d9;background:rgba(74,144,217,0.15);}
.onum{width:28px;height:28px;border-radius:50%;background:#22263a;border:1px solid #2a2f45;display:inline-flex;align-items:center;justify-content:center;font-size:0.78rem;font-weight:700;flex-shrink:0;color:#8892b0;}
.opt-btn.selected .onum{background:#4a90d9;border-color:#4a90d9;color:#fff;}
.otxt{flex:1;line-height:1.5;word-break:keep-all;}
.q21r{background:#22263a;border:1px solid #2a2f45;border-radius:10px;margin-top:0.7rem;font-size:0.95rem;min-height:90px;}
.dots{display:flex;flex-wrap:wrap;margin:0.9rem 0;justify-content:center;}
.a-dot{width:32px;height:32px;border-radius:50%;border:2px solid #2a2f45;display:inline-flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;cursor:pointer;color:#8892b0;background:#22263a;margin:0.2rem;}
.a-dot.answered{background:#4a90d9;border-color:#4a90d9;color:#fff;}
.a-dot.current{border-color:var(--gold);}
.ex-nav{display:flex;gap:0.6rem;margin-top:1.2rem;}
.btn-prev,.btn-next,.btn-submit{flex:1;padding:0.9rem;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-prev{background:#22263a;color:#8892b0;}
.btn-next{background:linear-gradient(135deg,#4a90d9,#3a7bc8);color:#fff;}
.btn-submit{background:linear-gradient(135deg,#2ecc71,#27ae60);color:#fff;}
.btn-prev:disabled{opacity:0.4;}
.done-card{background:#1a1d27;border:1px solid #2a2f45;border-radius:16px;padding:2rem 1.5rem;width:100%;max-width:420px;text-align:center;}
.done-title{font-size:1.3rem;font-weight:800;margin-bottom:0.3rem;}
.done-score{font-size:3.4rem;font-weight:900;font-family:'JetBrains Mono',monospace;margin:0.4rem 0;}
.done-msg{font-size:0.85rem;color:#8892b0;line-height:1.7;margin:0.8rem 0 1.2rem;}
body.exam-only{background:#0f1117;}
body.exam-only .ex-wrap{min-height:100vh;align-items:center;padding:1.2rem;}
body.exam-only .page{padding:0;max-width:none;}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0f1f3d;border:1px solid var(--sky);color:#fff;padding:0.65rem 1.2rem;border-radius:8px;display:none;z-index:99999;font-size:0.82rem;font-weight:600;}
.hide{display:none!important;}
@media(max-width:640px){.page{padding:0.8rem;}.card{padding:1rem;}}
@media print{
  :root{--bg:#fff;--surface:#fff;--surface2:#eef1f6;--border:#c9ced8;--text:#000;--text2:#444;--sky:#1f4e9c;}
  body{background:#fff;}header,.no-print{display:none!important;}
  .card{box-shadow:none;border:none;padding:0;}.tw{max-height:none;overflow:visible;}.results-table th{position:static;}
  body.printmodal .page{display:none!important;}
  .modal-bg.open{position:static;background:none;padding:0;}.modal{box-shadow:none;border:none;max-width:none;}
}
</style>
</head>
<body>
<header class="no-print" id="appHeader">
  <div class="header-left">

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }

let STAFF=[],PRAC=[],THEO=[],CFG={theoryPass:70,shuffle:true};
async function sb(path,opt={}){
  const r=await fetch(SB+'/rest/v1/'+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=representation',...(opt.headers||{})}});
  const t=await r.text(); if(!r.ok) throw new Error(t||r.status); return t?JSON.parse(t):null;
}
async function loadAll(){
  const [s,p,t,c]=await Promise.all([
    sb(TB.staff+'?select=*&order=name'),
    sb(TB.practical+'?select=*&order=eval_date.desc,id.desc'),
    sb(TB.theory+'?select=*&order=exam_date.desc,id.desc'),
    sb(TB.config+'?select=*')]);
  STAFF=s;PRAC=p;THEO=t;
  const st=(c||[]).find(x=>x.key==='settings'); if(st) CFG={...CFG,...st.value};
}
const grade=s=>s==null?null:s>=90?'S':s>=80?'A':s>=70?'B':'C';
const gCls={S:'grade-s',A:'grade-a',B:'grade-b',C:'grade-fail'};
const gTag=s=>s==null?`<span class="grade-na">—</span>`:`<span class="${gCls[grade(s)]}">${s} (${grade(s)})</span>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2400)}
const latestPrac=(n,e)=>PRAC.find(r=>r.staff_name===n&&r.equip===e);
const latestTheo=n=>THEO.find(r=>r.staff_name===n);
const plantLabel=p=>p==='2'?(LANG==='ko'?'2공장':'Planta 2'):(LANG==='ko'?'1공장':'Planta 1');

function judge(n){
  const th=latestTheo(n), sc=EQK.map(e=>{const p=latestPrac(n,e);return p?p.total:null});
  const done=sc.filter(x=>x!=null);
  const avg=done.length?Math.round(done.reduce((a,b)=>a+b,0)/done.length*10)/10:null;
  const cs=EQK.filter((e,i)=>sc[i]!=null&&sc[i]<70);
  let res;
  if(cs.length||(th&&th.score<CFG.theoryPass)) res='NG';
  else if(!th||done.length<EQK.length) res='NA';
  else if(Math.min(...sc)>=80) res='OK';
  else res='COND';
  return {th,sc,avg,res,cs};
}
const resPill=r=>({OK:`<span class="done-badge">✔ ${T('pass')}</span>`,COND:`<span class="pend-badge">△ ${T('cond')}</span>`,NG:`<span class="fail-badge">✖ ${T('fail')}</span>`,NA:`<span class="na-badge">${T('incomplete')}</span>`}[r]);
const thTag=th=>th?`<span class="score-t${th.score<CFG.theoryPass?' low':''}">${th.score}</span>`:`<span class="grade-na">—</span>`;

    <div class="muted">${plantLabel(s.plant)} ${s.emp_no?'· '+esc(s.emp_no):''} · ${T('avg')}: <b class="mono">${j.avg??'—'}</b>${j.cs.length?` · <span class="weak">${T('retrain')}: ${j.cs.map(eqShort).join(', ')}</span>`:''}</div>`;
  h+=`<h4 class="t">📝 ${T('theory')} ${j.th?thTag(j.th):''}</h4>`;
  if(j.th){
    const wrong=Q.map((q,i)=>({q,i,a:(j.th.answers||[])[i]})).filter(x=>x.a!==x.q.a);
    const li=LANG==='ko'?0:1;
    h+=`<div class="muted">${j.th.exam_date} · ${T('correct_cnt')} ${j.th.correct}/20 · ${j.th.lang==='ko'?'한국어':'Español'}</div>
      <div style="margin-top:0.5rem;font-size:0.8rem"><b>${T('wrong')}:</b> ${wrong.length?wrong.map(w=>`<div class="muted" style="margin-top:3px">Q${w.i+1}. ${esc(L(w.q))} → <span class="weak">${w.a==null?'—':esc(w.q.o[w.a][li])}</span> / ${T('answer')}: ${esc(w.q.o[w.q.a][li])}</div>`).join(''):T('none')}</div>
      <div style="margin-top:0.5rem;font-size:0.8rem"><b>Q21.</b> ${esc(L(Q21))}<div class="muted">${j.th.q21_choice?esc(Q21.o[j.th.q21_choice==='A'?0:1][li]):'—'} ${esc(j.th.q21_reason||'')}</div></div>`;
  } else h+=`<div class="muted">${T('no_data')}</div>`;
  EQK.forEach(k=>{
    const p=latestPrac(n,k), E=EQUIP[k];
    h+=`<h4>🛠️ ${L(E)} ${p?gTag(p.total):''} <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">${p?p.eval_date+(p.evaluator?' · '+esc(p.evaluator):''):''}</span></h4>`;
    if(!p){h+=`<div class="muted">${T('no_data')}</div>`;return}
    h+=`<table class="results-table"><thead><tr><th class="l">${T('item')}</th><th>${T('sc')}</th><th style="width:40%"></th></tr></thead><tbody>`+E.items.map((it,i)=>{
      const v=p.scores[i]??0, r=v/it.max, w=r<0.7;
      return `<tr><td class="l${w?' weak':''}">${L(it)}</td><td class="mono${w?' weak':''}">${v} / ${it.max}</td><td><div class="bar-track"><div class="bar-fill" style="width:${r*100}%;background:${w?'var(--red)':r>=0.9?'#f1c40f':r>=0.8?'var(--green)':'var(--blue)'}"></div></div></td></tr>`}).join('')+'</tbody></table>';
    const weak=E.items.filter((it,i)=>(p.scores[i]??0)/it.max<0.7).map(L);
    if(weak.length) h+=`<div class="weak" style="font-size:0.74rem;margin-top:0.4rem">⚠ ${T('weak')}: ${weak.join(', ')}</div>`;
  });
  document.getElementById('modalBody').innerHTML=h;
  document.getElementById('modal').classList.add('open');
}

let EX={on:false};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderTheory(){
  document.getElementById('exSub').textContent=(LANG==='ko'?'가공생산팀 '+PNAME.ko+' · ':'Producción de Corte · '+PNAME.es+' · ')+today();
  document.getElementById('exTags').innerHTML=`<span class="ex-tag">${T('q_tag')}</span><span class="ex-tag">${T('pass_tag').replace('{n}',CFG.theoryPass)}</span><span class="ex-tag">${T('pt_tag')}</span>`;
  onExName();
  renderQRSmall();
  if(EX.on) renderQ();
}
function onExName(){
  const n=document.getElementById('exName').value, s=STAFF.find(x=>x.name===n), box=document.getElementById('exInfo');
  if(s){box.style.display='block';box.textContent=s.name+(s.emp_no?' | '+s.emp_no:'')+' | '+plantLabel(s.plant)}else box.style.display='none';
}
function startExam(){
  const n=document.getElementById('exName').value; if(!n){alert(T('sel_name'));return}
  EX={on:true,name:n,cur:0,ans:Array(Q.length).fill(null),q21:null,q21r:'',order:Q.map(()=>CFG.shuffle?shuffle([0,1,2,3]):[0,1,2,3])};
  document.getElementById('exStart').classList.add('hide');
  document.getElementById('exResult').classList.add('hide');
  document.getElementById('exScreen').classList.remove('hide');
  document.getElementById('exWho').textContent=n;
  renderQ(); window.scrollTo(0,0);
}
const NQ=21;
function renderQ(){
  const li=LANG==='ko'?0:1, i=EX.cur, ko=LANG;
  document.getElementById('qCounter').textContent=`${T('question')} ${i+1} / ${NQ}`;
  if(i<20){
    const q=Q[i];
    document.getElementById('qText').textContent=`${i+1}. ${q[ko]}`;
    document.getElementById('qOpts').innerHTML=EX.order[i].map((oi,pos)=>`<button type="button" class="opt-btn${EX.ans[i]===oi?' selected':''}" onclick="pick(${oi})"><span class="onum">${ABCD[pos]}</span><span class="otxt">${esc(q.o[oi][li])}</span></button>`).join('');
  } else {
    document.getElementById('qText').textContent=`21. ${Q21[ko]}`;
    document.getElementById('qOpts').innerHTML=Q21.o.map((o,k)=>`<button type="button" class="opt-btn${EX.q21===ABCD[k]?' selected':''}" onclick="pick21('${ABCD[k]}')"><span class="onum">${ABCD[k]}</span><span class="otxt">${esc(o[li])}</span></button>`).join('')
      +`<textarea class="q21r" id="q21r" placeholder="${T('q21_hint')}" oninput="EX.q21r=this.value">${esc(EX.q21r)}</textarea>`;
  }
  const answered=k=>k<20?EX.ans[k]!=null:!!EX.q21;
  document.getElementById('qDots').innerHTML=Array.from({length:NQ},(_,k)=>`<span class="a-dot${answered(k)?' answered':''}${k===i?' current':''}" onclick="goQ(${k})">${k+1}</span>`).join('');
  document.getElementById('qNav').innerHTML=`<button class="btn-prev" onclick="goQ(${i-1})"${i===0?' disabled':''}>${T('prev')}</button>`+
    (i<NQ-1?`<button class="btn-next" onclick="goQ(${i+1})">${T('next')}</button>`:`<button class="btn-submit" onclick="submitExam()">${T('submit')}</button>`);
  const n=EX.ans.filter(x=>x!=null).length+(EX.q21?1:0);
  document.getElementById('exCnt').textContent=`${n}/${NQ}`;
  document.getElementById('exBar').style.width=(n/NQ*100)+'%';
}
function goQ(k){if(k<0||k>=NQ)return;EX.cur=k;renderQ();window.scrollTo(0,document.getElementById('exScreen').offsetTop-70)}
function pick(oi){EX.ans[EX.cur]=oi;renderQ();if(EX.cur<NQ-1)setTimeout(()=>goQ(EX.cur+1),250)}
function pick21(c){EX.q21=c;renderQ();setTimeout(()=>{const t=document.getElementById('q21r');if(t)t.focus()},50)}
function cancelExam(){if(!confirm(T('cancel_confirm')))return;EX={on:false};resetExamView()}
function resetExamView(){document.getElementById('exStart').classList.remove('hide');document.getElementById('exScreen').classList.add('hide');document.getElementById('exResult').classList.add('hide');document.getElementById('exName').value='';onExName();window.scrollTo(0,0)}
async function submitExam(){
  const miss=EX.ans.map((a,i)=>a==null?i:-1).filter(i=>i>=0); if(!EX.q21) miss.push(20);
  if(miss.length){alert(T('unanswered_confirm')+` (${miss.map(i=>i+1).join(', ')})`);goQ(miss[0]);return}
  const correct=EX.ans.filter((a,i)=>a===Q[i].a).length, score=correct*5;
  const rec={staff_name:EX.name,lang:LANG,answers:EX.ans,correct,score,q21_choice:EX.q21,q21_reason:EX.q21r,exam_date:today()};
  try{const r=await sb(TB.theory+'',{method:'POST',body:JSON.stringify(rec)});THEO.unshift(r[0])}catch(e){alert(T('err')+': '+e.message);return}
  const ok=score>=CFG.theoryPass, g=grade(score), ko=LANG==='ko';
  document.getElementById('exScreen').classList.add('hide');
  document.getElementById('exResult').classList.remove('hide');
  document.getElementById('exResultCard').innerHTML=`<div style="font-size:3rem">${ok?'✅':'📚'}</div>
    <div class="done-title" style="color:${ok?'var(--green)':'var(--red)'}">${ok?(ko?'합격':'Aprobado'):(ko?'불합격':'Reprobado')}</div>
    <div class="muted">${esc(EX.name)}</div>
    <div class="done-score" style="color:${ok?'var(--green)':'var(--red)'}">${score}</div>
    <span class="${ok?gCls[g]:'grade-fail'}">${g}</span>
    <div class="done-msg">${ko?'정답':'Correctas'} ${correct} / 20<br>${ok?'':(ko?'교육 후 재시험 대상입니다.':'Debe recapacitarse y presentar de nuevo.')}<br>${ko?'21번 서술형은 평가자가 확인합니다.':'La pregunta 21 la revisa el evaluador.'}</div>
    <button class="btn-start" onclick="EX={on:false};resetExamView()">${T('next_person')}</button>`;
  window.scrollTo(0,0); EX.on=false;
}
function examUrl(){
  // 로컬 파일(file://)로 열었을 때는 휴대폰이 접근할 수 없으므로 GitHub Pages 주소로 QR 생성

let PR={scores:[],editId:null};
function renderPrac(){
  const k=document.getElementById('prEquip').value, E=EQUIP[k];

  if(PR.equip!==k){PR.scores=E.items.map(()=>null);PR.equip=k}
  document.getElementById('prEqTitle').innerHTML=`📋 ${esc(L(E))} — ${E.items.length}${LANG==='ko'?'개 항목 · 100점':' rubros · 100 pts'}`;
  document.getElementById('prTable').innerHTML=`<thead><tr><th style="width:40px">No</th><th class="l">${T('item')} / ${T('crit')}</th><th class="l">${T('method')}</th><th style="width:90px">${T('sc')}</th></tr></thead><tbody>`+
   E.items.map((it,i)=>{const pts=lvPts(it.max), lab=LV[it.lv][LANG]||LV[it.lv].ko;
    return `<tr><td class="mono">${i+1}</td><td class="l"><b>${esc(L(it))}</b> <span class="muted">(${it.max})</span><div class="crit">${it.c.map(c=>'▷ '+esc(L(c))).join('<br>')}</div></td>
     <td class="l"><div class="lv">${pts.map((p,x)=>lab[x]==='-'?'':`<button type="button" data-p="${p}" class="${PR.scores[i]===p?'on':''}" onclick="setSc(${i},${p})"><b>${p}</b>${esc(lab[x])}</button>`).join('')}</div></td>
     <td><input type="number" class="sc-in" min="0" max="${it.max}" value="${PR.scores[i]??''}" oninput="setSc(${i},this.value===''?null:+this.value,true)" id="ps${i}"></td></tr>`}).join('')+'</tbody>';

function setSc(i,v,fromInput){
  const max=EQUIP[PR.equip].items[i].max;
  if(v!=null) v=Math.max(0,Math.min(max,Math.round(v)));
  PR.scores[i]=v;
  const inp=document.getElementById('ps'+i); if(!fromInput) inp.value=v??'';
  inp.closest('tr').querySelectorAll('.lv button').forEach(b=>b.classList.toggle('on',+b.dataset.p===v));
  updTot();
}
function updTot(){
  const t=PR.scores.reduce((a,b)=>a+(b||0),0), full=PR.scores.every(x=>x!=null);
  document.getElementById('prTot').textContent=t;
  document.getElementById('prGrade').innerHTML=full?gTag(t)+' '+(t>=80?`<span class="done-badge">✔ ${T('pass')}</span>`:t>=70?`<span class="pend-badge">△ ${T('cond')}</span>`:`<span class="fail-badge">✖ ${T('fail')}</span>`):`<span class="muted">${PR.scores.filter(x=>x!=null).length} / ${PR.scores.length}</span>`;
  const tag=document.getElementById('prEditTag');tag.classList.toggle('hide',!PR.editId);tag.textContent='✏️ '+T('editing')+' #'+(PR.editId||'');
}

async function saveCfg(){
  CFG={theoryPass:+document.getElementById('cfPass').value||70,shuffle:document.getElementById('cfShuffle').value==='1'};
  try{await sb(TB.config+'',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify({key:'settings',value:CFG})});toast(T('saved'))}catch(e){alert(T('err')+': '+e.message)}
}

(async()=>{
  if(EXAM_ONLY){document.body.classList.add('exam-only');document.getElementById('appHeader').classList.add('hide');document.getElementById('examLinkBox').classList.add('hide');if(!localStorage.getItem('mcert_lang'))LANG='es';}
  applyLang();

})();
