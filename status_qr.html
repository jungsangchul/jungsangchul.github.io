<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mi estado · 내 기록</title>
<style>
  :root{--navy:#0c2444;--ink:#0b1220;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--line:#e2e8f0;--muted:#64748b;--field:#f1f5f9}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#0b1220;overflow:hidden;-webkit-user-select:none;user-select:none}
  .app{height:100dvh;display:flex;flex-direction:column;background:#f3f6fb}
  header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:calc(14px + env(safe-area-inset-top))}
  header .brand{font-weight:800;letter-spacing:.4px;font-size:15px}
  header .sub{font-size:12px;opacity:.75;font-weight:600}
  main{flex:1;position:relative;overflow:hidden}
  .panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;gap:16px;opacity:0;pointer-events:none;transition:opacity .18s;background:#f3f6fb}
  .panel.active{opacity:1;pointer-events:auto}
  .panel.scroll{justify-content:flex-start;overflow-y:auto}
  .big{font-size:26px;font-weight:800;color:var(--ink)}
  .field{width:100%;max-width:360px;border:2px solid var(--line);border-radius:16px;background:var(--field);padding:18px 20px;font-size:22px;font-weight:800;text-align:center;letter-spacing:1px;text-transform:uppercase;color:var(--ink);outline:none}
  .field:focus{border-color:var(--navy);background:#fff}
  .btn{width:100%;max-width:360px;border:none;border-radius:16px;padding:16px;font-size:17px;font-weight:800;color:#fff;background:var(--navy);cursor:pointer}
  .btn.ghost{background:#e8eef7;color:var(--navy)}
  .btn:active{transform:scale(.98)}
  .footlink{font-size:13px;color:var(--muted);font-weight:600;background:none;border:none;text-decoration:underline;cursor:pointer}
  .spin{width:60px;height:60px;border-radius:50%;border:6px solid #dbe3ee;border-top-color:var(--navy);animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .step{font-size:14px;font-weight:600;color:var(--muted);min-height:18px}

  .result{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;margin-top:6px}
  .who{display:flex;flex-direction:column;align-items:center;gap:3px;margin-bottom:2px}
  .who .nm{font-size:24px;font-weight:800;color:var(--ink)}
  .who .id{font-size:13px;color:var(--muted);font-weight:600}
  .who .dt{font-size:13px;color:var(--navy);font-weight:700}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;box-shadow:0 6px 18px -12px rgba(12,36,68,.35)}
  .card .ch{font-size:12px;font-weight:800;color:var(--navy);letter-spacing:.3px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .card .ch::before{content:"";width:4px;height:14px;border-radius:3px;background:var(--navy)}
  .srow{display:flex;align-items:center;gap:12px;padding:8px 0}
  .srow+.srow{border-top:1px solid #f1f5f9}
  .ico{width:38px;height:38px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center}
  .ico svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .ico.g{background:#e7f7ee;color:#15a34a}.ico.a{background:#fdf1e1;color:#d97706}.ico.n{background:#eef1f6;color:#94a3b8}.ico.t{background:#e4f6f2;color:#0d8276}
  .sinfo{flex:1;min-width:0}
  .sinfo .lab{font-size:12px;color:var(--muted);font-weight:700}
  .sinfo .val{font-size:16px;font-weight:800;color:var(--ink);margin-top:1px}
  .sinfo .val.muted{color:#94a3b8;font-weight:700}
  .badge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;flex:none}
  .badge.g{background:#dcfce7;color:#15803d}.badge.a{background:#fef3c7;color:#92400e}.badge.n{background:#eef1f6;color:#64748b}
  .acts{display:flex;flex-direction:column;gap:10px;width:100%;max-width:360px;margin-top:6px}

  .hwrap{width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px}
  .seg{display:flex;gap:4px;background:#e8eef7;padding:4px;border-radius:12px}
  .seg button{flex:1;border:none;background:transparent;border-radius:9px;padding:9px;font-weight:800;font-size:13px;color:#64748b;cursor:pointer}
  .seg button.active{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(12,36,68,.15)}
  .hlist{display:flex;flex-direction:column;gap:7px;max-height:58vh;overflow-y:auto}
  .hrow{display:grid;grid-template-columns:70px 1fr 1fr 34px;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .hrow .hd{font-weight:800;color:var(--navy);font-size:13px;line-height:1.1}
  .hrow .hd small{display:block;color:#94a3b8;font-weight:700;font-size:11px}
  .hcell{font-size:14px;font-weight:800;color:var(--ink);line-height:1.1}
  .hcell small{color:#94a3b8;font-weight:600;display:block;font-size:10px}
  .hcell.muted{color:#cbd5e1}.hcell.late{color:#b91c1c}.hcell.early{color:#92400e}
  .hmeal{text-align:center;font-size:18px;font-weight:900}
  .hempty{text-align:center;color:#94a3b8;font-weight:600;padding:26px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="brand">Mi estado</div>
      <div class="sub">내 기록 확인 · YURA HARNESS MÉXICO</div>
    </div>
  </header>
  <main>
    <section class="panel active" id="p-init"><div class="spin"></div><div class="step">Cargando…</div></section>

    <section class="panel" id="p-id">
      <div class="big">Número de empleado</div>
      <div class="step">사번 입력</div>
      <input class="field" id="idInput" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="M026…">
      <button class="btn" id="idBtn">Consultar · 조회</button>
      <div class="step" id="idMsg" style="color:var(--bad)"></div>
    </section>

    <section class="panel scroll" id="p-result">
      <div class="result">
        <div class="who">
          <div class="nm" id="rName">—</div>
          <div class="id" id="rId">—</div>
          <div class="dt" id="rDate">—</div>
        </div>

        <div class="card">
          <div class="ch">Asistencia · 출퇴근</div>
          <div class="srow">
            <span class="ico n" id="inIco"><svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg></span>
            <div class="sinfo"><div class="lab">Entrada · 출근</div><div class="val" id="vIn">—</div></div>
            <span class="badge n" id="bIn" style="display:none"></span>
          </div>
          <div class="srow">
            <span class="ico n" id="outIco"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>
            <div class="sinfo"><div class="lab">Salida · 퇴근</div><div class="val" id="vOut">—</div></div>
            <span class="badge n" id="bOut" style="display:none"></span>
          </div>
        </div>

        <div class="card">
          <div class="ch">Comida · 식사</div>
          <div class="srow">
            <span class="ico n" id="mealIco"><svg viewBox="0 0 24 24"><path d="M3 11h18"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M10 4c0 1-1 1-1 2.5"/><path d="M14 4c0 1-1 1-1 2.5"/></svg></span>
            <div class="sinfo"><div class="lab">Solicitud · 신청</div><div class="val" id="vMeal">—</div></div>
            <span class="badge n" id="bMeal" style="display:none"></span>
          </div>
        </div>

        <div class="acts">
          <button class="btn" id="refreshBtn">Actualizar · 새로고침</button>
          <button class="btn ghost" id="histBtn">Historial · 이력 (주/월)</button>
          <button class="btn ghost" id="changeId">Cambiar empleado · 사번 변경</button>
        </div>
      </div>
    </section>

    <section class="panel scroll" id="p-history">
      <div class="hwrap">
        <div class="who"><div class="nm" id="hName">—</div><div class="id" id="hPeriod">—</div></div>
        <div class="seg">
          <button id="segWeek" class="active" onclick="loadHistory('week')">Semana · 이번 주</button>
          <button id="segMonth" onclick="loadHistory('month')">Mes · 이번 달</button>
        </div>
        <div class="hlist" id="hList"></div>
        <button class="btn ghost" id="histBack" style="margin-top:2px">← Volver · 돌아가기</button>
      </div>
    </section>

    <section class="panel" id="p-bad">
      <div class="big" id="badT" style="color:var(--bad)">Error</div>
      <div class="step" id="badM">—</div>
      <button class="btn" id="badRetry" style="max-width:280px">Reintentar · 다시</button>
    </section>
  </main>
</div>

<script>
const CONFIG = {
  SUPABASE_URL:  "https://lrjurjhavlalhlwaplxd.supabase.co",
  SUPABASE_ANON: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyanVyamhhdmxhbGhsd2FwbHhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNzUxNDAsImV4cCI6MjA5NTY1MTE0MH0.DVFmZaT37R9CXSMHdnLx4YAVNTnlBGijkOIaoUo7Qsk",
  T_EMPLOYEES:"att_employees", T_RECORDS:"attendance_records", T_MEALS:"meal_requests",
  PLACES: { "1":{ko:"1공장",es:"Planta 1"}, "lib":{ko:"도서관",es:"Biblioteca"} },
  TZ_OFFSET_HOURS:-6
};

const $=id=>document.getElementById(id);
const REST=p=>CONFIG.SUPABASE_URL+"/rest/v1/"+p;
const HEADERS={ "apikey":CONFIG.SUPABASE_ANON, "Authorization":"Bearer "+CONFIG.SUPABASE_ANON };
let me=null;

function show(id){ document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active")); $(id).classList.add("active"); }
function placeName(fk){ const p=CONFIG.PLACES[fk]; return p?p.es:(fk?String(fk):"—"); }
function todayDate(){ const n=new Date(); const l=new Date(n.getTime()+CONFIG.TZ_OFFSET_HOURS*3600*1000); return l.toISOString().slice(0,10); }
function todayLabel(){ const d=todayDate().split("-"); return `${d[0]}.${d[1]}.${d[2]}`; }
function todayStartISO(){ const n=new Date(); const l=new Date(n.getTime()+CONFIG.TZ_OFFSET_HOURS*3600*1000); l.setUTCHours(0,0,0,0); return new Date(l.getTime()-CONFIG.TZ_OFFSET_HOURS*3600*1000).toISOString(); }
function hhmm(iso){ const dt=new Date(new Date(iso).getTime()+CONFIG.TZ_OFFSET_HOURS*3600*1000); return String(dt.getUTCHours()).padStart(2,"0")+":"+String(dt.getUTCMinutes()).padStart(2,"0"); }

async function getJson(url){ const r=await fetch(url,{headers:HEADERS}); if(!r.ok) throw new Error(await r.text()); return r.json(); }
function reject(msg){ $("badM").textContent=msg; show("p-bad"); }

function init(){
  const saved=localStorage.getItem("yura_att_me");
  if(saved){ try{ me=JSON.parse(saved); }catch(e){ me=null; } }
  if(me && me.employee_id) loadStatus();
  else { show("p-id"); setTimeout(()=>$("idInput").focus(),200); }
}

$("idBtn").onclick=verifyId;
$("idInput").addEventListener("keydown",e=>{ if(e.key==="Enter") verifyId(); });
async function verifyId(){
  const id=$("idInput").value.trim().toUpperCase(); $("idMsg").textContent="";
  if(!id){ $("idMsg").textContent="Ingrese su número · 사번을 입력하세요"; return; }
  $("idBtn").disabled=true; $("idBtn").textContent="…";
  try{
    const rows=await getJson(REST(`${CONFIG.T_EMPLOYEES}?employee_id=eq.${encodeURIComponent(id)}&select=employee_id,name,name_ko&limit=1`));
    if(!Array.isArray(rows)||rows.length===0){ $("idMsg").textContent="No registrado · 등록되지 않은 사번"; return; }
    me={employee_id:rows[0].employee_id, name:rows[0].name||rows[0].employee_id, name_ko:rows[0].name_ko||""};
    localStorage.setItem("yura_att_me",JSON.stringify(me));
    loadStatus();
  }catch(e){ $("idMsg").textContent="Error de red · 통신 오류"; }
  finally{ $("idBtn").disabled=false; $("idBtn").textContent="Consultar · 조회"; }
}
$("changeId").onclick=()=>{ localStorage.removeItem("yura_att_me"); me=null; $("idInput").value=""; show("p-id"); setTimeout(()=>$("idInput").focus(),150); };
$("refreshBtn").onclick=loadStatus;
$("badRetry").onclick=loadStatus;

function setRow(icoId,valId,badId, icoClass, valText, valMuted, badClass, badText){
  $(icoId).className="ico "+icoClass;
  const v=$(valId); v.textContent=valText; v.className="val"+(valMuted?" muted":"");
  const b=$(badId);
  if(badText){ b.style.display=""; b.className="badge "+badClass; b.textContent=badText; }
  else b.style.display="none";
}

async function loadStatus(){
  show("p-init");
  try{
    const [att,meal]=await Promise.all([
      getJson(REST(`${CONFIG.T_RECORDS}?employee_id=eq.${encodeURIComponent(me.employee_id)}&created_at=gte.${todayStartISO()}&select=type,factory,flag,created_at&order=created_at.asc&limit=50`)),
      getJson(REST(`${CONFIG.T_MEALS}?employee_id=eq.${encodeURIComponent(me.employee_id)}&meal_date=eq.${todayDate()}&select=status,factory,created_at&limit=1`))
    ]);
    $("rName").textContent = me.name_ko ? `${me.name} (${me.name_ko})` : me.name;
    $("rId").textContent = me.employee_id;
    $("rDate").textContent = todayLabel();

    const ins=(att||[]).filter(r=>r.type==="in");
    const outs=(att||[]).filter(r=>r.type==="out");
    const firstIn=ins[0], lastOut=outs[outs.length-1];

    // 출근
    if(firstIn){
      const late=firstIn.flag==="late";
      setRow("inIco","vIn","bIn", late?"a":"g",
        `${hhmm(firstIn.created_at)} · ${placeName(firstIn.factory)}`, false,
        late?"a":"g", late?"Tarde · 지각":"A tiempo · 정상");
    } else {
      setRow("inIco","vIn","bIn","n","Sin registro · 미출근",true,"n","");
    }
    // 퇴근
    if(lastOut){
      const early=lastOut.flag==="early";
      setRow("outIco","vOut","bOut", early?"a":"g",
        `${hhmm(lastOut.created_at)} · ${placeName(lastOut.factory)}`, false,
        early?"a":"g", early?"Anticipada · 조퇴":"A tiempo · 정상");
    } else {
      setRow("outIco","vOut","bOut","n","Pendiente · 미퇴근",true,"n","");
    }
    // 식사
    const m=(meal&&meal[0])?meal[0]:null;
    if(m && m.status==="applied"){
      setRow("mealIco","vMeal","bMeal","t",
        `${placeName(m.factory)} · ${hhmm(m.created_at)}`, false, "g","Solicitada · 신청완료");
    } else if(m && m.status==="canceled"){
      setRow("mealIco","vMeal","bMeal","n","—",true,"a","Cancelada · 취소됨");
    } else {
      setRow("mealIco","vMeal","bMeal","n","No solicitada · 미신청",true,"n","");
    }

    show("p-result");
  }catch(e){ reject("No se pudo consultar · 조회 실패"); console.error(e); }
}

const WD_ES=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
function localDateStr(iso){ return new Date(new Date(iso).getTime()+CONFIG.TZ_OFFSET_HOURS*3600000).toISOString().slice(0,10); }
function periodStart(period){
  const n=new Date(); const l=new Date(n.getTime()+CONFIG.TZ_OFFSET_HOURS*3600000);
  const y=l.getUTCFullYear(), mo=l.getUTCMonth(), d=l.getUTCDate();
  let startLocal;
  if(period==="month") startLocal=Date.UTC(y,mo,1);
  else { const dow=(l.getUTCDay()+6)%7; startLocal=Date.UTC(y,mo,d)-dow*86400000; }
  return { iso:new Date(startLocal - CONFIG.TZ_OFFSET_HOURS*3600000).toISOString(), ds:new Date(startLocal).toISOString().slice(0,10) };
}
$("histBtn").onclick=openHistory;
$("histBack").onclick=()=>show("p-result");
function openHistory(){ $("hName").textContent = me.name_ko?`${me.name} (${me.name_ko})`:me.name; loadHistory("week"); }
async function loadHistory(period){
  $("segWeek").classList.toggle("active",period==="week"); $("segMonth").classList.toggle("active",period==="month");
  $("hPeriod").textContent = period==="week" ? "이번 주 · Semana" : "이번 달 · Mes";
  $("hList").innerHTML='<div class="hempty">Cargando… · 불러오는 중…</div>'; show("p-history");
  const {iso,ds}=periodStart(period);
  try{
    const [att,meal]=await Promise.all([
      getJson(REST(`${CONFIG.T_RECORDS}?employee_id=eq.${encodeURIComponent(me.employee_id)}&created_at=gte.${iso}&select=type,flag,created_at&order=created_at.asc&limit=500`)),
      getJson(REST(`${CONFIG.T_MEALS}?employee_id=eq.${encodeURIComponent(me.employee_id)}&meal_date=gte.${ds}&select=status,meal_date&limit=200`))
    ]);
    const map={};
    (att||[]).forEach(r=>{ const dt=localDateStr(r.created_at); map[dt]=map[dt]||{};
      if(r.type==="in"){ if(!map[dt].in){ map[dt].in=r.created_at; map[dt].inFlag=r.flag; } }
      if(r.type==="out"){ map[dt].out=r.created_at; map[dt].outFlag=r.flag; } });
    (meal||[]).forEach(m=>{ map[m.meal_date]=map[m.meal_date]||{}; map[m.meal_date].meal=m.status; });
    const dates=Object.keys(map).sort().reverse();
    if(!dates.length){ $("hList").innerHTML='<div class="hempty">Sin registros · 기록 없음</div>'; return; }
    $("hList").innerHTML=dates.map(dt=>{
      const o=map[dt]; const p=dt.split("-"); const wd=WD_ES[new Date(dt+"T00:00:00Z").getUTCDay()];
      const inC=o.in?`<div class="hcell ${o.inFlag==='late'?'late':''}">${hhmm(o.in)}<small>${o.inFlag==='late'?'지각':'출근'}</small></div>`:'<div class="hcell muted">—<small>출근</small></div>';
      const outC=o.out?`<div class="hcell ${o.outFlag==='early'?'early':''}">${hhmm(o.out)}<small>${o.outFlag==='early'?'조퇴':'퇴근'}</small></div>`:'<div class="hcell muted">—<small>퇴근</small></div>';
      const meal=o.meal==="applied"?'<div class="hmeal" style="color:#15a34a">✓</div>':'<div class="hmeal" style="color:#dbe3ee">·</div>';
      return `<div class="hrow"><div class="hd">${p[1]}.${p[2]}<small>${wd}</small></div>${inC}${outC}${meal}</div>`;
    }).join("");
  }catch(e){ $("hList").innerHTML='<div class="hempty">Error · 조회 실패</div>'; console.error(e); }
}

init();
</script>
</body>
</html>
