<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>치구 보관함 조회 · Plant 2 | Consulta de Ubicación</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#0B0C0F; --panel:#141519; --panel2:#1B1D23; --line:#26282F; --line2:#33363F;
  --txt:#E6E3DC; --dim:#8A8D96; --gold:#D9A62E; --accent:#8B7CF6;
  --teal:#4FC8B8; --red:#E05B5B; --green:#57C878; --ink:#0B0C0F;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:'Noto Sans KR',sans-serif;min-height:100vh}
.mono{font-family:'Nanum Gothic Coding',monospace}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 60px}

/* ===== top bar (portal style) ===== */
.topbar{display:flex;align-items:center;gap:14px;padding:16px 2px 12px;border-bottom:1px solid var(--line)}
.brand{font-family:'Nanum Gothic Coding',monospace;font-weight:700;font-size:13px;letter-spacing:.28em;color:var(--txt)}
.brand small{display:block;font-size:12px;letter-spacing:.2em;color:var(--dim);font-weight:400;margin-top:2px}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.tbtn{font-family:'Nanum Gothic Coding',monospace;font-size:12px;letter-spacing:.12em;background:var(--panel);
  border:1px solid var(--line2);color:var(--dim);padding:8px 14px;border-radius:4px;cursor:pointer;text-decoration:none}
.tbtn:hover{color:var(--txt);border-color:var(--gold)}
.tbtn.gold{color:var(--gold);border-color:var(--gold)}

/* module header */
.modhead{display:flex;align-items:flex-end;gap:14px;padding:22px 2px 14px;border-bottom:2px solid var(--accent)}
.plantdot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-bottom:9px}
.modhead .mod{font-family:'Nanum Gothic Coding',monospace;font-size:12px;letter-spacing:.25em;color:var(--dim)}
.modhead h1{font-size:22px;font-weight:900;letter-spacing:-.01em;line-height:1.15}
.modhead .sub{font-family:'Nanum Gothic Coding',monospace;font-size:12px;letter-spacing:.22em;color:var(--dim);margin-top:3px}
.plant-badge{margin-left:auto;font-family:'Nanum Gothic Coding',monospace;font-weight:700;font-size:14px;
  letter-spacing:.15em;color:var(--accent);border:1px solid var(--accent);padding:7px 14px;border-radius:4px;margin-bottom:2px}
.count-chip{font-family:'Nanum Gothic Coding',monospace;font-size:12px;color:var(--dim);letter-spacing:.08em;
  background:var(--panel);border:1px solid var(--line2);padding:7px 12px;border-radius:4px;margin-bottom:2px}
.count-chip b{color:var(--teal)}

/* tabs */
.tabs{display:flex;gap:8px;margin:16px 0}
.tab{flex:1;padding:12px;background:var(--panel);border:1px solid var(--line2);color:var(--dim);font-weight:700;
  font-size:14px;cursor:pointer;border-radius:5px;font-family:inherit}
.tab .es{font-family:'Nanum Gothic Coding',monospace;font-weight:400;font-size:12px;letter-spacing:.12em;opacity:.7}
.tab.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.tab.on .es{opacity:.75}
.page{display:none}
.page.on{display:block}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;margin-bottom:12px}
.flabel{font-family:'Nanum Gothic Coding',monospace;font-size:12px;color:var(--dim);font-weight:700;display:block;
  margin-bottom:8px;letter-spacing:.22em}
.scan-row{display:flex;gap:8px;position:relative}
input[type=text],input[type=number]{background:var(--bg);border:1.5px solid var(--line2);border-radius:5px;color:var(--txt);
  padding:12px 14px;font-size:16px;font-family:'Nanum Gothic Coding',monospace;outline:none;width:100%}
input:focus{border-color:var(--gold)}
.btn{padding:12px 22px;border:none;border-radius:5px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line2)}
.btn-red{background:var(--red);color:#fff}
.btn:disabled{opacity:.35;cursor:not-allowed}
.hint{font-size:12px;color:var(--dim);margin-top:9px}

/* autocomplete */
.ac{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel2);border:1px solid var(--gold);
  border-radius:5px;z-index:50;max-height:320px;overflow-y:auto;display:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.ac.show{display:block}
.ac-item{padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item.sel{background:rgba(217,166,46,.12)}
.ac-item .n{font-family:'Barlow Condensed';font-weight:700;font-size:19px;color:var(--gold);min-width:52px}
.ac-item .c{font-family:'Nanum Gothic Coding',monospace;font-size:13px;font-weight:700}
.ac-item .b{font-family:'Nanum Gothic Coding',monospace;font-size:12px;color:var(--dim);letter-spacing:.05em}
.ac-item .w{margin-left:auto;font-family:'Nanum Gothic Coding',monospace;font-size:12px;color:var(--teal)}

/* bin tag result */
.tag{position:relative;background:var(--gold);color:var(--ink);border-radius:8px;padding:24px 22px 18px;margin-bottom:10px}
.tag::before{content:"";position:absolute;top:13px;left:50%;transform:translateX(-50%);width:40px;height:8px;
  background:var(--bg);border-radius:4px}
.tag-top{display:flex;justify-content:space-between;align-items:flex-start;margin-top:8px}
.tag-no{font-family:'Barlow Condensed';font-weight:700;font-size:78px;line-height:1}
.tag-no small{font-size:15px;display:block;font-weight:600;letter-spacing:.15em;opacity:.6}
.tag-loc{text-align:right}
.tag-loc .loc{font-family:'Barlow Condensed';font-weight:700;font-size:46px;line-height:1.05}
.tag-loc small{display:block;font-size:12px;font-weight:700;opacity:.6;letter-spacing:.15em}
.tag-mid{border-top:2px dashed rgba(11,12,15,.35);margin-top:14px;padding-top:12px;display:flex;flex-wrap:wrap;gap:6px 24px}
.tag-mid .kv small{display:block;font-size:12px;font-weight:700;opacity:.55;letter-spacing:.12em}
.tag-mid .kv span{font-family:'Nanum Gothic Coding',monospace;font-weight:700;font-size:14px}

/* print settings */
.print-set{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.print-set .fld{width:110px}
.print-set .fld input{padding:10px 12px;font-size:14px}
.print-set .flabel{margin-bottom:5px}

.multi-note{font-size:12px;color:var(--gold);margin:4px 2px 8px;font-weight:700}
.result-list{display:flex;flex-direction:column;gap:8px}
.rrow{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:5px;
  padding:12px 14px;display:flex;align-items:center;gap:14px;cursor:pointer}
.rrow:hover{background:var(--panel2)}
.rrow .no{font-family:'Barlow Condensed';font-weight:700;font-size:28px;color:var(--gold);min-width:74px}
.rrow .code{font-family:'Nanum Gothic Coding',monospace;font-size:14px;font-weight:700}
.rrow .sub{font-size:12px;color:var(--dim);margin-top:2px;font-family:'Nanum Gothic Coding',monospace}
.rrow .where{margin-left:auto;text-align:right}
.rrow .where b{color:var(--teal);font-size:16px;font-family:'Nanum Gothic Coding',monospace}
.rrow .where small{display:block;color:var(--dim);font-size:12px;font-family:'Nanum Gothic Coding',monospace}
.empty{background:var(--panel);border:1px dashed var(--line2);border-radius:6px;padding:28px;text-align:center;color:var(--dim);font-size:14px}
.empty b{color:var(--red)}

/* master */
textarea{width:100%;min-height:170px;background:var(--bg);border:1.5px solid var(--line2);border-radius:5px;color:var(--txt);
  padding:12px;font-size:12px;font-family:'Nanum Gothic Coding',monospace;outline:none;resize:vertical}
textarea:focus{border-color:var(--gold)}
.mrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pill{font-family:'Nanum Gothic Coding',monospace;font-size:12px;background:var(--panel2);border:1px solid var(--line2);
  color:var(--dim);padding:5px 9px;border-radius:3px;letter-spacing:.04em}
.preview-wrap{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:5px;max-height:340px;overflow-y:auto}
table.grid{width:100%;border-collapse:collapse;font-size:12px;min-width:720px}
.grid th{background:var(--panel2);color:var(--dim);text-align:left;padding:8px;position:sticky;top:0;
  font-family:'Nanum Gothic Coding',monospace;font-size:12px;letter-spacing:.1em;z-index:2}
.grid td{padding:7px 8px;border-top:1px solid var(--line);font-family:'Nanum Gothic Coding',monospace;font-size:12px}
.grid td.k{color:var(--gold);font-weight:700}
.msg{margin-top:10px;padding:10px 12px;border-radius:5px;font-size:13px;font-weight:700;display:none}
.msg.ok{display:block;background:rgba(87,200,120,.1);color:var(--green);border:1px solid rgba(87,200,120,.35)}
.msg.err{display:block;background:rgba(224,91,91,.1);color:var(--red);border:1px solid rgba(224,91,91,.35)}
.sec-title{font-size:14px;font-weight:900;margin:22px 0 8px}
.sec-title span{font-family:'Nanum Gothic Coding',monospace;color:var(--dim);font-weight:400;font-size:12px;
  letter-spacing:.18em;margin-left:8px}
.mtools{display:flex;gap:8px;margin-bottom:8px}
.mtools input{flex:1;font-size:13px;padding:10px 12px}
.del-btn{background:none;border:none;color:var(--red);cursor:pointer;font-size:14px;padding:2px 6px}
.loading{display:inline-block;width:14px;height:14px;border:2px solid var(--dim);border-top-color:var(--gold);
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ===== label preview (화면) — 인쇄는 전용 iframe에서 수행, 동일 구조 ===== */
.lblbox .l2row{display:flex;align-items:center;justify-content:center;gap:0.8em}
.lblbox .lbl2{display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-sizing:border-box;background:#fff;color:#000;overflow:hidden;
  font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-weight:900;line-height:1;white-space:nowrap;
  outline:1px dashed #C8C8C8}   /* 화면에서만 경계 안내선 (인쇄에는 없음) */
.lblbox{background:#fff;border-radius:6px;padding:14px;display:inline-block;margin-bottom:16px;max-width:100%;overflow-x:auto}
.lbl-preview-label{font-family:'Nanum Gothic Coding',monospace;font-size:12px;color:var(--dim);
  letter-spacing:.2em;font-weight:700;margin-bottom:6px}

.tag-loc .pos{font-family:'Nanum Gothic Coding',monospace;font-weight:700;font-size:14px;margin-top:6px;opacity:.75}

@media(max-width:600px){
  .wrap{padding:0 12px 50px}
  .topbar{flex-wrap:wrap;gap:10px}
  .brand{font-size:12px;letter-spacing:.16em}
  .brand small{font-size:12px;letter-spacing:.12em}
  .top-right{margin-left:auto}
  .tbtn{padding:7px 10px;font-size:12px}
  .modhead{flex-wrap:wrap;gap:10px;padding:16px 2px 12px}
  .modhead h1{font-size:18px}
  .modhead .mod,.modhead .sub{font-size:12px;letter-spacing:.15em}
  .plant-badge{margin-left:0;font-size:12px;padding:6px 11px}
  .count-chip{font-size:12px;padding:6px 9px}
  .tab{padding:11px 8px;font-size:13px}
  .panel{padding:14px}
  .scan-row{flex-wrap:nowrap}
  .scan-row .btn{padding:12px 14px;flex-shrink:0}
  input[type=text]{font-size:15px;padding:11px 12px;min-width:0}
  /* 태그: 세로 배치로 전환 */
  .tag{padding:20px 16px 14px}
  .tag-top{flex-direction:column;gap:16px;margin-top:10px}
  .tag-no{font-size:58px}
  .tag-no small{font-size:13px}
  .tag-loc{text-align:left}
  .tag-loc .loc{font-size:40px;word-break:break-all}
  .tag-loc .pos{font-size:13px}
  .tag-mid{gap:8px 18px;padding-top:10px}
  .tag-mid .kv span{font-size:13px;word-break:break-all}
  /* 결과 목록 */
  .rrow{flex-wrap:wrap;gap:8px 12px;padding:11px 12px}
  .rrow .no{font-size:24px;min-width:60px}
  .rrow .where{margin-left:auto}
  /* 자동완성 */
  .ac-item{padding:10px 11px;gap:9px}
  .ac-item .n{font-size:16px;min-width:44px}
  .ac-item .c{font-size:12px}
  .ac-item .b{font-size:12px}
  .ac-item .w{font-size:12px;text-align:right}
  /* 인쇄 설정·미리보기 */
  .print-set{gap:6px}
  .print-set .fld{width:31%;min-width:88px}
  .print-set .btn{flex:1;padding:11px 10px}
  .lblbox{padding:10px}
  /* 마스터 */
  .mrow .btn{flex:1;padding:11px 8px;font-size:13px}
  .mtools{flex-wrap:wrap}
  .mtools input{min-width:0}
}

/* ═══ 포털 공통 테마 (index.html 스타일) ═══ */
:root{--bg:#0a0a0a;--panel:#141414;--panel2:#1b1b1b;--line:#2a2a2a;--line2:#333333;--txt:#f0f0f0;--dim:#8a8a8a;--gold:#c9a84c;--accent:#c9a84c;--teal:#6fb8dd;--red:#e05c5c;--green:#4caf7d;--ink:#0a0a0a;
  --mono:'Space Mono',Consolas,'Courier New',monospace;--body:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}
body{font-family:var(--body);background:radial-gradient(900px 420px at 50% -160px,rgba(201,168,76,.07),transparent 70%),#0a0a0a;-webkit-font-smoothing:antialiased}
.mono,.brand,.tbtn,.modhead .mod,.modhead .sub,.plant-badge,.count-chip,.tab .es,.flabel,.ac-item .c,.ac-item .b,.ac-item .w,.tag-mid .kv span,.rrow .code,.rrow .sub,.rrow .where b,.rrow .where small,.pill,.grid th,.grid td,.sec-title span,.lbl-preview-label,.tag-loc .pos,input[type=text],input[type=number],textarea{font-family:var(--mono)}
.ac-item .n,.tag-no,.tag-loc .loc,.rrow .no{font-family:var(--mono);letter-spacing:-.02em}
::selection{background:#c9a84c;color:#0a0a0a}
input,textarea{color-scheme:dark}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
header.portal{background:linear-gradient(180deg,#141414 0%,#0e0e0e 100%);border-bottom:1px solid #2a2a2a;box-shadow:0 1px 0 rgba(255,255,255,.03),0 8px 24px rgba(0,0,0,.35);position:sticky;top:0;z-index:100}
header.portal::before{content:'';display:block;height:2px;background:linear-gradient(90deg,#c9a84c 0%,#d4651a 45%,#7c5cbf 100%);opacity:.9}
header.portal .bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 24px}
header.portal .brand-text{display:flex;flex-direction:column;gap:4px;min-width:0}
header.portal .htitle{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.06em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(90deg,#fafafa 0%,#d9d0b4 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
header.portal .hsub{font-size:12px;color:#a8a8a8;letter-spacing:.2em;text-transform:uppercase;line-height:1;display:flex;align-items:center;gap:8px;white-space:nowrap;font-weight:500}
header.portal .hsub::before{content:'';width:14px;height:1px;background:#c9a84c}
header.portal .tbtn{height:36px;display:inline-flex;align-items:center;padding:0 15px;border-radius:999px;background:transparent;border:1px solid #2a2a2a;color:#c8c8c8;font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:0}
header.portal .tbtn.gold{background:rgba(201,168,76,.10);border-color:rgba(201,168,76,.32);color:#c9a84c}
.system-bar{padding:7px 24px;background:#0b0b0b;border-top:1px solid #1e1e1e;font-family:var(--mono);font-size:12px;color:#b0b0b0;letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;gap:12px}
.system-bar>span:first-child{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.system-bar>span:first-child::before{content:'';flex-shrink:0;width:5px;height:5px;border-radius:50%;background:#c9a84c;box-shadow:0 0 6px #c9a84c;animation:pulse 2.4s ease-in-out infinite}
.system-bar>span:last-child{white-space:nowrap;flex-shrink:0}
.system-bar b{color:#e2c46a;font-weight:700}
.wrap{padding:18px 16px 60px}
.topbar,.modhead{display:none}
.tabs{gap:6px;margin:4px 0 16px}
.tab{flex:0 1 auto;padding:9px 16px;background:transparent;border:1px solid transparent;border-radius:999px;color:#8a8a8a;font-size:13.5px;font-weight:600;transition:color .15s,background .15s,border-color .15s}
.tab .es{color:#666;letter-spacing:.08em}
.tab:hover{color:#f0f0f0;background:rgba(255,255,255,.04)}
.tab.on{background:rgba(201,168,76,.12);color:#c9a84c;border-color:rgba(201,168,76,.35);box-shadow:0 0 0 1px rgba(201,168,76,.08),0 4px 14px rgba(201,168,76,.08)}
.tab.on .es{color:rgba(201,168,76,.7);opacity:1}
.panel{border-radius:12px;padding:20px}
.flabel{font-size:12px;letter-spacing:.14em;color:#c9a84c;text-transform:uppercase;font-weight:400}
input[type=text],input[type=number],textarea{background:#0d0d0d;border:1px solid #2a2a2a;border-radius:8px;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus{border-color:#c9a84c;box-shadow:0 0 0 4px rgba(201,168,76,.14)}
.btn{border-radius:8px}
.btn-gold{background:linear-gradient(180deg,#d9b85c 0%,#c9a84c 100%);color:#0a0a0a;box-shadow:0 4px 16px rgba(201,168,76,.25),inset 0 1px 0 rgba(255,255,255,.3)}
.btn-gold:hover{filter:brightness(1.07)}
.btn-ghost{background:#1b1b1b;border:1px solid #2a2a2a;color:#c8c8c8}.btn-ghost:hover{border-color:#555;color:#fff}
.btn-red{background:transparent;border:1px solid rgba(224,92,92,.5);color:#ef9a9a}.btn-red:hover{background:rgba(224,92,92,.12)}
.ac{background:#141414;border-color:#2a2a2a;border-radius:10px;box-shadow:0 16px 34px rgba(0,0,0,.6)}
.ac-item{border-bottom-color:#1e1e1e}.ac-item:hover,.ac-item.sel{background:rgba(201,168,76,.10)}
.ac-item .n{color:#e2c46a}
.tag{background:linear-gradient(180deg,#d9b85c 0%,#c9a84c 100%);border-radius:14px;box-shadow:0 12px 40px rgba(201,168,76,.18)}
.tag::before{background:#0a0a0a}
.rrow{background:#141414;border:1px solid #2a2a2a;border-left:2px solid #c9a84c;border-radius:10px;transition:border-color .15s,background .15s}
.rrow:hover{background:#181818;border-color:#444;border-left-color:#c9a84c}
.rrow .no{color:#e2c46a}.rrow .where b{color:#8fcbe8}
.empty{border-radius:12px;border-color:#3a3a3a;color:#777}
.pill{border-radius:999px;padding:4px 10px}
.preview-wrap{border-radius:10px;border-color:#2a2a2a}
.grid th{background:#0f0f0f;color:#777;letter-spacing:.12em;font-weight:400;border-bottom:1px solid #2a2a2a}
.grid td{border-top-color:#1e1e1e;color:#d8d8d8}.grid td.k{color:#e2c46a}
.msg{border-radius:10px}
.msg.ok{background:rgba(76,175,125,.08);color:#4caf7d;border-color:rgba(76,175,125,.4)}
.msg.err{background:rgba(224,92,92,.08);color:#ef9a9a;border-color:rgba(224,92,92,.4)}
.sec-title{color:#fafafa;font-weight:700;display:flex;align-items:center;gap:10px}
.sec-title::after{content:'';flex:1;height:1px;background:#2a2a2a}
.multi-note{color:#e2c46a}
.lblbox{border-radius:10px}
.lbl-preview-label{color:#c9a84c;font-weight:400}
@media(max-width:600px){header.portal .bar{padding:10px 12px}.system-bar{padding:7px 12px}header.portal .htitle{font-size:12px}header.portal .hsub{display:none}.tab{padding:8px 12px;font-size:12.5px}}
.scan-row .btn,.mrow .btn,.print-set .btn{white-space:nowrap;flex-shrink:0}
</style>

<!-- ═══ 포털 공통 (yh-common-v2): 제목 서체 · 닫기 버튼 · 최소 글자 크기 ═══ -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style id="yh-common-v2">
  /* ① 제목 서체 */

<script>
(function(){
  /* ── 닫기 버튼 ── */
  function mkClose(){
    if(document.querySelector('.yh-close-wrap'))return;
    var w=document.createElement('span');w.className='yh-close-wrap';
    w.innerHTML='<button type="button" class="yh-close" title="창 닫기 / Cerrar ventana (ESC)"><span>✕</span><span class="ko">닫기</span><span class="es">Cerrar</span></button>'
      +'<small class="yh-close-cap"><span class="ko">창 닫기 (ESC)</span><span class="es">Cerrar ventana (ESC)</span></small>';
    var sel='.top-right',t=null;
    try{
      if(sel.indexOf('parent:')===0){var e=document.querySelector(sel.slice(7));t=e&&e.parentElement;}
      else t=document.querySelector(sel);
    }catch(e){}
    if(t)t.appendChild(w);else{w.classList.add('yh-fixed');document.body.appendChild(w);}
    w.querySelector('.yh-close').addEventListener('click',doClose);
    window.addEventListener('keydown',function(ev){
      if(ev.key!=='Escape')return;
      var a=document.activeElement;
      if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
      var openUI=[].slice.call(document.querySelectorAll('dialog,[role="dialog"],[class*="modal"],[class*="overlay"],[class*="drawer"],[class*="popup"],[class*="dialog"],[class*="lightbox"]')).some(function(e){if(e.classList.contains('yh-close-wrap'))return false;var cs=getComputedStyle(e);return cs.display!=='none'&&cs.visibility!=='hidden'&&cs.opacity!=='0'&&e.getBoundingClientRect().width>0;});
      if(openUI)return;
      doClose();
    },true);
  }
  function doClose(){
    var top=window.top||window;
    try{top.close();}catch(e){}
    try{window.close();}catch(e){}
    setTimeout(function(){
      try{if(top.closed||window.closed)return;}catch(e){}
      try{top.location.href='./';}catch(e){location.href='./';}
    },250);
  }
  /* ── 최소 글자 크기 12px ── */
  var SKIP=/^(SCRIPT|STYLE|CANVAS|SVG|svg|path|g|text|tspan|circle|rect|line|polyline|polygon|BR|HR|IMG|VIDEO)$/;
  function bump(root){
    var list=root.querySelectorAll?root.querySelectorAll('*'):[];
    var i=0,n=list.length;
    (function chunk(){
      var end=Math.min(n,i+1500);
      for(;i<end;i++){
        var el=list[i];
        if(SKIP.test(el.tagName)||el.classList.contains('yh-fs12'))continue;
        if(el.namespaceURI&&el.namespaceURI.indexOf('svg')>-1)continue;
        if(el.closest&&el.closest('.pcell,.plabel,.print-only,.sheet-flow'))continue;
        var st=el.style&&el.style.fontSize;
        if(st&&/(pt|mm|cm|in)\s*$/.test(st))continue;
        var fs=parseFloat(getComputedStyle(el).fontSize);
        if(fs>=6&&fs<12)el.classList.add('yh-fs12');
      }
      if(i<n)setTimeout(chunk,0);
    })();
  }
  var pend=null,queue=[];
  function schedule(nodes){
    for(var k=0;k<nodes.length;k++)if(nodes[k].nodeType===1)queue.push(nodes[k]);
    if(pend)return;
    pend=setTimeout(function(){pend=null;var q=queue;queue=[];q.forEach(bump);},120);
  }
  function init(){
    mkClose();
    if(!true)return;
    bump(document.body);
    new MutationObserver(function(ms){
      var add=[];
      ms.forEach(function(m){
        if(m.type==='childList'){for(var j=0;j<m.addedNodes.length;j++)add.push(m.addedNodes[j]);}
        else if(m.type==='attributes'&&m.target.nodeType===1&&!m.target.classList.contains('yh-fs12'))add.push(m.target);
      });
      if(add.length)schedule(add);
    }).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['style','class']});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

  return typeof v === 'function' ? v(...args) : v;
}
function applyLang() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = I18N[lang][el.dataset.i18n];
    if (typeof v === 'string') el.innerHTML = v;
  });
  document.getElementById('pasteArea').placeholder = t('pastePh');
  document.getElementById('noPasteArea').placeholder = t('noPastePh');
  document.getElementById('masterFilter').placeholder = t('filterPh');
  document.getElementById('noFilter').placeholder = t('noFilterPh');
  document.getElementById('langBtn').textContent = lang === 'ko' ? 'ESPAÑOL' : '한국어';
  renderMasterList();
  renderNoList();
}
function toggleLang() {
  lang = lang === 'ko' ? 'es' : 'ko';
  applyLang();
}

/* ================== state ================== */
let masterCache = [];
let noList = [];          // [{mold_name, num}]
let noMap = {};           // mold_name → num (4자리)
let parsedRows = [];
let parsedNoRows = [];
let printW = 110, printH = 25;   // 라벨 기본 크기 (mm)

/* ================== tabs ================== */
document.querySelectorAll('.tab').forEach(tb => tb.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
  document.querySelectorAll('.page').forEach(x => x.classList.remove('on'));
  tb.classList.add('on');
  document.getElementById('page-' + tb.dataset.page).classList.add('on');
  if (tb.dataset.page === 'search') setTimeout(() => document.getElementById('scanInput').focus(), 50);
});

/* ================== data ================== */
async function fetchAllRows(table, order) {
  const rows = [];
  let from = 0;
  while (true) {
    const r = await fetch(`${SB_URL}/rest/v1/${table}?select=*&order=${order}&limit=1000&offset=${from}`, {headers: HEAD});
    const d = await r.json();
    if (!Array.isArray(d)) break;
    rows.push(...d);
    if (d.length < 1000) break;
    from += 1000;
  }
  return rows;
}

async function loadAll(showMsg) {
  const [m, n] = await Promise.all([
    fetchAllRows(TABLE, 'num.asc,mgmt_no.asc'),
    fetchAllRows(NO_TABLE, 'num.asc')
  ]);
  masterCache = m;
  noList = n;
  noMap = {};
  for (const r of n) if (r.mold_name) noMap[r.mold_name] = r.num;
  document.getElementById('totalCount').textContent = m.length.toLocaleString();
  renderMasterList();
  renderNoList();
  if (showMsg) flash('ok', t('loaded', m.length));
}

/* ================== autocomplete ================== */
const scanInput = document.getElementById('scanInput');
const acBox = document.getElementById('acBox');
let acItems = [], acSel = -1;

scanInput.addEventListener('input', () => {
  const q = scanInput.value.trim().toUpperCase();
  if (q.length < 2 || q.startsWith('$')) { hideAc(); return; }   // 스캔값($..)은 자동완성 생략
  const seen = new Set();
  acItems = [];
  for (const r of masterCache) {
    const code = (r.mold_code || '').toUpperCase();
    const name = (r.mold_name || '').toUpperCase();
    const bc = (r.barcode || '').toUpperCase();
    if (code.includes(q) || name.includes(q) || bc.includes(q)) {
      const key = r.barcode;
      if (!seen.has(key)) { seen.add(key); acItems.push(r); }
      if (acItems.length >= 8) break;
    }
  }
  acSel = -1;
  if (!acItems.length) { hideAc(); return; }
  acBox.innerHTML = acItems.map((r, i) =>
    `<div class="ac-item" data-i="${i}" onmousedown="acPick(${i})">
       <span class="n">${esc(r.num || '')}</span>
       <span><div class="c">${esc(r.mold_code || '')}</div><div class="b">${esc(r.barcode)} · ${esc(r.mgmt_no || '')}</div></span>
       <span class="w">${esc(r.location || '')}${r.position ? ' · ' + esc(r.position) : ''}</span>
     </div>`).join('');
  acBox.classList.add('show');
});
scanInput.addEventListener('keydown', e => {
  if (acBox.classList.contains('show')) {
    if (e.key === 'ArrowDown') { e.preventDefault(); acMove(1); return; }
    if (e.key === 'ArrowUp')   { e.preventDefault(); acMove(-1); return; }
    if (e.key === 'Escape')    { hideAc(); return; }
    if (e.key === 'Enter' && acSel >= 0) { e.preventDefault(); acPick(acSel); return; }
  }
  if (e.key === 'Enter') { hideAc(); doScan(); }
});
scanInput.addEventListener('blur', () => setTimeout(hideAc, 150));
function acMove(d) {
  acSel = (acSel + d + acItems.length) % acItems.length;
  acBox.querySelectorAll('.ac-item').forEach((el, i) => el.classList.toggle('sel', i === acSel));
}
function acPick(i) {
  const r = acItems[i];
  scanInput.value = r.barcode;
  hideAc();
  doScan();
}
function hideAc() { acBox.classList.remove('show'); acSel = -1; }

/* ================== search ================== */
function doScan() {
  const q = scanInput.value.trim();
  if (!q) return;
  const box = document.getElementById('searchResult');

  let hits = masterCache.filter(r => (r.barcode || '') === q);
  if (!hits.length) hits = masterCache.filter(r => (r.mold_code || '') === q);
  if (!hits.length && q.length >= 2) {
    const uq = q.toUpperCase();
    hits = masterCache.filter(r =>
      (r.mold_code || '').toUpperCase().includes(uq) ||
      (r.mold_name || '').toUpperCase().includes(uq));
  }

  if (!hits.length) {
    currentLabelRow = null;
    box.innerHTML = `<div class="empty"><b>${t('noResult')}</b><br><br>"${esc(q)}" — ${t('noResultDesc')}</div>`;
  } else if (hits.length === 1) {
    currentLabelRow = hits[0];
    box.innerHTML = renderTag(hits[0]);
    updateLblPreview();
  } else {
    currentLabelRow = null;
    box.innerHTML = `<div class="multi-note">${t('multiFound', hits.length)}</div>` +
      `<div class="result-list">` + hits.slice(0, 50).map(r =>
        `<div class="rrow" onclick="showOne('${esc(r.barcode)}')">
           <div class="no">${esc(r.num || '-')}</div>
           <div><div class="code">${esc(r.mold_code || '')}</div>
                <div class="sub">${esc(r.barcode)} · ${esc(r.mgmt_no || '')}</div></div>
           <div class="where"><b>${esc(r.location || '-')}</b><small>${esc(r.position || '')}</small></div>
         </div>`).join('') + `</div>`;
  }
  scanInput.select(); scanInput.focus();
}
function showOne(barcode) {
  const r = masterCache.find(x => x.barcode === barcode);
  if (r) {
    currentLabelRow = r;
    document.getElementById('searchResult').innerHTML = renderTag(r);
    updateLblPreview();
  }
}
function renderTag(r) {
  const mainLoc = r.position || r.location || '-';           // 지정장소 우선, 없으면 보관장소
  return `
  <div class="tag">
    <div class="tag-top">
      <div class="tag-no"><small>NO.</small>${esc(r.num || '-')}</div>
      <div class="tag-loc">
        <small>${t('posLabel')}</small>
        <div class="loc">${esc(mainLoc)}</div>
      </div>
    </div>
    <div class="tag-mid">
      <div class="kv"><small>${t('thCode')}</small><span>${esc(r.mold_code || '-')}</span></div>
      <div class="kv"><small>${t('thMgmt')}</small><span>${esc(r.mgmt_no || '-')}</span></div>
      <div class="kv"><small>${t('thName')}</small><span>${esc(r.mold_name || '-')}</span></div>
      <div class="kv"><small>${t('thBarcode')}</small><span>${esc(r.barcode)}</span></div>
    </div>
  </div>
  <div class="print-set">
    <div class="fld"><label class="flabel">${t('printW')}</label><input type="number" id="pw" value="${printW}" min="30" max="300" step="1" oninput="updateLblPreview()"></div>
    <div class="fld"><label class="flabel">${t('printH')}</label><input type="number" id="ph" value="${printH}" min="15" max="200" step="1" oninput="updateLblPreview()"></div>
    <button class="btn btn-gold" onclick="printLabel()">${t('labelPrint')}</button>
  </div>
  <div class="lbl-preview-label">${t('previewLbl')}</div>
  <div class="lblbox" id="lblPreview"></div>`;
}

/* ================== label build / preview / print ================== */
let currentLabelRow = null;

/*
 * 테두리 없는 라벨 — "0001  TAP11025R1SN" 형식 (기본 110×25mm)
 */
/* Code128-B 인코더 → SVG (외부 라이브러리 없이 인쇄 iframe에서도 동작) */
const C128 = ["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
function code128SVG(text, wMm, hMm) {
  const t = String(text).replace(/[^\x20-\x7E]/g, '');
  if (!t) return '';
  const codes = [104];
  for (const ch of t) codes.push(ch.charCodeAt(0) - 32);
  let sum = 104;
  for (let i = 1; i < codes.length; i++) sum += codes[i] * i;
  codes.push(sum % 103, 106);
  const pat = codes.map(c => C128[c]).join('');
  const QZ = 10;                                   // 좌우 여백(quiet zone) 10모듈
  let x = QZ, rects = '';
  for (let i = 0; i < pat.length; i++) {
    const w = +pat[i];
    if (i % 2 === 0) rects += `<rect x="${x}" y="0" width="${w}" height="1"/>`;
    x += w;
  }
  const total = x + QZ;
  return `<svg class="l2bc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} 1" preserveAspectRatio="none"
    style="width:${wMm}mm;height:${hMm}mm;display:block" shape-rendering="crispEdges"><g fill="#000">${rects}</g></svg>`;
}

/*
 * 테두리 없는 라벨 — 윗줄 "0001  TAP11025R1SN", 아랫줄 단자명 Code128 바코드 (기본 110×25mm)
 */
function buildLabelHTML(r, pw, ph) {
  const tw = pw - 1.6, th = ph - 1.6;
  const code = r.mold_code || '';
  const num = r.num || '';
  const botM = Math.max(1.5, th * 0.08);   // 하단 절취선 여백 (최소 1.5mm)
  const textH = (th - botM) * 0.52, gapH = (th - botM) * 0.08, bcH = th - botM - textH - gapH;
  const chars = num.length + 2 + Math.max(code.length, 6);
  const fs = Math.min(textH * 0.85, tw / (chars * 0.62));
  const modules = 11 * (code.length + 3) + 2 + 20;
  const bcW = Math.min(tw, Math.max(modules * 0.33, tw * 0.75));   // 모듈폭 ≥0.33mm 확보
  return `
  <div class="lbl2" style="width:${tw}mm;height:${th}mm">
    <div class="l2row" style="height:${textH}mm;font-size:${fs}mm">
      <span class="l2no">${esc(num)}</span><span class="l2nm">${esc(code)}</span>
    </div>
    <div style="height:${gapH}mm"></div>
    ${code128SVG(code, bcW, bcH)}
    <div style="height:${botM}mm"></div>
  </div>`;
}

/*
 * 용지 맞춤: 실제 렌더된 글자 폭을 측정해서 라벨 폭을 넘으면 폰트를 비율로 줄임
 * (미리보기와 인쇄 iframe 양쪽에서 동일 함수 사용)
 */
function fitLabelText(doc) {
  doc.querySelectorAll('.lbl2').forEach(box => {
    const row = box.querySelector('.l2row');
    if (!row) return;
    row.style.width = 'auto';
    const maxW = box.clientWidth * 0.96;            // 좌우 2% 안전여백
    let fs = parseFloat(row.style.fontSize);         // mm 단위
    const unit = row.style.fontSize.replace(/[\d.]/g, '') || 'mm';
    for (let i = 0; i < 40 && row.scrollWidth > maxW && fs > 0.5; i++) {
      fs *= Math.max(0.5, Math.min(0.98, maxW / row.scrollWidth));
      row.style.fontSize = fs.toFixed(3) + unit;
    }
  });
}

const LABEL_CSS = `
  html,body{margin:0;padding:0;background:#fff;overflow:hidden}
  body{padding:0.8mm}
  .lbl2{display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-sizing:border-box;background:#fff;color:#000;overflow:hidden;
    font-family:'Malgun Gothic',Arial,sans-serif;font-weight:900;line-height:1;white-space:nowrap}
  .l2row{display:flex;align-items:center;justify-content:center;gap:0.8em;flex-shrink:0}`;

function updateLblPreview() {
  if (!currentLabelRow) return;
  const pw = parseFloat(document.getElementById('pw')?.value) || 100;
  const ph = parseFloat(document.getElementById('ph')?.value) || 30;
  printW = pw; printH = ph;
  const box = document.getElementById('lblPreview');
  if (box) {
    box.innerHTML = buildLabelHTML(currentLabelRow, pw, ph);
    fitLabelText(box);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitLabelText(box));
  }
}

/*
 * 전용 iframe으로 인쇄:
 * - @page { size: [가로]mm [세로]mm; margin: 0 } → 용지 = 라벨 크기, 여백 0
 * - 여백이 0이면 브라우저 머릿글/바닥글(날짜·URL·페이지번호)이 인쇄되지 않음
 * - 본문 페이지 CSS의 간섭 없이 항상 동일하게 출력됨
 */
function printLabel() {
  if (!currentLabelRow) return;
  const pw = printW, ph = printH;
  const old = document.getElementById('printFrame');
  if (old) old.remove();

  const f = document.createElement('iframe');
  f.id = 'printFrame';
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  document.body.appendChild(f);

  const doc = f.contentDocument;
  doc.open();
  doc.write(`<!DOCTYPE html><html><head><meta charset="utf-8">
    <style>@page{size:${pw}mm ${ph}mm;margin:0}${LABEL_CSS}</style>
    </head><body>${buildLabelHTML(currentLabelRow, pw, ph)}</body></html>`);
  doc.close();

  setTimeout(() => {
    fitLabelText(doc);                 // 인쇄 폰트(Malgun Gothic) 기준으로 다시 측정·축소
    f.contentWindow.focus();
    f.contentWindow.print();
  }, 200);
}

/* ================== master paste (A~G, 번호는 NO 부여 매핑에서 조회) ================== */
function parsePaste() {
  const raw = document.getElementById('pasteArea').value;
  const lines = raw.split(/\r?\n/).filter(l => l.trim());
  parsedRows = [];
  const seen = new Set();
  let skipped = 0;

  for (const line of lines) {
    const c = line.split('\t').map(x => x.trim());
    if (c.some(x => x.includes('금형바코드') || x === '번호' || x.includes('금형명칭') || x === '금형명')) continue;
    if (c.length < 4) { skipped++; continue; }
    const row = {barcode: c[0], mold_code: c[1] || null, mgmt_no: c[2] || null,
                 mold_name: c[3] || null, location: c[4] || null, position: c[5] || null};
    if (!row.barcode) { skipped++; continue; }
    if (seen.has(row.barcode)) { skipped++; continue; }
    seen.add(row.barcode);
    row.num = noMap[row.mold_name] || null;    // NO 부여 매핑에서 조회 (없으면 미지정)
    parsedRows.push(row);
  }
  const unassigned = parsedRows.filter(r => !r.num).length;

  const wrap = document.getElementById('previewWrap');
  const tbl = document.getElementById('previewTable');
  if (!parsedRows.length) {
    wrap.style.display = 'none';
    flash('err', t('parseErr'));
    setBtns(false);
    return;
  }
  tbl.innerHTML = `<tr><th>${t('thBarcode')}</th><th>${t('thCode')}</th><th>${t('thMgmt')}</th><th>${t('thName')}</th><th>${t('thLoc')}</th><th>${t('thPos')}</th><th style="color:var(--gold)">${t('thNum')}</th></tr>` +
    parsedRows.slice(0, 300).map(r =>
      `<tr><td class="k">${esc(r.barcode)}</td><td>${esc(r.mold_code)}</td><td>${esc(r.mgmt_no)}</td>
       <td>${esc(r.mold_name)}</td><td>${esc(r.location)}</td><td>${esc(r.position)}</td>
       <td class="k">${r.num ? esc(r.num) : '<span style="color:var(--red)">—</span>'}</td></tr>`).join('');
  wrap.style.display = 'block';
  flash(unassigned ? 'err' : 'ok', t('parseOk', parsedRows.length, skipped) +
    `<br><span style="font-weight:500;font-size:11px">${t('parseNote', unassigned)}</span>` +
    (parsedRows.length > 300 ? `<br><span style="font-weight:500;font-size:11px;color:var(--dim)">${t('parseMax')}</span>` : ''));
  setBtns(true);
}

async function saveMaster(replaceAll) {
  if (!parsedRows.length) return;
  if (replaceAll && !confirm(t('confirmReplace', masterCache.length, parsedRows.length))) return;
  setBtns(false);
  flash('ok', '<span class="loading"></span>' + t('saving'));
  try {
    if (replaceAll) {
      const del = await fetch(`${SB_URL}/rest/v1/${TABLE}?barcode=neq.___none___`, {method: 'DELETE', headers: HEAD});
      if (!del.ok) throw new Error(t('delFail') + ': HTTP ' + del.status);
    }
    for (let i = 0; i < parsedRows.length; i += 500) {
      const batch = parsedRows.slice(i, i + 500);
      const r = await fetch(`${SB_URL}/rest/v1/${TABLE}?on_conflict=barcode`, {
        method: 'POST',
        headers: {...HEAD, "Prefer": "resolution=merge-duplicates,return=minimal"},
        body: JSON.stringify(batch.map(x => ({...x, updated_at: new Date().toISOString()})))
      });
      if (!r.ok) throw new Error(t('saveFail') + ': HTTP ' + r.status + ' — ' + (await r.text()).slice(0, 150));
    }
    flash('ok', t('saveOk', parsedRows.length, replaceAll));
    document.getElementById('pasteArea').value = '';
    document.getElementById('previewWrap').style.display = 'none';
    parsedRows = [];
    await loadAll(false);
  } catch (e) {
    flash('err', '❌ ' + e.message);
    setBtns(true);
  }
}

async function deleteRow(barcode) {
  if (!confirm(t('confirmDel', barcode))) return;
  const r = await fetch(`${SB_URL}/rest/v1/${TABLE}?barcode=eq.${encodeURIComponent(barcode)}`, {method: 'DELETE', headers: HEAD});
  if (r.ok) { flash('ok', t('deleted', barcode)); loadAll(false); }
  else flash('err', t('delFail') + ': HTTP ' + r.status);
}

function renderMasterList() {
  const q = (document.getElementById('masterFilter').value || '').trim().toUpperCase();
  let rows = masterCache;
  if (q) rows = rows.filter(r =>
    (r.barcode || '').toUpperCase().includes(q) ||
    (r.mold_code || '').toUpperCase().includes(q) ||
    (r.num || '').includes(q));
  const tbl = document.getElementById('masterTable');
  tbl.innerHTML = `<tr><th>${t('thNum')}</th><th>${t('thBarcode')}</th><th>${t('thCode')}</th><th>${t('thMgmt')}</th><th>${t('thLoc')}</th><th>${t('thPos')}</th><th></th></tr>` +
    rows.slice(0, 200).map(r =>
      `<tr><td class="k">${r.num ? esc(r.num) : '<span style="color:var(--red)">—</span>'}</td><td>${esc(r.barcode)}</td><td>${esc(r.mold_code || '')}</td>
       <td>${esc(r.mgmt_no || '')}</td><td>${esc(r.location || '')}</td><td>${esc(r.position || '')}</td>
       <td><button class="del-btn" onclick="deleteRow('${esc(r.barcode)}')">✕</button></td></tr>`).join('') +
    (rows.length > 200 ? `<tr><td colspan="7" style="color:var(--dim)">${t('more', rows.length - 200)}</td></tr>` : '');
}

/* ================== NO 부여 (금형명 → 치구보관함 번호) ================== */
function parseNoPaste() {
  const raw = document.getElementById('noPasteArea').value;
  const lines = raw.split(/\r?\n/).filter(l => l.trim());
  parsedNoRows = [];
  const seen = new Set();
  let skipped = 0;

  for (const line of lines) {
    const c = line.split('\t').map(x => x.trim());
    if (c.some(x => x === 'NO' || x === '금형명' || x.includes('번호'))) continue;
    if (c.length < 2) { skipped++; continue; }
    // NO(숫자) / 금형명 — 순서가 반대여도 자동 인식
    let numRaw, name;
    if (/^\d+$/.test(c[0])) { numRaw = c[0]; name = c[1]; }
    else if (/^\d+$/.test(c[1])) { numRaw = c[1]; name = c[0]; }
    else { skipped++; continue; }
    if (!name) { skipped++; continue; }
    if (seen.has(name)) { skipped++; continue; }
    seen.add(name);
    parsedNoRows.push({mold_name: name, num: numRaw.padStart(4, '0')});
  }

  const wrap = document.getElementById('noPreviewWrap');
  const tbl = document.getElementById('noPreviewTable');
  if (!parsedNoRows.length) {
    wrap.style.display = 'none';
    noFlash('err', t('noParseErr'));
    setNoBtns(false);
    return;
  }
  tbl.innerHTML = `<tr><th style="color:var(--gold)">${t('thNum')}</th><th>${t('thName')}</th></tr>` +
    parsedNoRows.slice(0, 300).map(r =>
      `<tr><td class="k">${esc(r.num)}</td><td>${esc(r.mold_name)}</td></tr>`).join('');
  wrap.style.display = 'block';
  noFlash('ok', t('noParseOk', parsedNoRows.length, skipped) +
    (parsedNoRows.length > 300 ? `<br><span style="font-weight:500;font-size:11px;color:var(--dim)">${t('parseMax')}</span>` : ''));
  setNoBtns(true);
}

async function saveNoMap(replaceAll) {
  if (!parsedNoRows.length) return;
  if (replaceAll && !confirm(t('confirmReplace', noList.length, parsedNoRows.length))) return;
  setNoBtns(false);
  noFlash('ok', '<span class="loading"></span>' + t('saving'));
  try {
    if (replaceAll) {
      const del = await fetch(`${SB_URL}/rest/v1/${NO_TABLE}?mold_name=neq.___none___`, {method: 'DELETE', headers: HEAD});
      if (!del.ok) throw new Error(t('delFail') + ': HTTP ' + del.status);
    }
    for (let i = 0; i < parsedNoRows.length; i += 500) {
      const batch = parsedNoRows.slice(i, i + 500);
      const r = await fetch(`${SB_URL}/rest/v1/${NO_TABLE}?on_conflict=mold_name`, {
        method: 'POST',
        headers: {...HEAD, "Prefer": "resolution=merge-duplicates,return=minimal"},
        body: JSON.stringify(batch.map(x => ({...x, updated_at: new Date().toISOString()})))
      });
      if (!r.ok) throw new Error(t('saveFail') + ': HTTP ' + r.status + ' — ' + (await r.text()).slice(0, 150));
    }
    // 새 매핑 기준으로 마스터 번호 재계산
    const newMap = {};
    if (!replaceAll) for (const r of noList) if (r.mold_name) newMap[r.mold_name] = r.num;
    for (const r of parsedNoRows) newMap[r.mold_name] = r.num;
    const changed = [];
    for (const m of masterCache) {
      const nn = newMap[m.mold_name] || null;
      if (nn !== (m.num || null)) changed.push({barcode: m.barcode, num: nn});
    }
    for (let i = 0; i < changed.length; i += 500) {
      const batch = changed.slice(i, i + 500);
      const r = await fetch(`${SB_URL}/rest/v1/${TABLE}?on_conflict=barcode`, {
        method: 'POST',
        headers: {...HEAD, "Prefer": "resolution=merge-duplicates,return=minimal"},
        body: JSON.stringify(batch)
      });
      if (!r.ok) throw new Error(t('saveFail') + ': HTTP ' + r.status);
    }
    noFlash('ok', t('noSaveOk', parsedNoRows.length, replaceAll, changed.length));
    document.getElementById('noPasteArea').value = '';
    document.getElementById('noPreviewWrap').style.display = 'none';
    parsedNoRows = [];
    await loadAll(false);
  } catch (e) {
    noFlash('err', '❌ ' + e.message);
    setNoBtns(true);
  }
}

async function deleteNoRow(name) {
  if (!confirm(t('confirmDel', name))) return;
  const r = await fetch(`${SB_URL}/rest/v1/${NO_TABLE}?mold_name=eq.${encodeURIComponent(name)}`, {method: 'DELETE', headers: HEAD});
  if (r.ok) { noFlash('ok', t('deleted', name)); await loadAll(false); }
  else noFlash('err', t('delFail') + ': HTTP ' + r.status);
}

function renderNoList() {
  const el = document.getElementById('noFilter');
  if (!el) return;
  const q = (el.value || '').trim().toUpperCase();
  let rows = noList;
  if (q) rows = rows.filter(r =>
    (r.mold_name || '').toUpperCase().includes(q) ||
    (r.num || '').includes(q));
  const tbl = document.getElementById('noTable');
  tbl.innerHTML = `<tr><th>${t('thNum')}</th><th>${t('thName')}</th><th></th></tr>` +
    rows.slice(0, 300).map(r =>
      `<tr><td class="k">${esc(r.num || '')}</td><td>${esc(r.mold_name)}</td>
       <td><button class="del-btn" onclick="deleteNoRow('${esc(r.mold_name)}')">✕</button></td></tr>`).join('') +
    (rows.length > 300 ? `<tr><td colspan="3" style="color:var(--dim)">${t('more', rows.length - 300)}</td></tr>` : '');
}

/* ================== utils ================== */
function setBtns(on) {
  document.getElementById('btnUpsert').disabled = !on;
  document.getElementById('btnReplace').disabled = !on;
}
function setNoBtns(on) {
  document.getElementById('btnNoUpsert').disabled = !on;
  document.getElementById('btnNoReplace').disabled = !on;
}
function flash(type, html) {
  const m = document.getElementById('masterMsg');
  m.className = 'msg ' + type;
  m.innerHTML = html;
}
function noFlash(type, html) {
  const m = document.getElementById('noMsg');
  m.className = 'msg ' + type;
  m.innerHTML = html;
}
function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

applyLang();
loadAll(false);
</script>
</body>
</html>
