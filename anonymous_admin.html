<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>익명게시판 관리 · YURA</title>
<style>
  :root{--navy:#0f2747;--ink:#0b1220;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--line:#e2e8f0;--muted:#64748b;--field:#f1f5f9}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;background:#0f172a;color:#e2e8f0}
  .wrap{max-width:920px;margin:0 auto;padding:0 16px 60px}
  header{background:var(--navy);padding:16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
  header .brand{font-weight:800;font-size:17px;color:#fff}
  header .sub{font-size:12px;color:#94a3b8;font-weight:600}
  .btn{border:none;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:800;cursor:pointer;color:#fff;background:var(--navy)}
  .btn.ok{background:var(--ok)}.btn.gray{background:#334155}.btn:disabled{opacity:.5}
  /* 로그인 */
  .login{max-width:360px;margin:80px auto;background:#1e293b;border:1px solid #334155;border-radius:18px;padding:30px;text-align:center}
  .login h1{font-size:20px;margin:0 0 6px;color:#fff}.login p{color:#94a3b8;font-size:13px;margin:0 0 20px}
  .login input{width:100%;border:2px solid #334155;border-radius:12px;background:#0f172a;color:#fff;padding:14px;font-size:16px;text-align:center;outline:none;margin-bottom:14px}
  .login input:focus{border-color:#3b82f6}
  /* 탭 */
  .tabs{display:flex;gap:8px;margin:18px 0}
  .tab{flex:1;border:1px solid #334155;background:#1e293b;border-radius:12px;padding:13px;font-size:14px;font-weight:800;color:#94a3b8;cursor:pointer;text-align:center}
  .tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .tab .n{display:inline-block;min-width:22px;padding:1px 7px;border-radius:999px;background:#dc2626;color:#fff;font-size:12px;margin-left:6px}
  .tab.on .n{background:rgba(255,255,255,.25)}
  /* 카드 */
  .card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:18px;margin-bottom:14px}
  .row1{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .tag{font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px}
  .tag.company{background:#1e3a5f;color:#bfdbfe}.tag.personal{background:#4c1d6b;color:#e9d5ff}
  .tag.st-pending{background:#7c2d12;color:#fed7aa}.tag.st-answered{background:#14532d;color:#bbf7d0}
  .dt{font-size:12px;color:#64748b;margin-left:auto}
  .pt{font-size:17px;font-weight:800;color:#fff;line-height:1.35}
  .pc{font-size:14px;color:#cbd5e1;margin-top:8px;line-height:1.6;white-space:pre-wrap}
  .ans-box{margin-top:14px}
  .ans-box label{font-size:12px;font-weight:800;color:#86efac;display:block;margin-bottom:6px}
  textarea{width:100%;min-height:90px;border:2px solid #334155;border-radius:12px;background:#0f172a;color:#fff;padding:12px;font-size:14px;line-height:1.5;outline:none;font-family:inherit;resize:vertical}
  textarea:focus{border-color:var(--ok)}
  .ans-saved{margin-top:14px;background:#052e16;border-left:3px solid var(--ok);border-radius:0 10px 10px 0;padding:12px 14px}
  .ans-saved .h{font-size:12px;font-weight:800;color:#4ade80;margin-bottom:5px}
  .ans-saved .b{font-size:14px;color:#bbf7d0;line-height:1.55;white-space:pre-wrap}
  .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .empty{text-align:center;color:#64748b;padding:60px 20px;font-weight:600}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:12px 22px;border-radius:12px;font-weight:800;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
  .toast.show{opacity:1}
  .langtog{display:inline-flex;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:9px;overflow:hidden}
  .langtog button{border:none;background:transparent;color:#fff;font-weight:800;font-size:12px;padding:8px 11px;cursor:pointer;line-height:1;opacity:.7}
  .langtog button.on{background:#fff;color:#0f2747;opacity:1}
  a.btn{text-decoration:none;display:inline-block}
  .tr-btn{margin-top:10px;padding:7px 12px;font-size:12px;background:#1e3a5f}
  .tr-out{margin-top:10px;background:#0b2540;border:1px solid #1e3a5f;border-radius:10px;padding:11px 13px}
  .tr-out .tr-h{font-size:11px;font-weight:800;color:#93c5fd;margin-bottom:5px}
  .tr-out .tr-b{font-size:14px;color:#dbeafe;line-height:1.6;white-space:pre-wrap}
</style>
</head>
<body>
<header>
  <div><div class="brand">🔒 <span data-i18n="brand">익명게시판 관리</span></div><div class="sub" data-i18n="subFull">YURA HARNESS MÉXICO · 담당자 전용</div></div>
  <div style="display:flex;gap:8px;align-items:center">
    <a class="btn gray" href="blog.html?f=1">🏠 <span data-i18n="navBoard">게시판</span></a>
    <a class="btn gray" href="employee_admin.html">👥 <span data-i18n="navEmp">직원</span></a>
    <button class="btn gray" id="reloadBtn" style="display:none" data-i18n="reload">새로고침</button>
    <div class="langtog" id="langTog"><button data-l="es" class="on">ES</button><button data-l="ko">한</button></div>
  </div>
</header>

<div class="wrap">
  <!-- 로그인 -->
  <div class="login" id="login">
    <h1 data-i18n="loginH">담당자 인증</h1>
    <p data-i18n="loginP">관리 비밀번호를 입력하세요</p>
    <input id="pw" type="password" placeholder="비밀번호" data-i18n-ph="pwPh" autocomplete="off">
    <button class="btn" style="width:100%" id="pwBtn" data-i18n="enter">들어가기</button>
    <div id="pwMsg" style="color:#f87171;font-size:13px;margin-top:10px;min-height:16px"></div>
  </div>

  <!-- 본문 -->
  <div id="boardArea" style="display:none">
    <div class="tabs">
      <div class="tab on" data-tab="pending" id="tabP"><span data-i18n="tabPending">답변 대기</span> <span class="n" id="cntP">0</span></div>
      <div class="tab" data-tab="answered" id="tabA"><span data-i18n="tabAnswered">답변 완료</span> <span class="n" id="cntA">0</span></div>
    </div>
    <div id="list"><div class="empty" data-i18n="loading">불러오는 중…</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CONFIG = {
  SUPABASE_URL:"https://lrjurjhavlalhlwaplxd.supabase.co",
  SUPABASE_ANON:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyanVyamhhdmxhbGhsd2FwbHhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNzUxNDAsImV4cCI6MjA5NTY1MTE0MH0.DVFmZaT37R9CXSMHdnLx4YAVNTnlBGijkOIaoUo7Qsk",
  T_POSTS:"anon_posts",
  ADMIN_PW:"yura2026",          // ← 담당자 비밀번호. 운영 전 반드시 변경하세요.
  ANSWERED_BY:"게시판 담당자"    // 답변자 표시명
};
const $ = id => document.getElementById(id);
const REST = p => CONFIG.SUPABASE_URL+"/rest/v1/"+p;
const H = {"apikey":CONFIG.SUPABASE_ANON,"Authorization":"Bearer "+CONFIG.SUPABASE_ANON,"Content-Type":"application/json"};
const I18N={
 es:{brand:"Buzón anónimo",subFull:"YURA HARNESS MÉXICO · Solo administrador",navBoard:"Tablón",navEmp:"Empleados",reload:"Recargar",
  loginH:"Acceso administrador",loginP:"Ingrese la contraseña",pwPh:"Contraseña",enter:"Entrar",pwBad:"Contraseña incorrecta",
  tabPending:"Por responder",tabAnswered:"Respondidos",loading:"Cargando…",netErr:"Error de red",
  emptyPending:"No hay mensajes por responder",emptyAnswered:"No hay mensajes respondidos",
  catCompany:"Empresa",catPersonal:"Personal",stAnswered:"Respondido",stPending:"Pendiente",
  ansHead:(by,dt)=>`💬 Respuesta (${by} · ${dt})`,btnEditAns:"Editar respuesta",btnDel:"Eliminar",lEditAns:"Editar respuesta",btnSave:"Guardar",
  lWriteAns:"Escribir respuesta",phWriteAns:"Escribe la respuesta a este mensaje…",btnPostAns:"Publicar respuesta",
  trBtn:"🇰🇷 Traducir (KO)",trHead:"🇰🇷 한글 번역 (자동 · 참고용)",translating:"번역 중…",trFail:"Traducción fallida (revise internet)",
  needAns:"Escriba la respuesta",saving:"Guardando…",saveFail:"Error al guardar",ansPosted:"Respuesta publicada",
  delConfirm:"¿Eliminar este mensaje definitivamente? No se puede deshacer.",delFail:"Error al eliminar",deleted:"Eliminado"},
 ko:{brand:"익명게시판 관리",subFull:"YURA HARNESS MÉXICO · 담당자 전용",navBoard:"게시판",navEmp:"직원",reload:"새로고침",
  loginH:"담당자 인증",loginP:"관리 비밀번호를 입력하세요",pwPh:"비밀번호",enter:"들어가기",pwBad:"비밀번호가 올바르지 않습니다",
  tabPending:"답변 대기",tabAnswered:"답변 완료",loading:"불러오는 중…",netErr:"통신 오류",
  emptyPending:"답변 대기 중인 글이 없습니다",emptyAnswered:"답변 완료된 글이 없습니다",
  catCompany:"회사",catPersonal:"개인",stAnswered:"답변완료",stPending:"대기",
  ansHead:(by,dt)=>`💬 답변 (${by} · ${dt})`,btnEditAns:"답변 수정",btnDel:"삭제",lEditAns:"답변 수정",btnSave:"저장",
  lWriteAns:"답변 작성",phWriteAns:"이 글에 대한 답변을 작성하세요…",btnPostAns:"답변 등록",
  trBtn:"🇰🇷 한글 번역",trHead:"🇰🇷 한글 번역 (자동 · 참고용)",translating:"번역 중…",trFail:"번역 실패 (인터넷 연결 확인)",
  needAns:"답변 내용을 입력하세요",saving:"저장 중…",saveFail:"저장 실패",ansPosted:"답변이 등록되었습니다",
  delConfirm:"이 글을 완전히 삭제할까요? 되돌릴 수 없습니다.",delFail:"삭제 실패",deleted:"삭제됨"}
};
let lang="es"; const t=k=>I18N[lang][k];
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ const v=t(el.dataset.i18n); if(typeof v==="string") el.textContent=v; });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{ const v=t(el.dataset.i18nPh); if(typeof v==="string") el.placeholder=v; });
  document.querySelectorAll("#langTog button").forEach(b=>b.classList.toggle("on", b.dataset.l===lang));
  if($("boardArea").style.display!=="none") render();
}
document.querySelectorAll("#langTog button").forEach(b=>{ b.onclick=()=>{ if(lang===b.dataset.l) return; lang=b.dataset.l; applyLang(); }; });
let curTab="pending", allPosts=[];

/* 로그인 */
$("pwBtn").onclick=tryLogin;
$("pw").addEventListener("keydown",e=>{ if(e.key==="Enter") tryLogin(); });
function tryLogin(){
  if($("pw").value===CONFIG.ADMIN_PW){
    sessionStorage.setItem("yura_anon_admin","1");
    enter();
  } else { $("pwMsg").textContent=t("pwBad"); }
}
function enter(){
  $("login").style.display="none"; $("boardArea").style.display="block"; $("reloadBtn").style.display="";
  applyLang(); load();
}
$("reloadBtn").onclick=load;
if(sessionStorage.getItem("yura_anon_admin")==="1") enter();

/* 탭 */
document.querySelectorAll(".tab").forEach(tb=>{
  tb.onclick=()=>{ curTab=tb.dataset.tab; document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on")); tb.classList.add("on"); render(); };
});

/* 로드 */
async function load(){
  $("list").innerHTML=`<div class="empty">${t("loading")}</div>`;
  try{
    const r=await fetch(REST(`${CONFIG.T_POSTS}?select=*&order=created_at.desc&limit=500`),{headers:H});
    allPosts=await r.json();
    if(!Array.isArray(allPosts)) allPosts=[];
    const p=allPosts.filter(x=>x.status==="pending").length, a=allPosts.filter(x=>x.status==="answered").length;
    $("cntP").textContent=p; $("cntA").textContent=a;
    render();
  }catch(e){ $("list").innerHTML=`<div class="empty">${t("netErr")}</div>`; }
}

function render(){
  const rows=allPosts.filter(x=>x.status===curTab);
  if(rows.length===0){ $("list").innerHTML=`<div class="empty">${curTab==="pending"?t("emptyPending"):t("emptyAnswered")}</div>`; return; }
  $("list").innerHTML=rows.map(cardHtml).join("");
  rows.forEach(p=>{
    const sv=$("save_"+p.id); if(sv) sv.onclick=()=>saveAnswer(p.id);
    const ed=$("edit_"+p.id); if(ed) ed.onclick=()=>{ $("editbox_"+p.id).style.display="block"; ed.style.display="none"; };
    const del=$("del_"+p.id); if(del) del.onclick=()=>delPost(p.id);
    const tr=$("tr_"+p.id); if(tr) tr.onclick=()=>doTranslate(p.id,(p.title?p.title+"\n":"")+(p.content||""));
  });
}

function cardHtml(p){
  const catTag = p.category==="personal" ? `<span class="tag personal">${t("catPersonal")}</span>` : `<span class="tag company">${t("catCompany")}</span>`;
  const stTag = p.status==="answered" ? `<span class="tag st-answered">${t("stAnswered")}</span>` : `<span class="tag st-pending">${t("stPending")}</span>`;
  const dt = new Date(p.created_at).toLocaleString(lang==="ko"?"ko-KR":"es-MX",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
  let body=`<div class="card"><div class="row1">${catTag}${stTag}<span class="dt">${dt}</span></div>
    <div class="pt">${esc(p.title)}</div><div class="pc">${esc(p.content)}</div>
    <button class="btn gray tr-btn" id="tr_${p.id}">${t("trBtn")}</button><div class="tr-out" id="trout_${p.id}" style="display:none"></div>`;
  if(p.status==="answered"){
    const adt = p.answered_at ? new Date(p.answered_at).toLocaleDateString(lang==="ko"?"ko-KR":"es-MX") : "";
    body += `<div class="ans-saved"><div class="h">${t("ansHead")(esc(p.answered_by||""),adt)}</div><div class="b">${esc(p.answer||"")}</div></div>
      <div class="actions"><button class="btn gray" id="edit_${p.id}">${t("btnEditAns")}</button><button class="btn gray" id="del_${p.id}" style="background:#7f1d1d">${t("btnDel")}</button></div>
      <div id="editbox_${p.id}" style="display:none" class="ans-box"><label>${t("lEditAns")}</label><textarea id="ans_${p.id}">${esc(p.answer||"")}</textarea>
      <div class="actions"><button class="btn ok" id="save_${p.id}">${t("btnSave")}</button></div></div>`;
  } else {
    body += `<div class="ans-box"><label>${t("lWriteAns")}</label><textarea id="ans_${p.id}" placeholder="${t("phWriteAns")}"></textarea>
      <div class="actions"><button class="btn ok" id="save_${p.id}">${t("btnPostAns")}</button><button class="btn gray" id="del_${p.id}" style="background:#7f1d1d">${t("btnDel")}</button></div></div>`;
  }
  return body+`</div>`;
}

async function saveAnswer(id){
  const ans=$("ans_"+id).value.trim();
  if(!ans){ toast(t("needAns")); return; }
  const btn=$("save_"+id); btn.disabled=true; btn.textContent=t("saving");
  const body={ answer:ans, status:"answered", answered_by:CONFIG.ANSWERED_BY, answered_at:new Date().toISOString() };
  try{
    const r=await fetch(REST(`${CONFIG.T_POSTS}?id=eq.${id}`),{method:"PATCH",headers:{...H,"Prefer":"return=minimal"},body:JSON.stringify(body)});
    if(!r.ok){ console.error(await r.text()); toast(t("saveFail")); btn.disabled=false; btn.textContent=t("btnPostAns"); return; }
    toast(t("ansPosted")); await load();
  }catch(e){ toast(t("netErr")); btn.disabled=false; }
}

async function delPost(id){
  if(!confirm(t("delConfirm"))) return;
  try{
    const r=await fetch(REST(`${CONFIG.T_POSTS}?id=eq.${id}`),{method:"DELETE",headers:{...H,"Prefer":"return=minimal"}});
    if(!r.ok){ toast(t("delFail")); return; }
    toast(t("deleted")); await load();
  }catch(e){ toast(t("netErr")); }
}

async function translateToKo(text){
  // 1) 구글 비공식(언어 자동감지 → 한국어)
  try{
    const u="https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ko&dt=t&q="+encodeURIComponent(text);
    const r=await fetch(u);
    if(r.ok){ const d=await r.json(); if(d&&d[0]) return d[0].map(s=>s[0]).join(""); }
  }catch(e){}
  // 2) MyMemory 대체(es → ko)
  try{
    const u="https://api.mymemory.translated.net/get?q="+encodeURIComponent(text.slice(0,480))+"&langpair=es|ko";
    const r=await fetch(u);
    if(r.ok){ const d=await r.json(); if(d&&d.responseData&&d.responseData.translatedText) return d.responseData.translatedText; }
  }catch(e){}
  return null;
}
async function doTranslate(id, text){
  const btn=$("tr_"+id), out=$("trout_"+id);
  btn.disabled=true; btn.textContent=t("translating");
  const ko=await translateToKo(text);
  btn.disabled=false; btn.textContent=t("trBtn");
  if(ko){ out.style.display="block"; out.innerHTML=`<div class="tr-h">${t("trHead")}</div><div class="tr-b">${esc(ko)}</div>`; }
  else { toast(t("trFail")); }
}
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
let toastTimer;
function toast(msg){ $("toast").textContent=msg; $("toast").classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>$("toast").classList.remove("show"),2200); }
</script>
</body>
</html>
