<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YURA HARNESS MÉXICO · Portal</title>
<style>
  :root{--navy:#0c2444;--navy2:#163a66;--gold:#c9a14a;--gold2:#e3c878;--ink:#0b1220;--muted:#8294ad}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#e9eef7;
    background:radial-gradient(1100px 620px at 50% -160px,#13294a,transparent),linear-gradient(180deg,#0a1726,#0b1d34);background-attachment:fixed}
  .wrap{max-width:920px;margin:0 auto;padding:26px 16px 50px}
  header{text-align:center;margin-bottom:26px;position:relative}
  .logo{width:64px;height:64px;border-radius:18px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;color:#1a1407;
    background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 12px 30px -10px rgba(201,161,74,.7)}
  header h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.6px}
  header .sub{font-size:13px;color:rgba(255,255,255,.65);font-weight:600;margin-top:5px}
  .gold-line{height:3px;width:80px;margin:14px auto 0;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold))}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
  .card{background:#15243f;border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px;
    box-shadow:0 1px 2px rgba(0,0,0,.35),0 18px 36px -22px rgba(0,0,0,.75);transition:transform .16s,box-shadow .16s}
  .card:hover{transform:translateY(-3px);box-shadow:0 1px 2px rgba(0,0,0,.4),0 24px 42px -20px rgba(0,0,0,.8)}
  .ic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center}
  .ic svg{width:24px;height:24px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .ic.green{background:rgba(34,197,94,.16);color:#4ade80}
  .ic.teal{background:rgba(45,212,191,.16);color:#2dd4bf}
  .ic.blue{background:rgba(96,165,250,.16);color:#93c5fd}
  .ic.gold{background:rgba(201,161,74,.18);color:#e3c878}
  .ic.slate{background:rgba(148,163,184,.20);color:#cbd5e1}
  .card h3{margin:0;font-size:17px;font-weight:800}
  .card .ko{font-size:13px;color:var(--muted);font-weight:600;margin-top:-6px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
  .btn{flex:1;min-width:110px;text-align:center;text-decoration:none;border-radius:11px;padding:12px 10px;font-weight:800;font-size:14px;cursor:pointer;transition:.15s}
  .btn.primary{background:linear-gradient(135deg,#1e4d8b,#13335c);color:#fff}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.alt{background:rgba(255,255,255,.08);color:#dbe6f5;border:1px solid rgba(255,255,255,.12)}
  .btn.alt:hover{background:rgba(255,255,255,.15)}
  .btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1407}
  .foot{text-align:center;color:var(--muted);font-size:12px;font-weight:600;margin-top:28px}
  .foot b{color:var(--gold2)}
</style>
</head>

      <div class="actions">

      </div>
    </div>

    <div class="card">
      <div class="ic slate"><svg viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/></svg></div>
      <div>
        <h3>게시판 관리</h3>

      <div class="actions">

  </div>

  <div class="foot"><b>YURA HARNESS MÉXICO</b> · 유라하네스멕시코</div>
</div>

</html>
