<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>출석 · Asistencia</title>
<style>
  :root{--navy:#0f2747;--ink:#0b1220;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--line:#e2e8f0;--muted:#64748b;--field:#f1f5f9}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;background:var(--ink);overflow:hidden;-webkit-user-select:none;user-select:none}
  .app{height:100dvh;display:flex;flex-direction:column;background:#f8fafc}
  header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:calc(14px + env(safe-area-inset-top))}
  header .brand{font-weight:800;letter-spacing:.5px;font-size:15px}
  .hd-right{display:flex;align-items:center;gap:10px}
  header .loc{font-size:13px;opacity:.85;font-weight:600}
  .lang{background:rgba(255,255,255,.16);border:none;color:#fff;font-weight:800;font-size:12px;padding:6px 10px;border-radius:8px;cursor:pointer}
  main{flex:1;position:relative;overflow:hidden}
  .panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:18px;opacity:0;pointer-events:none;transition:opacity .18s;background:#f8fafc}
  .panel.active{opacity:1;pointer-events:auto}
  .big-name{font-size:30px;font-weight:800;color:var(--ink);line-height:1.15}
  .sub{font-size:15px;color:var(--muted);font-weight:600}
  .chip{display:inline-flex;gap:8px;align-items:center;background:#e8eef7;color:var(--navy);padding:7px 14px;border-radius:999px;font-weight:700;font-size:14px}
  .cta{width:100%;max-width:420px;border:none;border-radius:20px;padding:26px;font-size:24px;font-weight:800;color:#fff;background:var(--navy);box-shadow:0 10px 24px rgba(15,39,71,.28);cursor:pointer;transition:transform .08s}
  .cta:active{transform:scale(.97)}
  .cta.in{background:linear-gradient(135deg,#16a34a,#15803d)}
  .cta.out{background:linear-gradient(135deg,#ea580c,#c2410c)}
  .cta .cta-sub{display:block;font-size:14px;font-weight:600;opacity:.9;margin-top:4px}
  .field{width:100%;max-width:360px;border:2px solid var(--line);border-radius:16px;background:var(--field);padding:18px 20px;font-size:26px;font-weight:800;text-align:center;letter-spacing:2px;color:var(--ink);outline:none}
  .field:focus{border-color:var(--navy);background:#fff}
  .btn{width:100%;max-width:360px;border:none;border-radius:16px;padding:18px;font-size:18px;font-weight:800;color:#fff;background:var(--navy);cursor:pointer}
  .btn:active{transform:scale(.98)}
  .footlink{font-size:13px;color:var(--muted);font-weight:600;background:none;border:none;text-decoration:underline;cursor:pointer}
  .panel.flood-ok{background:linear-gradient(160deg,#16a34a,#15803d);color:#fff}
  .panel.flood-warn{background:linear-gradient(160deg,#d97706,#b45309);color:#fff}
  .panel.flood-bad{background:linear-gradient(160deg,#dc2626,#b91c1c);color:#fff}
  .flood-ok .sub,.flood-warn .sub,.flood-bad .sub{color:rgba(255,255,255,.9)}
  .mark{width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:72px;font-weight:800}
  .result-name{font-size:34px;font-weight:800;color:#fff}
  .result-type{font-size:22px;font-weight:800;letter-spacing:1px}
  .result-time{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;color:#fff}
  .result-time .ampm{font-size:18px;font-weight:600;opacity:.85}
  .flag-badge{font-size:18px;font-weight:800;padding:6px 16px;border-radius:999px;background:rgba(255,255,255,.2)}
  .spin{width:64px;height:64px;border-radius:50%;border:6px solid #dbe3ee;border-top-color:var(--navy);animation:sp 1s linear infinite}
  .flood-ok .spin,.flood-warn .spin,.flood-bad .spin{border-color:rgba(255,255,255,.3);border-top-color:#fff}
  @keyframes sp{to{transform:rotate(360deg)}}
  .step{font-size:15px;font-weight:600;color:var(--muted)}
  video,canvas{display:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="brand" data-i18n="brand">출석</span>
    <div class="hd-right">
      <span class="loc" id="locLabel">—</span>
      <button class="lang" id="langBtn">ES</button>
    </div>
  </header>
  <main>
    <section class="panel active" id="p-init"><div class="spin"></div><div class="step" data-i18n="checking">확인 중…</div></section>

    <section class="panel" id="p-id">
      <div class="big-name" data-i18n="enterId">사번 입력</div>
      <input class="field" id="idInput" inputmode="numeric" autocomplete="off" placeholder="------">
      <button class="btn" id="idBtn" data-i18n="confirm">확인</button>
      <div class="step" id="idMsg" style="min-height:18px;color:var(--bad)"></div>
    </section>

    <section class="panel" id="p-ready">
      <div class="chip" id="readyChip">—</div>
      <div class="big-name" id="readyName">—</div>
      <div class="sub" id="readyStatus">—</div>
      <button class="cta" id="punchBtn">—</button>
      <button class="footlink" id="changeId" data-i18n="changeId">사번 변경</button>
    </section>

    <section class="panel" id="p-proc"><div class="spin"></div><div class="step" id="procStep">—</div></section>

    <section class="panel flood-ok" id="p-ok">
      <div class="mark">✓</div>
      <div class="result-type" id="okType">—</div>
      <div class="flag-badge" id="okFlag" style="display:none"></div>
      <div class="result-name" id="okName">—</div>
      <div class="result-time" id="okTime">--:--</div>
    </section>

    <section class="panel flood-bad" id="p-bad">
      <div class="mark">✕</div>
      <div class="result-type" id="badTitle">—</div>
      <div class="sub" id="badMsg" style="font-size:17px;max-width:320px">—</div>
      <button class="btn" id="badRetry" style="background:rgba(255,255,255,.18);max-width:280px;margin-top:8px" data-i18n="retry">다시 시도</button>
    </section>

    <section class="panel flood-warn" id="p-warn">
      <div class="mark">!</div>
      <div class="result-type" id="warnTitle">—</div>
      <div class="sub" id="warnMsg" style="font-size:17px;max-width:320px">—</div>
      <button class="btn" id="warnBack" style="background:rgba(255,255,255,.18);max-width:280px;margin-top:8px" data-i18n="ok">확인</button>
    </section>
  </main>
  <video id="cam" playsinline muted></video><canvas id="cap"></canvas>
</div>

<script>
/* ============================================================
   설정 (CONFIG) — 여기만 채우세요
   ============================================================ */
const CONFIG = {
  SUPABASE_URL:  "https://lrjurjhavlalhlwaplxd.supabase.co",
  SUPABASE_ANON: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyanVyamhhdmxhbGhsd2FwbHhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNzUxNDAsImV4cCI6MjA5NTY1MTE0MH0.DVFmZaT37R9CXSMHdnLx4YAVNTnlBGijkOIaoUo7Qsk",      // ← 채우기
  T_EMPLOYEES:   "att_employees",
  T_RECORDS:     "attendance_records",

  // 공장별: 좌표/반경 + 근태 인정시각
  FACTORIES: {
    "1": { ko:"1공장", es:"Planta 1", lat:26.900233831261286, lng:-101.45329965310623, radius:250, inBy:"08:30", outBy:"17:20" },
    "2": { ko:"2공장", es:"Planta 2", lat:25.524134615561525, lng:-103.372496781381, radius:250, inBy:"08:30", outBy:"17:20" }
  },

  REQUIRE_PHOTO:true, REQUIRE_GPS:true,
  DEDUPE_MINUTES:2, TZ_OFFSET_HOURS:-6,
  PHOTO_WIDTH:320, PHOTO_QUALITY:0.45, RESET_AFTER_MS:4500
};
/* ============================================================ */

/* ---------- 다국어 ---------- */
const I18N = {
  ko:{ brand:"출석", checking:"확인 중…", enterId:"사번 입력", confirm:"확인", changeId:"사번 변경",
    retry:"다시 시도", ok:"확인", idEmpty:"사번을 입력하세요", idBad:"등록되지 않은 사번입니다",
    netErr:"통신 오류", checkingId:"확인 중…",
    checkin:"출근하기", checkout:"퇴근하기", checkinSub:"Registrar ENTRADA", checkoutSub:"Registrar SALIDA",
    readyIn:"버튼을 누르면 위치·사진을 확인합니다", readyOut:"버튼을 누르면 퇴근 등록합니다",
    stepLoc:"위치 확인 중…", stepPhoto:"사진 촬영 중…", stepSave:"등록 중…",
    locFailT:"위치 실패", locFailM:"위치 권한을 허용해야 등록됩니다.",
    locOutT:"위치 벗어남", locOutM:m=>`공장 반경 밖입니다 (약 ${m}m).`,
    camFailT:"카메라 실패", camFailM:"카메라 권한을 허용해야 등록됩니다.",
    saveFailT:"등록 실패", saveFailM:"잠시 후 다시 시도하세요.",
    netFailT:"통신 오류", netFailM:"네트워크를 확인하세요.",
    dupT:"이미 처리됨", dupM:tp=>`${tp==="in"?"출근":"퇴근"}이 방금 등록되었습니다.`,
    typeIn:"출근", typeOut:"퇴근", flagLate:"지각", flagEarly:"조퇴" },
  es:{ brand:"Asistencia", checking:"Verificando…", enterId:"Número de empleado", confirm:"Confirmar", changeId:"Cambiar empleado",
    retry:"Reintentar", ok:"OK", idEmpty:"Ingrese su número", idBad:"Número no registrado",
    netErr:"Error de red", checkingId:"Verificando…",
    checkin:"Registrar ENTRADA", checkout:"Registrar SALIDA", checkinSub:"출근", checkoutSub:"퇴근",
    readyIn:"Al pulsar se verifica ubicación y foto", readyOut:"Al pulsar se registra la salida",
    stepLoc:"Verificando ubicación…", stepPhoto:"Tomando foto…", stepSave:"Registrando…",
    locFailT:"Sin ubicación", locFailM:"Debe permitir el acceso a ubicación.",
    locOutT:"Fuera del área", locOutM:m=>`Fuera del área permitida (≈${m}m).`,
    camFailT:"Sin cámara", camFailM:"Debe permitir el acceso a la cámara.",
    saveFailT:"Error al registrar", saveFailM:"Intente de nuevo en un momento.",
    netFailT:"Error de red", netFailM:"Verifique su conexión.",
    dupT:"Ya registrado", dupM:tp=>`Se registró su ${tp==="in"?"entrada":"salida"} hace un momento.`,
    typeIn:"ENTRADA", typeOut:"SALIDA", flagLate:"Tarde", flagEarly:"Salida anticipada" }
};
let lang = localStorage.getItem("yura_lang") || (navigator.language.startsWith("es")?"es":"ko");
const t = k => I18N[lang][k];
function dispName(){ return (lang==='ko' && me && me.name_ko) ? me.name_ko : (me?me.name:''); }

/* ---------- 공통 ---------- */
const $ = id => document.getElementById(id);
const REST = p => CONFIG.SUPABASE_URL + "/rest/v1/" + p;
const HEADERS = { "apikey":CONFIG.SUPABASE_ANON, "Authorization":"Bearer "+CONFIG.SUPABASE_ANON, "Content-Type":"application/json" };
const params = new URLSearchParams(location.search);
const factoryKey = params.get("f");
let factory = CONFIG.FACTORIES[factoryKey] || null;
let me = null, nextType = "in";

function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  $("langBtn").textContent = lang==="ko" ? "ES" : "한";
  if(factory) $("locLabel").textContent = factory[lang];
  if($("p-ready").classList.contains("active")) renderReadyLabels();
}
$("langBtn").onclick = ()=>{ lang = lang==="ko"?"es":"ko"; localStorage.setItem("yura_lang",lang); applyLang(); };

function show(id){ document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active")); $(id).classList.add("active"); }
function reject(title,msg,retry){ $("badTitle").textContent=title; $("badMsg").textContent=msg; $("badRetry").style.display=retry?"":"none"; show("p-bad"); }
function warn(title,msg){ $("warnTitle").textContent=title; $("warnMsg").textContent=msg; show("p-warn"); }

function init(){
  applyLang();
  if(!factory){ reject("QR", lang==="ko"?"QR을 다시 스캔하세요.":"Escanee el QR de nuevo.", false); return; }
  $("locLabel").textContent = factory[lang];
  const saved=localStorage.getItem("yura_att_me");
  if(saved){ try{ me=JSON.parse(saved); }catch(e){ me=null; } }
  if(me && me.employee_id) enterReady();
  else { show("p-id"); setTimeout(()=>$("idInput").focus(),200); }
}

/* ---------- 사번 ---------- */
$("idBtn").onclick=verifyId;
$("idInput").addEventListener("keydown",e=>{ if(e.key==="Enter") verifyId(); });
async function verifyId(){
  const id=$("idInput").value.trim(); $("idMsg").textContent="";
  if(!id){ $("idMsg").textContent=t("idEmpty"); return; }
  $("idBtn").textContent=t("checkingId"); $("idBtn").disabled=true;
  try{
    const r=await fetch(REST(`${CONFIG.T_EMPLOYEES}?employee_id=eq.${encodeURIComponent(id)}&select=employee_id,name,name_ko&limit=1`),{headers:HEADERS});
    const rows=await r.json();
    if(!Array.isArray(rows)||rows.length===0){ $("idMsg").textContent=t("idBad"); return; }
    me={employee_id:rows[0].employee_id, name:rows[0].name||rows[0].employee_id, name_ko:rows[0].name_ko||''};
    localStorage.setItem("yura_att_me",JSON.stringify(me));
    enterReady();
  }catch(e){ $("idMsg").textContent=t("netErr"); }
  finally{ $("idBtn").textContent=t("confirm"); $("idBtn").disabled=false; }
}
$("changeId").onclick=()=>{ localStorage.removeItem("yura_att_me"); me=null; $("idInput").value=""; show("p-id"); setTimeout(()=>$("idInput").focus(),150); };

/* ---------- 근태 시각 ---------- */
function nowMinLocal(){ const n=new Date(); const l=new Date(n.getTime()+CONFIG.TZ_OFFSET_HOURS*3600*1000); return l.getUTCHours()*60+l.getUTCMinutes(); }
function hmToMin(s){ const [h,m]=s.split(":").map(Number); return h*60+m; }
function todayStartISO(){ const n=new Date(); const l=new Date(n.getTime()+CONFIG.TZ_OFFSET_HOURS*3600*1000); l.setUTCHours(0,0,0,0); return new Date(l.getTime()-CONFIG.TZ_OFFSET_HOURS*3600*1000).toISOString(); }

function renderReadyLabels(){
  $("readyChip").textContent=factory[lang];
  $("readyName").textContent=dispName();
  const isIn=nextType==="in";
  $("punchBtn").className="cta "+(isIn?"in":"out");
  $("punchBtn").innerHTML=(isIn?t("checkin"):t("checkout"))+`<span class="cta-sub">${isIn?t("checkinSub"):t("checkoutSub")}</span>`;
  $("readyStatus").textContent=isIn?t("readyIn"):t("readyOut");
}

async function enterReady(){
  show("p-ready"); $("readyName").textContent=dispName(); $("punchBtn").disabled=true;
  $("readyChip").textContent=factory[lang]; $("readyStatus").textContent=t("checking");
  try{
    const r=await fetch(REST(`${CONFIG.T_RECORDS}?employee_id=eq.${encodeURIComponent(me.employee_id)}&created_at=gte.${todayStartISO()}&select=type,created_at&order=created_at.desc&limit=1`),{headers:HEADERS});
    const rows=await r.json(); const last=(Array.isArray(rows)&&rows[0])?rows[0]:null;
    nextType = !last ? "in" : (last.type==="in" ? "out" : "in");
  }catch(e){ nextType="in"; }
  $("punchBtn").disabled=false; renderReadyLabels();
}

/* ---------- 등록 ---------- */
$("punchBtn").onclick=doPunch; $("badRetry").onclick=enterReady; $("warnBack").onclick=enterReady;
async function doPunch(){
  show("p-proc"); let lat=null,lng=null,photo=null;
  if(CONFIG.REQUIRE_GPS){
    $("procStep").textContent=t("stepLoc");
    try{ const pos=await getPosition(); lat=pos.coords.latitude; lng=pos.coords.longitude;
      const dist=haversine(lat,lng,factory.lat,factory.lng);
      if(dist>factory.radius){ reject(t("locOutT"), t("locOutM")(Math.round(dist)), true); return; }
    }catch(e){ reject(t("locFailT"), t("locFailM"), true); return; }
  }
  if(CONFIG.REQUIRE_PHOTO){
    $("procStep").textContent=t("stepPhoto");
    try{ photo=await capturePhoto(); }catch(e){ reject(t("camFailT"), t("camFailM"), true); return; }
  }
  $("procStep").textContent=t("stepSave");
  try{
    const chk=await fetch(REST(`${CONFIG.T_RECORDS}?employee_id=eq.${encodeURIComponent(me.employee_id)}&created_at=gte.${todayStartISO()}&select=type,created_at&order=created_at.desc&limit=1`),{headers:HEADERS});
    const crows=await chk.json(); const last=(Array.isArray(crows)&&crows[0])?crows[0]:null;
    if(last){ const age=(Date.now()-new Date(last.created_at).getTime())/60000;
      if(age<CONFIG.DEDUPE_MINUTES && last.type===nextType){ warn(t("dupT"), t("dupM")(nextType)); return; } }
  }catch(e){}

  // 근태 플래그
  const nm=nowMinLocal();
  let flag = "normal";
  if(nextType==="in")  flag = nm <= hmToMin(factory.inBy)  ? "normal" : "late";
  if(nextType==="out") flag = nm >= hmToMin(factory.outBy) ? "normal" : "early";

  const body={ employee_id:me.employee_id, name:me.name, type:nextType, factory:factoryKey, flag, lat, lng, photo };
  try{
    const r=await fetch(REST(CONFIG.T_RECORDS),{method:"POST",headers:{...HEADERS,"Prefer":"return=minimal"},body:JSON.stringify(body)});
    if(!r.ok){ reject(t("saveFailT"), t("saveFailM"), true); console.error(await r.text()); return; }
    showSuccess(nextType, flag);
  }catch(e){ reject(t("netFailT"), t("netFailM"), true); }
}

function showSuccess(type, flag){
  const now=new Date(); const hh=now.getHours(),mm=now.getMinutes();
  const ampm=hh<12?"AM":"PM"; const h12=((hh+11)%12)+1;
  $("okType").textContent = type==="in"?t("typeIn"):t("typeOut");
  $("okName").textContent = dispName();
  $("okTime").innerHTML = `${String(h12).padStart(2,"0")}:${String(mm).padStart(2,"0")} <span class="ampm">${ampm}</span>`;
  const fb=$("okFlag");
  if(flag==="normal"){ fb.style.display="none"; }
  else{ fb.style.display=""; fb.textContent = flag==="late"?t("flagLate"):t("flagEarly"); }
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  $("p-ok").className = "panel active " + (flag==="normal"?"flood-ok":"flood-warn");
  clearTimeout(window._t); window._t=setTimeout(enterReady, CONFIG.RESET_AFTER_MS);
}

/* ---------- 유틸 ---------- */
function getPosition(){ return new Promise((res,rej)=>{ if(!navigator.geolocation) return rej(); navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:12000,maximumAge:0}); }); }
function haversine(la1,lo1,la2,lo2){ const R=6371000,toR=x=>x*Math.PI/180; const dLa=toR(la2-la1),dLo=toR(lo2-lo1); const a=Math.sin(dLa/2)**2+Math.cos(toR(la1))*Math.cos(toR(la2))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(a)); }
async function capturePhoto(){
  const cam=$("cam"),cap=$("cap");
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640},height:{ideal:640}},audio:false});
  cam.srcObject=stream; await cam.play(); await new Promise(r=>setTimeout(r,500));
  const w=CONFIG.PHOTO_WIDTH, ratio=cam.videoHeight?(cam.videoHeight/cam.videoWidth):1, h=Math.round(w*ratio);
  cap.width=w; cap.height=h; cap.getContext("2d").drawImage(cam,0,0,w,h);
  stream.getTracks().forEach(x=>x.stop());
  return cap.toDataURL("image/jpeg",CONFIG.PHOTO_QUALITY);
}

init();
</script>
</body>
</html>
